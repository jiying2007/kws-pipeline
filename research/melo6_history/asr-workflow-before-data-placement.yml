name: Melo six-phrase blind ASR screen
on:
  push:
    branches:
      - research/melo6-source-screen-v1
permissions:
  contents: read
concurrency:
  group: melo6-source-screen-v1
  cancel-in-progress: false
jobs:
  asr:
    if: github.repository == 'jiying2007/kws-pipeline' && github.ref == 'refs/heads/research/melo6-source-screen-v1' && github.event.created == true && github.event.repository.private == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: research/melo6_asr
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Start bounded provisioning clock
        working-directory: ${{ github.workspace }}
        run: echo "QWEN6_JOB_STARTED_UNIX_SECONDS=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        timeout-minutes: 2
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Bind six public blind inputs
        run: |
          python -B - <<'PY'
          import json, pathlib, shutil, platform, os, time
          assert platform.python_version() == '3.12.14'
          assert time.time() - float(os.environ['QWEN6_JOB_STARTED_UNIX_SECONDS']) <= 300
          src=pathlib.Path('../melo6_blind')
          assert {p.name for p in src.iterdir()} == {'blind-inputs.zip','blind-input-freeze.json'}
          dest=pathlib.Path('runtime/incoming'); dest.mkdir(parents=True, exist_ok=False)
          for p in src.iterdir():
              assert p.is_file() and not p.is_symlink()
              shutil.copyfile(p, dest/p.name)
          from release_gate import verify_release
          verify_release(pathlib.Path('.'),'asr','../melo6-source-screen-release.json')
          PY
      - name: Decode once per clip with each recognizer
        run: |
          python -B - <<'PY'
          import json, subprocess, sys, pathlib
          release=pathlib.Path('../melo6-source-screen-release.json')
          r=json.loads(release.read_text())
          cmd=[sys.executable,'-B','run_asr6.py','--release',str(release),'--incoming','runtime/incoming',
               '--archive-sha256',r['blind_archive_sha256'],'--input-freeze-sha256',r['blind_freeze_sha256'],
               '--execute-reviewed-asr6']
          raise SystemExit(subprocess.call(cmd))
          PY
      - name: Verify raw evidence bounds
        id: artifact_bounds
        if: always()
        run: python -B -c 'from run_asr6 import artifact_check_cli; raise SystemExit(artifact_check_cli())'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.artifact_bounds.outcome == 'success' && hashFiles('research/melo6_asr/runtime/artifact/artifact-freeze.json') != ''
        with:
          name: melo6-raw-asr-status-resources
          path: research/melo6_asr/runtime/artifact/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
