name: Qwen16 fixed no-model setup probes
on:
  push:
    branches: [research/qwen16-container-probe-1, research/qwen16-container-probe-2]
permissions:
  contents: read
concurrency:
  group: qwen16-container-probes-serial
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'jiying2007/kws-pipeline' && github.event.created == true && github.event.repository.private == false && github.run_attempt == 1 && ((github.ref == 'refs/heads/research/qwen16-container-probe-1' && github.run_number == 1) || (github.ref == 'refs/heads/research/qwen16-container-probe-2' && github.run_number == 2))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Start one fixed stdlib-only setup scope
        id: run
        run: python3 -I -B research/source-screen32-v1/hosted_run.py --phase probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.run.outputs.evidence_root != ''
        with:
          name: qwen16-container-probe-${{ github.run_number }}-terminal-evidence
          path: ${{ steps.run.outputs.evidence_root }}/artifact/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
