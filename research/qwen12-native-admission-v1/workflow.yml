name: Qwen12 prospective native admission v1
on:
  push:
    branches:
      - research/qwen12-native-admission-recovery1
      - research/qwen12-native-transport-preflight-v1
  pull_request:
    paths:
      - "research/qwen12-native-admission-v1/**"
      - "research/source-screen32-v1/native_v2_adapter.py"
      - ".github/workflows/qwen12-native-admission-v1.yml"
permissions:
  contents: read
concurrency:
  group: qwen12-native-admission-v1
  cancel-in-progress: false
jobs:
  qwen12:
    # Reviewed release must separately remove this literal false before activation.
    if: ${{ github.repository == 'jiying2007/kws-pipeline' && github.event_name == 'push' && github.ref == 'refs/heads/research/qwen12-native-admission-recovery1' && github.event.created == true && github.event.repository.private == false && github.run_attempt == 1 }}
    needs: contracts
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run reviewed twelve by three native captures once
        timeout-minutes: 65
        run: python3 -I -B research/qwen12-native-admission-v1/hosted_run.py
      - name: Publish complete bounded native evidence, including failed or partial runs
        if: ${{ always() }}
        timeout-minutes: 4
        env:
          KWS_EVIDENCE_TOKEN: ${{ github.token }}
        run: python3 -I -B research/qwen12-native-admission-v1/evidence_publisher.py native
      # Only this poststep receives the token; no worker mount or environment does.
      # No artifact/cache/LFS upload; evidence ref creation cannot overwrite a ref.
  contracts:
    if: github.repository == 'jiying2007/kws-pipeline' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Stdlib-only contract and transport fixtures
        run: |
          for flags in '' '-O' '-OO'; do
            python3 -B $flags research/qwen12-native-admission-v1/test_contract.py
            python3 -B $flags research/qwen12-native-admission-v1/test_log_transport.py
            python3 -B $flags research/qwen12-native-admission-v1/test_branch_transport.py
            python3 -B $flags research/qwen12-native-admission-v1/test_evidence_publisher.py
            python3 -B $flags research/qwen12-native-admission-v1/test_native_v2_adapter.py
            python3 -B $flags research/qwen12-native-admission-v1/test_whisper_binding.py
            python3 -B $flags research/qwen12-native-admission-v1/test_native_locks.py
            python3 -B $flags research/qwen12-native-admission-v1/test_worker_receipts.py
          done
          python3 -B tools/test_inventory.py --root research/qwen12-native-admission-v1 --workflow .github/workflows/qwen12-native-admission-v1.yml
  transport-fixture:
    if: ${{ github.repository == 'jiying2007/kws-pipeline' && github.event_name == 'push' && github.ref == 'refs/heads/research/qwen12-native-transport-preflight-v1' && github.event.created == true && github.event.repository.private == false && github.run_attempt == 1 }}
    needs: contracts
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare public synthetic maximum-size package; zero ASR calls
        run: python3 -I -B research/qwen12-native-admission-v1/emit_synthetic_branch_fixture.py
      - name: Publish synthetic package once to its separate evidence branch
        if: ${{ always() }}
        timeout-minutes: 4
        env:
          KWS_EVIDENCE_TOKEN: ${{ github.token }}
        run: python3 -I -B research/qwen12-native-admission-v1/evidence_publisher.py synthetic
