name: Qwen6 source screen bounded recovery 2
on:
  push:
    branches:
      - research/qwen6-source-screen-recovery-v2
permissions:
  contents: read
concurrency:
  group: qwen6-source-screen-recovery-v2
  cancel-in-progress: false
jobs:
  tts:
    if: github.repository == 'jiying2007/kws-pipeline' && github.ref == 'refs/heads/research/qwen6-source-screen-recovery-v2' && github.event.created == true && github.event.repository.private == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: research/qwen6_tts
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      blind_archive_sha256: ${{ steps.generate.outputs.blind_archive_sha256 }}
      blind_freeze_sha256: ${{ steps.generate.outputs.blind_freeze_sha256 }}
      blind_job_sha256: ${{ steps.generate.outputs.blind_job_sha256 }}
      blind_artifact_id: ${{ steps.blind_upload.outputs.artifact-id }}
    steps:
      - name: Start TTS provisioning budget
        working-directory: ${{ github.workspace }}
        run: echo "QWEN6_JOB_STARTED_UNIX_SECONDS=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        timeout-minutes: 3
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Verify TTS provision budget
        run: python -B -c 'import os,platform,time,sys; sys.exit(0 if platform.python_version()=="3.12.14" and time.time()-float(os.environ["QWEN6_JOB_STARTED_UNIX_SECONDS"])<=300 else "Provision limit failed")'
      - name: Generate the six fixed cells once
        id: generate
        run: python -B run_tts.py --release "$GITHUB_WORKSPACE/research/qwen6-source-screen-release.json" --execute-reviewed-six
      - name: Freeze and bound full generation evidence
        id: full_bounds
        if: always()
        run: python -B artifact_bounds.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.full_bounds.outcome == 'success'
        with:
          name: qwen6-generation-evidence
          path: research/qwen6_tts/runtime/artifact/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
      - name: Bound blind handoff
        id: blind_bounds
        if: steps.generate.outcome == 'success'
        run: python -B artifact_bounds.py --blind
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: blind_upload
        if: steps.generate.outcome == 'success' && steps.full_bounds.outcome == 'success' && steps.blind_bounds.outcome == 'success'
        with:
          name: qwen6-blind-inputs
          path: research/qwen6_tts/runtime/blind-artifact/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
  asr:
    needs: tts
    if: needs.tts.result == 'success' && needs.tts.outputs.blind_artifact_id != '' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: research/qwen6_asr
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BLIND_ARCHIVE_SHA256: ${{ needs.tts.outputs.blind_archive_sha256 }}
      BLIND_FREEZE_SHA256: ${{ needs.tts.outputs.blind_freeze_sha256 }}
    steps:
      - name: Start ASR provisioning budget
        working-directory: ${{ github.workspace }}
        run: echo "QWEN6_JOB_STARTED_UNIX_SECONDS=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        timeout-minutes: 2
        with:
          python-version: '3.12.14'
          check-latest: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 1
        with:
          artifact-ids: ${{ needs.tts.outputs.blind_artifact_id }}
          path: research/qwen6_asr/runtime/incoming/
          merge-multiple: true
          digest-mismatch: error
      - name: Verify ASR provision budget
        run: python -B -c 'import os,platform,time,sys; sys.exit(0 if platform.python_version()=="3.12.14" and time.time()-float(os.environ["QWEN6_JOB_STARTED_UNIX_SECONDS"])<=300 else "Provision limit failed")'
      - name: Run both recognizers once per blind clip
        run: python -B run_asr6.py --release "$GITHUB_WORKSPACE/research/qwen6-source-screen-release.json" --incoming "$GITHUB_WORKSPACE/research/qwen6_asr/runtime/incoming" --archive-sha256 "$BLIND_ARCHIVE_SHA256" --input-freeze-sha256 "$BLIND_FREEZE_SHA256" --execute-reviewed-asr6
      - name: Verify ASR result artifact bounds
        id: artifact_bounds
        if: always()
        run: python -B -c 'from run_asr6 import artifact_check_cli; raise SystemExit(artifact_check_cli())'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.artifact_bounds.outcome == 'success' && hashFiles('research/qwen6_asr/runtime/artifact/artifact-freeze.json') != ''
        with:
          name: qwen6-raw-asr-status-resources
          path: research/qwen6_asr/runtime/artifact/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
