name: native-a20-domain-saved
on:
  pull_request:
    paths:
      - "research/native_a20_domain_diagnostics/**"
      - ".github/workflows/native-a20-domain-saved.yml"
  push:
    branches: [main, "research/**", "codex/**"]
    paths:
      - "research/native_a20_domain_diagnostics/**"
      - ".github/workflows/native-a20-domain-saved.yml"
permissions:
  contents: read
jobs:
  offline-saved-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      A20_DOMAIN_DATA_ROOT: domain-data/research/2026-10-04-domain-decoder-diagnostics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            research/native_a20_domain_diagnostics
      - name: Require immutable reviewed data reference
        id: data-pin
        run: |
          python3 -B - <<'PY'
          import importlib.util, os
          from pathlib import Path
          p=Path('research/native_a20_domain_diagnostics')
          spec=importlib.util.spec_from_file_location('saved_validator',p/'src/verify_saved.py')
          v=importlib.util.module_from_spec(spec);spec.loader.exec_module(v)
          commit=v.publication_pin(v.read(p/'DATA-REFERENCE.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('commit='+commit+'\n')
          PY
      - name: Checkout exactly the pinned numeric record
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jiying2007/kws-data
          ref: ${{ steps.data-pin.outputs.commit }}
          path: domain-data
          persist-credentials: false
          sparse-checkout: research/2026-10-04-domain-decoder-diagnostics
      - name: Validate published commit, manifest and saved evidence
        run: |
          python3 -B research/native_a20_domain_diagnostics/src/verify_saved.py --data-root "$A20_DOMAIN_DATA_ROOT" --require-published --data-commit "$(git -C domain-data rev-parse HEAD)"
      - name: Pure saved-data and invented adversarial tests
        run: python3 -B -m unittest discover -s research/native_a20_domain_diagnostics/tests -v
      - name: Confirm tracked source and numeric evidence unchanged
        run: |
          git diff --exit-code HEAD
          git -C domain-data diff --exit-code HEAD
