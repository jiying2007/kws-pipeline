name: k1-prefix-marginal

on:
  push:
    paths:
      - "research/k1-prefix-marginal-v1/**"
      - ".github/workflows/k1-prefix-marginal.yml"
  pull_request:
    paths:
      - "research/k1-prefix-marginal-v1/**"
      - ".github/workflows/k1-prefix-marginal.yml"

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run 30 mathematical module tests
        working-directory: research/k1-prefix-marginal-v1/frozen/k1-prefix-marginal-v1
        run: python3 -B -m unittest discover -s tests -p test_k1_prefix_marginal.py -v
      - name: Run seven original runner mock tests
        working-directory: research/k1-prefix-marginal-v1/frozen/k1-prefix-saved-evaluation-v1
        run: python3 -B -m unittest -v test_runner.py
      - name: Run 12 recovery synthetic and adapter tests
        working-directory: research/k1-prefix-marginal-v1/frozen/k1-prefix-saved-evaluation-recovery-v2
        run: python3 -B -m unittest -v test_runner.py
      - name: Run independent raw-path, edge and underflow checks
        run: python3 -B research/k1-prefix-marginal-v1/check_synthetic.py
      - name: Require all frozen unit test files in this workflow
        run: |
          python3 -B tools/test_inventory.py --root research/k1-prefix-marginal-v1/frozen/k1-prefix-marginal-v1/tests --workflow .github/workflows/k1-prefix-marginal.yml
          python3 -B tools/test_inventory.py --root research/k1-prefix-marginal-v1/frozen/k1-prefix-saved-evaluation-v1 --workflow .github/workflows/k1-prefix-marginal.yml
          python3 -B tools/test_inventory.py --root research/k1-prefix-marginal-v1/frozen/k1-prefix-saved-evaluation-recovery-v2 --workflow .github/workflows/k1-prefix-marginal.yml
