name: a20-cosy49-single-candidate
run-name: a20-cosy49-single-candidate-v1
on:
  push:
    branches: [research/a20-cosy49-single-candidate-v1]
    paths:
      - '.github/workflows/a20-cosy49.yml'
      - 'research/cosy49/**'
permissions:
  contents: read
concurrency:
  group: a20-cosy49-single-candidate-v1
  cancel-in-progress: false
jobs:
  cosy49:
    if: github.repository == 'jiying2007/kws-pipeline' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            research/cosy49
            .github/workflows
      - name: Pure fixtures only
        run: python3 -B -m unittest discover -s research/cosy49/tests -v
      - name: One exact approved cosy49 attempt
        run: python3 -B research/cosy49/src/launch_once.py --execute-release research/cosy49/EXECUTION-RELEASE.json
      - name: Preserve saved-only failure evidence
        if: always()
        run: python3 -B research/cosy49/src/finish_saved_only.py
      - name: Verify exact publication pair
        id: publication_check
        if: always() && hashFiles('research/cosy49/work/PUBLICATION-READY.json') != ''
        run: python3 -B research/cosy49/src/verify_publication.py
      - name: Retain complete raw evidence and the terminal candidate
        if: always() && steps.publication_check.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a20-cosy49-single-candidate-v1
          path: |
            research/cosy49/publication/a20-cosy49-artifact.tar.gz
            research/cosy49/publication/a20-cosy49-artifact.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false
