name: native-a20-n0-saved
on:
  pull_request:
    paths:
      - "research/native_a20_n0/**"
      - ".github/workflows/native-a20-n0-saved.yml"
  push:
    branches: [main, "research/**", "codex/**"]
    paths:
      - "research/native_a20_n0/**"
      - ".github/workflows/native-a20-n0-saved.yml"
permissions:
  contents: read
jobs:
  offline-saved-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      A20_N0_DATA_ROOT: n0-data/research/2026-10-04-n0-deterministic-controls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require a reviewed immutable data pin before publication
        run: |
          python3 -B - <<'PY'
          import json,re
          from pathlib import Path
          r=json.loads(Path('research/native_a20_n0/DATA-REFERENCE.json').read_text())
          assert r['publication_ready'] is True and re.fullmatch('[0-9a-f]{40}',r['commit'])
          assert r['commit']=='06cb1dffda0da624a16bce707d7729393d9bf2a8'
          PY
      - name: Fetch the immutable numeric evidence checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jiying2007/kws-data
          ref: 06cb1dffda0da624a16bce707d7729393d9bf2a8
          path: n0-data
          persist-credentials: false
          sparse-checkout: research/2026-10-04-n0-deterministic-controls
      - name: Require the exact evidence commit
        run: test "$(git -C n0-data rev-parse HEAD)" = "06cb1dffda0da624a16bce707d7729393d9bf2a8"
      - name: Validate complete saved evidence
        run: python3 -B research/native_a20_n0/validate.py --data-root "$A20_N0_DATA_ROOT" --require-published
      - name: Pure saved-data and tiny invented tests
        run: python3 -B -m unittest discover -s research/native_a20_n0/tests -v
      - name: Confirm tracked source and evidence unchanged
        run: |
          git diff --exit-code
          git -C n0-data diff --exit-code
