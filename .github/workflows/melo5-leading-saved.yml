name: Melo5 leading saved evidence
on:
  pull_request:
    paths:
      - 'research/melo5-leading-context-v1/**'
      - '.github/workflows/melo5-leading-saved.yml'
  push:
    paths:
      - 'research/melo5-leading-context-v1/**'
      - '.github/workflows/melo5-leading-saved.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saved-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the hosted Python interpreter
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Prepare immutable public saved inputs
        working-directory: research/melo5-leading-context-v1
        run: python3 -B prepare_inputs.py --output-dir build/fixtures
      - name: Verify saved evidence offline
        working-directory: research/melo5-leading-context-v1
        run: |
          python3 -B verify_saved.py --data-dir build/fixtures/data --dependencies build/fixtures/dependencies
          python3 -B -m unittest discover -s tests -v
