name: speech-like-provider-materialization-contract

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "tools/materialize_speech_like_provider.py"
      - "tools/speech_like_vits_resample_adapter.py"
      - "configs/training/speech-like-provider-reference-v1.json"
      - ".github/workflows/speech-like-provider-materialization-contract.yml"
  pull_request:
    paths:
      - "tools/materialize_speech_like_provider.py"
      - "tools/speech_like_vits_resample_adapter.py"
      - "configs/training/speech-like-provider-reference-v1.json"
      - ".github/workflows/speech-like-provider-materialization-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build fake generation environment
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/provider-materialization"
          mkdir -p "$root/assets"
          cat > "$root/fake-tts" <<'EOF'
          #!/usr/bin/env bash
          exit 0
          EOF
          chmod +x "$root/fake-tts"
          cat > "$root/fake-vits-8k" <<'PY'
          #!/usr/bin/env python3
          import math, pathlib, struct, sys, wave
          output = None
          for arg in sys.argv[1:]:
              if arg.startswith("--output-filename="):
                  output = pathlib.Path(arg.split("=", 1)[1])
          if output is None:
              raise SystemExit("missing --output-filename")
          output.parent.mkdir(parents=True, exist_ok=True)
          frames = [int(4000 * math.sin(2.0 * math.pi * 440.0 * n / 8000.0)) for n in range(800)]
          with wave.open(str(output), "wb") as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(8000)
              w.writeframes(b"".join(struct.pack("<h", x) for x in frames))
          PY
          chmod +x "$root/fake-vits-8k"
          cat > "$root/fake-ffmpeg" <<'PY'
          #!/usr/bin/env python3
          import pathlib, struct, sys, wave
          args = sys.argv[1:]
          source = pathlib.Path(args[args.index("-i") + 1])
          output = pathlib.Path(args[-1])
          with wave.open(str(source), "rb") as r:
              assert r.getnchannels() == 1 and r.getsampwidth() == 2 and r.getframerate() == 8000
              raw = r.readframes(r.getnframes())
          samples = struct.unpack("<" + "h" * (len(raw) // 2), raw)
          output.parent.mkdir(parents=True, exist_ok=True)
          with wave.open(str(output), "wb") as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(16000)
              w.writeframes(b"".join(struct.pack("<hh", x, x) for x in samples))
          PY
          chmod +x "$root/fake-ffmpeg"
          printf 'fake-model\n' > "$root/assets/model.onnx"
          printf 'fake-tokens\n' > "$root/assets/tokens.txt"
          printf 'fake-lexicon\n' > "$root/assets/lexicon.txt"
          printf 'LicenseRef-test-fixture evidence\n' > "$root/assets/LICENSE.txt"
          printf '%s\n' '---' 'license: apache-2.0' '---' > "$root/assets/AISHELL3-MODEL-CARD.md"
          python3 - <<'PY'
          import json, os, pathlib
          plan = json.loads(pathlib.Path("configs/training/speech-like-corpus-plan-v1.json").read_text())
          slots = []
          for split in ("train", "calibration", "test", "qualification"):
              slots.extend(plan["split_roles"][split]["voice_slots"])
          rows = [
              {"slot": slot, "speaker_id": index, "length_scale": 0.90 + (index % 5) * 0.05}
              for index, slot in enumerate(slots)
          ]
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "provider-materialization"
          (root / "speaker-map.json").write_text(json.dumps({
              "schema_version": 1,
              "evidence_class": "speech-like-provider-speaker-map-v1",
              "speakers": rows,
          }, indent=2) + "\n")
          PY

      - name: Materialize provider and exact voice inventory
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/provider-materialization"
          python3 tools/materialize_speech_like_provider.py             --corpus-plan configs/training/speech-like-corpus-plan-v1.json             --command-policy configs/training/speech-like-command-provider-v1.json             --speaker-map "$root/speaker-map.json"             --provider-name sherpa-onnx-test             --provider-version fixture-v1             --license-id LicenseRef-test-fixture             --license-file "$root/assets/LICENSE.txt"             --executable "$root/fake-tts"             --model "$root/assets/model.onnx"             --tokens "$root/assets/tokens.txt"             --lexicon "$root/assets/lexicon.txt"             --output-provider "$root/provider.json"             --output-inventory "$root/inventory.jsonl"             --summary "$root/provider-summary.json"

      - name: Reuse canonical provider and corpus-plan validators
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/provider-materialization"
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, "tools")
          from generate_speech_like_command_provider import load_policy, normalize_provider
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "provider-materialization"
          path = root / "provider.json"
          policy = load_policy(pathlib.Path("configs/training/speech-like-command-provider-v1.json"))
          value = json.loads(path.read_text())
          normalized = normalize_provider(path, value, policy)
          assert normalized["provider_name"] == "sherpa-onnx-test"
          assert {item["role"] for item in normalized["identity"]["assets"]} == {"model", "tokens", "lexicon", "license_evidence"}
          summary = json.loads((root / "provider-summary.json").read_text())
          assert summary["license_evidence_sha256"]
          assert summary["voice_slots"] == 24
          assert summary["protected_evidence_used"] is False
          PY
          python3 tools/speech_like_corpus_plan.py build             --plan configs/training/speech-like-corpus-plan-v1.json             --voice-inventory "$root/inventory.jsonl"             --requests "$root/requests.jsonl"             --intents "$root/intents.jsonl"             --summary "$root/request-summary.json"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "provider-materialization"
          s = json.loads((root / "request-summary.json").read_text())
          assert s["voice_slots"] == 24
          assert s["requests"] == 384
          assert s["protected_evidence_used"] is False
          print("speech-like-provider-materialization-contract: ok")
          PY

      - name: Verify pinned AISHELL3 license-safe reference
        run: |
          python3 - <<'PY'
          import json, pathlib
          ref = json.loads(pathlib.Path("configs/training/speech-like-provider-reference-v1.json").read_text())
          assert ref["preferred_stage_a_candidate"] == "icefall-tts-aishell3-vits-low-2024-04-06"
          row = next(x for x in ref["reference_candidates"] if x["name"] == ref["preferred_stage_a_candidate"])
          assert row["provider_profile"] == "sherpa-vits-resampled-to-16k-v1"
          assert row["reported_speakers"] == 174
          assert row["reported_sample_rate_hz"] == 8000
          assert row["normalized_sample_rate_hz"] == 16000
          assert row["suitable_for_24_voice_baseline"] is True
          assert row["license_id"] == "Apache-2.0"
          assert row["license_status"] == "verified-apache-2.0-pinned-model-card"
          evidence = row["license_evidence"]
          assert evidence["revision"] == "57345c004e13ed640e408c4c29ab56187b18f065"
          assert evidence["path"] == "README.md"
          assert evidence["expected_sha256"] == "98b45ea81164d1e1a1dd82255207053b15cd6c69d922a1c5cf3387ce604d4b74"
          fanchen = next(x for x in ref["reference_candidates"] if x["name"] == "sherpa-onnx-vits-zh-hf-fanchen-C")
          assert fanchen["suitable_for_24_voice_baseline"] is False
          assert fanchen["license_status"].startswith("blocked-")
          PY

      - name: Materialize and execute resampled VITS provider
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/provider-materialization"
          python3 tools/materialize_speech_like_provider.py \
            --corpus-plan configs/training/speech-like-corpus-plan-v1.json \
            --command-policy configs/training/speech-like-command-provider-v1.json \
            --speaker-map "$root/speaker-map.json" \
            --provider-profile sherpa-vits-resampled-to-16k-v1 \
            --provider-name icefall-aishell3-fixture \
            --provider-version fixture-v1 \
            --license-id Apache-2.0 \
            --license-file "$root/assets/AISHELL3-MODEL-CARD.md" \
            --provider-reference configs/training/speech-like-provider-reference-v1.json \
            --reference-candidate icefall-tts-aishell3-vits-low-2024-04-06 \
            --executable "$(command -v python3)" \
            --adapter tools/speech_like_vits_resample_adapter.py \
            --backend-executable "$root/fake-vits-8k" \
            --resampler-executable "$root/fake-ffmpeg" \
            --source-sample-rate 8000 \
            --model "$root/assets/model.onnx" \
            --tokens "$root/assets/tokens.txt" \
            --lexicon "$root/assets/lexicon.txt" \
            --output-provider "$root/provider-resampled.json" \
            --output-inventory "$root/inventory-resampled.jsonl" \
            --summary "$root/provider-resampled-summary.json"
          cat > "$root/one-request.jsonl" <<'EOF'
          {"schema_version":1,"group":"train","text":"你好小窝","tokens":["ni3","hao3","xiao3","wo1"],"voice_id":"icefall-aishell3-fixture:sid-0000","source_id":"fixture:one","parameters":{"speaker_id":0,"length_scale":1.0}}
          EOF
          python3 tools/generate_speech_like_command_provider.py \
            --policy configs/training/speech-like-command-provider-v1.json \
            --provider "$root/provider-resampled.json" \
            --requests "$root/one-request.jsonl" \
            --output-root "$root/generated-resampled" \
            --summary "$root/generated-resampled-summary.json"
          ROOT="$root" python3 - <<'PY'
          import json, os, pathlib, wave
          root = pathlib.Path(os.environ["ROOT"])
          provider = json.loads((root / "provider-resampled.json").read_text())
          roles = {item["role"] for item in provider["assets"]}
          assert roles == {
              "adapter", "backend_executable", "resampler_executable",
              "model", "tokens", "lexicon", "license_evidence",
          }
          summary = json.loads((root / "provider-resampled-summary.json").read_text())
          assert summary["provider_profile"] == "sherpa-vits-resampled-to-16k-v1"
          assert summary["license_id"] == "Apache-2.0"
          assert summary["license_reference_verified"] is True
          reference = summary["provider_reference"]
          assert reference["candidate"] == "icefall-tts-aishell3-vits-low-2024-04-06"
          assert reference["license_evidence_sha256"] == "98b45ea81164d1e1a1dd82255207053b15cd6c69d922a1c5cf3387ce604d4b74"
          assert reference["license_source"]["revision"] == "57345c004e13ed640e408c4c29ab56187b18f065"
          assert reference["reported_speakers"] == 174
          norm = summary["audio_normalization"]
          assert norm["source_sample_rate_hz"] == 8000
          assert norm["output_sample_rate_hz"] == 16000
          assert norm["resampled"] is True
          wav = root / "generated-resampled" / "train" / "recording-000000.wav"
          with wave.open(str(wav), "rb") as r:
              assert r.getnchannels() == 1
              assert r.getsampwidth() == 2
              assert r.getframerate() == 16000
              assert r.getnframes() > 0
          generated = json.loads((root / "generated-resampled-summary.json").read_text())
          assert generated["recordings"] == 1
          PY

      - name: Wrong license evidence cannot impersonate pinned AISHELL3 reference
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/provider-materialization"
          if python3 tools/materialize_speech_like_provider.py \
            --corpus-plan configs/training/speech-like-corpus-plan-v1.json \
            --command-policy configs/training/speech-like-command-provider-v1.json \
            --speaker-map "$root/speaker-map.json" \
            --provider-profile sherpa-vits-resampled-to-16k-v1 \
            --provider-name icefall-aishell3-fixture \
            --provider-version fixture-v1 \
            --license-id Apache-2.0 \
            --license-file "$root/assets/LICENSE.txt" \
            --provider-reference configs/training/speech-like-provider-reference-v1.json \
            --reference-candidate icefall-tts-aishell3-vits-low-2024-04-06 \
            --executable "$(command -v python3)" \
            --adapter tools/speech_like_vits_resample_adapter.py \
            --backend-executable "$root/fake-vits-8k" \
            --resampler-executable "$root/fake-ffmpeg" \
            --source-sample-rate 8000 \
            --model "$root/assets/model.onnx" \
            --tokens "$root/assets/tokens.txt" \
            --lexicon "$root/assets/lexicon.txt" \
            --output-provider "$root/bad-reference-provider.json" \
            --output-inventory "$root/bad-reference-inventory.jsonl" \
            --summary "$root/bad-reference-summary.json"; then
            echo "unpinned license evidence unexpectedly accepted" >&2
            exit 1
          fi

      - name: Resampler tamper invalidates resampled provider
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/provider-materialization"
          printf '# tamper\n' >> "$root/fake-ffmpeg"
          if python3 - "$root/provider-resampled.json" <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, "tools")
          from generate_speech_like_command_provider import load_policy, normalize_provider
          path = pathlib.Path(sys.argv[1])
          normalize_provider(
              path,
              json.loads(path.read_text()),
              load_policy(pathlib.Path("configs/training/speech-like-command-provider-v1.json")),
          )
          PY
          then
            echo "tampered resampler unexpectedly accepted" >&2
            exit 1
          fi

      - name: Unknown license must fail closed
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/provider-materialization"
          if python3 tools/materialize_speech_like_provider.py             --corpus-plan configs/training/speech-like-corpus-plan-v1.json             --command-policy configs/training/speech-like-command-provider-v1.json             --speaker-map "$root/speaker-map.json"             --provider-name bad --provider-version bad --license-id unknown             --license-file "$root/assets/LICENSE.txt"             --executable "$root/fake-tts"             --model "$root/assets/model.onnx" --tokens "$root/assets/tokens.txt" --lexicon "$root/assets/lexicon.txt"             --output-provider "$root/bad-provider.json" --output-inventory "$root/bad-inventory.jsonl" --summary "$root/bad-summary.json"; then
            echo "unknown license unexpectedly accepted" >&2
            exit 1
          fi

      - name: Duplicate speaker reuse must fail closed
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/provider-materialization"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "provider-materialization"
          value = json.loads((root / "speaker-map.json").read_text())
          value["speakers"][1]["speaker_id"] = value["speakers"][0]["speaker_id"]
          (root / "duplicate-speaker-map.json").write_text(json.dumps(value, indent=2) + "\n")
          PY
          if python3 tools/materialize_speech_like_provider.py             --corpus-plan configs/training/speech-like-corpus-plan-v1.json             --command-policy configs/training/speech-like-command-provider-v1.json             --speaker-map "$root/duplicate-speaker-map.json"             --provider-name bad --provider-version bad --license-id LicenseRef-test             --license-file "$root/assets/LICENSE.txt"             --executable "$root/fake-tts"             --model "$root/assets/model.onnx" --tokens "$root/assets/tokens.txt" --lexicon "$root/assets/lexicon.txt"             --output-provider "$root/bad2-provider.json" --output-inventory "$root/bad2-inventory.jsonl" --summary "$root/bad2-summary.json"; then
            echo "duplicate speaker unexpectedly accepted" >&2
            exit 1
          fi

      - name: License evidence tamper must invalidate provider
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/provider-materialization"
          printf 'tamper\n' >> "$root/assets/LICENSE.txt"
          if python3 - "$root/provider.json" <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, "tools")
          from generate_speech_like_command_provider import load_policy, normalize_provider
          path = pathlib.Path(sys.argv[1])
          normalize_provider(
              path,
              json.loads(path.read_text()),
              load_policy(pathlib.Path("configs/training/speech-like-command-provider-v1.json")),
          )
          PY
          then
            echo "tampered model unexpectedly accepted" >&2
            exit 1
          fi

      - name: Python syntax
        run: python3 -m py_compile tools/materialize_speech_like_provider.py tools/speech_like_vits_resample_adapter.py

      - name: Worktree remains clean
        run: git diff --exit-code -- .
