name: tmp-renderer-external-base-staging

on:
  push:
    branches: ["codex/speech-like-renderer-external-base-v1"]
    paths:
      - ".github/workflows/tmp-renderer-external-base-staging.yml"
      - "tmp/renderer-external-base-staging.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/speech-like-renderer-external-base-v1
      - name: Patch renderer and existing scene contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('training/render_domains.py')
          text = path.read_text(encoding='utf-8')
          old = 'from frontend_spec import SAMPLE_RATE_HZ\nfrom rir_manifest import load_rir_manifest\n'
          new = 'from frontend_spec import SAMPLE_RATE_HZ\nfrom external_base_dataset import load_external_base_bundle\nfrom rir_manifest import load_rir_manifest\n'
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    base_dir = output / "base"\n    base_summary = generate_dataset(config_path, base_dir)\n    base_rows = load_jsonl(base_dir / "dataset-index.jsonl")\n    seed = int(config.get("seed", 1337))\n'''
          new = '''    base_dir = output / "base"\n    external_base = load_external_base_bundle(config_path, config)\n    external_base_identity = None\n    if external_base is None:\n        base_summary = generate_dataset(config_path, base_dir)\n        base_rows = load_jsonl(base_dir / "dataset-index.jsonl")\n        base_dataset_summary_sha256 = sha256_file(base_dir / "dataset-summary.json")\n    else:\n        base_rows, external_summary = external_base\n        base_dir.mkdir(parents=True, exist_ok=True)\n        base_index_path = base_dir / "dataset-index.jsonl"\n        base_index_path.write_text(\n            "\\n".join(\n                json.dumps(row, ensure_ascii=False, sort_keys=True, allow_nan=False)\n                for row in base_rows\n            )\n            + "\\n",\n            encoding="utf-8",\n        )\n        base_summary = dict(external_summary)\n        base_summary_path = base_dir / "dataset-summary.json"\n        base_summary_path.write_text(\n            json.dumps(\n                base_summary,\n                ensure_ascii=False,\n                indent=2,\n                sort_keys=True,\n                allow_nan=False,\n            )\n            + "\\n",\n            encoding="utf-8",\n        )\n        base_dataset_summary_sha256 = sha256_file(base_summary_path)\n        external_base_identity = {\n            "evidence_class": str(external_summary["evidence_class"]),\n            "bundle_sha256": str(external_summary["bundle_sha256"]),\n            "recordings": int(external_summary["recordings"]),\n            "summary_sha256": base_dataset_summary_sha256,\n        }\n    seed = int(config.get("seed", 1337))\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        "base_dataset_summary_sha256": sha256_file(\n            base_dir / "dataset-summary.json"\n        ),\n'''
          new = '''        "base_dataset_summary_sha256": base_dataset_summary_sha256,\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    summary_path = output / "domain-summary.json"\n'''
          new = '''    if external_base_identity is not None:\n        summary["external_base_dataset"] = external_base_identity\n\n    summary_path = output / "domain-summary.json"\n'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_domain_scene.py')
          text = path.read_text(encoding='utf-8')
          old = '''from render_domains import (  # noqa: E402\n    _deterministic_eval_scene,\n    _evaluation_axes,\n    _sample_snr,\n    validate_domains,\n)\n'''
          new = '''from render_domains import (  # noqa: E402\n    _deterministic_eval_scene,\n    _evaluation_axes,\n    _sample_snr,\n    render_domain_dataset,\n    validate_domains,\n)\n'''
          assert old in text
          text = text.replace(old, new, 1)

          marker = '\n\ndef main() -> int:\n'
          assert marker in text
          fn = r'''

def test_external_speech_like_base_renderer() -> None:
    with tempfile.TemporaryDirectory() as tmp:
        root = pathlib.Path(tmp)
        config = json.loads(
            (ROOT / "configs" / "training" / "xiaowo.torch-domain.json").read_text(
                encoding="utf-8"
            )
        )
        config.pop("robustness_gates", None)
        config["domains"]["scenes_per_example"] = {
            split: 1 for split in ("train", "calibration", "test", "qualification")
        }
        external = {}
        for index, split in enumerate(("train", "calibration", "test", "qualification")):
            wav = root / f"{split}.wav"
            samples = [0] * 800 + clean_tone()[:3200] + [0] * 800
            write_pcm16(wav, samples)
            wav_sha = hashlib.sha256(wav.read_bytes()).hexdigest()
            row = {
                "split": split,
                "kind": "positive",
                "family_id": f"speech-like-{split}-000000",
                "variant": 0,
                "keyword_id": 1,
                "tokens": ["ni3", "hao3", "xiao3", "wo1"],
                "target_ids": [1, 2, 3, 4],
                "wav_sha256": wav_sha,
                "frames": len(samples),
                "event_start_frame": 800,
                "event_end_frame": 4000,
                "path": str(wav.resolve()),
                "speech_like_provenance": {
                    "provider_kind": "offline-tts",
                    "provider_name": "fixture",
                    "provider_version": "1",
                    "license_id": "fixture-test-only",
                    "voice_id": f"voice-{index}",
                    "source_id": f"source-{index}",
                    "generation_config_sha256": hashlib.sha256(
                        f"generation-{index}".encode()
                    ).hexdigest(),
                    "label_provenance_sha256": hashlib.sha256(
                        f"label-{index}".encode()
                    ).hexdigest(),
                    "pcm_sha256": hashlib.sha256(
                        b"".join(struct.pack("<h", value) for value in samples)
                    ).hexdigest(),
                },
            }
            index_path = root / f"{split}.index.jsonl"
            index_path.write_text(
                json.dumps(row, ensure_ascii=False, sort_keys=True) + "\n",
                encoding="utf-8",
            )
            summary = {
                "schema_version": 1,
                "evidence_class": "speech-like-base-dataset-v1",
                "split": split,
                "recordings": 1,
                "positive_recordings": 1,
                "negative_recordings": 0,
                "corpus_sha256": hashlib.sha256(
                    f"corpus-{index}".encode()
                ).hexdigest(),
                "tone_backend_used": False,
            }
            summary_path = root / f"{split}.summary.json"
            summary_path.write_text(
                json.dumps(summary, ensure_ascii=False, sort_keys=True) + "\n",
                encoding="utf-8",
            )
            external[split] = {
                "index": str(index_path.resolve()),
                "summary": str(summary_path.resolve()),
                "index_sha256": hashlib.sha256(index_path.read_bytes()).hexdigest(),
                "summary_sha256": hashlib.sha256(summary_path.read_bytes()).hexdigest(),
            }
        config["generator"]["external_base_dataset"] = external
        config_path = root / "config.json"
        config_path.write_text(
            json.dumps(config, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )
        output = root / "rendered"
        summary = render_domain_dataset(config_path, output)
        assert summary["external_base_dataset"]["evidence_class"] == "external-speech-like-base-bundle-v1"
        assert len(summary["external_base_dataset"]["bundle_sha256"]) == 64
        assert summary["external_base_dataset"]["recordings"] == 4
        assert not (output / "base" / "token-carriers.json").exists()
        base_summary = json.loads((output / "base" / "dataset-summary.json").read_text())
        assert base_summary["tone_backend_used"] is False
        assert base_summary["recordings"] == 4
        domain_rows = [
            json.loads(line)
            for line in (output / "domain-index.jsonl").read_text().splitlines()
            if line.strip()
        ]
        assert len(domain_rows) == 4
        assert {row["split"] for row in domain_rows} == {
            "train", "calibration", "test", "qualification"
        }
        assert all(row["speech_like_provenance"]["provider_kind"] == "offline-tts" for row in domain_rows)
'''
          text = text.replace(marker, fn + marker, 1)
          old = '''def main() -> int:\n    test_deterministic_robustness_axes()\n'''
          new = '''def main() -> int:\n    test_deterministic_robustness_axes()\n    test_external_speech_like_base_renderer()\n'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Scene renderer contract
        run: python3 tests/test_domain_scene.py
      - name: Python syntax
        run: python3 -m py_compile training/render_domains.py tests/test_domain_scene.py
      - name: Diff check
        run: git diff --check
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/render_domains.py tests/test_domain_scene.py
          git commit -m "data: allow immutable speech-like base rendering"
          git push origin HEAD:codex/speech-like-renderer-external-base-v1
