name: development-generalization-seed-contract

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "tools/build_development_generalization_seed.py"
      - ".github/workflows/development-generalization-seed-contract.yml"
  pull_request:
    paths:
      - "tools/build_development_generalization_seed.py"
      - ".github/workflows/development-generalization-seed-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build domain and robustness fixtures
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/generalization-seed"
          mkdir -p "$root"
          cat > "$root/domain.json" <<'EOF'
          {
            "schema_version": 6,
            "overall": {
              "expected": 256,
              "false_rejects": 1,
              "false_accepts": 2,
              "negative_audio_hours": 4.0
            },
            "keyword_domains": {
              "1": {"overall": {"expected": 128, "false_rejects": 1}},
              "2": {"overall": {"expected": 128, "false_rejects": 0}}
            }
          }
          EOF
          cat > "$root/robustness-performance-fail.json" <<'EOF'
          {
            "schema_version": 4,
            "evidence_class": "synthetic-domain-robustness-matrix",
            "qualified": false,
            "blocked": false,
            "gates": {},
            "slices": {},
            "failures": [
              {"slice": "distance_bin:5m", "reason": "frr", "actual": 0.25, "limit": 0.0}
            ]
          }
          EOF
          cat > "$root/robustness-coverage-fail.json" <<'EOF'
          {
            "schema_version": 4,
            "evidence_class": "synthetic-domain-robustness-matrix",
            "qualified": false,
            "blocked": false,
            "gates": {},
            "slices": {},
            "failures": [
              {"slice": "distance_bin:5m", "reason": "missing-slice"},
              {"slice": "distance_bin:3m", "reason": "far-per-hour", "actual": 1.0, "limit": 0.0}
            ]
          }
          EOF
      - name: Performance failure must not masquerade as coverage failure
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/generalization-seed"
          for i in 0 1 2 3; do
            python3 tools/build_development_generalization_seed.py \
              --domain-metrics "$root/domain.json" \
              --robustness "$root/robustness-performance-fail.json" \
              --tier search --model-family rnn --candidate-id rnn-h48 \
              --source-identity "source-$i" --seed "$((9000+i))" \
              --output "$root/seed-$i.json"
          done
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'generalization-seed'
          value = json.loads((root / 'seed-0.json').read_text())
          assert value['coverage_passed'] is True
          assert value['coverage_failures'] == []
          assert len(value['performance_failures_observed']) == 1
          assert value['performance_failures_observed'][0]['reason'] == 'frr'
          assert value['fresh_used'] is False and value['shadow_used'] is False and value['formal_qualification_used'] is False
          PY
      - name: Aggregate four independent search seeds statistically
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/generalization-seed"
          python3 tools/development_generalization.py \
            --policy configs/training/development-generalization-v1.json \
            --tier search \
            --seed-summary "$root/seed-0.json" \
            --seed-summary "$root/seed-1.json" \
            --seed-summary "$root/seed-2.json" \
            --seed-summary "$root/seed-3.json" \
            --output "$root/report.json"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'generalization-seed'
          report = json.loads((root / 'report.json').read_text())
          assert report['independent_seed_count'] == 4
          assert report['coverage_passed'] is True
          assert report['pooled']['expected_wakes'] == 1024
          assert report['pooled']['false_rejects'] == 4
          assert report['pooled']['false_accepts'] == 8
          assert report['protected_evidence_used'] is False
          assert report['statistical_gate_mode'] == 'report-only-until-baseline-calibrated'
          print('development-generalization-seed-contract: ok')
          PY
      - name: Missing/support failure must fail coverage independently of performance
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/generalization-seed"
          python3 tools/build_development_generalization_seed.py \
            --domain-metrics "$root/domain.json" \
            --robustness "$root/robustness-coverage-fail.json" \
            --tier search --model-family gru --candidate-id gru-h48 \
            --source-identity coverage-bad --seed 9999 \
            --output "$root/coverage-bad.json"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'generalization-seed'
          value = json.loads((root / 'coverage-bad.json').read_text())
          assert value['coverage_passed'] is False
          assert [item['reason'] for item in value['coverage_failures']] == ['missing-slice']
          assert [item['reason'] for item in value['performance_failures_observed']] == ['far-per-hour']
          PY
      - name: Python syntax
        run: python3 -m py_compile tools/build_development_generalization_seed.py
      - name: Worktree remains clean
        run: git diff --exit-code -- .
