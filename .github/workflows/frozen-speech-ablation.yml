name: frozen-speech-ablation

on:
  pull_request:
    branches: [main]
    paths:
      - 'training/frozen_speech_ablation.py'
      - 'tests/test_frozen_speech_ablation.py'
      - '.github/workflows/frozen-speech-ablation.yml'

permissions:
  contents: read

concurrency:
  group: frozen-speech-ablation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OMP_DYNAMIC: 'FALSE'
  MKL_NUM_THREADS: '1'
  MKL_CBWR: COMPATIBLE
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  ATEN_CPU_CAPABILITY: default

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pool_sha: ${{ steps.pool.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify and download existing immutable speech base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          contract=configs/training/product-speech-like-base-v1.json
          tag="$(jq -r .release_tag "$contract")"
          archive="$(jq -r .release_archive "$contract")"
          mkdir -p build/frozen-download
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > build/frozen-download/release.json
          jq -e --argjson id "$(jq .release_id "$contract")" \
            --arg target "$(jq -r .source_repro_head_sha "$contract")" \
            '.id == $id and .immutable == true and .draft == false and .prerelease == false and .target_commitish == $target' \
            build/frozen-download/release.json > /dev/null
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir build/frozen-download
          echo "$(jq -r .release_archive_sha256 "$contract")  build/frozen-download/$archive" | sha256sum -c -
      - name: Prepare portable development pool without TTS or mining
        id: pool
        run: |
          python3 tests/test_frozen_speech_ablation.py
          archive="$(jq -r .release_archive configs/training/product-speech-like-base-v1.json)"
          python3 training/frozen_speech_ablation.py prepare --archive "build/frozen-download/$archive" --output build/frozen-pool
          echo "sha=$(sha256sum build/frozen-pool/pool.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Retain frozen inputs before training
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-speech-pool-${{ github.event.pull_request.head.sha }}
          path: build/frozen-pool/
          if-no-files-found: error
          retention-days: 14

  trial:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: [current, ctc-only]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frozen-speech-pool-${{ github.event.pull_request.head.sha }}
          path: build/frozen-pool
      - name: Build exact C inference and posterior tools
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel 2 --target kws_wav kws_posterior_dump
      - name: Install pinned CPU runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run bounded frozen-speech trial
        env:
          POOL_SHA: ${{ needs.prepare.outputs.pool_sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          .venv/bin/python training/frozen_speech_ablation.py trial \
            --pool build/frozen-pool --pool-sha "$POOL_SHA" --variant "$VARIANT" \
            --output "build/frozen-results/$VARIANT" --runner build/kws_wav \
            --posterior-dump build/kws_posterior_dump --epochs 36 --seed 1337
      - name: Retain checkpoint and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-speech-${{ matrix.variant }}-${{ github.event.pull_request.head.sha }}
          path: build/frozen-results/
          if-no-files-found: warn
          retention-days: 14

  compare:
    needs: [prepare, trial]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: frozen-speech-*-only-${{ github.event.pull_request.head.sha }}
          path: results
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frozen-speech-current-${{ github.event.pull_request.head.sha }}
          path: results/current
      - name: Verify paired inputs and report actual runtime outcomes
        env:
          POOL_SHA: ${{ needs.prepare.outputs.pool_sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          rows=[json.loads(p.read_text()) for p in pathlib.Path('results').rglob('summary.json')]
          assert len(rows)==2 and {r['variant'] for r in rows}=={'current','ctc-only'}
          assert {r['pool_sha256'] for r in rows}=={os.environ['POOL_SHA']}
          for key in ('source_tree','seed','epochs','runner_sha256','posterior_dump_sha256'):
              assert len({r[key] for r in rows})==1, key
          assert len({r['readback']['training_corpus_sha256'] for r in rows})==1
          result={'policy':'clean-frozen-speech-ablation-v1','infrastructure_complete':True,
                  'release_authority':False,'quality_pass_claimed':False,
                  'outcomes':[{k:r[k] for k in ('variant','readback','train_seconds','runtime')} for r in rows]}
          pathlib.Path('comparison.json').write_text(json.dumps(result,indent=2,sort_keys=True,allow_nan=False)+'\n')
          print(json.dumps({r['variant']:{s:{k:r['runtime'][s][k] for k in ('frr','far_per_hour')} for s in ('train','calibration','test')} for r in rows},sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-speech-comparison-${{ github.event.pull_request.head.sha }}
          path: comparison.json
          if-no-files-found: error
          retention-days: 14
