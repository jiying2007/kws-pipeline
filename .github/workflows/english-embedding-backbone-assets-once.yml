name: English shared embedding backbone asset audit once
on:
  pull_request:
    paths:
      - configs/research/english-embedding-backbone-assets-20261116.json
      - research/english_embedding_backbone/audit_openwakeword_assets.py
      - research/english_embedding_backbone/test_asset_contract.py
      - research/english_final_embedding/**
      - .github/workflows/english-embedding-backbone-assets-once.yml
  push:
    branches: [main]
    paths:
      - configs/research/english-embedding-backbone-assets-20261116.json
      - research/english_final_embedding/**
      - .github/workflows/english-embedding-backbone-assets-once.yml
permissions:
  contents: read
concurrency:
  group: english-embedding-backbone-assets-20261116-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  source-contract:
    if: github.repository == 'jiying2007/kws-pipeline' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Source-only contract tests
        run: python3 -I -S -B research/english_embedding_backbone/test_asset_contract.py -v
      - name: Requested-intent head and portable C source tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B research/english_final_embedding/test_prepared_embedding.py -v
          python3 -I -S -B -O research/english_final_embedding/test_prepared_embedding.py -v
          python3 -I -S -B -OO research/english_final_embedding/test_prepared_embedding.py -v
          python3 -I -S -B research/english_final_embedding/test_portable_head.py -v
          python3 -I -S -B -O research/english_final_embedding/test_portable_head.py -v
          python3 -I -S -B -OO research/english_final_embedding/test_portable_head.py -v
  inspect-assets:
    needs: source-contract
    if: github.repository == 'jiying2007/kws-pipeline' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.sha == '511ccee46dc2fc01483b0d598cfd7fefb286bf31'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download exact upstream release metadata and four shared feature assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oww-assets"
          curl --fail --location --silent --show-error --retry 0 \
            https://api.github.com/repos/dscripka/openWakeWord/releases/tags/v0.5.1 \
            -o "$RUNNER_TEMP/oww-release.json"
          for name in melspectrogram.tflite embedding_model.tflite melspectrogram.onnx embedding_model.onnx; do
            curl --fail --location --silent --show-error --retry 0 \
              "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/$name" \
              -o "$RUNNER_TEMP/oww-assets/$name"
          done
      - name: Install pinned ONNX inspection runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/oww-venv"
          "$RUNNER_TEMP/oww-venv/bin/pip" install --disable-pip-version-check \
            "numpy==1.26.4" "onnx==1.17.0" "onnxruntime==1.20.1"
      - name: Hash assets and inspect ONNX graphs using synthetic zero tensors only
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/oww-venv/bin/python" -I -B \
            research/english_embedding_backbone/audit_openwakeword_assets.py \
            --assets "$RUNNER_TEMP/oww-assets" \
            --release-json "$RUNNER_TEMP/oww-release.json" \
            --output "$RUNNER_TEMP/oww-assets-audit.json"
      - name: Upload metadata-only audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-embedding-backbone-assets-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/oww-assets-audit.json
          retention-days: 30
          if-no-files-found: warn
