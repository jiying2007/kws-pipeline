name: research-sherpa-pcm
on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "research/sherpa_pcm/**"
      - ".github/workflows/research-sherpa-pcm.yml"
  pull_request:
    paths:
      - "research/sherpa_pcm/**"
      - ".github/workflows/research-sherpa-pcm.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-free-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source dependency lock
        run: python3 research/sherpa_pcm/verify_dependencies.py
      - name: Build model-free research C ABI lifecycle test
        run: python3 research/sherpa_pcm/build.py --stub --output "$RUNNER_TEMP/sherpa-pcm-stub"
      - name: Check local evidence input guards
        run: python3 research/sherpa_pcm/tests/test_parity_guards.py
      - name: Check optional parity driver syntax
        run: python3 -m py_compile research/sherpa_pcm/*.py research/sherpa_pcm/tests/*.py
