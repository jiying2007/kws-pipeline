name: record-fresh-v4-contract-fix

on:
  push:
    branches:
      - codex/record-gru-fresh-v4
    paths:
      - '.github/triggers/record-fresh-v4-contract-fix'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/record-gru-fresh-v4
      - name: Patch consumed Fresh v4 contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          frozen = Path('tests/test_gru_frozen_qualification_contract.py')
          text = frozen.read_text(encoding='utf-8')
          old = '''        self.assertEqual(current_fresh["status"], "reserved-untouched")\n        consumed_fresh = fresh_by_namespace[194000019]\n'''
          new = '''        self.assertEqual(current_fresh["status"], "opened")\n        self.assertEqual(current_fresh["source_run_id"], 35189536712)\n        self.assertEqual(\n            current_fresh["source_head"],\n            "88cfe044025602ab104e0e171707facd06d90500",\n        )\n        self.assertEqual(\n            current_fresh["source_artifact_digest"],\n            "sha256:47e96f7124438acccae3d2e3d74cbe10bff180d5856c0a86b4f1951e6081bd56",\n        )\n        self.assertEqual(\n            current_fresh["candidate_model_sha256"],\n            "6760e079a70bfd6291665dfb69c85c31e01aadfc61c48c77775caca753725aa6",\n        )\n        self.assertEqual(current_fresh["result"], "failed")\n        self.assertFalse(current_fresh["shadow_consumed"])\n        self.assertFalse(current_fresh["formal_qualification_seed_consumed"])\n        consumed_fresh = fresh_by_namespace[194000019]\n'''
          if old not in text:
              raise SystemExit('frozen contract marker missing')
          frozen.write_text(text.replace(old, new, 1), encoding='utf-8')

          acoustic = Path('tests/test_gru_train_acoustic_rotation.py')
          text = acoustic.read_text(encoding='utf-8')
          old = '''    protection = multiseed.validate_protected_seed_independence(\n        multi_policy,\n        real_config,\n        fresh_registry,\n        shadow_registry,\n    )\n    assert protection["fresh_registry_entry"] == "gru-fresh-validation-v4"\n    assert protection["fresh_registry_status"] == "reserved-untouched"\n    assert protection["shadow_arena"] == "gru-independent-shadow-v4"\n    assert protection["shadow_arena_status"] == "reserved-untouched"\n    assert protection["effective_exposure_seed_count"] == len(all_offsets)\n    assert protection["overlap_count"] == 0\n\n    bad_config = json.loads(json.dumps(real_config))\n'''
          new = '''    try:\n        multiseed.validate_protected_seed_independence(\n            multi_policy,\n            real_config,\n            fresh_registry,\n            shadow_registry,\n        )\n    except ValueError as exc:\n        assert "current fresh validation namespace is not reserved for GRU" in str(exc)\n    else:\n        raise AssertionError("consumed Fresh v4 namespace was accepted for new development")\n\n    reserved_fresh_registry = json.loads(json.dumps(fresh_registry))\n    for row in reserved_fresh_registry["namespaces"]:\n        if int(row.get("namespace", -1)) == int(\n            multi_policy["candidate_freeze"]["fresh_validation_seed_namespace"]\n        ):\n            row["status"] = "reserved-untouched"\n    protection = multiseed.validate_protected_seed_independence(\n        multi_policy,\n        real_config,\n        reserved_fresh_registry,\n        shadow_registry,\n    )\n    assert protection["fresh_registry_entry"] == "gru-fresh-validation-v4"\n    assert protection["fresh_registry_status"] == "reserved-untouched"\n    assert protection["shadow_arena"] == "gru-independent-shadow-v4"\n    assert protection["shadow_arena_status"] == "reserved-untouched"\n    assert protection["effective_exposure_seed_count"] == len(all_offsets)\n    assert protection["overlap_count"] == 0\n\n    bad_config = json.loads(json.dumps(real_config))\n'''
          if old not in text:
              raise SystemExit('acoustic contract marker missing')
          text = text.replace(old, new, 1)
          old_call = '''            fresh_registry,\n            shadow_registry,\n        )\n    except ValueError as exc:\n        assert "overlaps protected/model seed" in str(exc)\n'''
          new_call = '''            reserved_fresh_registry,\n            shadow_registry,\n        )\n    except ValueError as exc:\n        assert "overlaps protected/model seed" in str(exc)\n'''
          if old_call not in text:
              raise SystemExit('bad config marker missing')
          acoustic.write_text(text.replace(old_call, new_call, 1), encoding='utf-8')
          PY
          python3 tests/test_gru_frozen_qualification_contract.py
          python3 tests/test_gru_train_acoustic_rotation.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_gru_frozen_qualification_contract.py tests/test_gru_train_acoustic_rotation.py
          git commit -m 'test(training): encode consumed Fresh namespace transition'
          git push origin HEAD:codex/record-gru-fresh-v4
