name: retained-frozen-far-context-path-summary

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/triggers/retained-frozen-far-context-path-summary.json' # workflow-path-filter: allow-missing
      - '.github/workflows/retained-frozen-far-context-path-summary.yml'
      - 'tools/summarize_frozen_far_context_path.py'

permissions:
  contents: read
  actions: read

env:
  KWS_CONTEXT_PATH_SUMMARY_SPEC: .github/triggers/retained-frozen-far-context-path-summary.json

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      diagnostic_changed: ${{ steps.resolve.outputs.diagnostic_changed }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      source_artifact_id: ${{ steps.resolve.outputs.source_artifact_id }}
      source_head_sha: ${{ steps.resolve.outputs.source_head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test retained frozen FAR context path summary
        run: python3 tools/summarize_frozen_far_context_path.py --self-test

      - name: Resolve exact retained path summary request
        id: resolve
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$KWS_CONTEXT_PATH_SUMMARY_SPEC"; then
            echo "diagnostic_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -s "$KWS_CONTEXT_PATH_SUMMARY_SPEC"
          python3 tools/summarize_frozen_far_context_path.py             --verify-request             --request "$KWS_CONTEXT_PATH_SUMMARY_SPEC"             > build-retained-frozen-far-context-path-request.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import pathlib

          value=json.loads(
              pathlib.Path(os.environ["KWS_CONTEXT_PATH_SUMMARY_SPEC"])
              .read_text(encoding="utf-8")
          )
          print("diagnostic_changed=true")
          for key in ("source_run_id","source_artifact_id","source_head_sha"):
              print(f"{key}={value[key]}")
          PY

  summarize:
    needs: resolve
    if: needs.resolve.outputs.diagnostic_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download exact retained stream-context artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.resolve.outputs.source_run_id }}
          SOURCE_ARTIFACT_ID: ${{ needs.resolve.outputs.source_artifact_id }}
          SOURCE_HEAD_SHA: ${{ needs.resolve.outputs.source_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build .retained
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID"             > build/source-artifact-metadata.json
          python3 - <<'PY'
          import json
          import os
          import pathlib

          value=json.loads(
              pathlib.Path("build/source-artifact-metadata.json")
              .read_text(encoding="utf-8")
          )
          if int(value.get("id",-1)) != int(os.environ["SOURCE_ARTIFACT_ID"]):
              raise SystemExit("source artifact ID mismatch")
          expected=f"frozen-far-source-replay-{os.environ['SOURCE_HEAD_SHA']}"
          if value.get("name") != expected:
              raise SystemExit(
                  f"source artifact name mismatch: {value.get('name')} != {expected}"
              )
          if bool(value.get("expired")):
              raise SystemExit("source artifact is expired")
          workflow_run=value.get("workflow_run") or {}
          if int(workflow_run.get("id",-1)) != int(os.environ["SOURCE_RUN_ID"]):
              raise SystemExit("source artifact run mismatch")
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip"             > build/source-artifact.zip
          unzip -q build/source-artifact.zip -d .retained

      - name: Summarize retained kw2 decoder path evidence
        run: |
          set -euo pipefail
          python3 tools/summarize_frozen_far_context_path.py             --request "$KWS_CONTEXT_PATH_SUMMARY_SPEC"             --retained-root .retained             --output build/retained-frozen-far-context-path-summary.json

      - name: Retain decoder path summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retained-frozen-far-context-path-summary-${{ github.event.pull_request.head.sha }}
          path: |
            .github/triggers/retained-frozen-far-context-path-summary.json
            build/source-artifact-metadata.json
            build/retained-frozen-far-context-path-summary.json
          if-no-files-found: error
          retention-days: 30
