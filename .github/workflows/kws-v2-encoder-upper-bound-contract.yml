name: kws-v2-encoder-upper-bound-contract

on:
  push:
    branches:
      - "research/kws-architecture-v2-probe"
    paths:
      - "configs/training/kws-v2-fixed-keyword-upper-bound-v1.json"
      - "configs/training/kws-v2-encoder-frontend-upper-bound-sweep-v1.json"
      - ".github/workflows/kws-v2-fixed-keyword-upper-bound.yml"
      - ".github/workflows/kws-v2-encoder-frontend-upper-bound.yml"
      - ".github/workflows/kws-v2-encoder-upper-bound-contract.yml"
  pull_request:
    paths:
      - "configs/training/kws-v2-fixed-keyword-upper-bound-v1.json"
      - "configs/training/kws-v2-encoder-frontend-upper-bound-sweep-v1.json"
      - ".github/workflows/kws-v2-fixed-keyword-upper-bound.yml"
      - ".github/workflows/kws-v2-encoder-frontend-upper-bound.yml"
      - ".github/workflows/kws-v2-encoder-upper-bound-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify fixed-keyword upper-bound authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p=json.loads(pathlib.Path("configs/training/kws-v2-fixed-keyword-upper-bound-v1.json").read_text())
          assert p["policy"]=="kws-v2-fixed-keyword-upper-bound-v1"
          assert p["evidence_scope"]=="research-only"
          assert p["data"]["qualification_split_consumed"] is False
          assert p["model"]=={
              "architecture":"clip-gru-v1",
              "frontend":"logmel",
              "feature_dim":32,
              "hidden_dim":64,
              "classes":["nonwake","keyword-1","keyword-2"],
          }
          assert p["train"]=={
              "epochs":24,
              "batch_size":16,
              "learning_rate":0.001,
              "seed":1337,
              "balance_mode":"equal-class-sampler-v1",
          }
          assert p["authority"]=={
              "diagnostic_only":True,
              "promotion_allowed":False,
              "protected_evidence_used":False,
              "shipping_metric":False,
          }
          print("fixed-keyword upper-bound contract: ok")
          PY

      - name: Verify sweep candidates change one variable
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p=json.loads(pathlib.Path("configs/training/kws-v2-encoder-frontend-upper-bound-sweep-v1.json").read_text())
          assert p["policy"]=="kws-v2-encoder-frontend-upper-bound-sweep-v1"
          assert p["evidence_scope"]=="research-only"
          b=p["baseline"]
          assert (b["frontend"],b["hidden_dim"],b["epochs"],b["seed"])==("logmel",64,24,1337)
          fixed=p["fixed"]
          assert fixed["qualification_split_consumed"] is False
          assert fixed["rendered_cache_run_id"]==35412153192
          assert fixed["sidecar_run_id"]==35367960968
          candidates=p["candidates"]
          assert list(candidates)==[
              "b0-logmel64","f1-pcen64","c1-logmel128","fc1-pcen128"
          ]
          b0=candidates["b0-logmel64"]
          assert b0["single_variable"]=="none"
          assert (b0["frontend"],b0["hidden_dim"])==("logmel",64)
          f=candidates["f1-pcen64"]
          assert f["single_variable"]=="frontend"
          assert (f["frontend"],f["hidden_dim"])==("pcen-lite",64)
          c=candidates["c1-logmel128"]
          assert c["single_variable"]=="hidden_dim"
          assert (c["frontend"],c["hidden_dim"])==("logmel",128)
          fc=candidates["fc1-pcen128"]
          assert fc["single_variable"]=="frontend+hidden_dim"
          assert (fc["frontend"],fc["hidden_dim"])==("pcen-lite",128)
          op=p["threshold_operating_point"]
          assert [row["max_negative_fp_rate"] for row in op["calibration_constraints"]]==[0.2,0.1,0.05]
          rules=p["decision_rules"]
          assert rules["decision_basis"]=="calibration-selected-threshold-transfer-to-test"
          assert rules["primary_operating_point"]=="strict-10fp"
          assert rules["secondary_operating_point"]=="strict-05fp"
          assert rules["material_gain_min_test_wake_recall_delta"]==0.10
          assert rules["material_gain_max_test_negative_fp_rate_regression"]==0.02
          assert set(p["baseline"]["operating_points"])=={"balanced-20fp","strict-10fp","strict-05fp"}
          assert p["authority"]=={
              "diagnostic_only":True,
              "promotion_allowed":False,
              "protected_evidence_used":False,
              "shipping_metric":False,
          }
          print("encoder/frontend sweep single-variable contract: ok")
          PY

      - name: Verify workflows avoid protected evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          for name in (
              ".github/workflows/kws-v2-fixed-keyword-upper-bound.yml",
              ".github/workflows/kws-v2-encoder-frontend-upper-bound.yml",
          ):
              text=pathlib.Path(name).read_text().lower()
              assert "run-id: 35412153192" in text
              assert "run-id: 35367960968" in text
              for forbidden in (
                  "qualification-index",
                  "qualification-summary",
                  "generalization-freeze",
                  "fresh-validation",
                  "shadow-validation",
                  "formal-qualification",
              ):
                  assert forbidden not in text, (name, forbidden)
          print("upper-bound workflow evidence boundary: ok")
          PY

      - name: Verify classifier and decision semantics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          classifier=pathlib.Path("training/research_keyword_classifier.py").read_text()
          workflow=pathlib.Path(".github/workflows/kws-v2-encoder-frontend-upper-bound.yml").read_text()
          assert 'positive_score_semantics": "true-keyword-probability"' in classifier
          assert "true_class_score = probs.gather" in classifier
          assert "model_state_sha256" in classifier
          assert 'primary_name=rules["primary_operating_point"]' in workflow
          assert '"decision_basis":{' in workflow
          assert 'primary_recall_delta >=' in workflow
          assert 'fp_reduction >=' not in workflow
          assert 'gap_improvement >=' not in workflow
          print("classifier/decision semantics contract: ok")
          PY

      - name: Worktree remains clean
        run: git diff --exit-code -- .
