name: research-arm-runtime
on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "research/arm_runtime/**"
      - ".github/workflows/research-arm-runtime.yml"
  pull_request:
    paths:
      - "research/arm_runtime/**"
      - ".github/workflows/research-arm-runtime.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-static-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline parser, lock and static gate fixtures
        run: python3 -m unittest discover -s research/arm_runtime/tests -v
      - name: Read-only probe shell syntax
        run: |
          sh -n research/arm_runtime/scripts/probe_board_readonly.sh
          sh -n research/arm_runtime/scripts/probe_sdk_readonly.sh
      - name: Python syntax
        run: python3 -m py_compile research/arm_runtime/scripts/*.py research/arm_runtime/tests/*.py
