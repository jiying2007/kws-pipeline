name: kws-v2-experiment-plan-contract

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "configs/training/kws-v2-staged-experiments-v1.json"
      - "configs/training/xiaowo.v2-speech-like-stage-base.json"
      - "configs/training/xiaowo.v2-speech-like-stage-base.json"
      - "tools/kws_v2_experiment_plan.py"
      - "configs/training/xiaowo.gru-development-stage-a-v1.json"
      - "configs/training/xiaowo.rnn-development-stage-a-v1.json"
      - ".github/workflows/kws-v2-experiment-plan-contract.yml"
  pull_request:
    paths:
      - "configs/training/kws-v2-staged-experiments-v1.json"
      - "tools/kws_v2_experiment_plan.py"
      - "configs/training/xiaowo.gru-development-stage-a-v1.json"
      - "configs/training/xiaowo.rnn-development-stage-a-v1.json"
      - ".github/workflows/kws-v2-experiment-plan-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Materialize Stage A frontend matrix
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kws-v2-experiments"
          mkdir -p "$root"
          python3 tools/kws_v2_experiment_plan.py             --policy configs/training/kws-v2-staged-experiments-v1.json             --stage A             --output-dir "$root/stage-a"

      - name: Verify Stage A changes frontend only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kws-v2-experiments" / "stage-a"
          matrix = json.loads((root / "experiment-matrix.json").read_text())
          assert matrix["stage"] == "A"
          assert matrix["generalization_cohort_id"] == "kws-v2-stage-a-search-v1"
          assert matrix["recommended_generalization_search_seeds"] >= 8
          assert matrix["single_primary_variable_per_stage"] is True
          assert matrix["canonical_base_config_path_contract"] == "repository-relative-v1"
          assert matrix["canonical_base_config"] == "configs/training/xiaowo.v2-speech-like-stage-base.json"
          assert not pathlib.Path(matrix["canonical_base_config"]).is_absolute()
          assert matrix["fresh_used"] is False
          assert matrix["shadow_used"] is False
          assert matrix["formal_qualification_used"] is False
          rows = matrix["candidates"]
          assert len(rows) == 4
          assert {r["generalization_cohort_id"] for r in rows} == {matrix["generalization_cohort_id"]}
          assert {(r["model_family"], r["frontend"], r["hidden_dim"]) for r in rows} == {
              ("rnn", "logmel", 64),
              ("rnn", "pcen-lite", 64),
              ("gru", "logmel", 64),
              ("gru", "pcen-lite", 64),
          }
          for row in rows:
              assert row["primary_variable"] == "frontend"
              assert row["config_path_contract"] == "matrix-relative-v1"
              assert not pathlib.Path(row["config"]).is_absolute()
              assert set(row["mutation_paths_from_stage_base"]).issubset({"model.frontends"})
              assert row["protected_evidence_used"] is False
              assert row["development_policy_path_contract"] == "repository-relative-v1"
              assert not pathlib.Path(row["development_policy"]).is_absolute()
              policy = json.loads(pathlib.Path(row["development_policy"]).read_text())
              assert policy["min_rounds"] == policy["max_rounds"] == 8
              assert policy["patience"] >= 8
              assert policy["epochs_per_round"] == 8

          assert set(matrix["development_policy_sha256"]) == {"rnn", "gru"}
          logmel = json.loads((root / "stage-a-rnn-h64-logmel.json").read_text())
          pcen = json.loads((root / "stage-a-rnn-h64-pcen-lite.json").read_text())
          assert logmel["model"]["frontends"] == ["logmel"]
          assert pcen["model"]["frontends"] == ["pcen-lite"]
          a = json.loads(json.dumps(logmel))
          b = json.loads(json.dumps(pcen))
          a["model"]["frontends"] = ["<frontend>"]
          b["model"]["frontends"] = ["<frontend>"]
          assert a == b
          print("stage-a-single-variable: ok")
          PY

      - name: Materialize Stage B capacity matrix from frozen PCEN choice
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kws-v2-experiments"
          python3 tools/kws_v2_experiment_plan.py             --policy configs/training/kws-v2-staged-experiments-v1.json             --stage B             --frontend pcen-lite             --output-dir "$root/stage-b"

      - name: Verify Stage B changes capacity only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kws-v2-experiments" / "stage-b"
          matrix = json.loads((root / "experiment-matrix.json").read_text())
          stage_a = json.loads((root.parent / "stage-a" / "experiment-matrix.json").read_text())
          assert matrix["stage"] == "B"
          assert matrix["generalization_cohort_id"] == "kws-v2-stage-b-search-v1"
          assert matrix["generalization_cohort_id"] != stage_a["generalization_cohort_id"]
          rows = matrix["candidates"]
          assert len(rows) == 5
          assert {r["generalization_cohort_id"] for r in rows} == {matrix["generalization_cohort_id"]}
          assert {(r["model_family"], r["hidden_dim"]) for r in rows} == {
              ("rnn", 48), ("rnn", 64),
              ("gru", 32), ("gru", 48), ("gru", 64),
          }
          assert max(r["hidden_dim"] for r in rows) == 64
          base = json.loads((root / "stage-b-base-pcen-lite.json").read_text())
          assert base["model"]["frontends"] == ["pcen-lite"]
          for row in rows:
              assert row["frontend"] == "pcen-lite"
              assert row["primary_variable"] == "hidden_dim"
              assert set(row["mutation_paths_from_stage_base"]).issubset({"model.hidden_dim"})
              assert row["protected_evidence_used"] is False
              assert row["config_path_contract"] == "matrix-relative-v1"
              assert row["development_policy_path_contract"] == "repository-relative-v1"
              assert not pathlib.Path(row["development_policy"]).is_absolute()
              policy = json.loads(pathlib.Path(row["development_policy"]).read_text())
              assert policy["min_rounds"] == policy["max_rounds"] == 8
              assert policy["patience"] >= 8
              candidate = json.loads((root / row["config"]).read_text())
              assert candidate["model"]["frontends"] == ["pcen-lite"]
          print("stage-b-single-variable: ok")
          PY

      - name: Stage B without frozen frontend must fail closed
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kws-v2-experiments"
          if python3 tools/kws_v2_experiment_plan.py             --policy configs/training/kws-v2-staged-experiments-v1.json             --stage B             --output-dir "$root/bad-stage-b"; then
            echo "stage B unexpectedly accepted missing frontend" >&2
            exit 1
          fi

      - name: Stage C must remain blocked
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kws-v2-experiments"
          if python3 tools/kws_v2_experiment_plan.py             --policy configs/training/kws-v2-staged-experiments-v1.json             --stage C             --output-dir "$root/stage-c"; then
            echo "stage C unexpectedly enabled" >&2
            exit 1
          fi

      - name: Python syntax
        run: python3 -m py_compile tools/kws_v2_experiment_plan.py

      - name: Worktree remains clean
        run: git diff --exit-code -- .
