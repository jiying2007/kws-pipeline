name: experiment-quality-guards

# Automatic PR/main coverage runs in ci.yml's required python-contracts chain.
# Keep this standalone entry only for an explicitly requested offline recheck.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run saved review and dataset quality guards (normal and optimized)
        run: |
          python3 -S -B -m unittest discover -s research/experiment_quality_guards/tests -p test_quality_gates.py -v
          python3 -S -B -m unittest discover -s research/experiment_quality_guards/tests -p test_review_counterexamples.py -v
          python3 -S -B -m unittest discover -s research/experiment_quality_guards/tests -p test_admission_cli.py -v
          python3 -S -B -m unittest discover -s research/experiment_quality_guards/tests -p test_public_report.py -v
          python3 -S -B -m unittest discover -s research/experiment_quality_guards/tests -p test_screen32_human_review.py -v
          python3 -S -B -O -m unittest discover -s research/experiment_quality_guards/tests -p test_quality_gates.py -v
          python3 -S -B -O -m unittest discover -s research/experiment_quality_guards/tests -p test_review_counterexamples.py -v
          python3 -S -B -O -m unittest discover -s research/experiment_quality_guards/tests -p test_admission_cli.py -v
          python3 -S -B -O -m unittest discover -s research/experiment_quality_guards/tests -p test_public_report.py -v
          python3 -S -B -O -m unittest discover -s research/experiment_quality_guards/tests -p test_screen32_human_review.py -v
          python3 -S -B -OO -m unittest discover -s research/experiment_quality_guards/tests -p test_quality_gates.py -v
          python3 -S -B -OO -m unittest discover -s research/experiment_quality_guards/tests -p test_review_counterexamples.py -v
          python3 -S -B -OO -m unittest discover -s research/experiment_quality_guards/tests -p test_admission_cli.py -v
          python3 -S -B -OO -m unittest discover -s research/experiment_quality_guards/tests -p test_public_report.py -v
          python3 -S -B -OO -m unittest discover -s research/experiment_quality_guards/tests -p test_screen32_human_review.py -v
          python3 -B tools/test_inventory.py --root research/experiment_quality_guards/tests --workflow .github/workflows/experiment-quality-guards.yml
