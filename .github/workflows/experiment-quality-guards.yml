name: experiment-quality-guards

on:
  push:
    paths:
      - "research/experiment_quality_guards/**"
      - ".github/workflows/experiment-quality-guards.yml"
  pull_request:
    paths:
      - "research/experiment_quality_guards/**"
      - ".github/workflows/experiment-quality-guards.yml"

permissions:
  contents: read

jobs:
  pure-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run portable guard and public-report tests
        run: |
          python3 -B -m unittest discover -s research/experiment_quality_guards/tests -p test_quality_gates.py -v
          python3 -B -m unittest discover -s research/experiment_quality_guards/tests -p test_review_counterexamples.py -v
          python3 -B -m unittest discover -s research/experiment_quality_guards/tests -p test_admission_cli.py -v
          python3 -B -m unittest discover -s research/experiment_quality_guards/tests -p test_public_report.py -v
      - name: Require every research test file in this workflow
        run: >-
          python3 -B tools/test_inventory.py
          --root research/experiment_quality_guards/tests
          --workflow .github/workflows/experiment-quality-guards.yml
