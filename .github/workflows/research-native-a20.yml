name: research-native-a20
on:
  pull_request:
    paths:
      - "research/native_a20/**"
      - ".github/workflows/research-native-a20.yml"
  push:
    branches: [main, "codex/**"]
    paths:
      - "research/native_a20/**"
      - ".github/workflows/research-native-a20.yml"
permissions:
  contents: read
jobs:
  offline-invented-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Offline build-driver safety contracts
        run: python3 -B research/native_a20/tests/test_build_driver.py
      - name: Compile research runtime and test invented inputs only
        run: python3 -B research/native_a20/build.py --cc ${{ matrix.cc }} --output "$RUNNER_TEMP/native-a20"
      - name: Address and undefined behavior sanitizer invented contracts
        run: python3 -B research/native_a20/build.py --cc ${{ matrix.cc }} --sanitize --output "$RUNNER_TEMP/native-a20-sanitized"
      - name: Confirm tracked source unchanged
        run: git diff --exit-code

  generic-arm-compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install generic Ubuntu ARM compiler (no target runner)
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
      - name: Compile and link isolated research ARM artifacts without execution
        run: >-
          python3 -B research/native_a20/build.py
          --mode compile-only --cc arm-linux-gnueabihf-gcc
          --target-elf-class 32 --target-machine arm --target-endian little
          --target-flag=-mcpu=cortex-a32 --target-flag=-mfpu=neon-vfpv4
          --target-flag=-mfloat-abi=hard
          --output "$RUNNER_TEMP/native-a20-arm"
      - name: Inspect static target metadata and assert execution stayed disabled
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/native-a20-arm"
          arm-linux-gnueabihf-readelf -h -A -d -V --dyn-syms "$out/liba20_fft64.so" > "$out/readelf-library.txt"
          arm-linux-gnueabihf-readelf -h -A -d -V --dyn-syms "$out/a20_pcm_fft64_cli" > "$out/readelf-cli.txt"
          python3 - "$out" <<'PY'
          import json
          from pathlib import Path
          import sys
          out = Path(sys.argv[1])
          receipt = json.loads((out / 'receipt.json').read_text())
          assert receipt['mode'] == 'compile-only'
          assert receipt['compile_link'] == receipt['elf_identity'] == 'PASS'
          assert receipt['target_executions'] == receipt['target_dlopen_calls'] == 0
          assert receipt['invented_tests_status'] == receipt['resource_sizes'] == receipt['ctypes_abi'] == 'NOT_RUN'
          assert not (out / 'resource-sizes.json').exists()
          PY
      - name: Preserve generic compilation evidence (not board qualification)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-a20-generic-arm-compile-only
          path: ${{ runner.temp }}/native-a20-arm/
          if-no-files-found: warn
      - name: Confirm tracked source unchanged
        run: git diff --exit-code
