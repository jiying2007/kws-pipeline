# Isolated one-shot transfer branch only; never merge this workflow over main.
# No audio, model weights, credentials, ASR/TTS or training are read/exported.
name: V3 offline core runtime transfer
on:
  push:
    branches: ['research/v3-core-offline-transfer-20261107']
permissions:
  contents: read
concurrency:
  group: v3-core-offline-transfer-20261107
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'jiying2007/kws-pipeline' && github.event_name == 'push' && github.ref == 'refs/heads/research/v3-core-offline-transfer-20261107' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_RETRIES: '0'
      PIP_DEFAULT_TIMEOUT: '60'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup-research-python
      - name: Verify frozen source and install the unchanged core lock
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 7bfcb33a47a1df3e317c835b81e419d14e07dbf8
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/github-hosted-resource-probe.yml
          timeout --signal=TERM --kill-after=10s 600 bash training/setup_core_runtime.sh "$RUNNER_TEMP/core-venv"
      - name: Assemble a clean relocatable interpreter and locked packages
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v3-core-transfer"
          mkdir -p "$root/runtime/bin" "$root/runtime/lib" "$root/source/tools" "$root/source/configs/runtime"
          cp -L "$pythonLocation/bin/python3.12" "$root/runtime/bin/python3.12"
          cp -L "$pythonLocation/lib/libpython3.12.so.1.0" "$root/runtime/lib/libpython3.12.so.1.0"
          cp -a "$pythonLocation/lib/python3.12" "$root/runtime/lib/"
          rm -rf "$root/runtime/lib/python3.12/site-packages"
          cp -a "$RUNNER_TEMP/core-venv/lib/python3.12/site-packages" "$root/runtime/lib/python3.12/site-packages"
          find "$root" -type d -name '__pycache__' -prune -exec rm -rf {} +
          find "$root" -type f \( -name '*.pyc' -o -name '*.ttf' -o -name '*.otf' -o -name '*.woff' -o -name '*.woff2' \) -delete
          cp tools/research_runtime.py "$root/source/tools/"
          cp configs/runtime/research-runtime.json "$root/source/configs/runtime/"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 \
            PYTHONHOME="$root/runtime" LD_LIBRARY_PATH="$root/runtime/lib" \
            "$root/runtime/bin/python3.12" -B "$root/source/tools/research_runtime.py" check --role core --packages
          KWS_TRANSFER_ROOT="$root" "$root/runtime/bin/python3.12" -B - <<'PY'
          import hashlib,importlib.metadata,json,os,pathlib,platform,sys
          root=pathlib.Path(os.environ['KWS_TRANSFER_ROOT'])
          files={}
          for path in sorted(root.rglob('*')):
              if path.is_symlink():
                  if not path.resolve().is_relative_to(root): raise SystemExit('external runtime symlink')
                  continue
              if path.is_file():
                  h=hashlib.sha256()
                  with path.open('rb') as f:
                      for block in iter(lambda:f.read(1048576),b''):h.update(block)
                  files[path.relative_to(root).as_posix()]={'bytes':path.stat().st_size,'sha256':h.hexdigest()}
          total=sum(v['bytes'] for v in files.values())
          if total>3*1024**3:raise SystemExit('runtime transfer exceeds 3GiB uncompressed')
          result={'schema':'kws-v3-offline-core-runtime-transfer-v1','source_commit':'7bfcb33a47a1df3e317c835b81e419d14e07dbf8',
                  'python':platform.python_version(),'platform':platform.platform(),'files':files,'bytes':total,
                  'scope':'software runtime only; imported package versions are not model quality',
                  'private_assets_included':False,'model_weights_included':False,'model_calls':0,'training_runs':0}
          (root/'MANIFEST.json').write_text(json.dumps(result,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in result.items() if k!='files'}))
          PY
          mkdir -p transfer-output
          tar -C "$RUNNER_TEMP" -czf transfer-output/v3-core-runtime.tar.gz v3-core-transfer
          test "$(stat -c %s transfer-output/v3-core-runtime.tar.gz)" -lt 943718400
          sha256sum transfer-output/v3-core-runtime.tar.gz > transfer-output/SHA256SUMS
          cp "$root/MANIFEST.json" transfer-output/runtime-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v3-offline-core-runtime
          path: transfer-output/
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
