# Isolated source-transfer branch; never merge over main's resource probe.
name: V3 exact FSMN source transfer
on:
  push:
    branches: ['research/v3-fsmn-source-transfer-20261107']
permissions:
  contents: read
concurrency:
  group: v3-fsmn-source-transfer-20261107
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'jiying2007/kws-pipeline' && github.event_name == 'push' && github.ref == 'refs/heads/research/v3-fsmn-source-transfer-20261107' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup-research-python
      - name: Fetch only existing hash-pinned public model and implementation assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 7bfcb33a47a1df3e317c835b81e419d14e07dbf8
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/github-hosted-resource-probe.yml
          timeout --signal=TERM --kill-after=10s 600 python -I -B - <<'PY'
          import hashlib,json,pathlib,sys,time,urllib.request
          if sys.version_info[:3]!=(3,12,16):raise SystemExit('runtime mismatch')
          lockpath=pathlib.Path('configs/runtime/fsmn-fulltext-sources.json')
          lock=json.loads(lockpath.read_bytes())
          if lock['revision']!='cd0c18d0dda6742c371fbb72ec66185906a9885d' or len(lock['files'])!=12:raise SystemExit('source lock changed')
          root=pathlib.Path('transfer-output');root.mkdir()
          assets=root/'official';assets.mkdir()
          records=[];started=time.monotonic()
          for item in lock['files']:
              name=pathlib.PurePosixPath(item['path'])
              if name.is_absolute() or '..' in name.parts or item['bytes']>4*1024**2:raise SystemExit('source bounds')
              request=urllib.request.Request(item['url'],headers={'User-Agent':'kws-v3-research-source-transfer/1.0'})
              with urllib.request.urlopen(request,timeout=45) as response:
                  raw=response.read(item['bytes']+1);status=response.status
              if len(raw)!=item['bytes'] or hashlib.sha256(raw).hexdigest()!=item['sha256']:raise SystemExit('download identity mismatch: '+item['path'])
              target=assets/name;target.parent.mkdir(parents=True,exist_ok=True)
              with target.open('xb') as f:f.write(raw)
              records.append({'path':item['path'],'bytes':len(raw),'sha256':item['sha256'],'http_status':status})
          (root/'source-lock.json').write_bytes(lockpath.read_bytes())
          receipt={'schema':'kws-v3-fsmn-source-transfer-v1','files':records,'source_lock_sha256':hashlib.sha256(lockpath.read_bytes()).hexdigest(),
                   'source_commit':'7bfcb33a47a1df3e317c835b81e419d14e07dbf8','wall_seconds':time.monotonic()-started,
                   'model_constructions':0,'model_forwards':0,'optimizer_updates':0,'private_audio':False,'deserialization_performed':False,'automatic_retries':0}
          (root/'transfer-receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v3-exact-fsmn-source-assets
          path: transfer-output/
          retention-days: 3
          if-no-files-found: error
          compression-level: 6
