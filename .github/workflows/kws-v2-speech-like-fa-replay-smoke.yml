name: kws-v2-speech-like-fa-replay-paired

on:
  push:
    branches:
      - "experiment/kws-speech-like-fa-replay-clean-*"
    paths:
      - ".github/workflows/kws-v2-speech-like-fa-replay-smoke.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: kws-v2-speech-like-fa-replay-paired-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-three-round-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download immutable production corpus
        uses: actions/download-artifact@v4
        with:
          name: kws-v2-threshold-production-corpus-408aa33be33f30a8b2728ba1cf5e3ccedf2fd0f3
          path: ${{ runner.temp }}/paired-input
          github-token: ${{ github.token }}
          repository: jiying2007/kws-pipeline
          run-id: 35333458390

      - name: Resolve immutable corpus inputs
        id: corpus
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/paired-input"
          for split in train calibration test qualification; do
            index="$(find "$input" -path "*/$split/dataset-index.jsonl" -print -quit)"
            summary="$(find "$input" -path "*/$split/dataset-summary.json" -print -quit)"
            test -n "$index"
            test -n "$summary"
            echo "${split}_index=$index" >> "$GITHUB_OUTPUT"
            echo "${split}_summary=$summary" >> "$GITHUB_OUTPUT"
          done

      - name: Prepare exact GRU-logmel Stage A binding
        run: |
          set -euo pipefail
          python3 tools/run_kws_v2_stage_a_search.py \
            --train-index "${{ steps.corpus.outputs.train_index }}" \
            --train-summary "${{ steps.corpus.outputs.train_summary }}" \
            --calibration-index "${{ steps.corpus.outputs.calibration_index }}" \
            --calibration-summary "${{ steps.corpus.outputs.calibration_summary }}" \
            --test-index "${{ steps.corpus.outputs.test_index }}" \
            --test-summary "${{ steps.corpus.outputs.test_summary }}" \
            --qualification-index "${{ steps.corpus.outputs.qualification_index }}" \
            --qualification-summary "${{ steps.corpus.outputs.qualification_summary }}" \
            --candidate-id v2-a-gru-h64-logmel \
            --prepare-only \
            --work-dir "$RUNNER_TEMP/paired-stage-a"

      - name: Materialize paired control and treatment
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])
          candidate=temp/"paired-stage-a/candidates/v2-a-gru-h64-logmel"
          base=json.loads((candidate/"effective-config.json").read_text())

          control=json.loads(json.dumps(base))
          treatment=json.loads(json.dumps(base))
          aug=treatment["data_augmentation_v3"]
          assert aug["failure_replay_enabled"] is False
          assert treatment["domain_iteration"]["hard_negative_replay"] == []
          assert treatment["domain_iteration"]["positive_stress_replay"] == []
          speech=treatment["kws_v2_speech_like_training"]
          assert speech["tone_replay_allowed"] is False
          assert speech["failure_replay"] == "disabled"
          aug["failure_replay_enabled"]=True
          aug["failure_replay_mode"]="train-source-reuse-v1"
          aug["failure_replay_kinds"]=["false-accept"]
          speech["failure_replay"]="train-source-reuse-v1"

          def write(path, value):
              path.write_text(json.dumps(value, indent=2, sort_keys=True)+"\n")
              return hashlib.sha256(path.read_bytes()).hexdigest()

          control_path=candidate/"paired-control-config.json"
          treatment_path=candidate/"paired-treatment-config.json"
          control_sha=write(control_path, control)
          treatment_sha=write(treatment_path, treatment)

          policy=json.loads(
              pathlib.Path("configs/training/xiaowo.gru-development-stage-a-v1.json").read_text()
          )
          assert policy["epochs_per_round"]==8
          policy["min_rounds"]=3
          policy["max_rounds"]=3
          policy["patience"]=3
          policy["experiment_context"]="kws-v2-fa-source-reuse-paired-three-round-v1"
          policy_path=temp/"paired-policy.json"
          policy_sha=write(policy_path, policy)

          experiment={
              "schema_version":1,
              "evidence_class":"kws-v2-fa-source-reuse-paired-three-round-v1",
              "evidence_scope":"development-only",
              "baseline_main_sha":"09d477bc3ca0f9ad0cfd33aad6ab0b531c0ec136",
              "production_source_run_id":35333458390,
              "candidate_id":"v2-a-gru-h64-logmel",
              "control_config_sha256":control_sha,
              "treatment_config_sha256":treatment_sha,
              "shared_policy_sha256":policy_sha,
              "primary_delta":"failure-replay=train-source-reuse-v1; failure-kinds=false-accept-only",
              "epochs_per_round":8,
              "rounds":3,
              "single_thread_env":{
                  "OMP_NUM_THREADS":os.environ["OMP_NUM_THREADS"],
                  "MKL_NUM_THREADS":os.environ["MKL_NUM_THREADS"],
                  "OPENBLAS_NUM_THREADS":os.environ["OPENBLAS_NUM_THREADS"],
              },
              "fixed_hard_negative_replay_changed":False,
              "positive_stress_replay_changed":False,
              "threshold_changed":False,
              "gate_changed":False,
              "decoder_changed":False,
              "selection_feedback_allowed":False,
              "protected_evidence_used":False,
          }
          write(temp/"paired-experiment.json", experiment)
          PY

      - name: Build GRU runtime runner
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel --target kws_wav_gru

      - name: Install pinned CPU training runtime
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input \
            torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run paired control
        id: control
        run: |
          set +e
          candidate="$RUNNER_TEMP/paired-stage-a/candidates/v2-a-gru-h64-logmel"
          .venv/bin/python training/run_gru_development.py \
            --config "$candidate/paired-control-config.json" \
            --policy "$RUNNER_TEMP/paired-policy.json" \
            --runner build/kws_wav_gru \
            --work-dir "$candidate/control" \
            > "$RUNNER_TEMP/paired-control.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run paired treatment
        id: treatment
        run: |
          set +e
          candidate="$RUNNER_TEMP/paired-stage-a/candidates/v2-a-gru-h64-logmel"
          .venv/bin/python training/run_gru_development.py \
            --config "$candidate/paired-treatment-config.json" \
            --policy "$RUNNER_TEMP/paired-policy.json" \
            --runner build/kws_wav_gru \
            --work-dir "$candidate/treatment" \
            > "$RUNNER_TEMP/paired-treatment.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Require causal comparability and score first replay delta
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])
          candidate=temp/"paired-stage-a/candidates/v2-a-gru-h64-logmel"
          control=json.loads((candidate/"control/development-loop-manifest.json").read_text())
          treatment=json.loads((candidate/"treatment/development-loop-manifest.json").read_text())
          crows=control["records"]
          trows=treatment["records"]
          assert [int(x["round"]) for x in crows]==[0,1,2]
          assert [int(x["round"]) for x in trows]==[0,1,2]
          assert all(int(x["training"]["failure_replay_examples"])==0 for x in crows)
          active=[
              int(x["round"])
              for x in trows
              if int(x["training"]["failure_replay_examples"])>0
          ]
          assert active, "treatment never activated FA source replay"
          first=min(active)

          pre=[]
          for r in range(first):
              c=crows[r]
              t=trows[r]
              assert int(t["training"]["failure_replay_examples"])==0
              assert c["model_sha256"]==t["model_sha256"], (
                  f"pre-replay model identity drifted at round {r}: "
                  f"{c['model_sha256']} != {t['model_sha256']}"
              )
              assert c["calibration"]["calibrated_thresholds"] == t["calibration"]["calibrated_thresholds"]
              assert float(c["calibration"]["frr"]) == float(t["calibration"]["frr"])
              assert float(c["calibration"]["far_per_hour"]) == float(t["calibration"]["far_per_hour"])
              assert float(c["test"]["frr"]) == float(t["test"]["frr"])
              assert float(c["test"]["far_per_hour"]) == float(t["test"]["far_per_hour"])
              pre.append({
                  "round":r,
                  "model_sha256":c["model_sha256"],
                  "identical":True,
              })

          c=crows[first]
          t=trows[first]
          for key in ("learning_rate","positive_example_weight","ordered_token_loss_weight"):
              assert float(c["training"][key]) == float(t["training"][key])
          assert int(c["training"]["fixed_replay_examples"]) == int(t["training"]["fixed_replay_examples"]) == 0
          assert int(t["training"]["failure_replay_examples"]) > 0
          assert int(t["training"]["manifest_count"]) > int(c["training"]["manifest_count"])

          evidence_path=(
              candidate/"treatment/failure-replay"/f"round-{first:02d}"/"development-failure-replay.json"
          )
          evidence=json.loads(evidence_path.read_text())
          assert evidence["evidence_class"]=="development-only-failure-train-source-reuse"
          assert evidence["mode"]=="train-source-reuse-v1"
          assert evidence["failure_kinds"]==["false-accept"]
          assert evidence["training_source_split"]=="train"
          assert evidence["tone_backend_used"] is False
          assert evidence["development_source_wav_bytes_copied"] is False
          assert evidence["train_clean_source_wav_bytes_reused"] is True

          def metrics(row):
              return {
                  "cal_frr":float(row["calibration"]["frr"]),
                  "cal_far_per_hour":float(row["calibration"]["far_per_hour"]),
                  "test_frr":float(row["test"]["frr"]),
                  "test_far_per_hour":float(row["test"]["far_per_hour"]),
                  "false_accepts":int(row["false_accepts"]),
                  "false_rejects":int(row["false_rejects"]),
                  "model_sha256":row["model_sha256"],
                  "thresholds":row["calibration"]["calibrated_thresholds"],
              }
          cm=metrics(c)
          tm=metrics(t)
          scorecard={
              "schema_version":1,
              "evidence_class":"kws-v2-fa-source-reuse-paired-scorecard-v1",
              "diagnostic_only":True,
              "selection_feedback_allowed":False,
              "protected_evidence_used":False,
              "single_threaded":True,
              "pre_replay_identity":pre,
              "first_replay_round":first,
              "replay_examples":int(t["training"]["failure_replay_examples"]),
              "control_manifest_count":int(c["training"]["manifest_count"]),
              "treatment_manifest_count":int(t["training"]["manifest_count"]),
              "control":cm,
              "treatment":tm,
              "delta_treatment_minus_control":{
                  key:tm[key]-cm[key]
                  for key in ("cal_frr","cal_far_per_hour","test_frr","test_far_per_hour","false_accepts","false_rejects")
              },
          }
          (temp/"paired-scorecard.json").write_text(
              json.dumps(scorecard, indent=2, sort_keys=True)+"\n"
          )
          print(json.dumps(scorecard, indent=2, sort_keys=True))
          PY

      - name: Collect paired evidence
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/paired-evidence"
          candidate="$RUNNER_TEMP/paired-stage-a/candidates/v2-a-gru-h64-logmel"
          mkdir -p "$out"
          for src in \
            "$RUNNER_TEMP/paired-experiment.json" \
            "$RUNNER_TEMP/paired-policy.json" \
            "$RUNNER_TEMP/paired-scorecard.json" \
            "$RUNNER_TEMP/paired-control.log" \
            "$RUNNER_TEMP/paired-treatment.log" \
            "$candidate/control/development-loop-manifest.json" \
            "$candidate/treatment/development-loop-manifest.json"; do
            if [[ -f "$src" ]]; then cp "$src" "$out/$(basename "$src")"; fi
          done
          if [[ -d "$candidate/treatment/failure-replay" ]]; then
            find "$candidate/treatment/failure-replay" -name 'development-failure-replay.json' -exec cp --parents {} "$out/" \;
          fi

      - name: Upload paired evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kws-v2-fa-source-reuse-paired-${{ github.sha }}
          path: ${{ runner.temp }}/paired-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce paired causal evidence
        if: always()
        run: |
          test -f "$RUNNER_TEMP/paired-scorecard.json"
