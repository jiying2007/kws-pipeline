name: kws-research-comparator-status

on:
  push:
    branches: [main]
    paths:
      - "configs/research-baseline.xiaowo.json"
      - "models/registry/**"
      - "tools/verify_model_registry.py"
      - ".github/workflows/kws-landing-status.yml"
  pull_request:
    paths:
      - "configs/research-baseline.xiaowo.json"
      - "models/registry/**"
      - "tools/verify_model_registry.py"
      - ".github/workflows/kws-landing-status.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-research-python
      - name: Verify pinned research comparator and historical registry identity
        run: |
          python3 -B - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import subprocess
          import sys

          baseline = json.loads(Path("configs/research-baseline.xiaowo.json").read_text(encoding="utf-8"))
          if baseline.get("schema") != "kws-research-model-baseline-v1":
              raise SystemExit("invalid research comparator schema")
          if baseline.get("policy") != "frozen-historical-research-comparator":
              raise SystemExit("invalid research comparator policy")
          tag = baseline.get("model_tag")
          if not isinstance(tag, str) or not re.fullmatch(r"model-[0-9a-f]{12}", tag):
              raise SystemExit("invalid model comparator tag")
          root = Path("models/registry") / tag
          subprocess.run([sys.executable, "-B", "tools/verify_model_registry.py",
                          "--registry-dir", str(root)], check=True)
          registry = json.loads((root / "registry.json").read_text(encoding="utf-8"))
          if registry["training"]["head_sha"] != baseline.get("training_source_sha"):
              raise SystemExit("research training source drift")
          for filename, field in (("xiaowo-model.kwm", "model_sha256"),
                                  ("xiaowo-keywords.kwk", "keyword_pack_sha256")):
              if hashlib.sha256((root / filename).read_bytes()).hexdigest() != baseline.get(field):
                  raise SystemExit("research comparator SHA256 drift: " + filename)
          for field in ("actual_human_wav_evaluated",
                        "independent_longstream_far_measured", "ssc305_measured"):
              if baseline.get(field) is not False:
                  raise SystemExit("historical research comparator overclaims: " + field)
          report = {"model_tag": tag, "historical_comparator_verified": True,
                    "research_model_accepted": False,
                    "independent_acoustic_evidence": False}
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Worktree remains clean
        run: git diff --exit-code -- .
