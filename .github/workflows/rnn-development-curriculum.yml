name: rnn-development-curriculum

on:
  push:
    branches:
      - codex/rnn-live-bba68b3c
    paths:
      - '.github/workflows/rnn-development-curriculum.yml'

permissions:
  contents: read

concurrency:
  group: rnn-development-live-bba68b3c
  cancel-in-progress: false

env:
  RNN_SOURCE_SHA: bba68b3c26b432790361d7c138dfeef85470178f

jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact clean main product head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bba68b3c26b432790361d7c138dfeef85470178f
          persist-credentials: false
      - name: Bind exact product head and protected evidence namespaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RNN_SOURCE_SHA"
          python3 tools/verify_rnn_parallel_contract.py
          python3 tools/verify_rnn_development_gate.py --self-test
          test "$(git status --porcelain)" = ""
      - name: Build shipping RNN runner
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel --target kws_wav kws_decoder_tests kws_decoder_retention_tests
          ctest --test-dir build --output-on-failure -R '^kws_decoder_(tests|retention_tests)$'
      - name: Install pinned CPU training runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input \
            torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run development-only multi-round RNN curriculum
        id: loop
        shell: bash
        run: |
          set +e
          .venv/bin/python training/run_rnn_development.py \
            --config configs/training/xiaowo.torch-domain.json \
            --policy configs/training/xiaowo.rnn-development-loop.json \
            --runner build/kws_wav \
            --work-dir build/rnn-development-curriculum
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Reconcile full-robustness RNN development gate
        id: development_gate
        if: steps.loop.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python3 tools/reconcile_rnn_development_gate.py \
            --work-dir build/rnn-development-curriculum \
            --config configs/training/xiaowo.torch-domain.json \
            --policy configs/training/xiaowo.rnn-development-loop.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify reconciled RNN development gate
        if: steps.loop.outputs.exit_code == '0' && steps.development_gate.outputs.exit_code == '0'
        run: >-
          python3 tools/verify_rnn_development_gate.py
          --work-dir build/rnn-development-curriculum
          --config configs/training/xiaowo.torch-domain.json
          --policy configs/training/xiaowo.rnn-development-loop.json
      - name: Finalize self-contained frozen RNN candidate
        if: steps.loop.outputs.exit_code == '0' && steps.development_gate.outputs.exit_code == '0'
        run: >-
          python3 tools/finalize_rnn_frozen_candidate.py
          --work-dir build/rnn-development-curriculum
          --config configs/training/xiaowo.torch-domain.json
          --policy configs/training/xiaowo.rnn-development-loop.json
      - name: Verify frozen RNN candidate handoff
        if: steps.loop.outputs.exit_code == '0' && steps.development_gate.outputs.exit_code == '0'
        run: |
          python3 tools/verify_rnn_frozen_candidate.py \
            --candidate build/rnn-development-curriculum/frozen-candidate
          python3 tools/verify_rnn_stability_evidence.py \
            --candidate build/rnn-development-curriculum/frozen-candidate
          python3 tools/verify_rnn_development_gate.py \
            --candidate build/rnn-development-curriculum/frozen-candidate
      - name: Write exact source binding
        if: always()
        shell: bash
        run: |
          mkdir -p build/rnn-development-curriculum
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path('build/rnn-development-curriculum/source-binding.json')
          payload = {
              'model_family': 'rnn',
              'source_commit': os.environ['RNN_SOURCE_SHA'],
              'checked_out_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'development_only': True,
              'fresh_validation_used': False,
              'shadow_used': False,
              'formal_qualification_used': False,
          }
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Retain immutable RNN development evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rnn-development-curriculum
          path: |
            build/rnn-development-curriculum/source-binding.json
            build/rnn-development-curriculum/development-loop-manifest.json
            build/rnn-development-curriculum/curriculum/*.json
            build/rnn-development-curriculum/failure-replay/*/development-failure-replay.json
            build/rnn-development-curriculum/fixed-replay/*/hard-negatives.json
            build/rnn-development-curriculum/frozen-candidate/*
          if-no-files-found: warn
          retention-days: 30
      - name: Gate RNN development-only run
        run: |
          test "${{ steps.loop.outputs.exit_code }}" = '0'
          test "${{ steps.development_gate.outputs.exit_code }}" = '0'
