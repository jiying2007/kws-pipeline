name: rnn-development-curriculum

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/rnn-*
    paths:
      - 'training/model.py'
      - 'training/train_ctc.py'
      - 'training/export_model.py'
      - 'training/iterate_rnn_development.py'
      - 'training/run_rnn_development.py'
      - 'training/iterate_gru_development.py'
      - 'training/run_gru_development.py'
      - 'training/development_failure_replay.py'
      - 'training/domain_curriculum.py'
      - 'training/hard_negative_replay.py'
      - 'eval/gate_robustness.py'
      - 'tools/rnn_development_gate.py'
      - 'tools/reconcile_rnn_development_gate.py'
      - 'tools/verify_rnn_development_gate.py'
      - 'tools/finalize_rnn_frozen_candidate.py'
      - 'tools/verify_rnn_frozen_candidate.py'
      - 'tools/verify_rnn_stability_evidence.py'
      - 'tools/verify_rnn_parallel_contract.py'
      - 'configs/training/xiaowo.rnn-development-loop.json'
      - 'experiments/model_family/rnn_fresh_validation_registry.json'
      - 'experiments/model_family/shadow_arena_registry.json'
      - '.github/workflows/rnn-development-curriculum.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rnn-development-curriculum-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: RNN parallel governance contract
        run: |
          python3 tools/verify_rnn_parallel_contract.py
          python3 tools/verify_rnn_development_gate.py --self-test
      - name: Python syntax
        run: >-
          python3 -m py_compile
          training/iterate_rnn_development.py
          training/run_rnn_development.py
          tools/rnn_development_gate.py
          tools/reconcile_rnn_development_gate.py
          tools/verify_rnn_development_gate.py
          tools/finalize_rnn_frozen_candidate.py
          tools/verify_rnn_frozen_candidate.py
          tools/verify_rnn_stability_evidence.py
          tools/verify_rnn_parallel_contract.py

  development:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify RNN protected evidence namespaces are isolated
        run: python3 tools/verify_rnn_parallel_contract.py
      - name: Build shipping RNN runner
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel --target kws_wav kws_decoder_tests kws_decoder_retention_tests
          ctest --test-dir build --output-on-failure -R '^kws_decoder_(tests|retention_tests)$'
      - name: Install pinned CPU training runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input \
            torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run multi-round RNN development curriculum
        id: loop
        shell: bash
        run: |
          set +e
          .venv/bin/python training/run_rnn_development.py \
            --config configs/training/xiaowo.torch-domain.json \
            --policy configs/training/xiaowo.rnn-development-loop.json \
            --runner build/kws_wav \
            --work-dir build/rnn-development-curriculum
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Reconcile full-robustness RNN development gate
        id: development_gate
        if: steps.loop.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python3 tools/reconcile_rnn_development_gate.py \
            --work-dir build/rnn-development-curriculum \
            --config configs/training/xiaowo.torch-domain.json \
            --policy configs/training/xiaowo.rnn-development-loop.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify reconciled RNN development gate
        if: steps.loop.outputs.exit_code == '0' && steps.development_gate.outputs.exit_code == '0'
        run: >-
          python3 tools/verify_rnn_development_gate.py
          --work-dir build/rnn-development-curriculum
          --config configs/training/xiaowo.torch-domain.json
          --policy configs/training/xiaowo.rnn-development-loop.json
      - name: Finalize self-contained frozen RNN candidate
        if: steps.loop.outputs.exit_code == '0' && steps.development_gate.outputs.exit_code == '0'
        run: >-
          python3 tools/finalize_rnn_frozen_candidate.py
          --work-dir build/rnn-development-curriculum
          --config configs/training/xiaowo.torch-domain.json
          --policy configs/training/xiaowo.rnn-development-loop.json
      - name: Verify frozen RNN candidate handoff
        if: steps.loop.outputs.exit_code == '0' && steps.development_gate.outputs.exit_code == '0'
        run: |
          python3 tools/verify_rnn_frozen_candidate.py \
            --candidate build/rnn-development-curriculum/frozen-candidate
          python3 tools/verify_rnn_stability_evidence.py \
            --candidate build/rnn-development-curriculum/frozen-candidate
          python3 tools/verify_rnn_development_gate.py \
            --candidate build/rnn-development-curriculum/frozen-candidate
      - name: Verify calibrated threshold evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          manifest = pathlib.Path("build/rnn-development-curriculum/development-loop-manifest.json")
          value = json.loads(manifest.read_text())
          records = value.get("records", [])
          assert records, "development records are missing"
          for record in records:
              calibration = record["calibration"]
              selected = calibration["calibrated_thresholds"]
              grid = calibration["calibration_threshold_grid"]
              rounds = calibration["calibration_coordinate_rounds"]
              assert isinstance(selected, dict) and selected
              assert isinstance(grid, list) and grid
              assert isinstance(rounds, int) and rounds > 0
              allowed = {float(x) for x in grid}
              assert all(float(x) in allowed for x in selected.values())
          print("RNN calibrated threshold evidence: ok")
          PY

      - name: Retain RNN development evidence and frozen candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rnn-development-curriculum
          path: |
            build/rnn-development-curriculum/development-loop-manifest.json
            build/rnn-development-curriculum/curriculum/*.json
            build/rnn-development-curriculum/failure-replay/*/development-failure-replay.json
            build/rnn-development-curriculum/fixed-replay/*/hard-negatives.json
            build/rnn-development-curriculum/frozen-candidate/*
          if-no-files-found: warn
          retention-days: 30
      - name: Gate RNN development loop
        run: |
          test "${{ steps.loop.outputs.exit_code }}" = '0'
          test "${{ steps.development_gate.outputs.exit_code }}" = '0'
