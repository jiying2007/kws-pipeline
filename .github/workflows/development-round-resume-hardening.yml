name: development-round-resume-hardening

on:
  push:
    branches:
      - tmp/development-round-resume
    paths:
      - '.github/triggers/development-round-resume-hardening.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/development-round-resume
      - name: Bind replay source evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('training/development_resume.py')
          text = path.read_text()
          marker = '''def _candidate_hashes(records: list[dict], work: pathlib.Path) -> list[dict]:\n'''
          helper = '''def _optional_record_file_hashes(record: dict, work: pathlib.Path) -> dict:\n    result: dict[str, str] = {}\n    round_index = int(record["round"])\n    domain_index = _under_root(\n        work / "datasets" / f"round-{round_index:02d}" / "domain-index.jsonl",\n        work,\n        "domain-index",\n    )\n    if not domain_index.is_file() or domain_index.stat().st_size <= 0:\n        raise ValueError(f"resume domain index missing: {domain_index}")\n    result["domain_index"] = sha256_file(domain_index)\n    for split in ("calibration", "test"):\n        metrics = record.get(split)\n        if not isinstance(metrics, dict):\n            raise ValueError(f"resume record missing {split} metrics")\n        for field in ("false_rejects_path", "false_positives_path"):\n            raw = metrics.get(field)\n            if raw is None or raw == "":\n                continue\n            if not isinstance(raw, str):\n                raise ValueError(f"resume {split}.{field} must be a path string")\n            item = _under_root(pathlib.Path(raw), work, f"{split}.{field}")\n            if not item.is_file():\n                raise ValueError(f"resume failure evidence missing: {item}")\n            result[f"{split}.{field}"] = sha256_file(item)\n    return dict(sorted(result.items()))\n\n\n'''
          if helper not in text:
              if marker not in text:
                  raise SystemExit('candidate hash marker missing')
              text = text.replace(marker, helper + marker, 1)
          old = '''        result.append(row)\n    return result\n'''
          new = '''        row["replay_sources"] = _optional_record_file_hashes(record, work)\n        result.append(row)\n    return result\n'''
          if old not in text:
              raise SystemExit('candidate hash return marker missing')
          text = text.replace(old, new, 1)
          # Extend self-test with the required domain index and failure files.
          needle = '''        curriculum = old / "curriculum" / "round-00.json"\n        curriculum.parent.mkdir(parents=True)\n        curriculum.write_text('{"weight":1}\\n', encoding="utf-8")\n'''
          replacement = needle + '''        domain_index = old / "datasets" / "round-00" / "domain-index.jsonl"\n        domain_index.parent.mkdir(parents=True)\n        domain_index.write_text('{"split":"test"}\\n', encoding="utf-8")\n        failures = candidate / "calibration"\n        failures.mkdir(parents=True)\n        false_rejects = failures / "false-rejects.jsonl"\n        false_positives = failures / "false-positives.jsonl"\n        false_rejects.write_text('', encoding="utf-8")\n        false_positives.write_text('', encoding="utf-8")\n'''
          if needle not in text:
              raise SystemExit('self-test curriculum marker missing')
          text = text.replace(needle, replacement, 1)
          record_old = '''            "calibration_gate": True,\n            "test_gate": True,\n            **members,\n'''
          record_new = '''            "calibration_gate": True,\n            "test_gate": True,\n            "calibration": {\n                "false_rejects_path": str(false_rejects),\n                "false_positives_path": str(false_positives),\n            },\n            "test": {},\n            **members,\n'''
          if record_old not in text:
              raise SystemExit('self-test record marker missing')
          text = text.replace(record_old, record_new, 1)
          # After candidate tamper test, also ensure replay-source tampering is rejected.
          tamper = '''        else:\n            raise AssertionError("tampered resume candidate was accepted")\n'''
          extra = tamper + '''        shutil.copy2(state, new / "development-resume-state.json")\n        # Restore the candidate byte and tamper a replay input instead.\n        pathlib.Path(loaded["records"][0]["model"]).write_bytes(b"model\\n")\n        rebased_index = new / "datasets" / "round-00" / "domain-index.jsonl"\n        rebased_index.write_text('{"split":"tampered"}\\n', encoding="utf-8")\n        try:\n            load_state(\n                new / "development-resume-state.json",\n                work=new,\n                model_family="test",\n                architecture="test-v1",\n                source_policy="test-policy",\n                config_path=config,\n                policy_path=policy,\n            )\n        except ValueError as exc:\n            assert "candidate bytes drifted" in str(exc)\n        else:\n            raise AssertionError("tampered resume replay source was accepted")\n'''
          if tamper not in text:
              raise SystemExit('tamper assertion marker missing')
          text = text.replace(tamper, extra, 1)
          path.write_text(text)
          PY
          python3 training/development_resume.py --self-test
          python3 tests/test_gru_train_acoustic_rotation.py
          python3 -m py_compile training/development_resume.py training/iterate_gru_development.py training/iterate_rnn_development.py training/run_gru_development.py training/run_gru_development_multiseed.py tests/test_domain_loop.py tests/test_gru_train_acoustic_rotation.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add training/development_resume.py
          git commit -m 'fix(training): bind resume replay sources'
          git push origin HEAD:tmp/development-round-resume
