name: research-cosyvoice3-pilot
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'research/cosyvoice3_pilot/**'
      - '.github/workflows/research-cosyvoice3-pilot.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: research-cosyvoice3-pilot-v1
  cancel-in-progress: false
jobs:
  candidate-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run only stdlib static and synthetic contract tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I -S research/cosyvoice3_pilot/check_candidate.py
  one-time-pilot:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'cosyvoice3-six-pair-once-v1' &&
      github.run_attempt == 1 &&
      github.repository == 'jiying2007/kws-pipeline' &&
      github.event.repository.private == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/cosyvoice3-six-pair-pilot-20261002' &&
      github.event.pull_request.user.login == 'jiying2007' &&
      github.actor == 'jiying2007' &&
      contains(github.event.pull_request.body, 'KWS_COSYVOICE3_APPROVAL=')
    needs: candidate-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit exact source and bounded public scope once before runtime setup
        env:
          GH_READ_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I -S research/cosyvoice3_pilot/admit_run.py
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Qualify isolated runtime and source then run the fixed twelve-clip maximum
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
          NUMBA_NUM_THREADS: '4'
          TOKENIZERS_PARALLELISM: 'false'
        run: python3 -I -S research/cosyvoice3_pilot/controller.py
      - name: Prepare only allowlisted synthetic output and bounded technical receipts
        if: always()
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I -S research/cosyvoice3_pilot/publish_results.py
      - name: Return bounded public technical pilot artifact for one day
        if: always() && hashFiles('cosyvoice3-public-artifact/manifest.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cosyvoice3-six-pair-pilot-${{ github.run_id }}
          path: cosyvoice3-public-artifact/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
