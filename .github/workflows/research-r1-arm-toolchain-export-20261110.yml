# One-shot, source-only public toolchain export. Never accepts model/audio.
# Branch constrained, run attempt 1 only. No scheduled/manual recurrent trigger.
name: R1 ARM public toolchain handoff 20261110
on:
  push:
    branches:
      - research/r1-arm-toolchain-export-20261110-v1
permissions:
  contents: read
concurrency:
  group: r1-public-toolchain-20261110-v1
  cancel-in-progress: false
jobs:
  export:
    if: ${{ github.ref == 'refs/heads/research/r1-arm-toolchain-export-20261110-v1' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install public ARM compiler, sysroot and static QEMU within fixed budget
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo python3 -I -S -B tools/install_arm_dependencies.py
      - name: Export public binaries only with SHA256 and package versions
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/r1-arm-public-toolchain"
          mkdir -p "$out"
          test -x /usr/bin/qemu-arm-static
          test -x /usr/bin/arm-linux-gnueabihf-gcc
          test -d /usr/arm-linux-gnueabihf
          test -d /usr/lib/gcc-cross/arm-linux-gnueabihf
          find /usr/arm-linux-gnueabihf -name ld-linux-armhf.so.3 -print -quit | grep -q .
          paths=(usr/arm-linux-gnueabihf usr/lib/gcc-cross/arm-linux-gnueabihf usr/bin/qemu-arm-static)
          if test -d /usr/libexec/gcc/arm-linux-gnueabihf; then
            paths+=(usr/libexec/gcc/arm-linux-gnueabihf)
          fi
          shopt -s nullglob
          for file in /usr/bin/arm-linux-gnueabihf-*; do
            if [[ -f "$file" || -L "$file" ]]; then paths+=("${file#/}"); fi
          done
          test "${#paths[@]}" -ge 20
          tar -C / -czf "$out/toolchain.tar.gz" "${paths[@]}"
          test "$(stat -c%s "$out/toolchain.tar.gz")" -le 350000000
          (cd "$out"; sha256sum toolchain.tar.gz > SHA256SUMS)
          dpkg-query -W -f='${Package} ${Version}\n' gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user-static binutils-arm-linux-gnueabihf > "$out/PACKAGES.txt"
          printf '%s\n' 'Public GNU GCC/binutils, GNU libc cross-sysroot and QEMU binaries from Ubuntu 24.04 packages.' 'Only toolchain/target libs: NO model weights, NO audio, NO private data, NO source repo secrets.' 'Corresponding package source and licenses: https://packages.ubuntu.com/ and https://archive.ubuntu.com/ubuntu/pool/.' 'Artifact expires after one day; this export does not qualify SSC305 firmware.' > "$out/README.txt"
          ls -lh "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r1-public-arm-toolchain-20261110-v1
          path: ${{ runner.temp }}/r1-arm-public-toolchain/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
