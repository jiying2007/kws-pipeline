name: repository-cleanup

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report deletable retired/closed branches without deleting them"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: repository-cleanup
  cancel-in-progress: false

env:
  SAFE_BRANCH_PREFIXES: "feature/ feat/ fix/ chore/ refactor/ docs/ test/ ci/ tmp/ codex/ kws/ commercial/ deployment/ governance/ audit/ cleanup/ eval/ exp/ experiment/ infra/ obs/ perf/ probe/ research/ staging- staging/ training/"
