    training/keyword-set-identity-v1
  RETAINED_DESIGN_BRANCHES: >-
    feat/decoder-boundary-requalification-v1
    training/keyword-set-contract-v1
    training/keyword-set-identity-v1

jobs:
  sweep-merged-branches:
    name: sweep retired ephemeral branches
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - name: Delete only provably retired ephemeral branches
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          is_safe_prefix() {
            local candidate="$1"
            local prefix
            for prefix in ${SAFE_BRANCH_PREFIXES}; do
              [[ "${candidate}" == "${prefix}"* ]] && return 0
            done
            return 1
          }

          is_explicitly_retired() {
            local candidate="$1"
            local retired
            for retired in ${RETIRED_BRANCHES}; do
              [[ "${candidate}" == "${retired}" ]] && return 0
            done
            return 1
          }

          is_retained_consolidation() {
            local candidate="$1"
            local retained
            for retained in ${RETAINED_CONSOLIDATION_BRANCHES}; do
              [[ "${candidate}" == "${retained}" ]] && return 0
            done
            return 1
          }

          is_retained_design() {
            local candidate="$1"
            local retained
            for retained in ${RETAINED_DESIGN_BRANCHES}; do
              [[ "${candidate}" == "${retained}" ]] && return 0
            done
            return 1
          }

          active_runs_present() {
            local candidate="$1" response
            # Follow every advertised page, then prove the result is complete.
            # GitHub caps filtered searches at 1,000: a truncated/changing result
            # must abort cleanup, never become an apparent zero active count.
            # Unknown future non-completed states also retain the branch.
            response="$(gh api --paginate --slurp -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f branch="${candidate}" -f per_page=100)" || return 1
            jq -er --arg branch "$candidate" '
              if type != "array" or length == 0 then
                error("missing workflow-runs pages")
              elif any(.[]; type != "object" or (.total_count | type) != "number" or
                       (.workflow_runs | type) != "array") then
                error("invalid workflow-runs page")
              elif any(.[]; .total_count < 0 or (.total_count | floor) != .total_count or
                       (.workflow_runs | length) > 100) then
                error("invalid workflow-runs count")
              elif ([.[].total_count] | unique | length) != 1 then
                error("workflow-runs changed during pagination")
              else .[0].total_count as $total | [.[].workflow_runs[]] as $runs |
                if ($runs | length) != $total then
                  error("incomplete workflow-runs pagination; preserve branch")
                elif any($runs[]; (.id | type) != "number" or
                         .head_branch != $branch or (.status | type) != "string" or .status == "") then
                  error("invalid workflow-run identity or status")
                elif ([$runs[].id] | unique | length) != $total then
                  error("duplicate workflow runs across pages")
                elif any($runs[]; .status != "completed") then 1
                else 0 end
              end
            ' <<<"$response"
          }

          dry_run=false
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INPUT_DRY_RUN:-false}" == "true" ]]; then
            dry_run=true
          fi

          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          owner="${GITHUB_REPOSITORY_OWNER}"
          gh auth setup-git >/dev/null
          remote="https://github.com/${GITHUB_REPOSITORY}.git"

          branches_json="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/branches?per_page=100")"
          default_sha="$(jq -r --arg name "${default_branch}" \
            '[.[][] | select(.name == $name)][0].commit.sha // empty' <<<"${branches_json}")"
          if [[ -z "${default_sha}" ]]; then
            echo "error: default branch '${default_branch}' was not returned by branches API" >&2
            exit 2
          fi

          graph="${RUNNER_TEMP}/repository-cleanup-graph"
          git init -q "${graph}"
          git -C "${graph}" remote add origin "${remote}"
          git -C "${graph}" fetch --quiet --no-tags --prune origin \
            '+refs/heads/*:refs/remotes/origin/*'
          default_ref="refs/remotes/origin/${default_branch}"
          if ! git -C "${graph}" show-ref --verify --quiet "${default_ref}"; then
            echo "error: default branch ref '${default_ref}' was not fetched" >&2
            exit 2
          fi

          deleted=0
          candidates=0
          manual_review=0
          retained_design=0
          retained_consolidation=0
          mapfile -t branch_rows < <(
            jq -r '.[][] | [.name, .commit.sha, .protected] | @tsv' <<<"${branches_json}"
          )

          for row in "${branch_rows[@]}"; do
            IFS=$'\t' read -r branch sha protected <<<"${row}"
            [[ "${branch}" == "${default_branch}" ]] && continue
            if is_retained_consolidation "${branch}"; then
              retained_consolidation=$((retained_consolidation + 1))
              echo "skip consolidation retention: ${branch}"
              continue
            fi
            is_safe_prefix "${branch}" || continue
            if [[ "${protected}" == "true" ]]; then
              echo "skip protected: ${branch}"
              continue
            fi

            open_prs="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open -f head="${owner}:${branch}" -f per_page=100 --jq 'length')"
            if (( open_prs != 0 )); then
              echo "skip open PR: ${branch}"
              continue
            fi

            if is_retained_design "${branch}"; then
              retained_design=$((retained_design + 1))
              echo "skip retained design: ${branch}"
              continue
            fi

            reason=""
            branch_ref="refs/remotes/origin/${branch}"
            if is_explicitly_retired "${branch}"; then
              active_runs="$(active_runs_present "$branch")"
              if (( active_runs != 0 )); then
                echo "skip active retired branch: ${branch}"
                continue
              fi
              reason="explicitly retired historical branch"
            elif git -C "${graph}" show-ref --verify --quiet "${branch_ref}" && \
                 git -C "${graph}" merge-base --is-ancestor "${branch_ref}" "${default_ref}"; then
              reason="branch tip is already contained in ${default_branch}"
            else
              closed_prs_json="$(
                gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" \
                  -f state=closed -f head="${owner}:${branch}" -f per_page=100
              )"
              merged_same_head="$(
                jq --arg sha "${sha}" \
                  '[.[] | select(.merged_at != null and .head.sha == $sha)] | length' \
                  <<<"${closed_prs_json}"
              )"
              if (( merged_same_head > 0 )); then
                reason="current SHA is an already-merged PR head"
              else
                closed_unmerged_at="$(
                  jq -r --arg sha "${sha}" \
                    '[.[] | select(.merged_at == null and .head.sha == $sha) | .closed_at] | max // empty' \
                    <<<"${closed_prs_json}"
                )"
                if [[ -n "${closed_unmerged_at}" ]]; then
                  closed_epoch="$(date -d "${closed_unmerged_at}" +%s)"
                  now_epoch="$(date +%s)"
                  retention_seconds="$((CLOSED_PR_RETENTION_DAYS * 86400))"
                  age_seconds="$((now_epoch - closed_epoch))"
                  if (( age_seconds >= retention_seconds )); then
                    reason="current SHA is a closed-unmerged PR head older than ${CLOSED_PR_RETENTION_DAYS}d"
                  else
                    echo "skip recently closed PR head: ${branch} (closed ${closed_unmerged_at})"
                  fi
                else
                  manual_review=$((manual_review + 1))
                  echo "manual-review: ${branch} (diverged from ${default_branch}; no exact-head closed PR provenance)"
                fi
              fi
            fi

            [[ -n "${reason}" ]] || continue
            candidates=$((candidates + 1))
            echo "candidate: ${branch} (${reason})"
            if [[ "${dry_run}" == "true" ]]; then
              continue
            fi

            # Re-read PR/run state immediately before deletion. These API checks
            # are best effort, not atomic with deletion; the exact-SHA lease below
            # independently rejects any concurrent branch-tip update.
            latest_sha="$(git ls-remote --heads "${remote}" "refs/heads/${branch}" | awk '{print $1}')"
            latest_open_prs="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open -f head="${owner}:${branch}" -f per_page=100 --jq 'length')"
            latest_active_runs="$(active_runs_present "$branch")"
            if [[ "${latest_sha}" != "${sha}" || "${latest_open_prs}" != "0" || "${latest_active_runs}" != "0" ]]; then
              echo "skip race: ${branch} changed while cleanup was running"
              continue
            fi

            git -C "${graph}" push --quiet --force-with-lease="refs/heads/${branch}:${sha}" origin ":refs/heads/${branch}"
            deleted=$((deleted + 1))
            echo "deleted: ${branch}"
          done

          echo "summary: candidates=${candidates} deleted=${deleted} manual_review=${manual_review} retained_design=${retained_design} retained_consolidation=${retained_consolidation} dry_run=${dry_run}"
