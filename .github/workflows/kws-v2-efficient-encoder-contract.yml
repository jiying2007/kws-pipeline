name: kws-v2-efficient-encoder-contract

on:
  push:
    branches:
      - "research/kws-efficient-encoder-v2"
    paths:
      - "configs/training/kws-v2-efficient-encoder-discovery-v1.json"
      - "configs/training/kws-v2-efficient-encoder-cross-runner-repro-v1.json"
      - "configs/training/kws-v2-efficient-encoder-context-v3.json"
      - "training/research_keyword_classifier.py"
      - "training/verify_efficient_encoder_cross_runner_repro.py"
      - "training/analyze_efficient_encoder_discovery.py"
      - ".github/workflows/kws-v2-efficient-encoder-discovery.yml"
      - ".github/workflows/kws-v2-efficient-encoder-cross-runner-repro.yml"
      - ".github/workflows/kws-v2-efficient-encoder-context-v3.yml"
      - ".github/workflows/kws-v2-efficient-encoder-contract.yml"
  pull_request:
    paths:
      - "configs/training/kws-v2-efficient-encoder-discovery-v1.json"
      - "configs/training/kws-v2-efficient-encoder-cross-runner-repro-v1.json"
      - "configs/training/kws-v2-efficient-encoder-context-v3.json"
      - "training/research_keyword_classifier.py"
      - "training/verify_efficient_encoder_cross_runner_repro.py"
      - "training/analyze_efficient_encoder_discovery.py"
      - ".github/workflows/kws-v2-efficient-encoder-discovery.yml"
      - ".github/workflows/kws-v2-efficient-encoder-cross-runner-repro.yml"
      - ".github/workflows/kws-v2-efficient-encoder-context-v3.yml"
      - ".github/workflows/kws-v2-efficient-encoder-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify efficient encoder experiment contract
        run: |
          set -euo pipefail
          python3 -m py_compile training/research_keyword_classifier.py training/analyze_efficient_encoder_discovery.py
          python3 - <<'PY'
          import json, pathlib
          p=json.loads(pathlib.Path("configs/training/kws-v2-efficient-encoder-discovery-v1.json").read_text())
          assert p["policy"]=="kws-v2-efficient-encoder-discovery-v1"
          assert p["source_runtime_fit_pcen64_evidence"]["run_id"]==35429252239
          assert p["source_runtime_fit_pcen64_evidence"]["multistart_pass"] is False
          assert p["source_capacity_upper_bound"]["run_id"]==35428804016
          assert p["fixed"]["model_seeds"]==[35201,36307,37409]
          assert p["fixed"]["qualification_split_consumed"] is False
          previous={1337,2027,4099,7919,12011,16001}
          for name in (
              "configs/training/kws-v2-classifier-multistart-calibration-selection-v1.json",
              "configs/training/kws-v2-runtime-fit-pcen64-multistart-v1.json",
          ):
              old=json.loads(pathlib.Path(name).read_text())
              previous.update(seed for values in old["cohorts"].values() for seed in values)
          assert not (set(p["fixed"]["model_seeds"]) & previous)
          candidates=p["candidates"]
          assert candidates["b0-gru64"]["encoder_architecture"]=="single-gru-v1"
          assert candidates["e40-gru2x40"]["encoder_architecture"]=="stacked-gru-v2"
          assert candidates["e48-gru2x48"]["encoder_architecture"]=="stacked-gru-v2"
          assert candidates["e40-gru2x40"]["resource"]["dense_mmac_per_s"]==0.922
          assert candidates["e40-gru2x40"]["resource"]["int8_weight_float_bias_payload_bytes"]==20380
          assert candidates["e48-gru2x48"]["resource"]["dense_mmac_per_s"]==1.2792
          assert candidates["e48-gru2x48"]["resource"]["int8_weight_float_bias_payload_bytes"]==27908
          assert candidates["e40-gru2x40"]["resource"]["current_kwg1_runtime_fit"] is False
          assert p["selection"]["test_metrics_used_for_selection"] is False
          assert p["authority"]["runtime_format_change_allowed"] is False
          result=p["source_same_runner_result"]
          assert result["run_id"]==35433373024
          assert result["exact_head_sha"]=="4d98584d87caf5ae1b6530a7dfea8137bd576c09"
          assert result["same_runner_all_seeds"] is True
          assert result["discovery_pass"] is False
          assert result["selected_candidate"] is None
          assert p["numerical_contract"]=={
              "policy":"research-same-runner-paired-v3",
              "adamw_foreach":False,
              "adamw_fused":False,
              "grad_clip_foreach":False,
              "causal_authority":"same-runner-all-seeds-paired-v1",
              "all_discovery_seeds_same_runner":True,
              "cross_vendor_bit_exact_required":False,
              "cross_runner_repro_diagnostic_only":True,
          }
          source=p["source_cross_runner_repro"]
          assert source["run_id"]==35433157724
          assert source["reproducibility_pass"] is False
          assert source["observations"]["cross_vendor_groups_diverged"] is True
          classifier=pathlib.Path("training/research_keyword_classifier.py").read_text()
          assert "StackedClipGRU" in classifier
          assert "stacked-gru-v2" in classifier
          assert "ContextResidualClipGRU" in classifier
          assert "context2-residual-gru-v3" in classifier
          assert "initial_encoder_core_sha256" in classifier
          assert "foreach=False" in classifier
          assert "fused=False" in classifier
          assert '"grad_clip_foreach": False' in classifier
          analyzer=pathlib.Path("training/analyze_efficient_encoder_discovery.py").read_text()
          selection_body=analyzer.split("eligible=[",1)[1].split("# Test is reported",1)[0]
          assert '["test"]' not in selection_body
          workflow=pathlib.Path(".github/workflows/kws-v2-efficient-encoder-discovery.yml").read_text()
          assert "workflow_dispatch:" in workflow and "\n  push:" not in workflow
          assert "Train all seeds and candidates on one runner" in workflow
          assert "Aggregate same-runner calibration-only discovery" in workflow
          assert "matrix:" not in workflow
          for seed in p["fixed"]["model_seeds"]:
              assert str(seed) in pathlib.Path("configs/training/kws-v2-efficient-encoder-discovery-v1.json").read_text()
          for forbidden in ("qualification-index","fresh-validation","shadow-validation","formal-qualification"):
              assert forbidden not in workflow.lower()
          print("efficient encoder discovery contract: ok")
          PY
      - name: Verify efficient encoder cross-runner contract
        run: |
          set -euo pipefail
          python3 -m py_compile training/verify_efficient_encoder_cross_runner_repro.py
          python3 - <<'PY'
          import json, pathlib
          p=json.loads(pathlib.Path("configs/training/kws-v2-efficient-encoder-cross-runner-repro-v1.json").read_text())
          assert p["policy"]=="kws-v2-efficient-encoder-cross-runner-repro-v1"
          assert p["fixed"]["model_seeds"]==[35201,37409]
          assert p["fixed"]["replicas"]==["a","b"]
          assert set(p["candidates"])=={"b0-gru64","e40-gru2x40","e48-gru2x48"}
          assert p["required_kernel_contract"]=={
              "foreach":False,
              "fused":False,
              "grad_clip_foreach":False,
          }
          workflow=pathlib.Path(".github/workflows/kws-v2-efficient-encoder-cross-runner-repro.yml").read_text()
          assert "workflow_dispatch:" in workflow and "\n  push:" not in workflow
          assert "replica: [a, b]" in workflow
          assert "model_seed: [35201, 37409]" in workflow
          assert "Train cross-runner replica" in workflow
          print("efficient encoder cross-runner contract: ok")
          PY

      - name: Verify context residual v3 contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p=json.loads(pathlib.Path("configs/training/kws-v2-efficient-encoder-context-v3.json").read_text())
          assert p["policy"]=="kws-v2-efficient-encoder-context-v3"
          assert p["source_stacked_discovery"]["run_id"]==35433373024
          assert p["source_stacked_discovery"]["discovery_pass"] is False
          assert p["source_numeric_boundary"]["run_id"]==35433157724
          assert p["fixed"]["model_seeds"]==[38501,39607,40709]
          previous={35201,36307,37409}
          assert not (set(p["fixed"]["model_seeds"]) & previous)
          c=p["candidates"]
          assert c["c48-context2-gru48"]["resource"]=={
              "dense_mmac_per_s":0.6904,
              "int8_weight_float_bias_payload_bytes":15108,
              "recurrent_state_bytes":320,
              "current_kwg1_runtime_fit":False,
          }
          assert c["c64-context2-gru64"]["resource"]=={
              "dense_mmac_per_s":1.04,
              "int8_weight_float_bias_payload_bytes":22484,
              "recurrent_state_bytes":384,
              "current_kwg1_runtime_fit":False,
          }
          assert p["core_identity_checks"]==[
              {"candidate":"c64-context2-gru64","reference":"b0-gru64","required":True}
          ]
          assert p["selection"]["test_metrics_used_for_selection"] is False
          assert p["numerical_contract"]["all_discovery_seeds_same_runner"] is True
          assert p["authority"]["runtime_format_change_allowed"] is False
          workflow=pathlib.Path(".github/workflows/kws-v2-efficient-encoder-context-v3.yml").read_text()
          assert "Train all context-v3 seeds and candidates on one runner" in workflow
          assert "matrix:" not in workflow
          for forbidden in ("qualification-index","fresh-validation","shadow-validation","formal-qualification"):
              assert forbidden not in workflow.lower()
          print("context residual v3 contract: ok")
          PY

      - name: Worktree remains clean
        run: git diff --exit-code -- .
