name: kws-v2-classifier-multistart-calibration-selection

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: kws-v2-classifier-multistart-calibration-selection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cohort:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cohort: [cohort-a, cohort-b, cohort-c, cohort-d, cohort-e]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download frozen rendered research dataset
        uses: actions/download-artifact@v4
        with:
          name: kws-v2-research-rendered-dataset-gru-logmel-8961cfd981c80a3
          path: ${{ runner.temp }}/rendered-cache
          github-token: ${{ github.token }}
          repository: jiying2007/kws-pipeline
          run-id: 35412153192

      - name: Download frozen ordinary-speech sidecar
        uses: actions/download-artifact@v4
        with:
          name: kws-v2-research-negative-sidecar-b1eb61db767122ebc8a28d40151b73667d135c33
          path: ${{ runner.temp }}/negative-sidecar
          github-token: ${{ github.token }}
          repository: jiying2007/kws-pipeline
          run-id: 35367960968

      - name: Install pinned CPU training runtime
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input \
            torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Train calibration-only multi-start candidates
        env:
          COHORT: ${{ matrix.cohort }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/multistart/$COHORT"
          mkdir -p "$root"
          seeds="$(python3 - "$COHORT" <<'PY'
          import json, pathlib, sys
          p=json.loads(pathlib.Path("configs/training/kws-v2-classifier-multistart-calibration-selection-v1.json").read_text())
          print(" ".join(str(v) for v in p["cohorts"][sys.argv[1]]))
          PY
          )"
          common=(
            --train-manifest "$RUNNER_TEMP/rendered-cache/train.tsv"
            --train-manifest "$RUNNER_TEMP/negative-sidecar/train/negative-empty-target.tsv"
            --calibration-manifest "$RUNNER_TEMP/rendered-cache/calibration.tsv"
            --calibration-manifest "$RUNNER_TEMP/negative-sidecar/calibration/negative-empty-target.tsv"
            --test-manifest "$RUNNER_TEMP/rendered-cache/test.tsv"
            --test-manifest "$RUNNER_TEMP/negative-sidecar/test/negative-empty-target.tsv"
            --tokens keywords/tokens.example.txt
            --keywords keywords/zh_cn_example.tsv
            --feature-dim 32
            --epochs 24
            --batch-size 16
            --lr 0.001
            --lr-schedule fixed-v1
            --sampler-seed 1337
            --init-mode default-pytorch-v1
            --balance-mode equal-class-sampler-v1
          )
          for seed in $seeds; do
            for spec in "b0-logmel64 logmel 64" "fc1-pcen128 pcen-lite 128"; do
              read -r name frontend hidden <<< "$spec"
              out="$root/$name/$seed"
              mkdir -p "$out"
              .venv/bin/python training/research_keyword_classifier.py \
                "${common[@]}" \
                --frontend "$frontend" \
                --hidden-dim "$hidden" \
                --model-seed "$seed" \
                --output "$out/classifier.json"
            done
          done

      - name: Select starts using calibration only
        env:
          COHORT: ${{ matrix.cohort }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/multistart/$COHORT"
          .venv/bin/python training/analyze_classifier_multistart_selection.py cohort \
            --config configs/training/kws-v2-classifier-multistart-calibration-selection-v1.json \
            --cohort "$COHORT" \
            --root "$root" \
            --output "$root/cohort-evidence.json"

      - name: Upload cohort evidence
        uses: actions/upload-artifact@v4
        with:
          name: kws-v2-multistart-${{ matrix.cohort }}-${{ github.sha }}
          path: ${{ runner.temp }}/multistart/${{ matrix.cohort }}/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: cohort
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download cohort evidence
        uses: actions/download-artifact@v4
        with:
          pattern: kws-v2-multistart-*-${{ github.sha }}
          path: ${{ runner.temp }}/multistart-evidence
          merge-multiple: false
      - name: Aggregate calibration-only selection evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/multistart-summary"
          python3 training/analyze_classifier_multistart_selection.py aggregate \
            --config configs/training/kws-v2-classifier-multistart-calibration-selection-v1.json \
            --root "$RUNNER_TEMP/multistart-evidence" \
            --output "$RUNNER_TEMP/multistart-summary/summary.json"
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: kws-v2-classifier-multistart-summary-${{ github.sha }}
          path: ${{ runner.temp }}/multistart-summary/
          if-no-files-found: error
          retention-days: 30
