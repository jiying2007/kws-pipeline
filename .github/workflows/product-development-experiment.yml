name: product-development-experiment

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/triggers/model-training-experiment.json' # workflow-path-filter: allow-missing (created only on experiment PRs)
      - '.github/workflows/product-development-experiment.yml'
      - 'training/product_development_experiment.py'

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  KWS_EXPERIMENT_SPEC: .github/triggers/model-training-experiment.json
  KWS_EFFECTIVE_TRAINING_CONFIG: .generated/xiaowo.product-effective.json
  KWS_EXPERIMENT_CONFIG: .generated/xiaowo.product-experiment.json
  KWS_EXPERIMENT_WORK: build/product-development-experiment
  KWS_EXPERIMENT_RECEIPT: build/product-development-experiment-receipt.json

concurrency:
  group: product-development-experiment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      experiment_changed: ${{ steps.diff.outputs.experiment_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact PR-head experiment
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$KWS_EXPERIMENT_SPEC"; then
            echo "experiment_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -s "$KWS_EXPERIMENT_SPEC"
          if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- .github/triggers/model-training-request.json; then
            echo "development experiment must not change governed model-training request" >&2
            exit 2
          fi
          for forbidden in             configs/training/xiaowo.torch-domain.json             configs/training/product-speech-like-base-v1.json             .github/workflows/model-training.yml; do
            if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$forbidden"; then
              echo "development experiment must not change protected canonical path: $forbidden" >&2
              exit 2
            fi
          done
          python3 training/product_development_experiment.py verify             --spec "$KWS_EXPERIMENT_SPEC"
          echo "experiment_changed=true" >> "$GITHUB_OUTPUT"

  experiment:
    needs: resolve
    if: needs.resolve.outputs.experiment_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact PR-head source
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 training/product_development_experiment.py verify             --spec "$KWS_EXPERIMENT_SPEC"
          if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- .github/triggers/model-training-request.json; then
            exit 2
          fi

      - name: Materialize governed unprotected product base
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash training/materialize_governed_product_base.sh

      - name: Materialize bounded PR-head experiment config
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 training/product_development_experiment.py materialize             --spec "$KWS_EXPERIMENT_SPEC"             --effective-config "$KWS_EFFECTIVE_TRAINING_CONFIG"             --output "$KWS_EXPERIMENT_CONFIG"             --receipt "$KWS_EXPERIMENT_RECEIPT"             --base-sha "$BASE_SHA"             --head-sha "$HEAD_SHA"
          python3 training/verify_training_entry_contract.py             --config "$KWS_EXPERIMENT_CONFIG"             --require-product-speech-like-base

      - name: Resolve optional decoder policy diagnostic
        id: decoder_policy
        run: |
          enabled="$(python3 - <<'PY'
          import json, os, pathlib
          spec=json.loads(pathlib.Path(os.environ['KWS_EXPERIMENT_SPEC']).read_text(encoding='utf-8'))
          experiment_id=str(spec.get('experiment_id',''))
          print('true' if experiment_id.startswith('decoder-policy-replay-') else 'false')
          PY
          )"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Build exact C runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel --target             kws_wav kws_feature_dump kws_posterior_dump kws_decoder_replay kws_decoder_tests kws_decoder_retention_tests
          ctest --test-dir build --output-on-failure -R '^kws_decoder_(tests|retention_tests)$'

      - name: Install pinned CPU training runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input             torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Verify objective math
        run: .venv/bin/python training/test_sequence_margin.py

      - name: Run bounded PR-head base development
        id: base
        shell: bash
        run: |
          set +e
          .venv/bin/python training/iterate_domain.py             --config "$KWS_EXPERIMENT_CONFIG"             --runner build/kws_wav             --work-dir "$KWS_EXPERIMENT_WORK"             --posterior-dump build/kws_posterior_dump             --decoder-replay build/kws_decoder_replay             --posterior-cache "$KWS_EXPERIMENT_WORK/posterior-cache"             --defer-qualification             --compact-log
          code=$?
          set -e
          case "$code" in 0|1) ;; *) exit "$code" ;; esac
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -s "$KWS_EXPERIMENT_WORK/domain-loop-manifest.json"

      - name: Evaluate refinement eligibility
        id: eligibility
        run: |
          .venv/bin/python training/evaluate_refinement_eligibility.py             --config "$KWS_EXPERIMENT_CONFIG"             --manifest "$KWS_EXPERIMENT_WORK/domain-loop-manifest.json"             --output "$KWS_EXPERIMENT_WORK/base-refinement-eligibility.json"
          eligible="$(python3 - <<'PY'
          import json, os, pathlib
          path=pathlib.Path(os.environ['KWS_EXPERIMENT_WORK'])/'base-refinement-eligibility.json'
          value=json.loads(path.read_text(encoding='utf-8')).get('eligible')
          if value is True: print('true')
          elif value is False: print('false')
          else: raise SystemExit('refinement eligibility must be boolean')
          PY
          )"
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Diagnose base acoustic/runtime alignment
        run: |
          .venv/bin/python tools/diagnose_acoustic_alignment.py             --config "$KWS_EXPERIMENT_CONFIG"             --manifest "$KWS_EXPERIMENT_WORK/domain-loop-manifest.json"             --feature-dump build/kws_feature_dump             --runner build/kws_wav             --max-per-keyword-split 8             --output "$KWS_EXPERIMENT_WORK/acoustic-alignment.json"
          python3 tools/build_training_diagnostics.py             --config "$KWS_EXPERIMENT_CONFIG"             --work-dir "$KWS_EXPERIMENT_WORK"             --output "$KWS_EXPERIMENT_WORK/compact-base-diagnostics.json"

      - name: Diagnose sequence-margin runtime gap
        run: |
          .venv/bin/python - <<'PY'
          import json, os, pathlib, subprocess, sys

          repo=pathlib.Path.cwd()
          sys.path.insert(0,str(repo/'training'))
          from adversarial_refinement import select_refinement_source

          root=pathlib.Path(os.environ['KWS_EXPERIMENT_WORK'])
          manifest=json.loads((root/'domain-loop-manifest.json').read_text(encoding='utf-8'))
          config_path=pathlib.Path(os.environ['KWS_EXPERIMENT_CONFIG'])
          config=json.loads(config_path.read_text(encoding='utf-8'))
          source, policy=select_refinement_source(manifest)
          tokens=pathlib.Path(str(config['tokens']))
          if not tokens.is_absolute():
              tokens=(repo/tokens).resolve()
          command=[
              str(repo/'.venv/bin/python'),
              'tools/diagnose_sequence_margin_runtime_gap.py',
              '--model',str(source['model']),
              '--tokens',str(tokens),
              '--keywords-tsv',str(source['keywords']),
              '--pack',str(source['pack']),
              '--decoder-replay','build/kws_decoder_replay',
              '--posterior-cache',str(root/'posterior-cache'),
              '--output',str(root/'sequence-margin-runtime-gap.json'),
          ]
          subprocess.check_call(command)
          print(json.dumps({
              'sequence_margin_runtime_gap_diagnostic':True,
              'source_round':int(source['round']),
              'source_selection_policy':policy,
              'selection_feedback_allowed':False,
          },sort_keys=True))
          PY

      - name: Diagnose saturated source threshold grid
        run: |
          .venv/bin/python - <<'PY'
          import json, os, pathlib, subprocess, sys

          repo=pathlib.Path.cwd()
          sys.path.insert(0,str(repo/'training'))
          from adversarial_refinement import select_refinement_source

          root=pathlib.Path(os.environ['KWS_EXPERIMENT_WORK'])
          manifest=json.loads((root/'domain-loop-manifest.json').read_text(encoding='utf-8'))
          config_path=pathlib.Path(os.environ['KWS_EXPERIMENT_CONFIG'])
          config=json.loads(config_path.read_text(encoding='utf-8'))
          source, policy=select_refinement_source(manifest)
          calibration=source.get('calibration')
          if not isinstance(calibration,dict):
              raise SystemExit('refinement source lacks calibration evidence')
          grid=[float(value) for value in calibration.get('calibration_threshold_grid',[])]
          selected=calibration.get('calibrated_thresholds')
          if not grid or not isinstance(selected,dict) or not selected:
              raise SystemExit('refinement source lacks threshold calibration evidence')
          low=min(grid); high=max(grid)
          edge_keywords={
              str(keyword_id):(
                  'min' if abs(float(value)-low) <= 1.0e-12
                  else 'max' if abs(float(value)-high) <= 1.0e-12
                  else None
              )
              for keyword_id,value in selected.items()
          }
          edge_keywords={key:value for key,value in edge_keywords.items() if value is not None}
          triggered=bool(edge_keywords)
          trigger={
              'schema_version':1,
              'evidence_class':'development-threshold-saturation-trigger-v1',
              'development_only':True,
              'selection_feedback_allowed':False,
              'source_round':int(source['round']),
              'source_frontend':str(source['frontend']),
              'source_selection_policy':policy,
              'formal_grid_min':low,
              'formal_grid_max':high,
              'formal_selected_thresholds':{
                  str(key):float(value) for key,value in selected.items()
              },
              'edge_keywords':edge_keywords,
              'triggered':triggered,
              'diagnostic_thresholds':[
                  round(0.20 + 0.05*index,2) for index in range(15)
              ] if triggered else [],
          }
          (root/'threshold-saturation-trigger.json').write_text(
              json.dumps(trigger,ensure_ascii=False,indent=2,sort_keys=True)+'\n',
              encoding='utf-8',
          )
          if not triggered:
              print('threshold saturation diagnostic: not triggered')
              raise SystemExit(0)

          model=pathlib.Path(str(source['model']))
          keywords=pathlib.Path(str(source['keywords']))
          candidate_dir=model.parent
          round_index=int(source['round'])
          dataset=root/'datasets'/f'round-{round_index:02d}'
          tokens=pathlib.Path(str(config['tokens']))
          if not tokens.is_absolute():
              tokens=(repo/tokens).resolve()
          thresholds=[f'{0.20 + 0.05*index:.2f}' for index in range(15)]
          command=[
              str(repo/'.venv/bin/python'),
              'tools/diagnose_kws_threshold_operating_curve.py',
              '--runner','build/kws_wav',
              '--model',str(model),
              '--tokens',str(tokens),
              '--keywords',str(keywords),
              '--config',str(config_path),
              '--calibration-references',str(dataset/'calibration.references.jsonl'),
              '--test-references',str(dataset/'test.references.jsonl'),
              '--thresholds',*thresholds,
              '--development-manifest',str(root/'domain-loop-manifest.json'),
              '--development-authority-receipt',os.environ['KWS_EXPERIMENT_RECEIPT'],
              '--round-index',str(round_index),
              '--diagnostic-round-selection-policy','refinement-source-saturation-v1',
              '--work-dir',str(root/'threshold-wide-sweep-work'),
              '--output',str(root/'threshold-wide-sweep.json'),
              '--posterior-dump','build/kws_posterior_dump',
              '--decoder-replay','build/kws_decoder_replay',
              '--posterior-cache',str(root/'posterior-cache'),
          ]
          subprocess.check_call(command)
          print(json.dumps({
              'threshold_saturation_triggered':True,
              'source_round':round_index,
              'edge_keywords':edge_keywords,
              'threshold_count':len(thresholds),
          },sort_keys=True))
          PY

      - name: Diagnose recalibrated decoder retention curve
        run: |
          .venv/bin/python - <<'PY'
          import json, os, pathlib, subprocess, sys

          repo=pathlib.Path.cwd()
          sys.path.insert(0,str(repo/'training'))
          from adversarial_refinement import select_refinement_source

          root=pathlib.Path(os.environ['KWS_EXPERIMENT_WORK'])
          manifest=json.loads((root/'domain-loop-manifest.json').read_text(encoding='utf-8'))
          config_path=pathlib.Path(os.environ['KWS_EXPERIMENT_CONFIG'])
          config=json.loads(config_path.read_text(encoding='utf-8'))
          source, policy=select_refinement_source(manifest)
          model=pathlib.Path(str(source['model']))
          keywords=pathlib.Path(str(source['keywords']))
          round_index=int(source['round'])
          dataset=root/'datasets'/f'round-{round_index:02d}'
          tokens=pathlib.Path(str(config['tokens']))
          if not tokens.is_absolute():
              tokens=(repo/tokens).resolve()
          retentions=['0.85','0.90','0.94','0.97','0.99']
          command=[
              str(repo/'.venv/bin/python'),
              'tools/diagnose_decoder_retention_recalibrated_curve.py',
              '--runner','build/kws_wav',
              '--model',str(model),
              '--tokens',str(tokens),
              '--keywords',str(keywords),
              '--config',str(config_path),
              '--calibration-references',str(dataset/'calibration.references.jsonl'),
              '--test-references',str(dataset/'test.references.jsonl'),
              '--development-manifest',str(root/'domain-loop-manifest.json'),
              '--development-authority-receipt',os.environ['KWS_EXPERIMENT_RECEIPT'],
              '--round-index',str(round_index),
              '--diagnostic-round-selection-policy','refinement-source-retention-v1',
              '--posterior-dump','build/kws_posterior_dump',
              '--decoder-replay','build/kws_decoder_replay',
              '--posterior-cache',str(root/'posterior-cache'),
              '--retentions',*retentions,
              '--work-dir',str(root/'decoder-retention-recalibrated-work'),
              '--output',str(root/'decoder-retention-recalibrated-curve.json'),
          ]
          subprocess.check_call(command)
          print(json.dumps({
              'decoder_retention_diagnostic':True,
              'source_round':round_index,
              'source_selection_policy':policy,
              'shipping_default_retention':0.94,
              'retentions':[float(value) for value in retentions],
              'selection_feedback_allowed':False,
          },sort_keys=True))
          PY

      - name: Diagnose decoder blank/fuzzy policy grid
        if: steps.decoder_policy.outputs.enabled == 'true'
        run: |
          .venv/bin/python - <<'PY'
          import json, os, pathlib, subprocess, sys

          repo=pathlib.Path.cwd()
          sys.path.insert(0,str(repo/'training'))
          from adversarial_refinement import select_refinement_source

          root=pathlib.Path(os.environ['KWS_EXPERIMENT_WORK'])
          manifest=json.loads((root/'domain-loop-manifest.json').read_text(encoding='utf-8'))
          config_path=pathlib.Path(os.environ['KWS_EXPERIMENT_CONFIG'])
          config=json.loads(config_path.read_text(encoding='utf-8'))
          source, policy=select_refinement_source(manifest)
          model=pathlib.Path(str(source['model']))
          keywords=pathlib.Path(str(source['keywords']))
          round_index=int(source['round'])
          dataset=root/'datasets'/f'round-{round_index:02d}'
          tokens=pathlib.Path(str(config['tokens']))
          if not tokens.is_absolute():
              tokens=(repo/tokens).resolve()
          command=[
              str(repo/'.venv/bin/python'),
              'tools/diagnose_decoder_policy_replay.py',
              '--runner','build/kws_wav',
              '--model',str(model),
              '--tokens',str(tokens),
              '--keywords',str(keywords),
              '--config',str(config_path),
              '--calibration-references',str(dataset/'calibration.references.jsonl'),
              '--test-references',str(dataset/'test.references.jsonl'),
              '--development-manifest',str(root/'domain-loop-manifest.json'),
              '--development-authority-receipt',os.environ['KWS_EXPERIMENT_RECEIPT'],
              '--round-index',str(round_index),
              '--diagnostic-round-selection-policy','refinement-source-decoder-policy-v1',
              '--posterior-dump','build/kws_posterior_dump',
              '--decoder-replay','build/kws_decoder_replay',
              '--posterior-cache',str(root/'posterior-cache'),
              '--blank-retentions','0.70','0.85','0.95',
              '--fuzzy-child-cost-logs','-8.25','-4.0',
              '--coordinate-rounds','1',
              '--work-dir',str(root/'decoder-policy-replay-work'),
              '--output',str(root/'decoder-policy-replay-grid.json'),
          ]
          subprocess.check_call(command)
          print(json.dumps({
              'decoder_policy_diagnostic':True,
              'source_round':round_index,
              'source_selection_policy':policy,
              'blank_retentions':[0.70,0.85,0.95],
              'fuzzy_child_cost_logs':[-8.25,-4.0],
              'selection_feedback_allowed':False,
          },sort_keys=True))
          PY

      - name: Run bounded refinement experiment
        if: steps.eligibility.outputs.eligible == 'true' && steps.decoder_policy.outputs.enabled != 'true'
        run: |
          .venv/bin/python training/adversarial_refinement.py             --config "$KWS_EXPERIMENT_CONFIG"             --runner build/kws_wav             --work-dir "$KWS_EXPERIMENT_WORK"             --posterior-dump build/kws_posterior_dump             --decoder-replay build/kws_decoder_replay             --posterior-cache "$KWS_EXPERIMENT_WORK/posterior-cache"             --stop-after-development-eval
          test -s "$KWS_EXPERIMENT_WORK/adversarial-refinement/preflight-summary.json"

      - name: Summarize posterior replay cache
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['KWS_EXPERIMENT_WORK'])
          cache=root/'posterior-cache'
          provenances=[]
          total_hits=0
          total_misses=0
          for path in sorted(root.rglob('detections.provenance.json')):
              value=json.loads(path.read_text(encoding='utf-8'))
              if value.get('evaluation_mode') != 'posterior-replay-cache-v1':
                  continue
              hits=int(value.get('posterior_cache_hits',0))
              misses=int(value.get('posterior_cache_misses',0))
              total_hits += hits
              total_misses += misses
              provenances.append({
                  'path':str(path.relative_to(root)),
                  'hits':hits,
                  'misses':misses,
                  'recordings':int(value.get('recordings',0)),
              })
          traces=sorted(cache.rglob('*.kwtr')) if cache.is_dir() else []
          sidecars=sorted(cache.rglob('*.json')) if cache.is_dir() else []
          result={
              'schema_version':1,
              'evidence_class':'posterior-replay-cache-summary-v1',
              'evaluation_provenance_files':len(provenances),
              'total_cache_hits':total_hits,
              'total_cache_misses':total_misses,
              'unique_traces':len(traces),
              'trace_bytes':sum(path.stat().st_size for path in traces),
              'cache_sidecars':len(sidecars),
              'evaluations':provenances,
          }
          if not provenances or not traces or total_misses <= 0:
              raise SystemExit('posterior replay cache evidence is incomplete')
          (root/'posterior-cache-summary.json').write_text(
              json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'hits':total_hits,
              'misses':total_misses,
              'unique_traces':len(traces),
              'trace_bytes':result['trace_bytes'],
          },sort_keys=True))
          PY

      - name: Build experiment summary
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_EXIT: ${{ steps.base.outputs.exit_code }}
          REFINEMENT_ELIGIBLE: ${{ steps.eligibility.outputs.eligible }}
          DECODER_POLICY_REPLAY_ENABLED: ${{ steps.decoder_policy.outputs.enabled }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['KWS_EXPERIMENT_WORK'])
          def load_optional(path):
              if not path.is_file():
                  return None
              value=json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(value,dict):
                  raise SystemExit(f'experiment evidence must be a JSON object: {path}')
              return value

          receipt=load_optional(pathlib.Path(os.environ['KWS_EXPERIMENT_RECEIPT']))
          manifest=load_optional(root/'domain-loop-manifest.json')
          eligibility=load_optional(root/'base-refinement-eligibility.json')
          acoustic=load_optional(root/'acoustic-alignment.json')
          refinement=load_optional(root/'adversarial-refinement'/'preflight-summary.json')
          posterior_cache=load_optional(root/'posterior-cache-summary.json')
          threshold_trigger=load_optional(root/'threshold-saturation-trigger.json')
          threshold_sweep=load_optional(root/'threshold-wide-sweep.json')
          retention_curve=load_optional(root/'decoder-retention-recalibrated-curve.json')
          decoder_policy=load_optional(root/'decoder-policy-replay-grid.json')
          sequence_margin_gap=load_optional(root/'sequence-margin-runtime-gap.json')
          required={
              'experiment_receipt': receipt is not None,
              'domain_loop_manifest': manifest is not None,
              'refinement_eligibility': eligibility is not None,
              'acoustic_alignment': acoustic is not None,
              'sequence_margin_runtime_gap': sequence_margin_gap is not None,
              'posterior_cache': posterior_cache is not None,
              'threshold_saturation_trigger': threshold_trigger is not None,
              'decoder_retention_recalibrated_curve': retention_curve is not None,
          }
          if isinstance(threshold_trigger,dict) and threshold_trigger.get('triggered') is True:
              required['threshold_wide_sweep']=threshold_sweep is not None
          decoder_policy_enabled=os.environ.get('DECODER_POLICY_REPLAY_ENABLED') == 'true'
          if (
              isinstance(eligibility,dict)
              and eligibility.get('eligible') is True
              and not decoder_policy_enabled
          ):
              required['refinement_summary']=refinement is not None
          if decoder_policy_enabled:
              required['decoder_policy_replay_grid']=decoder_policy is not None
          summary={
              'schema_version':1,
              'evidence_class':'product-development-pr-head-experiment-summary-v1',
              'development_only':True,
              'protected_evidence_used':False,
              'source_policy':'exact-pr-head',
              'pr_base_sha':os.environ['BASE_SHA'],
              'pr_head_sha':os.environ['HEAD_SHA'],
              'infrastructure_complete':all(required.values()),
              'required_evidence_present':required,
              'experiment_receipt':receipt,
              'base_exit_code':(
                  int(os.environ['BASE_EXIT'])
                  if os.environ.get('BASE_EXIT') not in (None,'')
                  else None
              ),
              'refinement_eligible':(
                  eligibility.get('eligible') if eligibility is not None else None
              ),
              'refinement_skipped_for_decoder_policy':(
                  decoder_policy_enabled
                  and isinstance(eligibility,dict)
                  and eligibility.get('eligible') is True
              ),
              'base_candidate_selection':(
                  manifest.get('candidate_selection') if manifest is not None else None
              ),
              'base_records':manifest.get('records',[]) if manifest is not None else [],
              'refinement':refinement,
              'posterior_cache':posterior_cache,
              'threshold_saturation_trigger':threshold_trigger,
              'threshold_wide_sweep':threshold_sweep,
              'decoder_retention_recalibrated_curve':retention_curve,
              'decoder_policy_replay_grid':decoder_policy,
              'sequence_margin_runtime_gap':sequence_margin_gap,
          }
          (root/'experiment-summary.json').write_text(
              json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True,allow_nan=False)+'\n',
              encoding='utf-8',
          )
          PY

      - name: Retain development-only experiment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-development-experiment-${{ github.event.pull_request.base.sha }}-${{ github.event.pull_request.head.sha }}
          path: |
            .github/triggers/model-training-experiment.json
