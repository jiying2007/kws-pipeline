            build/product-development-experiment-receipt.json
            build/product-development-experiment/experiment-summary.json
            build/product-development-experiment/domain-loop-manifest.json
            build/product-development-experiment/base-refinement-eligibility.json
            build/product-development-experiment/acoustic-alignment.json
            build/product-development-experiment/sequence-margin-runtime-gap.json
            build/product-development-experiment/compact-base-diagnostics.json
            build/product-development-experiment/posterior-cache-summary.json
            build/product-development-experiment/threshold-saturation-trigger.json
            build/product-development-experiment/threshold-wide-sweep.json
            build/product-development-experiment/decoder-retention-recalibrated-curve.json
            build/product-development-experiment/decoder-policy-replay-grid.json
            build/product-development-experiment/candidates/*/model.kwm
            build/product-development-experiment/candidates/*/calibration/calibrated-keywords.tsv
            build/product-development-experiment/candidates/*/calibration/calibrated-keywords.kwk
            build/product-development-experiment/datasets/round-*/calibration.references.jsonl
            build/product-development-experiment/datasets/round-*/test.references.jsonl
            keywords/tokens.example.txt
            build/product-development-experiment/posterior-cache/**/*.kwtr
            build/product-development-experiment/posterior-cache/**/*.json
            build/product-development-experiment/candidates/*/calibration/calibration-operating-curve.json
