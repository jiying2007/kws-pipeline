name: One-shot reviewed branch archive 20261007
'on':
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed archive, diagnostic, GraphQL prune, or reviewed Git atomic prune
        required: true
        type: choice
        options: [archive, diagnose, prune, git-prune]
      reviewed_source_sha:
        description: Exact reviewed current main commit (40 hex characters)
        required: true
        type: string
      owner_policy_attestation:
        description: Git-prune only; fresh owner full-policy attestation JSON, exact both-main identities
        required: false
        default: ''
        type: string
      reviewed_cas_signature_sha256:
        description: Prune only; SHA-256 of the reviewed normalized archive/diagnostic CAS mismatch signature
        required: false
        default: ''
        type: string
permissions: {}
concurrency:
  group: archive-branches-once-20261007
  cancel-in-progress: false
jobs:
  archive:
    if: >-
      github.repository == 'jiying2007/kws-pipeline' &&
      github.repository_id == '1349639240' &&
      github.repository_owner_id == '33591504' &&
      github.actor_id == '33591504' &&
      github.actor == 'jiying2007' &&
      github.triggering_actor == 'jiying2007' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      ARCHIVE_SCRIPT_SHA256: 4bff4406e3a981c5f98b2b4e9003f7e8686001173c482aa3d0226343d4ae92a5
      ARCHIVE_TEST_SHA256: cc341905c521ece1e1c4e3f5a62dce837209969ec9db75faaa9946e05e4c12f3
      ARCHIVE_PLAN_SHA256: 8ff9b809dc585efa3bde0e119c309a22185ef142c98475b5422488160aa9ca09
      ATOMIC_MODULE_SHA256: df9599c8ad28d9b954f503120964060f5ef4d220beec70a5c73fb6fcd8e00328
      ATOMIC_GUARD_SHA256: 3773f51b07b018352ad471ee74d0f4a5f8d6fe54ba00532380d10faba80b9917
      ATOMIC_ASKPASS_SHA256: 9b96628994be01753317b89e26c63e3f35eaa1b81d1fa15cb843027401e1b53c
      ATOMIC_TEST_SHA256: 83aeb92425b53ee7b35dc6f03fcfb442b776289559a53e68802e2d60a1bfa804
      ATOMIC_COORDINATOR_TEST_SHA256: 9c87a44984eaa81690a10d1e6311f5016487f7d571d2889f8f318d62cb0dd390
      ATOMIC_TEST_FIXTURE_SHA256: 8adbbb4bf62ad7130a62166d4d9bd88a1e8502b8f385152afaf9daae14ea1fcc
      ATOMIC_API_BUDGET_TEST_SHA256: bf22ba478ad73fbb7401a654e2c4512479f1caf27bc2d86518cac6d01c19628c
    steps:
      - name: Load exact reviewed source and run offline tests
        shell: python
        env:
          SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_SHA: ${{ github.sha }}
          RUNNER_TEMP_PATH: ${{ runner.temp }}
        run: |
          import base64, hashlib, json, os, pathlib, re, subprocess, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError('redirect refused')
          source = os.environ['SOURCE_SHA']
          if not re.fullmatch('[0-9a-f]{40}', source):
              raise RuntimeError('reviewed source SHA missing or malformed')
          if source != os.environ['WORKFLOW_SHA'] or source != os.environ['EVENT_SHA']:
              raise RuntimeError('workflow source is not reviewed commit')
          root = pathlib.Path(os.environ['RUNNER_TEMP_PATH']) / 'kws-archive-reviewed'
          root.mkdir(mode=0o700)
          opener = urllib.request.build_opener(NoRedirect())
          files = [
              ('tools/archive_branches_once_20261007.py', 'archive_branches_once_20261007.py', 'ARCHIVE_SCRIPT_SHA256'),
              ('tests/test_archive_branches_once_20261007.py', 'test_archive_branches_once_20261007.py', 'ARCHIVE_TEST_SHA256'),
              ('docs/archive-branches-once-20261007.json', 'archive-plan.json', 'ARCHIVE_PLAN_SHA256'),
              ('tools/git_atomic_prune_20261008.py', 'git_atomic_prune_20261008.py', 'ATOMIC_MODULE_SHA256'),
              ('tools/git_atomic_guard_20261008.py', 'git_atomic_guard_20261008.py', 'ATOMIC_GUARD_SHA256'),
              ('tools/git_atomic_askpass_20261008.py', 'git_atomic_askpass_20261008.py', 'ATOMIC_ASKPASS_SHA256'),
              ('tests/test_git_atomic_prune_20261008.py', 'test_git_atomic_prune_20261008.py', 'ATOMIC_TEST_SHA256'),
              ('tests/test_git_atomic_coordinator_20261008.py', 'test_git_atomic_coordinator_20261008.py', 'ATOMIC_COORDINATOR_TEST_SHA256'),
              ('tests/atomic_git_test_fixtures.py', 'atomic_git_test_fixtures.py', 'ATOMIC_TEST_FIXTURE_SHA256'),
              ('tests/test_git_atomic_api_budget_20261008.py', 'test_git_atomic_api_budget_20261008.py', 'ATOMIC_API_BUDGET_TEST_SHA256'),
          ]
          for path, name, pin in files:
              url = 'https://raw.githubusercontent.com/jiying2007/kws-pipeline/' + source + '/' + path
              request = urllib.request.Request(url)
              with opener.open(request, timeout=30) as response:
                  raw = response.read(262145)
              if len(raw) > 262144:
                  raise RuntimeError('source response limit')
              if hashlib.sha256(raw).hexdigest() != os.environ[pin]:
                  raise RuntimeError('reviewed source hash mismatch')
              (root / name).write_bytes(raw)
          clean = {'PATH': '/usr/bin:/bin', 'HOME': str(root), 'LANG': 'C', 'LC_ALL': 'C'}
          for test in ('test_archive_branches_once_20261007.py', 'test_git_atomic_prune_20261008.py', 'test_git_atomic_coordinator_20261008.py', 'test_git_atomic_api_budget_20261008.py'):
              subprocess.run(['python3', '-B', str(root / test)],
                             check=True, timeout=120, env=clean, cwd=root)
      - name: Verify archives and perform only the frozen phase
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_CTX_OWNER_POLICY_ATTESTATION: ${{ inputs.owner_policy_attestation }}
          ARCHIVE_PLAN_FILE: ${{ runner.temp }}/kws-archive-reviewed/archive-plan.json
          ARCHIVE_CTX_REPOSITORY: ${{ github.repository }}
          ARCHIVE_CTX_REPOSITORY_ID: ${{ github.repository_id }}
          ARCHIVE_CTX_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          ARCHIVE_CTX_ACTOR_ID: ${{ github.actor_id }}
          ARCHIVE_CTX_ACTOR: ${{ github.actor }}
          ARCHIVE_CTX_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ARCHIVE_CTX_EVENT_NAME: ${{ github.event_name }}
          ARCHIVE_CTX_REF: ${{ github.ref }}
          ARCHIVE_CTX_RUN_ATTEMPT: ${{ github.run_attempt }}
          ARCHIVE_CTX_OPERATION: ${{ inputs.operation }}
          ARCHIVE_CTX_REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
          ARCHIVE_CTX_REVIEWED_CAS_SIGNATURE_SHA256: ${{ inputs.reviewed_cas_signature_sha256 }}
          ARCHIVE_CTX_SHA: ${{ github.sha }}
          ARCHIVE_CTX_WORKFLOW_SHA: ${{ github.workflow_sha }}
          ARCHIVE_CTX_WORKFLOW_REF: ${{ github.workflow_ref }}
          ARCHIVE_CTX_RUN_ID: ${{ github.run_id }}
        run: python3 -B "${RUNNER_TEMP}/kws-archive-reviewed/archive_branches_once_20261007.py"
      - name: Remove local reviewed source files
        if: always()
        shell: python
        env:
          RUNNER_TEMP_PATH: ${{ runner.temp }}
        run: |
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP_PATH']) / 'kws-archive-reviewed'
          if root.is_dir():
              shutil.rmtree(root)

