name: research-source-consolidation
on:
  workflow_call:
  push:
    branches: ['consolidate/**']
    paths:
      - 'research/**'
      - 'tools/verify_research_sources.py'
      - 'tools/verify_research_publication.py'
      - 'tools/run_research_source_checks.py'
      - 'tools/check_workflow_path_filters.py'
      - 'tools/research_ci_changes.py'
      - 'tests/test_research_ci_changes.py'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  offline-source-checks:
    needs: decoder-scratch
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      # Local source/retention checks run once in ci.yml python-contracts.
      - name: Require decoder scratch checks
        env:
          SCRATCH_RESULT: ${{ needs.decoder-scratch.result }}
        run: test "$SCRATCH_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify publication index with pinned public metadata
        run: |
          python3 -B tools/verify_research_publication.py --fetch-metadata
      - name: Install numeric test dependencies only
        run: |
          python3 -m pip install --only-binary=:all: --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Restore hash-keyed public helper cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/public-admission-cache
          key: public-admission-v1-${{ hashFiles('research/offline-evidence-safety-v1/PUBLIC-DEPENDENCY.json') }}
      - name: Test new saved-only admission and failure evidence
        run: python3 -B research/offline-evidence-safety-v1/run_tests.py --fetch-helper --helper-cache-dir "$RUNNER_TEMP/public-admission-cache"
      - name: Test invented-logit boundary mechanism without a model
        run: python3 -B research/saved-diagnostics-2026-10-09/run_shipping_synthetic.py . --output "$RUNNER_TEMP/shipping-boundary-synthetic"
      - name: Run the explicit synthetic and mock allowlist
        run: python3 -B tools/run_research_source_checks.py --suite synthetic
      - name: Retain synthetic-only resource and mechanism receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-optimization-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shipping-boundary-synthetic/RESULTS.json
          if-no-files-found: ignore
          retention-days: 30

  decoder-scratch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test strict opt-in scratch under both compilers
        env:
          CC: ${{ matrix.cc }}
        run: |
          python3 -B research/decoder_scratch_v1/test_driver_guards.py
          python3 -B research/decoder_scratch_v1/build.py --cc "$CC" --output "$RUNNER_TEMP/decoder-scratch-v1"
      - name: Test bounded local retention with synthetic state only
        env:
          CC: ${{ matrix.cc }}
        run: python3 -B research/bounded-local-retention-2026-10-20/run_synthetic.py --cc "$CC"
      - name: Test explicit offline research activation with invented rows only
        env:
          CC: ${{ matrix.cc }}
        run: python3 -B research/bounded-local-retention-2026-10-20/activation/run_checks.py --cc "$CC"
      - name: Retain synthetic scratch receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decoder-scratch-${{ matrix.cc }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/decoder-scratch-v1/RESULTS.json
          if-no-files-found: ignore
          retention-days: 30
