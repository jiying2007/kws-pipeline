name: research-donor-fsmn
on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "research/donor_fsmn/**"
      - "research/donor_fbank/**"
      - ".github/workflows/research-donor-fsmn.yml"
  pull_request:
    paths:
      - "research/donor_fsmn/**"
      - "research/donor_fbank/**"
      - ".github/workflows/research-donor-fsmn.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-synthetic-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Portable synthetic contracts without donor assets or dependencies
        run: python research/donor_fsmn/tests/run_portable.py
      - name: Address and undefined behavior sanitizer contracts
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -ffp-contract=off -fsanitize=address,undefined -fno-omit-frame-pointer research/donor_fsmn/tests/test_portable.c research/donor_fsmn/pcm.c research/donor_fsmn/splice.c research/donor_fbank/donor_fbank.c -lm -o "$RUNNER_TEMP/donor-fsmn-portable"
          "$RUNNER_TEMP/donor-fsmn-portable"
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -ffp-contract=off -fsanitize=address,undefined -fno-omit-frame-pointer research/donor_fsmn/fsmn.c research/donor_fsmn/tests/sanitize_smoke.c -o "$RUNNER_TEMP/donor-fsmn-faults"
          "$RUNNER_TEMP/donor-fsmn-faults"
      - name: Python syntax only for opt-in research drivers
        run: python -m py_compile research/donor_fsmn/*.py research/donor_fsmn/tests/*.py
