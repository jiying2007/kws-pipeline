name: training-audit-closure

on:
  pull_request:
    branches: [main]
    paths:
      - 'training/**'
      - 'tests/test_training_audit_closure.py'
      - 'tests/test_development_signal.py'
      - 'tests/test_frozen_speech_ablation.py'
      - 'tests/test_reproducibility_trace.py'
      - 'tests/test_startup_context.py'
      - 'tests/test_preceding_context.py'
      - 'tools/diagnose_kws_threshold_operating_curve.py'
      - 'tools/diagnose_decoder_policy_replay.py'
      - 'tools/diagnose_decoder_retention_recalibrated_curve.py'
      - '.github/workflows/training-audit-closure.yml'
      - '.github/workflows/product-development-experiment.yml'

permissions:
  contents: read

concurrency:
  group: training-audit-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Retain exact research source
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          mkdir -p build/audit-source
          git archive --format=tar.gz --output=build/audit-source/source.tar.gz HEAD
          printf '%s\n' "$HEAD_SHA" > build/audit-source/source-sha.txt
          (cd build/audit-source && sha256sum source.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: training-audit-source-${{ github.event.pull_request.head.sha }}
          path: build/audit-source/*
          if-no-files-found: error
          retention-days: 14
      - name: Validate research entry contract
        run: python3 training/product_development_experiment.py --self-test
      - name: Install pinned CPU test runtime
        run: |
          python3 -m venv .venv-audit
          .venv-audit/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv-audit/bin/python -m pip install --disable-pip-version-check --no-input torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Execute objective and floating-state regressions
        run: |
          .venv-audit/bin/python tests/test_training_audit_closure.py
          .venv-audit/bin/python tests/test_development_signal.py
          .venv-audit/bin/python tests/test_frozen_speech_ablation.py
          .venv-audit/bin/python tests/test_reproducibility_trace.py
          .venv-audit/bin/python tests/test_startup_context.py
          .venv-audit/bin/python tests/test_preceding_context.py
          python3 tools/check_workflow_path_filters.py
      - name: Verify no tracked source changes
        run: git diff --exit-code -- .
