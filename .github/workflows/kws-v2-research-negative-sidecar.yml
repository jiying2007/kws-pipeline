name: kws-v2-research-negative-sidecar

on:
  workflow_dispatch:
  push:
    branches:
      - "research/kws-training-reset-v1"
    paths:
      - "configs/training/kws-v2-research-negative-utterances-v1.json"
      - "tools/build_kws_v2_research_negative_requests.py"
      - "tools/materialize_kws_v2_research_negative_sidecar.py"
      - "tools/run_speech_like_corpus_generation.py"
      - ".github/workflows/kws-v2-research-negative-sidecar.yml"

permissions:
  contents: read

concurrency:
  group: kws-v2-research-negative-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sidecar:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Bootstrap pinned TTS assets
        run: |
          set -euo pipefail
          python3 tools/bootstrap_speech_like_stage_a.py             --cache-dir "$RUNNER_TEMP/speech-cache"             --work-dir "$RUNNER_TEMP/bootstrap"             --assets-only

      - name: Resolve verified bootstrap assets
        id: assets
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"bootstrap/bootstrap-summary.json"
          x=json.loads(p.read_text())
          print(f"runtime_archive={x['archive']['path']}")
          print(f"license_evidence={x['license_evidence']['path']}")
          print(f"backend={x['backend']['path']}")
          for key, source in (
              ("backend_platform","platform"),
              ("backend_archive","archive_path"),
              ("backend_receipt","receipt_path"),
              ("backend_root","bundle_root"),
              ("backend_lib_dir","lib_dir"),
          ):
              value=x["backend"].get(source)
              print(f"{key}={value or ''}")
          PY

      - name: Prepare verified provider and Stage-A voice inventory
        run: |
          set -euo pipefail
          args=(
            --runtime-archive "${{ steps.assets.outputs.runtime_archive }}"
            --license-evidence "${{ steps.assets.outputs.license_evidence }}"
            --backend-executable "${{ steps.assets.outputs.backend }}"
            --work-dir "$RUNNER_TEMP/provider"
            --prepare-provider-only
          )
          if [[ -n "${{ steps.assets.outputs.backend_platform }}" ]]; then
            args+=(
              --backend-platform "${{ steps.assets.outputs.backend_platform }}"
              --backend-bundle-archive "${{ steps.assets.outputs.backend_archive }}"
              --backend-bundle-receipt "${{ steps.assets.outputs.backend_receipt }}"
              --backend-bundle-root "${{ steps.assets.outputs.backend_root }}"
              --backend-lib-dir "${{ steps.assets.outputs.backend_lib_dir }}"
            )
          fi
          python3 tools/run_speech_like_corpus_generation.py "${args[@]}"

      - name: Build ordinary-speech research requests
        run: |
          set -euo pipefail
          python3 tools/build_kws_v2_research_negative_requests.py             --voice-inventory "$RUNNER_TEMP/provider/provider/voice-inventory.jsonl"             --requests "$RUNNER_TEMP/negative-plan/requests.jsonl"             --index "$RUNNER_TEMP/negative-plan/index.jsonl"             --summary "$RUNNER_TEMP/negative-plan/summary.json"

      - name: Generate research negatives with pinned provider
        run: |
          set -euo pipefail
          python3 tools/generate_speech_like_command_provider.py             --policy configs/training/speech-like-command-provider-v1.json             --provider "$RUNNER_TEMP/provider/provider/provider.json"             --requests "$RUNNER_TEMP/negative-plan/requests.jsonl"             --output-root "$RUNNER_TEMP/generated-negatives"             --summary "$RUNNER_TEMP/generated-negatives-summary.json"             --workers 4

      - name: Materialize empty-target sidecar
        run: |
          set -euo pipefail
          python3 tools/materialize_kws_v2_research_negative_sidecar.py             --generated-root "$RUNNER_TEMP/generated-negatives"             --request-index "$RUNNER_TEMP/negative-plan/index.jsonl"             --output-dir "$RUNNER_TEMP/negative-sidecar"
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"negative-sidecar"
          x=json.loads((root/"sidecar-receipt.json").read_text())
          assert x["evidence_scope"]=="research-only"
          assert x["target_policy"]=="empty-target-nonwake"
          assert x["qualification_split_consumed"] is False
          assert x["protected_evidence_used"] is False
          assert x["total_recordings"] == 32 * 16
          assert x["splits"]["train"]["recordings"] == 32 * 8
          assert x["splits"]["calibration"]["recordings"] == 32 * 4
          assert x["splits"]["test"]["recordings"] == 32 * 4
          print(json.dumps(x, indent=2, sort_keys=True))
          PY

      - name: Collect generation receipts
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/bootstrap/bootstrap-summary.json" "$RUNNER_TEMP/negative-sidecar/bootstrap-summary.json"
          cp "$RUNNER_TEMP/provider/provider-preparation.json" "$RUNNER_TEMP/negative-sidecar/provider-preparation.json"
          cp "$RUNNER_TEMP/negative-plan/summary.json" "$RUNNER_TEMP/negative-sidecar/request-summary.json"
          cp "$RUNNER_TEMP/generated-negatives-summary.json" "$RUNNER_TEMP/negative-sidecar/generation-summary.json"

      - name: Upload research negative sidecar
        uses: actions/upload-artifact@v4
        with:
          name: kws-v2-research-negative-sidecar-${{ github.sha }}
          path: ${{ runner.temp }}/negative-sidecar/
          if-no-files-found: error
          retention-days: 30

  m0-gru-logmel-diagnostic:
    needs: build-sidecar
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download research negative sidecar
        uses: actions/download-artifact@v4
        with:
          name: kws-v2-research-negative-sidecar-${{ github.sha }}
          path: ${{ runner.temp }}/negative-sidecar

      - name: Download immutable canonical speech-like corpus
        uses: actions/download-artifact@v4
        with:
          name: kws-v2-threshold-production-corpus-408aa33be33f30a8b2728ba1cf5e3ccedf2fd0f3
          path: ${{ runner.temp }}/canonical-input
          github-token: ${{ github.token }}
          repository: jiying2007/kws-pipeline
          run-id: 35333458390

      - name: Resolve canonical corpus inputs
        id: corpus
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/canonical-input"
          for split in train calibration test qualification; do
            index="$(find "$input" -path "*/$split/dataset-index.jsonl" -print -quit)"
            summary="$(find "$input" -path "*/$split/dataset-summary.json" -print -quit)"
            test -n "$index"
            test -n "$summary"
            echo "${split}_index=$index" >> "$GITHUB_OUTPUT"
            echo "${split}_summary=$summary" >> "$GITHUB_OUTPUT"
          done

      - name: Prepare exact GRU-logmel binding
        run: |
          set -euo pipefail
          python3 tools/run_kws_v2_stage_a_search.py             --train-index "${{ steps.corpus.outputs.train_index }}"             --train-summary "${{ steps.corpus.outputs.train_summary }}"             --calibration-index "${{ steps.corpus.outputs.calibration_index }}"             --calibration-summary "${{ steps.corpus.outputs.calibration_summary }}"             --test-index "${{ steps.corpus.outputs.test_index }}"             --test-summary "${{ steps.corpus.outputs.test_summary }}"             --qualification-index "${{ steps.corpus.outputs.qualification_index }}"             --qualification-summary "${{ steps.corpus.outputs.qualification_summary }}"             --candidate-id v2-a-gru-h64-logmel             --prepare-only             --work-dir "$RUNNER_TEMP/research-stage-a"

      - name: Build GRU evaluation runtime
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel --target kws_wav_gru

      - name: Install pinned CPU training runtime
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input             torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run Training Reset M0 with ordinary-speech sidecar
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/research-stage-a/candidates/v2-a-gru-h64-logmel"
          .venv/bin/python training/run_kws_research_baseline.py             --config "$candidate/effective-config.json"             --family gru             --loss-profile m0-ctc-only             --runner build/kws_wav_gru             --negative-sidecar "$RUNNER_TEMP/negative-sidecar"             --work-dir "$RUNNER_TEMP/m0-result"

      - name: Show M0 scorecard
        if: always()
        run: |
          test -f "$RUNNER_TEMP/m0-result/research-scorecard.json"
          cat "$RUNNER_TEMP/m0-result/research-scorecard.json"

      - name: Upload M0 diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kws-v2-training-reset-m0-gru-logmel-${{ github.sha }}
          path: ${{ runner.temp }}/m0-result/
          if-no-files-found: error
          retention-days: 30
