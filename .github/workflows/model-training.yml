name: model-training

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/model-training.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'configs/training/**'
      - 'eval/run_corpus.py'
      - 'eval/score_events.py'
      - 'eval/domain_metrics.py'
      - 'eval/gate_robustness.py'
      - 'eval/long_far_stream.py'
      - 'include/**'
      - 'keywords/**'
      - 'src/**'
      - 'tools/**'
      - 'training/**'
      - 'tests/test_decoder_retention.c'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/model-training.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'configs/training/**'
      - 'eval/run_corpus.py'
      - 'eval/score_events.py'
      - 'eval/domain_metrics.py'
      - 'eval/gate_robustness.py'
      - 'eval/long_far_stream.py'
      - 'include/**'
      - 'keywords/**'
      - 'src/**'
      - 'tools/**'
      - 'training/**'
      - 'tests/test_decoder_retention.c'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-training-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  torch-domain-iteration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify real C runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel --target \
            kws_wav kws_raw_stream kws_decoder_tests kws_decoder_retention_tests
          ctest --test-dir build --output-on-failure -R '^kws_decoder_(tests|retention_tests)$'
      - name: Install pinned CPU training runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input \
            torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python - <<'PY'
          import platform
          import numpy
          import torch
          print('python', platform.python_version())
          print('numpy', numpy.__version__)
          print('torch', torch.__version__)
          assert numpy.__version__ == '2.3.2'
          assert str(torch.__version__).split('+', 1)[0] == '2.13.0'
          PY
      - name: Train and iterate three domain rounds
        id: train
        shell: bash
        run: |
          set +e
          .venv/bin/python training/iterate_domain.py \
            --config configs/training/xiaowo.torch-domain.json \
            --runner build/kws_wav \
            --work-dir build/model-training
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Finalize gate-equivalent candidate and run summary
        shell: bash
        env:
          ITERATION_EXIT_CODE: ${{ steps.train.outputs.exit_code }}
        run: |
          .venv/bin/python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import sys

          root = pathlib.Path('build/model-training')
          manifest_path = root / 'domain-loop-manifest.json'
          if not manifest_path.is_file():
              raise SystemExit('training did not produce domain-loop-manifest.json')
          iteration_exit = int(os.environ.get('ITERATION_EXIT_CODE', '2'))
          if iteration_exit not in (0, 1):
              raise SystemExit(f'training infrastructure failed with exit code {iteration_exit}')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          config = json.loads(
              pathlib.Path('configs/training/xiaowo.torch-domain.json').read_text(encoding='utf-8')
          )
          epsilon = float(config.get('domain_iteration', {}).get('gate_equivalent_score_epsilon', 0.0))
          if epsilon < 0.0:
              raise SystemExit('gate_equivalent_score_epsilon must be non-negative')

          eligible = [
              row for row in manifest['records']
              if bool(row.get('calibration_gate'))
              and bool(row.get('test_gate'))
              and 'checkpoint' in row
          ]
          if not eligible:
              raise SystemExit('no calibration/test gate-passing torch candidate')
          score_floor = min(float(row['score']) for row in eligible)
          plateau = [
              row for row in eligible
              if float(row['score']) <= score_floor + epsilon + 1.0e-12
          ]
          selected = max(
              plateau,
              key=lambda row: (int(row['round']), -float(row['score']), str(row['frontend'])),
          )
          selected_round = int(selected['round'])
          selected_frontend = str(selected['frontend'])
          selected_score = float(selected['score'])
          original_round = int(manifest['best_round'])
          original_frontend = str(manifest['best_frontend'])
          reselected = (selected_round, selected_frontend) != (original_round, original_frontend)
          print(
              f'candidate-selection floor={score_floor:.9f} epsilon={epsilon:.9f} '
              f'original={original_round}/{original_frontend} '
              f'selected={selected_round}/{selected_frontend} score={selected_score:.9f}'
          )

          best_dir = root / 'best'
          best_dir.mkdir(parents=True, exist_ok=True)
          copies = {
              pathlib.Path(selected['model']): best_dir / 'model.kwm',
              pathlib.Path(selected['checkpoint']): best_dir / 'model.pt',
              pathlib.Path(selected['pack']): best_dir / 'keywords.kwk',
              pathlib.Path(selected['keywords']): best_dir / 'keywords.tsv',
              pathlib.Path(selected['provenance']): best_dir / 'model-provenance.json',
          }
          for source, destination in copies.items():
              if not source.is_file() or source.stat().st_size == 0:
                  raise SystemExit(f'missing selected candidate artifact: {source}')
              shutil.copy2(source, destination)

          def sha256(path: pathlib.Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          # Candidate selection above uses calibration/test evidence only. Re-run
          # the untouched qualification holdout after selection so qualification
          # cannot influence candidate choice or curriculum/replay.
          sys.path.insert(0, str(pathlib.Path('training').resolve()))
          from iterate_domain import base_gate, domain_gate, evaluate, gate_values

          qualification_dir = best_dir / 'qualification'
          if qualification_dir.exists():
              shutil.rmtree(qualification_dir)
          references = root / 'qualification-dataset' / 'qualification.references.jsonl'
          if not references.is_file():
              raise SystemExit(f'missing qualification holdout: {references}')
          qualification, qualification_domains = evaluate(
              runner=pathlib.Path('build/kws_wav').resolve(),
              model=(best_dir / 'model.kwm').resolve(),
              pack=(best_dir / 'keywords.kwk').resolve(),
              references=references.resolve(),
              output=qualification_dir.resolve(),
          )
          gates = gate_values(config.get('domain_gates', {}))
          qualified = base_gate(qualification, gates) and domain_gate(qualification_domains, gates)

          manifest['best_round'] = selected_round
          manifest['best_frontend'] = selected_frontend
          manifest['best_score'] = selected_score
          manifest['best_model_sha256'] = sha256(best_dir / 'model.kwm')
          manifest['best_pack_sha256'] = sha256(best_dir / 'keywords.kwk')
          manifest['qualification'] = qualification
          manifest['qualification_domains'] = qualification_domains
          manifest['qualified'] = bool(qualified)
          manifest['candidate_selection'] = {
              'policy': 'latest-gate-equivalent-within-score-epsilon',
              'score_floor': score_floor,
              'score_epsilon': epsilon,
              'original_round': original_round,
              'original_frontend': original_frontend,
              'selected_round': selected_round,
              'selected_frontend': selected_frontend,
              'selected_score': selected_score,
              'reselected': reselected,
              'qualification_used_for_selection': False,
          }
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False) + '\n',
              encoding='utf-8',
          )

          required = [
              best_dir / 'model.kwm',
              best_dir / 'model.pt',
              best_dir / 'keywords.kwk',
              best_dir / 'keywords.tsv',
              best_dir / 'model-provenance.json',
          ]
          for path in required:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing training artifact: {path}')
          summary = {
              'schema_version': 2,
              'iteration_exit_code': iteration_exit,
              'training_exit_code': 0 if qualified else 1,
              'qualified': bool(qualified),
              'best_round': selected_round,
              'best_frontend': selected_frontend,
              'best_score': selected_score,
              'candidate_selection': manifest['candidate_selection'],
              'qualification': qualification,
              'qualification_domains': qualification_domains,
              'artifacts': {path.name: sha256(path) for path in required},
              'limitations': manifest['limitations'],
          }
          (root / 'training-run-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - name: Enforce synthetic qualification gate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('build/model-training/training-run-summary.json').read_text(encoding='utf-8'))
          qualified = bool(summary['qualified'])
          train_exit = int(summary['training_exit_code'])
          iteration_exit = int(summary['iteration_exit_code'])
          print(f"qualified={qualified} best_round={summary['best_round']} frontend={summary['best_frontend']}")
          print(json.dumps(summary['candidate_selection'], indent=2, sort_keys=True))
          print(json.dumps(summary['qualification'], indent=2, sort_keys=True))
          if iteration_exit not in (0, 1):
              raise SystemExit(f'training infrastructure failed with exit code {iteration_exit}')
          if qualified != (train_exit == 0):
              raise SystemExit(
                  f'qualification/exit-code contract mismatch: qualified={qualified} exit={train_exit}'
              )
          if not qualified:
              raise SystemExit('synthetic qualification gates were not met')
          PY
      - name: Enforce robustness matrix gate
        if: always()
        run: |
          python3 eval/gate_robustness.py \
            --summary build/model-training/training-run-summary.json \
            --config configs/training/xiaowo.torch-domain.json \
            --output build/model-training/robustness-summary.json
      - name: Enforce continuous hard-negative regression gate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          replay=$(find build/model-training/hard-negative-replay \
            -type f -path '*/hard-negatives.tsv' | sort | tail -n 1)
          test -n "$replay"
          test -s "$replay"
          cp "$replay" build/model-training/best/hard-negatives.tsv
          .venv/bin/python eval/long_far_stream.py \
            --runner build/kws_raw_stream \
            --model build/model-training/best/model.kwm \
            --keywords build/model-training/best/keywords.kwk \
            --negative-manifest "$replay" \
            --hard-negative-rate-per-minute 8.0 \
            --seconds 900 \
            --seed 5501 \
            --output-dir build/model-training/hard-negative-stream \
            --max-far-per-hour 0
      - name: Retain trained model and iteration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xiaowo-torch-domain-model
          path: |
            build/model-training/best/
            build/model-training/domain-loop-manifest.json
            build/model-training/training-run-summary.json
            build/model-training/robustness-summary.json
            build/model-training/hard-negative-stream/
            build/model-training/curriculum/
            build/model-training/datasets/*/audit.json
          if-no-files-found: error
          retention-days: 30
