name: development-round-segment

on:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
      product_head:
        required: true
        type: string
      segment_index:
        required: true
        type: number
      input_artifact:
        required: false
        type: string
        default: ''
    outputs:
      exit_code:
        value: ${{ jobs.segment.outputs.exit_code }}
      artifact_name:
        value: ${{ jobs.segment.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  segment:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      exit_code: ${{ steps.loop.outputs.exit_code }}
      artifact_name: ${{ steps.names.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.product_head }}
          persist-credentials: false

      - name: Resolve development variant
        id: variant
        shell: bash
        run: |
          set -euo pipefail
          case '${{ inputs.variant }}' in
            gru)
              echo 'family=gru' >> "$GITHUB_OUTPUT"
              echo 'wrapper=training/run_gru_development.py' >> "$GITHUB_OUTPUT"
              echo 'policy=configs/training/xiaowo.gru-development-loop.json' >> "$GITHUB_OUTPUT"
              echo 'runner_target=kws_wav_gru' >> "$GITHUB_OUTPUT"
              echo 'runner_path=build/kws_wav_gru' >> "$GITHUB_OUTPUT"
              echo 'work_name=gru-development-curriculum' >> "$GITHUB_OUTPUT"
              echo 'artifact_prefix=gru-development-resume' >> "$GITHUB_OUTPUT"
              ;;
            gru-multiseed)
              echo 'family=gru' >> "$GITHUB_OUTPUT"
              echo 'wrapper=training/run_gru_development_multiseed.py' >> "$GITHUB_OUTPUT"
              echo 'policy=configs/training/xiaowo.gru-development-multiseed-v1.json' >> "$GITHUB_OUTPUT"
              echo 'runner_target=kws_wav_gru' >> "$GITHUB_OUTPUT"
              echo 'runner_path=build/kws_wav_gru' >> "$GITHUB_OUTPUT"
              echo 'work_name=gru-development-multiseed' >> "$GITHUB_OUTPUT"
              echo 'artifact_prefix=gru-multiseed-resume' >> "$GITHUB_OUTPUT"
              ;;
            rnn)
              echo 'family=rnn' >> "$GITHUB_OUTPUT"
              echo 'wrapper=training/run_rnn_development.py' >> "$GITHUB_OUTPUT"
              echo 'policy=configs/training/xiaowo.rnn-development-loop.json' >> "$GITHUB_OUTPUT"
              echo 'runner_target=kws_wav' >> "$GITHUB_OUTPUT"
              echo 'runner_path=build/kws_wav' >> "$GITHUB_OUTPUT"
              echo 'work_name=rnn-development-curriculum' >> "$GITHUB_OUTPUT"
              echo 'artifact_prefix=rnn-development-resume' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'unsupported development variant: ${{ inputs.variant }}' >&2
              exit 2
              ;;
          esac

      - name: Validate exact product source and segment policy
        env:
          PRODUCT_HEAD: ${{ inputs.product_head }}
          SEGMENT_INDEX: ${{ inputs.segment_index }}
          POLICY_PATH: ${{ steps.variant.outputs.policy }}
        run: |
          set -euo pipefail
          [[ "$PRODUCT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          case "$SEGMENT_INDEX" in 1|2|3|4) ;; *) exit 2 ;; esac
          python3 - <<'PY'
          import json, os
          policy=json.load(open(os.environ['POLICY_PATH'], encoding='utf-8'))
          assert int(policy['max_rounds']) == 8
          assert int(policy['feature_cache_max_items']) == 8192
          assert policy['qualification_used'] is False
          assert policy['shadow_used'] is False
          assert policy['formal_qualification_used'] is False
          freeze=policy['candidate_freeze']
          assert freeze['validation_feedback_allowed'] is False
          assert freeze['threshold_feedback_allowed'] is False
          assert freeze['training_rule_feedback_allowed'] is False
          PY

      - name: Download prior development segment
        if: inputs.input_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.input_artifact }}
          path: build/segment-input

      - name: Restore immutable resume bundle
        if: inputs.input_artifact != ''
        env:
          WORK_NAME: ${{ steps.variant.outputs.work_name }}
        run: |
          set -euo pipefail
          test -s build/segment-input/resume-bundle.tar.gz
          mkdir -p "build/$WORK_NAME"
          python3 - <<'PY'
          import os, pathlib, tarfile
          archive=pathlib.Path('build/segment-input/resume-bundle.tar.gz')
          root=pathlib.Path('build') / os.environ['WORK_NAME']
          root=root.resolve()
          with tarfile.open(archive, 'r:gz') as tf:
              for member in tf.getmembers():
                  target=(root / member.name).resolve()
                  try:
                      target.relative_to(root)
                  except ValueError as exc:
                      raise SystemExit(f'unsafe resume archive member: {member.name}') from exc
              tf.extractall(root)
          state=root / 'development-resume-state.json'
          if not state.is_file():
              raise SystemExit('resume bundle is missing development-resume-state.json')
          PY

      - name: Inspect resume completion state
        id: resume
        env:
          WORK_NAME: ${{ steps.variant.outputs.work_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          state=pathlib.Path('build') / os.environ['WORK_NAME'] / 'development-resume-state.json'
          if not state.is_file():
              print('complete=false')
          else:
              value=json.load(open(state, encoding='utf-8'))
              print('complete=' + ('true' if value.get('complete') is True else 'false'))
          PY

      - name: Build exact development runner
        if: steps.resume.outputs.complete != 'true'
        env:
          RUNNER_TARGET: ${{ steps.variant.outputs.runner_target }}
          SEGMENT_INDEX: ${{ inputs.segment_index }}
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          if [ "$SEGMENT_INDEX" = '1' ]; then
            cmake --build build --parallel --target "$RUNNER_TARGET" kws_decoder_tests kws_decoder_retention_tests
            ctest --test-dir build --output-on-failure -R '^kws_decoder_(tests|retention_tests)$'
          else
            cmake --build build --parallel --target "$RUNNER_TARGET"
          fi

      - name: Install pinned CPU training runtime
        if: steps.resume.outputs.complete != 'true'
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input \
            torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run or forward two-round development segment
        id: loop
        shell: bash
        env:
          WRAPPER: ${{ steps.variant.outputs.wrapper }}
          POLICY_PATH: ${{ steps.variant.outputs.policy }}
          RUNNER_PATH: ${{ steps.variant.outputs.runner_path }}
          WORK_NAME: ${{ steps.variant.outputs.work_name }}
          COMPLETE: ${{ steps.resume.outputs.complete }}
        run: |
          set -euo pipefail
          work="build/$WORK_NAME"
          if [ "$COMPLETE" = 'true' ]; then
            code="$(python3 - <<'PY'
          import json, os, pathlib
          manifest=pathlib.Path('build') / os.environ['WORK_NAME'] / 'development-loop-manifest.json'
          value=json.load(open(manifest, encoding='utf-8'))
          print(0 if value.get('development_qualified') is True else 1)
          PY
          )"
          else
            args=(
              --config configs/training/xiaowo.torch-domain.json
              --policy "$POLICY_PATH"
              --runner "$RUNNER_PATH"
              --work-dir "$work"
              --round-budget 2
            )
            if [ -s "$work/development-resume-state.json" ]; then
              args+=(--resume-state "$work/development-resume-state.json")
            fi
            set +e
            .venv/bin/python "$WRAPPER" "${args[@]}"
            code=$?
            set -e
          fi
          case "$code" in
            0|1|3) ;;
            *) echo "invalid development segment exit code: $code" >&2; exit "$code" ;;
          esac
          test -s "$work/development-resume-state.json"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Package compact immutable resume bundle
        env:
          WORK_NAME: ${{ steps.variant.outputs.work_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tarfile
          root=(pathlib.Path('build') / os.environ['WORK_NAME']).resolve()
          state=root / 'development-resume-state.json'
          if not state.is_file():
              raise SystemExit('cannot package development segment without resume state')
          members={state}
          for name in ('candidates','curriculum','training-acoustic-rotation-evidence','frozen-candidate'):
              path=root / name
              if path.exists():
                  members.add(path)
          manifest=root / 'development-loop-manifest.json'
          if manifest.is_file():
              members.add(manifest)
          members.update(root.glob('datasets/round-*/domain-index.jsonl'))
          members.update(root.glob('failure-replay/*/development-failure-replay.json'))
          members.update(root.glob('fixed-replay/*/hard-negatives.json'))
          archive=pathlib.Path('build/resume-bundle.tar.gz')
          with tarfile.open(archive, 'w:gz') as tf:
              for path in sorted(members, key=lambda item: item.as_posix()):
                  tf.add(path, arcname=path.relative_to(root).as_posix())
          if archive.stat().st_size <= 0:
              raise SystemExit('resume archive is empty')
          PY

      - name: Resolve segment artifact name
        id: names
        run: echo "artifact_name=${{ steps.variant.outputs.artifact_prefix }}-segment-${{ inputs.segment_index }}" >> "$GITHUB_OUTPUT"

      - name: Upload compact development segment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: build/resume-bundle.tar.gz
          if-no-files-found: error
          retention-days: 7
