name: k1-fixed-slot-math

on:
  push:
    branches: [research/k1-fixed-slot-ctc-v1]
    paths:
      - 'research/k1-fixed-slot-ctc-v1/**'
      - '.github/workflows/k1-fixed-slot-math.yml'
  pull_request:
    paths:
      - 'research/k1-fixed-slot-ctc-v1/**'
      - '.github/workflows/k1-fixed-slot-math.yml'

permissions:
  contents: read

jobs:
  pure-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Strict owner oracle
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror \
            research/k1-fixed-slot-ctc-v1/k1_fixed_slot_ctc.c \
            research/k1-fixed-slot-ctc-v1/test_k1_fixed_slot_ctc.c \
            -lm -o "$RUNNER_TEMP/k1-owner-oracle"
          "$RUNNER_TEMP/k1-owner-oracle"
      - name: Strict independent oracle
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror \
            -I research/k1-fixed-slot-ctc-v1 \
            research/k1-fixed-slot-ctc-v1/k1_fixed_slot_ctc.c \
            research/k1-fixed-slot-ctc-v1/review/independent_oracle.c \
            -lm -o "$RUNNER_TEMP/k1-independent-oracle"
          "$RUNNER_TEMP/k1-independent-oracle"
