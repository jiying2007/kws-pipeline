name: gru-development-curriculum

on:
  push:
    branches:
      - codex/gru-development-curriculum
      - codex/gru-two-layer-pipeline
    paths:
      - 'training/iterate_gru_development.py'
      - 'training/development_failure_replay.py'
      - 'training/domain_curriculum.py'
      - 'training/hard_negative_replay.py'
      - 'training/train_gru_ctc.py'
      - 'tools/finalize_gru_frozen_candidate.py'
      - 'tools/verify_gru_frozen_candidate.py'
      - 'configs/training/xiaowo.gru-development-loop.json'
      - 'tests/test_gru_development_curriculum_contract.py'
      - '.github/workflows/gru-development-curriculum.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gru-development-curriculum-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Development / candidate boundary contract
        run: python3 tests/test_gru_development_curriculum_contract.py
      - name: Python syntax
        run: >-
          python3 -m py_compile
          training/iterate_gru_development.py
          tools/finalize_gru_frozen_candidate.py
          tools/verify_gru_frozen_candidate.py
          tests/test_gru_development_curriculum_contract.py

  development:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify protected evidence namespaces are not inputs
        run: |
          python3 - <<'PY'
          import json
          cfg=json.load(open('configs/training/xiaowo.torch-domain.json', encoding='utf-8'))
          registry=json.load(open('experiments/model_family/shadow_arena_registry.json', encoding='utf-8'))
          policy=json.load(open('configs/training/xiaowo.gru-development-loop.json', encoding='utf-8'))
          assert policy['qualification_used'] is False
          assert policy['shadow_used'] is False
          assert policy['formal_qualification_used'] is False
          assert cfg['qualification_holdout_seed'] == 271843
          arenas={row['name']: row for row in registry['arenas']}
          assert arenas['gru-independent-shadow-v2']['status'] == 'reserved-untouched'
          assert arenas['gru-independent-shadow-v2']['seeds'] == list(range(951101, 951109))
          print('development curriculum is isolated from formal/shadow qualification evidence')
          PY
      - name: Build experimental GRU runner
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel --target kws_wav_gru kws_decoder_tests kws_decoder_retention_tests
          ctest --test-dir build --output-on-failure -R '^kws_decoder_(tests|retention_tests)$'
      - name: Install pinned CPU training runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input \
            torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run multi-round development curriculum
        id: loop
        shell: bash
        run: |
          set +e
          .venv/bin/python training/iterate_gru_development.py \
            --config configs/training/xiaowo.torch-domain.json \
            --policy configs/training/xiaowo.gru-development-loop.json \
            --runner build/kws_wav_gru \
            --work-dir build/gru-development-curriculum
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Finalize self-contained frozen candidate evidence
        if: steps.loop.outputs.exit_code == '0'
        run: >-
          python3 tools/finalize_gru_frozen_candidate.py
          --work-dir build/gru-development-curriculum
          --config configs/training/xiaowo.torch-domain.json
          --policy configs/training/xiaowo.gru-development-loop.json
      - name: Verify frozen candidate handoff
        if: steps.loop.outputs.exit_code == '0'
        run: >-
          python3 tools/verify_gru_frozen_candidate.py
          --candidate build/gru-development-curriculum/frozen-candidate
      - name: Retain development evidence and frozen candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gru-development-curriculum
          path: |
            build/gru-development-curriculum/development-loop-manifest.json
            build/gru-development-curriculum/curriculum/*.json
            build/gru-development-curriculum/failure-replay/*/development-failure-replay.json
            build/gru-development-curriculum/fixed-replay/*/hard-negatives.json
            build/gru-development-curriculum/frozen-candidate/*
          if-no-files-found: warn
          retention-days: 30
      - name: Gate development loop
        run: test "${{ steps.loop.outputs.exit_code }}" = '0'
