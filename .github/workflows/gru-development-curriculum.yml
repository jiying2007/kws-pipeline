name: gru-development-curriculum

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/gru-development-curriculum
      - codex/gru-two-layer-*
    paths:
      - 'training/iterate_gru_development.py'
      - 'training/run_gru_development.py'
      - 'training/development_failure_replay.py'
      - 'training/domain_curriculum.py'
      - 'training/hard_negative_replay.py'
      - 'training/train_gru_ctc.py'
      - 'eval/gate_robustness.py'
      - 'tools/gru_development_gate.py'
      - 'tools/reconcile_gru_development_gate.py'
      - 'tools/verify_gru_development_gate.py'
      - 'tools/finalize_gru_frozen_candidate.py'
      - 'tools/verify_gru_frozen_candidate.py'
      - 'tools/verify_gru_stability_evidence.py'
      - 'configs/training/xiaowo.gru-development-loop.json'
      - 'experiments/model_family/fresh_validation_registry.json'
      - 'experiments/model_family/shadow_arena_registry.json'
      - 'tests/test_gru_development_curriculum_contract.py'
      - 'tests/test_gru_development_stability_gate.py'
      - 'tests/test_gru_stability_evidence_contract.py'
      - 'tests/test_gru_train_acoustic_rotation.py'
      - '.github/workflows/gru-development-curriculum.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gru-development-curriculum-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Development / candidate boundary contract
        run: |
          python3 tests/test_gru_development_curriculum_contract.py
          python3 tests/test_gru_development_stability_gate.py
          python3 tests/test_gru_stability_evidence_contract.py
          python3 tests/test_gru_train_acoustic_rotation.py
          python3 tools/verify_gru_development_gate.py --self-test
      - name: Python syntax
        run: >-
          python3 -m py_compile
          training/iterate_gru_development.py
          training/run_gru_development.py
          tools/gru_development_gate.py
          tools/reconcile_gru_development_gate.py
          tools/verify_gru_development_gate.py
          tools/finalize_gru_frozen_candidate.py
          tools/verify_gru_frozen_candidate.py
          tools/verify_gru_stability_evidence.py
          tests/test_gru_development_curriculum_contract.py
          tests/test_gru_development_stability_gate.py
          tests/test_gru_stability_evidence_contract.py
          tests/test_gru_train_acoustic_rotation.py

  development:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify protected evidence namespaces are not inputs
        run: |
          python3 - <<'PY'
          import json
          cfg=json.load(open('configs/training/xiaowo.torch-domain.json', encoding='utf-8'))
          fresh_registry=json.load(open('experiments/model_family/fresh_validation_registry.json', encoding='utf-8'))
          shadow_registry=json.load(open('experiments/model_family/shadow_arena_registry.json', encoding='utf-8'))
          policy=json.load(open('configs/training/xiaowo.gru-development-loop.json', encoding='utf-8'))
          assert policy['qualification_used'] is False
          assert policy['shadow_used'] is False
          assert policy['formal_qualification_used'] is False
          assert cfg['qualification_holdout_seed'] == 271843

          freeze=policy['candidate_freeze']
          namespace=int(freeze['fresh_validation_seed_namespace'])
          matches=[row for row in fresh_registry['namespaces'] if int(row['namespace']) == namespace]
          assert len(matches) == 1
          fresh=matches[0]
          assert fresh['model_family'] == 'gru'
          assert fresh['status'] == 'reserved-untouched'
          fresh_seed=int(cfg.get('seed', 1337)) + namespace

          acoustic_namespace=int(policy['training_acoustic_seed_namespace'])
          acoustic_stride=int(policy['training_acoustic_seed_stride'])
          assert acoustic_namespace > 0 and acoustic_stride > 0
          assert acoustic_namespace != int(policy['training_seed_namespace'])
          assert acoustic_namespace != namespace

          arenas={row['name']: row for row in shadow_registry['arenas']}
          arena_name=freeze['shadow_arena']
          arena=arenas[arena_name]
          assert arena['model_family'] == 'gru'
          assert arena['status'] == 'reserved-untouched'
          seeds=[int(value) for value in arena['seeds']]
          assert 8 <= len(seeds) <= 16
          assert len(seeds) == len(set(seeds))

          protected={int(cfg['qualification_holdout_seed'])}
          protected.update(int(value) for value in cfg.get('retired_qualification_holdout_seeds', []))
          assert fresh_seed not in protected
          assert fresh_seed not in set(seeds)
          assert not (set(seeds) & protected)
          for round_index in range(int(policy['max_rounds'])):
              acoustic_seed=int(cfg.get('seed', 1337)) + acoustic_namespace + round_index * acoustic_stride
              assert acoustic_seed != fresh_seed
              assert acoustic_seed not in set(seeds)
              assert acoustic_seed not in protected
          print(f'development curriculum is isolated from protected evidence; acoustic={acoustic_namespace} fresh={fresh["name"]} shadow={arena_name}')
          PY
      - name: Build experimental GRU runner
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel --target kws_wav_gru kws_decoder_tests kws_decoder_retention_tests
          ctest --test-dir build --output-on-failure -R '^kws_decoder_(tests|retention_tests)$'
      - name: Install pinned CPU training runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input \
            torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run multi-round development curriculum
        id: loop
        shell: bash
        run: |
          set +e
          .venv/bin/python training/run_gru_development.py \
            --config configs/training/xiaowo.torch-domain.json \
            --policy configs/training/xiaowo.gru-development-loop.json \
            --runner build/kws_wav_gru \
            --work-dir build/gru-development-curriculum
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Reconcile full-robustness development gate
        id: development_gate
        if: steps.loop.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python3 tools/reconcile_gru_development_gate.py \
            --work-dir build/gru-development-curriculum \
            --config configs/training/xiaowo.torch-domain.json \
            --policy configs/training/xiaowo.gru-development-loop.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify reconciled development gate
        if: steps.loop.outputs.exit_code == '0' && steps.development_gate.outputs.exit_code == '0'
        run: >-
          python3 tools/verify_gru_development_gate.py
          --work-dir build/gru-development-curriculum
          --config configs/training/xiaowo.torch-domain.json
          --policy configs/training/xiaowo.gru-development-loop.json
      - name: Finalize self-contained frozen candidate evidence
        if: steps.loop.outputs.exit_code == '0' && steps.development_gate.outputs.exit_code == '0'
        run: >-
          python3 tools/finalize_gru_frozen_candidate.py
          --work-dir build/gru-development-curriculum
          --config configs/training/xiaowo.torch-domain.json
          --policy configs/training/xiaowo.gru-development-loop.json
      - name: Verify frozen candidate handoff
        if: steps.loop.outputs.exit_code == '0' && steps.development_gate.outputs.exit_code == '0'
        run: |
          python3 tools/verify_gru_frozen_candidate.py \
            --candidate build/gru-development-curriculum/frozen-candidate
          python3 tools/verify_gru_stability_evidence.py \
            --candidate build/gru-development-curriculum/frozen-candidate
          python3 tools/verify_gru_development_gate.py \
            --candidate build/gru-development-curriculum/frozen-candidate
      - name: Retain development evidence and frozen candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gru-development-curriculum
          path: |
            build/gru-development-curriculum/development-loop-manifest.json
            build/gru-development-curriculum/curriculum/*.json
            build/gru-development-curriculum/failure-replay/*/development-failure-replay.json
            build/gru-development-curriculum/fixed-replay/*/hard-negatives.json
            build/gru-development-curriculum/frozen-candidate/*
          if-no-files-found: warn
          retention-days: 30
      - name: Gate development loop
        run: |
          test "${{ steps.loop.outputs.exit_code }}" = '0'
          test "${{ steps.development_gate.outputs.exit_code }}" = '0'
