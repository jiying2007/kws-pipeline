name: startup-context-learnability

on:
  pull_request:
    branches: [main]
    paths:
      - 'training/startup_context_training.py'
      - 'training/context_negative_margin.py'
      - 'tests/test_context_negative_margin.py'
      - 'training/startup_context_evaluation.py'
      - 'tests/test_startup_context.py'
      - 'training/select_context_checkpoint.py'
      - 'tests/test_context_checkpoint_selection.py'
      - '.github/workflows/startup-context-learnability.yml'

permissions:
  contents: read

concurrency:
  group: startup-context-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OMP_DYNAMIC: 'FALSE'
  MKL_NUM_THREADS: '1'
  MKL_CBWR: COMPATIBLE
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  ATEN_CPU_CAPABILITY: default

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pool_sha: ${{ steps.pool.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify and download existing immutable speech base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          contract=configs/training/product-speech-like-base-v1.json
          tag="$(jq -r .release_tag "$contract")"
          archive="$(jq -r .release_archive "$contract")"
          mkdir -p build/frozen-download
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > build/frozen-download/release.json
          jq -e --argjson id "$(jq .release_id "$contract")" \
            --arg target "$(jq -r .source_repro_head_sha "$contract")" \
            '.id == $id and .immutable == true and .draft == false and .prerelease == false and .target_commitish == $target' \
            build/frozen-download/release.json > /dev/null
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir build/frozen-download
          echo "$(jq -r .release_archive_sha256 "$contract")  build/frozen-download/$archive" | sha256sum -c -
      - name: Prepare portable development pool without TTS or mining
        id: pool
        run: |
          python3 tests/test_frozen_speech_ablation.py
          archive="$(jq -r .release_archive configs/training/product-speech-like-base-v1.json)"
          python3 training/frozen_speech_ablation.py prepare --archive "build/frozen-download/$archive" --output build/frozen-pool
          echo "sha=$(sha256sum build/frozen-pool/pool.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Retain frozen inputs before training
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-speech-pool-${{ github.event.pull_request.head.sha }}
          path: build/frozen-pool/
          if-no-files-found: error
          retention-days: 14

  paired-learning:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frozen-speech-pool-${{ github.event.pull_request.head.sha }}
          path: build/frozen-pool
      - name: Build unchanged C runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel 2 --target kws_wav kws_posterior_dump kws_decoder_replay
      - name: Install pinned training runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test context loss and evidence contracts
        run: .venv/bin/python tests/test_startup_context.py
      - name: Train and evaluate declared paired recipes on one worker
        env:
          POOL_SHA: ${{ needs.prepare.outputs.pool_sha }}
        run: |
          set -euo pipefail
          mkdir -p build/startup-context
          for spec in plain-ctc:1337 context-ctc:1337 grounded-ctc:1337 grounded-ctc:2346 grounded-margin:1337 grounded-margin:2346; do
            variant="${spec%:*}"
            seed="${spec#*:}"
            name="$variant-$seed"
            margin_args=()
            if [ "$variant" = grounded-margin ]; then
              variant=grounded-ctc
              margin_args=(--negative-margin-weight 0.1)
            fi
            retention=()
            if [ "$variant" = grounded-ctc ]; then retention=(--retain-milestones); fi
            .venv/bin/python training/startup_context_training.py               --pool build/frozen-pool --pool-sha "$POOL_SHA"               --output "build/startup-context/$name" --variant "$variant"               --scope all --epochs 600 --seed "$seed" "${retention[@]}" "${margin_args[@]}" > "build/startup-context/$name-train.log" 2>&1
            if [ "$variant" = grounded-ctc ]; then
              .venv/bin/python training/select_context_checkpoint.py \
                --pool build/frozen-pool --pool-sha "$POOL_SHA" \
                --trial "build/startup-context/$name" --runner build/kws_wav \
                --output "build/startup-context/$name-selection" \
                > "build/startup-context/$name-selection.log" 2>&1
              export TRIAL="build/startup-context/$name"
              selected="$(.venv/bin/python - <<'PYSEL'
          import json, os, pathlib, sys
          sys.path.insert(0, 'training')
          from select_context_checkpoint import confined
          from frozen_speech_ablation import sha
          root=pathlib.Path(os.environ['TRIAL'])
          decision=json.loads(pathlib.Path(str(root)+'-selection/selection.json').read_text())
          assert decision['completed'] is True and decision['test_used_for_selection'] is False
          row=decision['selected']
          assert row is not None, 'no eligible development checkpoint'
          model=confined(root,row['directory']+'/model.kwm')
          assert sha(model)==row['files']['model.kwm']
          print(model)
          PYSEL
              )"
              sha256sum "build/startup-context/$name-selection/selection.json" > "build/startup-context/$name-decision.sha256"
              .venv/bin/python training/startup_context_evaluation.py \
                --pool build/frozen-pool --pool-sha "$POOL_SHA" --model "$selected" \
                --output "build/startup-context/$name-selected-evaluation" \
                --runner build/kws_wav --dump build/kws_posterior_dump --replay build/kws_decoder_replay \
                > "build/startup-context/$name-selected-evaluation.log" 2>&1
              .venv/bin/python training/preceding_context_evaluation.py \
                --pool build/frozen-pool --pool-sha "$POOL_SHA" --model "$selected" \
                --output "build/startup-context/$name-preceding" --runner build/kws_wav \
                > "build/startup-context/$name-preceding.log" 2>&1
              sha256sum -c "build/startup-context/$name-decision.sha256"
            fi
            .venv/bin/python training/startup_context_evaluation.py               --pool build/frozen-pool --pool-sha "$POOL_SHA"               --model "build/startup-context/$name/model.kwm"               --output "build/startup-context/$name-evaluation"               --runner build/kws_wav --dump build/kws_posterior_dump --replay build/kws_decoder_replay               > "build/startup-context/$name-evaluation.log" 2>&1
          done
      - name: Verify paired evidence and report acoustic verdict separately
        run: |
          .venv/bin/python - <<'PY'
          import json, pathlib, torch
          root=pathlib.Path('build/startup-context')
          names=['plain-ctc-1337','context-ctc-1337','grounded-ctc-1337','grounded-ctc-2346','grounded-margin-1337','grounded-margin-2346']
          rows=[]; checkpoints={}
          for name in names:
              cp=torch.load(root/name/'model.pt',weights_only=True,map_location='cpu')
              checkpoints[name]=cp
              recipe=json.loads((root/name/'recipe.json').read_text())
              result=json.loads((root/(name+'-evaluation')/'summary.json').read_text())
              assert cp['epochs']==recipe['epochs']==600
              assert cp['development_recipe']==recipe
              assert recipe['release_authority'] is False and result['release_authority'] is False
              rows.append({'name':name,'recipe':recipe,'runtime':result,'initial':cp['initial_float_state_identity'],'batch_order':cp['batch_order_sha256'],'context_order':cp['context_order_sha256']})
          assert len({r['recipe']['pool_sha256'] for r in rows})==1
          assert len({json.dumps(r['recipe']['source_rows'],sort_keys=True) for r in rows})==1
          assert len({r['initial']['sha256'] for r in rows[:3]})==1
          assert len({r['batch_order'] for r in rows[:3]})==1
          assert rows[1]['context_order']==rows[2]['context_order']
          assert len({json.dumps(r['recipe']['implementation_sha256'],sort_keys=True) for r in rows[:4]})==1
          for seed in (1337,2346):
              baseline=checkpoints[f'grounded-ctc-{seed}']; candidate=checkpoints[f'grounded-margin-{seed}']
              for field in ('initial_float_state_identity','batch_order_sha256','context_order_sha256','training_corpus_identity'):
                  assert baseline[field]==candidate[field],field
              expected=dict(candidate['development_recipe']);spec=expected.pop('negative_wake_margin')
              assert spec['weight']==0.1 and spec['confidence_ceiling']==0.5 and spec['exact_runtime_loss'] is False
              expected['implementation_sha256']=dict(expected['implementation_sha256'])
              expected['implementation_sha256'].pop('training/context_negative_margin.py')
              assert expected==baseline['development_recipe'], 'unplanned paired difference'
          assert all(r['recipe']['source_worktree_clean'] is True for r in rows)
          for key in ('runner_sha256','dump_sha256','replay_sha256','pack_sha256'):
              assert len({r['runtime'][key] for r in rows})==1
          result={'evidence_complete':True,'release_authority':False,'rows':rows,
                  'notes':['Both CTC controls have the same target-length normalization, uniform row weights, initialization and 600 epochs.',
                           'Grounded recipe adds BOTH activity-span CTC and non-speech blank supervision: combined treatment, not individual attribution.',
                           'All recipes execute on one worker; cross-vendor portability is separate and not asserted.',
                           'Train-fit is a diagnostic gate only; development test and calibration are not release holdouts.',
                           'Negative-margin pairs differ only by an explicit activity-only surrogate term of weight0.1; no runtime threshold changes.',
                           'Completion and train-fit do not imply reduced held-out errors; retain adverse recall/FA tradeoffs. No automatic promotion.']}
          (root/'comparison.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print(json.dumps({r['name']:{'train_fit':r['runtime']['train_fit_gate'],'startup':r['runtime']['startup_independence_gate']} for r in rows}))
          PY
      - name: Retain completed and failed acoustic experiments
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startup-context-${{ github.event.pull_request.head.sha }}
          path: build/startup-context/
          if-no-files-found: error
          retention-days: 14
      - name: Gate actual training-set context learnability
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('build/startup-context')
          for name in ('grounded-ctc-1337','grounded-ctc-2346','grounded-margin-1337','grounded-margin-2346'):
              result=json.loads((root/(name+'-evaluation')/'summary.json').read_text())
              assert result['basic_train_learnability_pass'] is True, name
              decision=json.loads((root/(name+'-selection')/'selection.json').read_text())
              selected=json.loads((root/(name+'-selected-evaluation')/'summary.json').read_text())
              assert decision['completed'] is True and decision['selected'] is not None
              assert decision['test_used_for_selection'] is False
              assert selected['model_sha256']==decision['selected']['files']['model.kwm']
              assert selected['basic_train_learnability_pass'] is True, name
              assert selected['release_authority'] is False
          print('Both declared seeds and both grounded treatments pass actual C train-fit, continuous context and startup-prefix independence.')
          print('Development generalization and product qualification remain separate; no release authority.')
          PY
