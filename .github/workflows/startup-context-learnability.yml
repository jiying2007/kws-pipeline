name: startup-context-learnability

on:
  pull_request:
    branches: [main]
    paths:
      - 'training/startup_context_training.py'
      - 'training/startup_context_evaluation.py'
      - 'tests/test_startup_context.py'
      - '.github/workflows/startup-context-learnability.yml'

permissions:
  contents: read

concurrency:
  group: startup-context-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OMP_DYNAMIC: 'FALSE'
  MKL_NUM_THREADS: '1'
  MKL_CBWR: COMPATIBLE
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  ATEN_CPU_CAPABILITY: default

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pool_sha: ${{ steps.pool.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify and download existing immutable speech base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          contract=configs/training/product-speech-like-base-v1.json
          tag="$(jq -r .release_tag "$contract")"
          archive="$(jq -r .release_archive "$contract")"
          mkdir -p build/frozen-download
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > build/frozen-download/release.json
          jq -e --argjson id "$(jq .release_id "$contract")" \
            --arg target "$(jq -r .source_repro_head_sha "$contract")" \
            '.id == $id and .immutable == true and .draft == false and .prerelease == false and .target_commitish == $target' \
            build/frozen-download/release.json > /dev/null
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir build/frozen-download
          echo "$(jq -r .release_archive_sha256 "$contract")  build/frozen-download/$archive" | sha256sum -c -
      - name: Prepare portable development pool without TTS or mining
        id: pool
        run: |
          python3 tests/test_frozen_speech_ablation.py
          archive="$(jq -r .release_archive configs/training/product-speech-like-base-v1.json)"
          python3 training/frozen_speech_ablation.py prepare --archive "build/frozen-download/$archive" --output build/frozen-pool
          echo "sha=$(sha256sum build/frozen-pool/pool.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Retain frozen inputs before training
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-speech-pool-${{ github.event.pull_request.head.sha }}
          path: build/frozen-pool/
          if-no-files-found: error
          retention-days: 14

  paired-learning:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frozen-speech-pool-${{ github.event.pull_request.head.sha }}
          path: build/frozen-pool
      - name: Build unchanged C runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel 2 --target kws_wav kws_posterior_dump kws_decoder_replay
      - name: Install pinned training runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test context loss and evidence contracts
        run: .venv/bin/python tests/test_startup_context.py
      - name: Train and evaluate declared paired recipes on one worker
        env:
          POOL_SHA: ${{ needs.prepare.outputs.pool_sha }}
        run: |
          set -euo pipefail
          mkdir -p build/startup-context
          for spec in plain-ctc:1337 context-ctc:1337 grounded-ctc:1337 grounded-ctc:2346; do
            variant="${spec%:*}"
            seed="${spec#*:}"
            name="$variant-$seed"
            .venv/bin/python training/startup_context_training.py               --pool build/frozen-pool --pool-sha "$POOL_SHA"               --output "build/startup-context/$name" --variant "$variant"               --scope all --epochs 600 --seed "$seed" > "build/startup-context/$name-train.log" 2>&1
            .venv/bin/python training/startup_context_evaluation.py               --pool build/frozen-pool --pool-sha "$POOL_SHA"               --model "build/startup-context/$name/model.kwm"               --output "build/startup-context/$name-evaluation"               --runner build/kws_wav --dump build/kws_posterior_dump --replay build/kws_decoder_replay               > "build/startup-context/$name-evaluation.log" 2>&1
          done
      - name: Verify paired evidence and report acoustic verdict separately
        run: |
          .venv/bin/python - <<'PY'
          import json, pathlib, torch
          root=pathlib.Path('build/startup-context')
          names=['plain-ctc-1337','context-ctc-1337','grounded-ctc-1337','grounded-ctc-2346']
          rows=[]
          for name in names:
              cp=torch.load(root/name/'model.pt',weights_only=True,map_location='cpu')
              recipe=json.loads((root/name/'recipe.json').read_text())
              result=json.loads((root/(name+'-evaluation')/'summary.json').read_text())
              assert cp['epochs']==recipe['epochs']==600
              assert cp['development_recipe']==recipe
              assert recipe['release_authority'] is False and result['release_authority'] is False
              rows.append({'name':name,'recipe':recipe,'runtime':result,'initial':cp['initial_float_state_identity'],'batch_order':cp['batch_order_sha256'],'context_order':cp['context_order_sha256']})
          assert len({r['recipe']['pool_sha256'] for r in rows})==1
          assert len({json.dumps(r['recipe']['source_rows'],sort_keys=True) for r in rows})==1
          assert len({r['initial']['sha256'] for r in rows[:3]})==1
          assert len({r['batch_order'] for r in rows[:3]})==1
          assert rows[1]['context_order']==rows[2]['context_order']
          assert len({json.dumps(r['recipe']['implementation_sha256'],sort_keys=True) for r in rows})==1
          assert all(r['recipe']['source_worktree_clean'] is True for r in rows)
          for key in ('runner_sha256','dump_sha256','replay_sha256','pack_sha256'):
              assert len({r['runtime'][key] for r in rows})==1
          result={'evidence_complete':True,'release_authority':False,'rows':rows,
                  'notes':['Both CTC controls have the same target-length normalization, uniform row weights, initialization and 600 epochs.',
                           'Grounded recipe adds BOTH activity-span CTC and non-speech blank supervision: combined treatment, not individual attribution.',
                           'All recipes execute on one worker; cross-vendor portability is separate and not asserted.',
                           'Train-fit is a diagnostic gate only; development test and calibration are not release holdouts.']}
          (root/'comparison.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print(json.dumps({r['name']:{'train_fit':r['runtime']['train_fit_gate'],'startup':r['runtime']['startup_independence_gate']} for r in rows}))
          PY
      - name: Retain completed and failed acoustic experiments
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startup-context-${{ github.event.pull_request.head.sha }}
          path: build/startup-context/
          if-no-files-found: error
          retention-days: 14
      - name: Gate actual training-set context learnability
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('build/startup-context')
          for name in ('grounded-ctc-1337','grounded-ctc-2346'):
              result=json.loads((root/(name+'-evaluation')/'summary.json').read_text())
              assert result['basic_train_learnability_pass'] is True, name
          print('Both declared seeds pass actual C train-fit, continuous context and startup-prefix independence.')
          print('Development generalization and product qualification remain separate; no release authority.')
          PY
