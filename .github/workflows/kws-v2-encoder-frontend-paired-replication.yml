name: kws-v2-encoder-frontend-paired-replication

on:
  workflow_dispatch:
  push:
    branches:
      - "research/kws-architecture-v2-probe"
    paths:
      - "configs/training/kws-v2-encoder-frontend-paired-seed-replication-v1.json"
      - "training/research_keyword_classifier.py"
      - "training/analyze_encoder_frontend_replication.py"
      - "training/gru_model.py"
      - "training/frontend.py"
      - ".github/workflows/kws-v2-encoder-frontend-paired-replication.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: kws-v2-encoder-frontend-paired-replication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: [2027, 4099, 7919, 12011, 16001]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify pre-registered seed
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          cfg=json.loads(pathlib.Path("configs/training/kws-v2-encoder-frontend-paired-seed-replication-v1.json").read_text())
          seed=int(os.environ["SEED"])
          assert seed in cfg["seeds"]
          assert seed != 1337
          assert cfg["replication_rules"]["discovery_seed_excluded"] is True
          assert cfg["authority"]["promotion_allowed"] is False
          assert cfg["fixed"]["qualification_split_consumed"] is False
          print(f"paired replication seed {seed}: pre-registered")
          PY

      - name: Download frozen rendered research dataset
        uses: actions/download-artifact@v4
        with:
          name: kws-v2-research-rendered-dataset-gru-logmel-8961cfd981c80a3
          path: ${{ runner.temp }}/rendered-cache
          github-token: ${{ github.token }}
          repository: jiying2007/kws-pipeline
          run-id: 35412153192

      - name: Download frozen ordinary-speech sidecar
        uses: actions/download-artifact@v4
        with:
          name: kws-v2-research-negative-sidecar-b1eb61db767122ebc8a28d40151b73667d135c33
          path: ${{ runner.temp }}/negative-sidecar
          github-token: ${{ github.token }}
          repository: jiying2007/kws-pipeline
          run-id: 35367960968

      - name: Install pinned CPU training runtime
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input \
            torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Train paired candidates on one runner
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/paired/$SEED"
          mkdir -p "$root"
          while read -r candidate frontend hidden_dim; do
            out="$root/$candidate"
            mkdir -p "$out"
            .venv/bin/python training/research_keyword_classifier.py \
              --train-manifest "$RUNNER_TEMP/rendered-cache/train.tsv" \
              --train-manifest "$RUNNER_TEMP/negative-sidecar/train/negative-empty-target.tsv" \
              --calibration-manifest "$RUNNER_TEMP/rendered-cache/calibration.tsv" \
              --calibration-manifest "$RUNNER_TEMP/negative-sidecar/calibration/negative-empty-target.tsv" \
              --test-manifest "$RUNNER_TEMP/rendered-cache/test.tsv" \
              --test-manifest "$RUNNER_TEMP/negative-sidecar/test/negative-empty-target.tsv" \
              --tokens keywords/tokens.example.txt \
              --keywords keywords/zh_cn_example.tsv \
              --frontend "$frontend" \
              --feature-dim 32 \
              --hidden-dim "$hidden_dim" \
              --epochs 24 \
              --batch-size 16 \
              --lr 0.001 \
              --seed "$SEED" \
              --balance-mode equal-class-sampler-v1 \
              --output "$out/classifier.json"
          done <<'EOF'
          b0-logmel64 logmel 64
          c1-logmel128 logmel 128
          fc1-pcen128 pcen-lite 128
          EOF

      - name: Build paired seed evidence
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          .venv/bin/python training/analyze_encoder_frontend_replication.py seed \
            --config configs/training/kws-v2-encoder-frontend-paired-seed-replication-v1.json \
            --seed "$SEED" \
            --root "$RUNNER_TEMP/paired/$SEED" \
            --output "$RUNNER_TEMP/paired/$SEED/seed-evidence.json"

      - name: Upload paired seed evidence
        uses: actions/upload-artifact@v4
        with:
          name: kws-v2-paired-seed-${{ matrix.seed }}-${{ github.sha }}
          path: ${{ runner.temp }}/paired/${{ matrix.seed }}/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: replicate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download paired seed evidence
        uses: actions/download-artifact@v4
        with:
          pattern: kws-v2-paired-seed-*-${{ github.sha }}
          path: ${{ runner.temp }}/paired-evidence
          merge-multiple: false

      - name: Aggregate pre-registered paired replication
        run: |
          set -euo pipefail
          python3 training/analyze_encoder_frontend_replication.py aggregate \
            --config configs/training/kws-v2-encoder-frontend-paired-seed-replication-v1.json \
            --root "$RUNNER_TEMP/paired-evidence" \
            --output "$RUNNER_TEMP/paired-summary/summary.json"

      - name: Upload paired replication summary
        uses: actions/upload-artifact@v4
        with:
          name: kws-v2-encoder-frontend-paired-replication-summary-${{ github.sha }}
          path: ${{ runner.temp }}/paired-summary/
          if-no-files-found: error
          retention-days: 30
