name: kws-v2-phonetic-representation

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: kws-v2-phonetic-representation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  representation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download frozen rendered research dataset
        uses: actions/download-artifact@v4
        with:
          name: kws-v2-research-rendered-dataset-gru-logmel-8961cfd981c80a3
          path: ${{ runner.temp }}/rendered-cache
          github-token: ${{ github.token }}
          repository: jiying2007/kws-pipeline
          run-id: 35412153192

      - name: Download frozen ordinary-speech sidecar
        uses: actions/download-artifact@v4
        with:
          name: kws-v2-research-negative-sidecar-b1eb61db767122ebc8a28d40151b73667d135c33
          path: ${{ runner.temp }}/negative-sidecar
          github-token: ${{ github.token }}
          repository: jiying2007/kws-pipeline
          run-id: 35367960968

      - name: Build phonetic-v2 representation dataset
        run: |
          set -euo pipefail
          python3 tools/build_kws_v2_phonetic_representation_dataset.py             --canonical-cache "$RUNNER_TEMP/rendered-cache"             --ordinary-sidecar "$RUNNER_TEMP/negative-sidecar"             --source-tokens keywords/tokens.example.txt             --target-tokens keywords/tokens.zh_cn_phonetic_v2.txt             --target-keywords keywords/zh_cn_phonetic_v2.tsv             --labels configs/training/kws-v2-phonetic-labels-v1.json             --output-dir "$RUNNER_TEMP/phonetic-dataset"
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"phonetic-dataset"
          x=json.loads((root/"representation-receipt.json").read_text())
          assert x["evidence_class"]=="kws-v2-phonetic-representation-dataset-v1"
          assert x["evidence_scope"]=="research-only"
          assert x["qualification_split_consumed"] is False
          assert x["target_vocab_size"]==72
          assert x["wake_token_ids_preserved"]=={"ni3":1,"hao3":2,"xiao3":3,"wo1":4}
          assert (x["splits"]["train"]["recordings"],x["splits"]["train"]["wake_recordings"],x["splits"]["train"]["nonwake_recordings"])==(768,128,640)
          assert (x["splits"]["calibration"]["recordings"],x["splits"]["calibration"]["wake_recordings"],x["splits"]["calibration"]["nonwake_recordings"])==(384,64,320)
          assert (x["splits"]["test"]["recordings"],x["splits"]["test"]["wake_recordings"],x["splits"]["test"]["nonwake_recordings"])==(384,64,320)
          print(json.dumps(x,indent=2,sort_keys=True))
          PY

      - name: Build GRU evaluation runtime
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel --target kws_wav_gru

      - name: Install pinned CPU training runtime
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input             torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run phonetic representation-v2 experiment
        run: |
          set -euo pipefail
          .venv/bin/python training/run_kws_phonetic_representation.py             --config configs/training/kws-v2-phonetic-representation-experiment-v1.json             --dataset "$RUNNER_TEMP/phonetic-dataset"             --runner build/kws_wav_gru             --work-dir "$RUNNER_TEMP/phonetic-result"

      - name: Show representation decision evidence
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/phonetic-result/phonetic-representation-scorecard.json" ]]; then
            cat "$RUNNER_TEMP/phonetic-result/phonetic-representation-scorecard.json"
          fi

      - name: Upload representation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kws-v2-phonetic-representation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/phonetic-result/
            ${{ runner.temp }}/phonetic-dataset/representation-receipt.json
          if-no-files-found: error
          retention-days: 30
