name: kws-v2-research-reset

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Stage-A candidate identity
        required: true
        default: v2-a-gru-h64-logmel
        type: choice
        options:
          - v2-a-gru-h64-logmel
          - v2-a-gru-h64-pcen-lite
          - v2-a-rnn-h64-logmel
          - v2-a-rnn-h64-pcen-lite
      loss_profile:
        description: Interpretable loss ladder profile
        required: true
        default: m0-ctc-only
        type: choice
        options:
          - m0-ctc-only
          - m1-ctc-ordered
          - m2-plus-margin
          - m3-plus-completion
          - m4-plus-release
  push:
    branches:
      - "research/kws-training-reset-v1"
    paths:
      - "configs/training/kws-v2-research-reset-v1.json"
      - "training/run_kws_research_baseline.py"
      - "training/research_keyword_classifier.py"
      - "training/train_ctc.py"
      - "training/train_gru_ctc.py"
      - ".github/workflows/kws-v2-research-reset.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: kws-v2-research-reset-${{ github.ref }}-${{ inputs.candidate_id || 'v2-a-gru-h64-logmel' }}-${{ github.event_name == 'push' && 'm1-ctc-ordered' || inputs.loss_profile }}
  cancel-in-progress: true

jobs:
  research-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CANDIDATE_ID: ${{ inputs.candidate_id || 'v2-a-gru-h64-logmel' }}
      LOSS_PROFILE: ${{ github.event_name == 'push' && 'm1-ctc-ordered' || inputs.loss_profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download immutable speech-like corpus
        uses: actions/download-artifact@v4
        with:
          name: kws-v2-threshold-production-corpus-408aa33be33f30a8b2728ba1cf5e3ccedf2fd0f3
          path: ${{ runner.temp }}/research-input
          github-token: ${{ github.token }}
          repository: jiying2007/kws-pipeline
          run-id: 35333458390

      - name: Download frozen research negative sidecar
        uses: actions/download-artifact@v4
        with:
          name: kws-v2-research-negative-sidecar-b1eb61db767122ebc8a28d40151b73667d135c33
          path: ${{ runner.temp }}/negative-sidecar
          github-token: ${{ github.token }}
          repository: jiying2007/kws-pipeline
          run-id: 35367960968

      - name: Resolve corpus inputs
        id: corpus
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/research-input"
          for split in train calibration test qualification; do
            index="$(find "$input" -path "*/$split/dataset-index.jsonl" -print -quit)"
            summary="$(find "$input" -path "*/$split/dataset-summary.json" -print -quit)"
            test -n "$index"
            test -n "$summary"
            echo "${split}_index=$index" >> "$GITHUB_OUTPUT"
            echo "${split}_summary=$summary" >> "$GITHUB_OUTPUT"
          done
          test -f "$RUNNER_TEMP/negative-sidecar/sidecar-receipt.json"

      - name: Prepare immutable Stage-A binding
        run: |
          set -euo pipefail
          python3 tools/run_kws_v2_stage_a_search.py             --train-index "${{ steps.corpus.outputs.train_index }}"             --train-summary "${{ steps.corpus.outputs.train_summary }}"             --calibration-index "${{ steps.corpus.outputs.calibration_index }}"             --calibration-summary "${{ steps.corpus.outputs.calibration_summary }}"             --test-index "${{ steps.corpus.outputs.test_index }}"             --test-summary "${{ steps.corpus.outputs.test_summary }}"             --qualification-index "${{ steps.corpus.outputs.qualification_index }}"             --qualification-summary "${{ steps.corpus.outputs.qualification_summary }}"             --candidate-id "$CANDIDATE_ID"             --prepare-only             --work-dir "$RUNNER_TEMP/research-stage-a"

      - name: Resolve research candidate
        id: candidate
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/research-stage-a/candidates/$CANDIDATE_ID"
          test -f "$ROOT/effective-config.json"
          python3 - "$ROOT" >> "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          binding=json.loads((root/"binding.json").read_text())
          family=binding["model_family"]
          assert family in {"rnn","gru"}
          print(f"family={family}")
          print(f"config={root/'effective-config.json'}")
          print(f"runner=build/kws_wav_gru" if family=="gru" else "runner=build/kws_wav")
          PY

      - name: Build evaluation runtimes
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel --target kws_wav kws_wav_gru

      - name: Install pinned CPU training runtime
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input             torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run research-only baseline
        run: |
          set -euo pipefail
          .venv/bin/python training/run_kws_research_baseline.py             --config "${{ steps.candidate.outputs.config }}"             --family "${{ steps.candidate.outputs.family }}"             --loss-profile "$LOSS_PROFILE"             --runner "${{ steps.candidate.outputs.runner }}"             --negative-sidecar "$RUNNER_TEMP/negative-sidecar"             --work-dir "$RUNNER_TEMP/research-result"

      - name: Show research scorecard
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/research-result/research-scorecard.json" ]]; then
            cat "$RUNNER_TEMP/research-result/research-scorecard.json"
          fi

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kws-v2-research-reset-${{ env.CANDIDATE_ID }}-${{ env.LOSS_PROFILE }}-${{ github.sha }}
          path: ${{ runner.temp }}/research-result/
          if-no-files-found: error
          retention-days: 30
