name: kws-v2-research-rendered-dataset-cache

on:
  workflow_dispatch:
  push:
    branches:
      - "research/kws-training-reset-v1"
    paths:
      - "tools/materialize_kws_v2_research_rendered_cache.py"
      - ".github/workflows/kws-v2-research-rendered-dataset-cache.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: kws-v2-research-rendered-dataset-cache
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download retained deterministic M2 research dataset
        uses: actions/download-artifact@v4
        with:
          name: kws-v2-research-reset-v2-a-gru-h64-logmel-m2-plus-margin-0d4b0cce201fed75a489a63b1c2bf35da2c2044f
          path: ${{ runner.temp }}/source-research
          github-token: ${{ github.token }}
          repository: jiying2007/kws-pipeline
          run-id: 35410019255

      - name: Materialize portable rendered cache
        run: |
          set -euo pipefail
          python3 tools/materialize_kws_v2_research_rendered_cache.py             --source-dataset "$RUNNER_TEMP/source-research/dataset"             --output-dir "$RUNNER_TEMP/rendered-cache"
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"rendered-cache"
          x=json.loads((root/"cache-receipt.json").read_text())
          assert x["evidence_class"]=="kws-v2-research-rendered-dataset-cache-v1"
          assert x["evidence_scope"]=="research-only"
          assert x["source_config_sha256"]=="8961cfd981c80a3e3a9e262b9039d846ac589a9e295bd868a57acda65bdeb69d"
          assert x["portable_paths_only"] is True
          assert x["qualification_split_consumed"] is False
          assert x["splits"]["train"]["recordings"] == 512
          assert x["splits"]["calibration"]["recordings"] == 256
          assert x["splits"]["test"]["recordings"] == 256
          print(json.dumps(x, indent=2, sort_keys=True))
          PY

      - name: Upload portable rendered dataset
        uses: actions/upload-artifact@v4
        with:
          name: kws-v2-research-rendered-dataset-gru-logmel-8961cfd981c80a3
          path: ${{ runner.temp }}/rendered-cache/
          if-no-files-found: error
          retention-days: 90
