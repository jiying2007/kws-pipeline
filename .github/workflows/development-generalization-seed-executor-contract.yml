name: development-generalization-seed-executor-contract

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "tools/run_development_generalization_seed.py"
      - "tools/build_development_generalization_seed.py"
      - "tools/development_generalization_plan.py"
      - "training/external_base_dataset.py"
      - "training/render_domains.py"
      - ".github/workflows/development-generalization-seed-executor-contract.yml"
  pull_request:
    paths:
      - "tools/run_development_generalization_seed.py"
      - "tools/build_development_generalization_seed.py"
      - "tools/development_generalization_plan.py"
      - "training/external_base_dataset.py"
      - "training/render_domains.py"
      - ".github/workflows/development-generalization-seed-executor-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tiny immutable speech-like arena fixture
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/generalization-executor"
          mkdir -p "$root"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, struct, wave
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'generalization-executor'
          splits = ('train','calibration','test','qualification')
          external = {}
          for split_index, split in enumerate(splits):
              rows = []
              for item_index, kind in enumerate(('positive','negative')):
                  samples = [0] * 640
                  frequency = 500 + split_index * 70 + item_index * 30
                  for n in range(3200):
                      value = int(5000 * __import__('math').sin(2.0 * __import__('math').pi * frequency * n / 16000.0))
                      samples.append(value)
                  samples += [0] * 640
                  wav_path = root / f'{split}-{kind}.wav'
                  with wave.open(str(wav_path), 'wb') as writer:
                      writer.setnchannels(1); writer.setsampwidth(2); writer.setframerate(16000)
                      writer.writeframes(b''.join(struct.pack('<h', x) for x in samples))
                  wav_sha = hashlib.sha256(wav_path.read_bytes()).hexdigest()
                  pcm_sha = hashlib.sha256(b''.join(struct.pack('<h', x) for x in samples)).hexdigest()
                  row = {
                      'split': split,
                      'kind': kind,
                      'family_id': f'{split}-{kind}',
                      'variant': 0,
                      'keyword_id': 1 if kind == 'positive' else None,
                      'tokens': ['ni3','hao3','xiao3','wo1'] if kind == 'positive' else [],
                      'target_ids': [1,2,3,4] if kind == 'positive' else [],
                      'wav_sha256': wav_sha,
                      'frames': len(samples),
                      'event_start_frame': 640 if kind == 'positive' else 0,
                      'event_end_frame': 3840 if kind == 'positive' else 0,
                      'path': str(wav_path.resolve()),
                      'speech_like_provenance': {
                          'provider_kind': 'offline-tts',
                          'provider_name': 'fixture',
                          'provider_version': '1',
                          'license_id': 'fixture-test-only',
                          'voice_id': f'voice-{split_index}',
                          'source_id': f'source-{split_index}',
                          'generation_config_sha256': hashlib.sha256(f'g-{split_index}'.encode()).hexdigest(),
                          'label_provenance_sha256': hashlib.sha256(f'l-{split_index}-{item_index}'.encode()).hexdigest(),
                          'pcm_sha256': pcm_sha,
                      },
                  }
                  rows.append(row)
              index = root / f'{split}.index.jsonl'
              index.write_text('\n'.join(json.dumps(x, sort_keys=True) for x in rows) + '\n')
              summary = {
                  'schema_version': 1,
                  'evidence_class': 'speech-like-base-dataset-v1',
                  'split': split,
                  'recordings': len(rows),
                  'positive_recordings': 1,
                  'negative_recordings': 1,
                  'corpus_sha256': hashlib.sha256(index.read_bytes()).hexdigest(),
                  'tone_backend_used': False,
              }
              summary_path = root / f'{split}.summary.json'
              summary_path.write_text(json.dumps(summary, sort_keys=True) + '\n')
              external[split] = {
                  'index': str(index.resolve()),
                  'summary': str(summary_path.resolve()),
                  'index_sha256': hashlib.sha256(index.read_bytes()).hexdigest(),
                  'summary_sha256': hashlib.sha256(summary_path.read_bytes()).hexdigest(),
              }
          config = {
              'schema_version': 1,
              'name': 'generalization-executor-fixture',
              'seed': 1,
              'generator': {'external_base_dataset': external},
              'domains': {
                  'distance_bands': {
                      'near': {'distance_m':[0.3,1.0],'weight':1.0},
                      'mid': {'distance_m':[1.0,3.0],'weight':1.0},
                      'far': {'distance_m':[3.0,5.0],'weight':1.0},
                  },
                  'azimuth_deg':[0],
                  'rt60_s':[0.10,0.20],
                  'snr_db':[25.0,30.0],
                  'noise_profiles':['white'],
                  'mic_spacing_m':0.06,
                  'playback':{'probability':0.0,'sir_db':[-5.0,20.0]},
                  'afe':{'backend':'proxy'},
                  'scenes_per_example': {s:1 for s in splits},
              },
              'robustness_gates': {
                  'max_frr':0.0,
                  'max_far_per_hour':0.0,
                  'min_expected_wakes':1,
                  'min_negative_recordings':1,
                  'min_negative_audio_hours':0.0,
                  'required_distance_bins':['0.5m'],
                  'required_azimuth_deg':[0],
                  'required_snr_bands':['high'],
                  'required_rt60_bands':['dry'],
                  'required_noise_profiles':['white'],
                  'required_playback_states':['no-playback'],
                  'required_stress_slices':[],
              },
          }
          (root/'config.json').write_text(json.dumps(config, indent=2, sort_keys=True) + '\n')
          (root/'model.bin').write_bytes(b'fixture-model-v1')
          (root/'keywords.bin').write_bytes(b'fixture-keyword-pack-v1')
          runner = root/'fake-runner.py'
          runner.write_text('#!/usr/bin/env python3\nimport sys\nraise SystemExit(0)\n')
          runner.chmod(0o755)
          PY

      - name: Predeclare four-seed search cohort
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/generalization-executor"
          model_sha="$(sha256sum "$root/model.bin" | awk '{print $1}')"
          python3 tools/development_generalization_plan.py \
            --policy configs/training/development-generalization-v1.json \
            --tier search --candidate-id executor-fixture --model-family rnn \
            --model-sha256 "$model_sha" --product-head "$(git rev-parse HEAD)" \
            --count 4 --output "$root/plan.json"

      - name: Execute one plan-bound acoustic seed end to end
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/generalization-executor"
          python3 tools/run_development_generalization_seed.py \
            --plan "$root/plan.json" --plan-ordinal 0 \
            --config "$root/config.json" \
            --runner "$root/fake-runner.py" \
            --model "$root/model.bin" \
            --keywords "$root/keywords.bin" \
            --split test --work-dir "$root/work" \
            --output "$root/seed.json"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'generalization-executor'
          plan = json.loads((root/'plan.json').read_text())
          seed = json.loads((root/'seed.json').read_text())
          assert seed['plan_sha256'] == plan['plan_sha256']
          assert seed['plan_ordinal'] == 0
          assert seed['seed'] == plan['seed_plan'][0]['seed']
          assert seed['source_identity'] == plan['seed_plan'][0]['source_identity']
          assert seed['fresh_used'] is False and seed['shadow_used'] is False and seed['formal_qualification_used'] is False
          assert seed['execution_binding']['protected_evidence_used'] is False
          assert seed['execution_binding']['external_base_bundle_sha256']
          assert seed['expected_wakes'] == 1
          assert seed['false_rejects'] == 1
          assert seed['false_accepts'] == 0
          assert seed['coverage_passed'] is True
          assert any(item['reason'] == 'frr' for item in seed['performance_failures_observed'])
          print('development-generalization-seed-executor-contract: ok')
          PY

      - name: Model tamper fails closed before evaluation
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/generalization-executor"
          cp "$root/model.bin" "$root/model-tampered.bin"
          printf x >> "$root/model-tampered.bin"
          if python3 tools/run_development_generalization_seed.py \
            --plan "$root/plan.json" --plan-ordinal 1 \
            --config "$root/config.json" \
            --runner "$root/fake-runner.py" \
            --model "$root/model-tampered.bin" \
            --keywords "$root/keywords.bin" \
            --split test --work-dir "$root/tampered-work" \
            --output "$root/tampered-seed.json"; then
            echo 'tampered model unexpectedly accepted' >&2
            exit 1
          fi
          test ! -e "$root/tampered-work/rendered/domain-summary.json"

      - name: Python syntax
        run: python3 -m py_compile tools/run_development_generalization_seed.py

      - name: Worktree remains clean
        run: git diff --exit-code -- .
