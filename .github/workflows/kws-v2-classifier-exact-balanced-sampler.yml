name: kws-v2-classifier-exact-balanced-sampler

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: kws-v2-classifier-exact-balanced-sampler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model_seed: [2027, 4099, 7919, 12011, 16001]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download frozen rendered research dataset
        uses: actions/download-artifact@v4
        with:
          name: kws-v2-research-rendered-dataset-gru-logmel-8961cfd981c80a3
          path: ${{ runner.temp }}/rendered-cache
          github-token: ${{ github.token }}
          repository: jiying2007/kws-pipeline
          run-id: 35412153192

      - name: Download frozen ordinary-speech sidecar
        uses: actions/download-artifact@v4
        with:
          name: kws-v2-research-negative-sidecar-b1eb61db767122ebc8a28d40151b73667d135c33
          path: ${{ runner.temp }}/negative-sidecar
          github-token: ${{ github.token }}
          repository: jiying2007/kws-pipeline
          run-id: 35367960968

      - name: Install pinned CPU training runtime
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input \
            torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Train paired sampler candidates
        env:
          MODEL_SEED: ${{ matrix.model_seed }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sampler/$MODEL_SEED"
          mkdir -p "$root"
          common=(
            --train-manifest "$RUNNER_TEMP/rendered-cache/train.tsv"
            --train-manifest "$RUNNER_TEMP/negative-sidecar/train/negative-empty-target.tsv"
            --calibration-manifest "$RUNNER_TEMP/rendered-cache/calibration.tsv"
            --calibration-manifest "$RUNNER_TEMP/negative-sidecar/calibration/negative-empty-target.tsv"
            --test-manifest "$RUNNER_TEMP/rendered-cache/test.tsv"
            --test-manifest "$RUNNER_TEMP/negative-sidecar/test/negative-empty-target.tsv"
            --tokens keywords/tokens.example.txt
            --keywords keywords/zh_cn_example.tsv
            --feature-dim 32
            --epochs 24
            --batch-size 16
            --lr 0.001
            --lr-schedule fixed-v1
            --model-seed "$MODEL_SEED"
            --sampler-seed 1337
            --init-mode default-pytorch-v1
          )
          train() {
            local name="$1" frontend="$2" hidden="$3" balance="$4"
            mkdir -p "$root/$name"
            .venv/bin/python training/research_keyword_classifier.py \
              "${common[@]}" \
              --frontend "$frontend" \
              --hidden-dim "$hidden" \
              --balance-mode "$balance" \
              --output "$root/$name/classifier.json"
          }
          train b0-logmel64-weighted logmel 64 equal-class-sampler-v1
          train fc1-pcen128-weighted pcen-lite 128 equal-class-sampler-v1
          train b0-logmel64-exact logmel 64 exact-balanced-epoch-v2
          train fc1-pcen128-exact pcen-lite 128 exact-balanced-epoch-v2

      - name: Build per-seed sampler evidence
        env:
          MODEL_SEED: ${{ matrix.model_seed }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sampler/$MODEL_SEED"
          .venv/bin/python training/analyze_classifier_exact_balanced_sampler.py trial \
            --config configs/training/kws-v2-classifier-exact-balanced-sampler-v2.json \
            --model-seed "$MODEL_SEED" \
            --root "$root" \
            --output "$root/trial-evidence.json"

      - name: Upload per-seed evidence
        uses: actions/upload-artifact@v4
        with:
          name: kws-v2-exact-balanced-${{ matrix.model_seed }}-${{ github.sha }}
          path: ${{ runner.temp }}/sampler/${{ matrix.model_seed }}/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: trial
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download per-seed evidence
        uses: actions/download-artifact@v4
        with:
          pattern: kws-v2-exact-balanced-*-${{ github.sha }}
          path: ${{ runner.temp }}/sampler-evidence
          merge-multiple: false
      - name: Aggregate exact-balanced sampler evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sampler-summary"
          python3 training/analyze_classifier_exact_balanced_sampler.py aggregate \
            --config configs/training/kws-v2-classifier-exact-balanced-sampler-v2.json \
            --root "$RUNNER_TEMP/sampler-evidence" \
            --output "$RUNNER_TEMP/sampler-summary/summary.json"
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: kws-v2-classifier-exact-balanced-sampler-summary-${{ github.sha }}
          path: ${{ runner.temp }}/sampler-summary/
          if-no-files-found: error
          retention-days: 30
