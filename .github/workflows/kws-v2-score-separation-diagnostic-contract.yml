name: kws-v2-score-separation-diagnostic-contract

on:
  push:
    branches: [main, "codex/**", "staging/kws-score-separation-diagnostic-*"]
    paths:
      - "src/decoder.c"
      - "src/decoder.h"
      - "tools/kws_wav_gru.c"
      - "tools/diagnose_kws_score_separation.py"
      - "tests/test_decoder.c"
      - ".github/workflows/kws-v2-score-separation-diagnostic-contract.yml"
      - ".github/workflows/kws-v2-score-separation-diagnostic-live.yml"
  pull_request:
    paths:
      - "src/decoder.c"
      - "src/decoder.h"
      - "tools/kws_wav_gru.c"
      - "tools/diagnose_kws_score_separation.py"
      - "tests/test_decoder.c"
      - ".github/workflows/kws-v2-score-separation-diagnostic-contract.yml"
      - ".github/workflows/kws-v2-score-separation-diagnostic-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build diagnostic observation path
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel --target kws_decoder_tests kws_wav_gru
          ctest --test-dir build --output-on-failure -R '^kws_decoder_tests$'

      - name: Score separation analyzer contract
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/score-separation-contract"
          mkdir -p "$root"
          cat > "$root/keywords.tsv" <<'EOF'
          # id	text	threshold	explicit-pinyin-tokens
          1	keyword-one	0.60	kw one
          2	keyword-two	0.60	kw two
          EOF
          ROOT="$root" python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["ROOT"])
          refs=[
              {
                  "recording":"p1","audio_path":"unused-p1.wav","duration_s":2.0,
                  "expected":[{"keyword_id":1,"start_s":0.5,"end_s":1.0}],
                  "domain":{"distance_band":"near"},
              },
              {
                  "recording":"p2","audio_path":"unused-p2.wav","duration_s":2.0,
                  "expected":[{"keyword_id":2,"start_s":0.5,"end_s":1.0}],
                  "domain":{"distance_band":"far"},
              },
              {
                  "recording":"n1","audio_path":"unused-n1.wav","duration_s":2.0,
                  "expected":[],"domain":{"distance_band":"near"},
              },
              {
                  "recording":"n2","audio_path":"unused-n2.wav","duration_s":2.0,
                  "expected":[],"domain":{"distance_band":"far"},
              },
          ]
          frames=[
              {"recording":"p1","keyword_id":1,"time_s":0.8,"confidence":0.80,"retention_log":-1.0},
              {"recording":"p1","keyword_id":1,"time_s":1.8,"confidence":0.30,"retention_log":-1.0},
              {"recording":"p1","keyword_id":2,"time_s":0.8,"confidence":0.45,"retention_log":-1.0},
              {"recording":"p2","keyword_id":2,"time_s":0.9,"confidence":0.55,"retention_log":-1.0},
              {"recording":"p2","keyword_id":2,"time_s":1.8,"confidence":0.20,"retention_log":-1.0},
              {"recording":"p2","keyword_id":1,"time_s":0.8,"confidence":0.50,"retention_log":-1.0},
              {"recording":"n1","keyword_id":1,"time_s":0.7,"confidence":0.40,"retention_log":-1.0},
              {"recording":"n1","keyword_id":2,"time_s":0.7,"confidence":0.35,"retention_log":-1.0},
              {"recording":"n2","keyword_id":1,"time_s":0.7,"confidence":0.60,"retention_log":-1.0},
              {"recording":"n2","keyword_id":2,"time_s":0.7,"confidence":0.50,"retention_log":-1.0},
          ]
          for name, rows in (("references.jsonl", refs), ("frames.jsonl", frames)):
              (root/name).write_text(
                  "\n".join(json.dumps(row, sort_keys=True) for row in rows)+"\n"
              )
          PY
          python3 tools/diagnose_kws_score_separation.py             --keyword-table "$root/keywords.tsv"             --references "$root/references.jsonl"             --frames "$root/frames.jsonl"             --reuse-frames             --output "$root/report.json"
          ROOT="$root" python3 - <<'PY'
          import json, os, pathlib
          value=json.loads((pathlib.Path(os.environ["ROOT"])/"report.json").read_text())
          assert value["evidence_class"]=="kws-v2-score-separation-diagnostic-v1"
          assert value["evidence_scope"]=="development-only"
          assert value["diagnostic_only"] is True
          assert value["selection_feedback_allowed"] is False
          assert value["protected_evidence_used"] is False
          assert value["normal_runtime_behavior_changed"] is False
          assert value["recordings"]==4
          assert value["probe_frames"]==10
          assert value["overall"]["target"]["count"]==2
          assert value["overall"]["negative"]["count"]==4
          assert value["overall"]["cross_keyword"]["count"]==2
          assert value["overall"]["outside_target"]["count"]==2
          assert value["overall"]["background"]["count"]==8
          assert value["by_keyword"]["1"]["formal_threshold"]==0.60
          assert value["by_keyword"]["2"]["formal_threshold"]==0.60
          assert value["by_keyword"]["1"]["target"]["max"]==0.80
          assert value["by_keyword"]["2"]["target"]["max"]==0.55
          assert value["by_distance"]["near"]["target"]["count"]==1
          assert value["by_distance"]["far"]["target"]["count"]==1
          assert value["runner_sha256"] is None
          assert value["model_sha256"] is None
          assert value["keyword_pack_sha256"] is None
          print("score separation analyzer contract: ok")
          PY

      - name: Live score separation wiring remains development-only
        run: |
          python3 - <<'PY'
          import pathlib
          live=pathlib.Path(
              ".github/workflows/kws-v2-score-separation-diagnostic-live.yml"
          ).read_text(encoding="utf-8")
          analyzer=pathlib.Path(
              "tools/diagnose_kws_score_separation.py"
          ).read_text(encoding="utf-8")
          runner=pathlib.Path("tools/kws_wav_gru.c").read_text(encoding="utf-8")
          required=(
              "workflow_dispatch:",
              "source_run_id:",
              "source_head_sha:",
              "actions: read",
              "kws-v2-threshold-diagnostic-v2-a-gru-h64-logmel-",
              "kws-v2-threshold-production-corpus-",
              "selected-model.kwg",
              "development-calibrated-keywords.kwk",
              "development-calibrated-keywords.tsv",
              "calibration.references.jsonl",
              "test.references.jsonl",
              "tools/diagnose_kws_score_separation.py",
              "diagnostic_only",
              "selection_feedback_allowed",
              "protected_evidence_used",
              "retention-days: 30",
          )
          missing=[value for value in required if value not in live]
          assert not missing, f"live score-separation wiring missing: {missing}"
          assert "qualification.references" not in live
          assert "formal_qualification" not in live
          assert '"--score-probe"' in analyzer
          assert '"--score-probe"' in runner
          assert "decoder.thresholds[k] = 2.0f" in runner
          print("live score separation wiring: ok")
          PY

      - name: Python syntax
        run: python3 -m py_compile tools/diagnose_kws_score_separation.py

      - name: Worktree remains clean
        run: git diff --exit-code -- .
