name: model-registry-contract

on:
  push:
    branches: [main, "ops/model-registry-v1", "model-registry/**"]
    paths:
      - "models/**"
      - "tools/verify_model_registry.py"
      - ".github/workflows/model-registry-contract.yml"
      - "configs/research-baseline.xiaowo.json"
      - ".gitignore"
  pull_request:
    paths:
      - "models/**"
      - "tools/verify_model_registry.py"
      - ".github/workflows/model-registry-contract.yml"
      - "configs/research-baseline.xiaowo.json"
      - ".gitignore"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python syntax
        run: python3 -m py_compile tools/verify_model_registry.py
      - name: Verify all registry entries and pinned model
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(models/registry/model-*)
          test "${#entries[@]}" -gt 0 || {
            echo "no promoted model registry entries found" >&2
            exit 2
          }
          for entry in "${entries[@]}"; do
            python3 tools/verify_model_registry.py --registry-dir "$entry"
          done
          python3 -B - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          baseline = json.loads(Path("configs/research-baseline.xiaowo.json").read_text(encoding="utf-8"))
          if baseline.get("schema") != "kws-research-model-baseline-v1" or baseline.get("policy") != "frozen-historical-research-comparator":
              raise SystemExit("research baseline policy mismatch")
          tag = baseline.get("model_tag")
          if not isinstance(tag, str) or not tag.startswith("model-"):
              raise SystemExit("invalid research model tag")
          root = Path("models/registry") / tag
          if not root.is_dir():
              raise SystemExit("pinned research comparator is missing from Git registry")
          for name, field in (
              ("xiaowo-model.kwm", "model_sha256"),
              ("xiaowo-keywords.kwk", "keyword_pack_sha256"),
          ):
              expected = baseline.get(field)
              if not isinstance(expected, str) or len(expected) != 64:
                  raise SystemExit("invalid research model digest")
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit("research model/keyword digest drift: " + name)
          print("research model tuple pinned to exact registry bytes")
          PY
      - name: Assert registry research boundary
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/model-registry-contract.yml").read_text(encoding="utf-8")
          verifier = Path("tools/verify_model_registry.py").read_text(encoding="utf-8")
          active_workflow = workflow.split("      - name: Assert registry research boundary", 1)[0]
          for forbidden in ("configs/shipping.xiaowo.json", "commercial/", "shipping_approved", "model-promotion.yml"):
              assert forbidden not in active_workflow, forbidden
          for forbidden in ("verify_model_release", "shipping_approved", "shipping_evidence_boundary", "--config"):
              assert forbidden not in verifier, forbidden
          print("research registry verification has no publication gate")
          PY
      - name: Worktree remains clean
        run: git diff --exit-code -- .
