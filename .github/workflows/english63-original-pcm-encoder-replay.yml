name: english63-original-pcm-encoder-replay

on:
  pull_request:
    paths:
      - "research/english63_weak_pilot/integrated_pcm_encoder.py"
      - "research/english63_weak_pilot/integrated_pcm_encoder_cases.py"
      - ".github/workflows/english63-original-pcm-encoder-replay.yml"

permissions:
  contents: read

jobs:
  original-63-one-shot:
    # No fork secrets, no scheduled execution, no other branches.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'research/en63-pcm-to-encoder-parity-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned CPU-only research inference packages
        timeout-minutes: 10
        run: |
          python -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5'
          python -m pip install --disable-pip-version-check --no-input \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.10.0+cpu'
          python - <<'PY'
          import numpy, torch
          assert numpy.__version__ == "2.3.5"
          assert torch.__version__ == "2.10.0+cpu"
          assert not torch.cuda.is_available()
          PY
      - name: Fetch exactly existing public source artifacts (not new TTS or ASR)
        timeout-minutes: 6
        env:
          FAMILY_READ_TOKEN: ${ secrets.CODEX_SAFE_FAMILY_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FAMILY_READ_TOKEN"
          function fetch_original {
            local id="$1" output="$2"
            curl -fsSL --retry 2 --connect-timeout 20 --max-time 240 \
              -H "Authorization: Bearer ${FAMILY_READ_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/jiying2007/kws-data/actions/artifacts/${id}/zip" \
              -o "$output"
          }
          fetch_original 13954744587 "$RUNNER_TEMP/en63-original-tts.zip"
          fetch_original 14001747172 "$RUNNER_TEMP/en63-original-review-artifact.zip"
          printf '%s  %s\n' \
            f180004a27ea14c0575f4dd0e2a8476ca048442c76c2dcc186ede6d731cdffcc \
            "$RUNNER_TEMP/en63-original-tts.zip" | sha256sum --check -
          unzip -p "$RUNNER_TEMP/en63-original-review-artifact.zip" \
            english63-three-evidence-review.json >"$RUNNER_TEMP/en63-original-review.json"
          printf '%s  %s\n' \
            89f20b7ac5a672840013b3cf780422dcf68451b6f5d618e8f494a0e5f5dc6b12 \
            "$RUNNER_TEMP/en63-original-review.json" | sha256sum --check -
      - name: Execute real PCM-to-saved-encoder comparison, zero optimization
        timeout-minutes: 12
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B research/english63_weak_pilot/integrated_pcm_encoder.py \
            --tts-zip "$RUNNER_TEMP/en63-original-tts.zip" \
            --review-json "$RUNNER_TEMP/en63-original-review.json" \
            --output "$RUNNER_TEMP/english63-integrated-pcm-encoder-parity.json"
      - name: Publish only the machine research receipt, never raw audio
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: english63-original-pcm-encoder-parity
          path: ${ runner.temp }}/english63-integrated-pcm-encoder-parity.json
          if-no-files-found: error
          retention-days: 14
