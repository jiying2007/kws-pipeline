name: retained-decoder-search-path-decomposition

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/triggers/retained-decoder-search-path-decomposition.json' # workflow-path-filter: allow-missing (created only on retained diagnostic PRs)
      - '.github/workflows/retained-decoder-search-path-decomposition.yml'
      - 'src/kws_debug.h'
      - 'src/kws.c'
      - 'src/decoder.c'
      - 'tools/kws_decoder_path_replay.c'
      - 'tools/diagnose_decoder_search_path_decomposition.py'
      - 'tools/diagnose_decoder_selected_path_provenance.py'
      - 'tools/diagnose_sequence_margin_runtime_gap.py'
      - 'CMakeLists.txt'

permissions:
  contents: read
  actions: read

env:
  KWS_DIAGNOSTIC_SPEC: .github/triggers/retained-decoder-search-path-decomposition.json

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      diagnostic_changed: ${{ steps.resolve.outputs.diagnostic_changed }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      source_artifact_name: ${{ steps.resolve.outputs.source_artifact_name }}
      source_pr_number: ${{ steps.resolve.outputs.source_pr_number }}
      source_head_sha: ${{ steps.resolve.outputs.source_head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve retained decoder-path request
        id: resolve
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$KWS_DIAGNOSTIC_SPEC"; then
            echo "diagnostic_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -s "$KWS_DIAGNOSTIC_SPEC"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, re
          path=pathlib.Path(os.environ["KWS_DIAGNOSTIC_SPEC"])
          value=json.loads(path.read_text(encoding="utf-8"))
          required={
              "schema_version","experiment_id","development_only",
              "selection_feedback_allowed","protected_evidence_used",
              "source_run_id","source_artifact_name","source_pr_number",
              "source_head_sha","model","tokens","keywords_tsv","keyword_pack",
              "posterior_cache","baseline_summary","acoustic_alignment",
          }
          if set(value) != required:
              raise SystemExit("retained decoder-path spec fields mismatch")
          if value["schema_version"] != 1:
              raise SystemExit("retained decoder-path schema_version must be 1")
          if value["development_only"] is not True:
              raise SystemExit("retained decoder-path diagnostic must be development_only")
          if value["selection_feedback_allowed"] is not False:
              raise SystemExit("retained decoder-path diagnostic must not feed selection")
          if value["protected_evidence_used"] is not False:
              raise SystemExit("retained decoder-path diagnostic must not use protected evidence")
          if not isinstance(value["source_run_id"], int) or value["source_run_id"] <= 0:
              raise SystemExit("source_run_id must be positive integer")
          if not isinstance(value["source_pr_number"], int) or value["source_pr_number"] <= 0:
              raise SystemExit("source_pr_number must be positive integer")
          if re.fullmatch(r"[0-9a-f]{40}", str(value["source_head_sha"])) is None:
              raise SystemExit("source_head_sha must be lowercase git SHA")
          for key in (
              "source_artifact_name","model","tokens","keywords_tsv","keyword_pack",
              "posterior_cache","baseline_summary","acoustic_alignment",
          ):
              raw=value[key]
              if (
                  not isinstance(raw,str)
                  or not raw.strip()
                  or raw.startswith("/")
                  or ".." in pathlib.PurePosixPath(raw).parts
              ):
                  raise SystemExit(f"{key} must be a safe relative path/name")
          print("diagnostic_changed=true")
          for key in ("source_run_id","source_artifact_name","source_pr_number","source_head_sha"):
              print(f"{key}={value[key]}")
          PY

  analyze:
    needs: resolve
    if: needs.resolve.outputs.diagnostic_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download retained product-development evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.resolve.outputs.source_artifact_name }}
          path: .retained
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.source_run_id }}

      - name: Verify retained authority and unchanged decoder math
        env:
          SOURCE_HEAD: ${{ needs.resolve.outputs.source_head_sha }}
          SOURCE_PR: ${{ needs.resolve.outputs.source_pr_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(".retained")
          spec=json.loads(pathlib.Path(os.environ["KWS_DIAGNOSTIC_SPEC"]).read_text(encoding="utf-8"))
          receipt=json.loads((root/"build/product-development-experiment-receipt.json").read_text(encoding="utf-8"))
          baseline=json.loads((root/spec["baseline_summary"]).read_text(encoding="utf-8"))
          model=root/spec["model"]
          if receipt.get("source_policy") != "exact-pr-head":
              raise SystemExit("retained source is not exact-pr-head")
          if receipt.get("development_only") is not True or receipt.get("protected_evidence_used") is not False:
              raise SystemExit("retained source authority is not development-only")
          if receipt.get("pr_head_sha") != os.environ["SOURCE_HEAD"]:
              raise SystemExit("retained source head differs from requested source")
          actual=hashlib.file_digest(model.open("rb"),"sha256").hexdigest()
          if actual != baseline.get("model_sha256"):
              raise SystemExit("retained model differs from baseline diagnostic")
          print(f"retained exact source verified: model={actual}")
          PY
          git fetch --no-tags origin "pull/$SOURCE_PR/head"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_HEAD"
          git diff --quiet "$SOURCE_HEAD" HEAD -- src/decoder.c || {
            echo "decoder math changed relative to retained source" >&2
            git diff "$SOURCE_HEAD" HEAD -- src/decoder.c >&2
            exit 2
          }
          read -r adds dels _ < <(git diff --numstat "$SOURCE_HEAD" HEAD -- src/kws.c)
          test "${dels:-0}" = "0" || {
            echo "src/kws.c must be additive-only relative to retained source" >&2
            exit 2
          }
          echo "decoder math unchanged; kws.c additive-only: +${adds:-0}/-${dels:-0}"

      - name: Build decoder path replay
        run: |
          cmake -S . -B build-observe -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build-observe --parallel --target kws_decoder_path_replay
          test -x build-observe/kws_decoder_path_replay

      - name: Decompose exact decoder search paths
        run: |
          set -euo pipefail
          python3 tools/diagnose_decoder_search_path_decomposition.py --self-test
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          spec=json.loads(pathlib.Path(os.environ["KWS_DIAGNOSTIC_SPEC"]).read_text(encoding="utf-8"))
          root=pathlib.Path(".retained")
          output=pathlib.Path("build/retained-decoder-search-path-decomposition.json")
          subprocess.check_call([
              "python3",
              "tools/diagnose_decoder_search_path_decomposition.py",
              "--model",str(root/spec["model"]),
              "--tokens",str(root/spec["tokens"]),
              "--keywords-tsv",str(root/spec["keywords_tsv"]),
              "--pack",str(root/spec["keyword_pack"]),
              "--decoder-path-replay","build-observe/kws_decoder_path_replay",
              "--posterior-cache",str(root/spec["posterior_cache"]),
              "--baseline-summary",str(root/spec["baseline_summary"]),
              "--acoustic-alignment",str(root/spec["acoustic_alignment"]),
              "--output",str(output),
          ])
          value=json.loads(output.read_text(encoding="utf-8"))
          print(json.dumps({
              "totals":value["totals"],
              "positive_sample":value["positive_sample"],
              "per_keyword":{
                  key:{
                      "misses":row["surrogate_above_threshold_runtime_miss"],
                      "categories":row["categories"],
                      "max_depth_histogram":row["max_depth_histogram"],
                      "terminal_confidence":row["miss_max_terminal_confidence"],
                      "terminal_retention_log":row["miss_max_terminal_retention_log"],
                  }
                  for key,row in value["per_keyword"].items()
              },
              "selection_feedback_allowed":value["selection_feedback_allowed"],
          },sort_keys=True))
          PY

      - name: Summarize selected-path backpointer provenance
        run: |
          set -euo pipefail
          python3 tools/diagnose_decoder_selected_path_provenance.py --self-test
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          spec=json.loads(pathlib.Path(os.environ["KWS_DIAGNOSTIC_SPEC"]).read_text(encoding="utf-8"))
          root=pathlib.Path(".retained")
          output=pathlib.Path("build/retained-decoder-selected-path-provenance.json")
          subprocess.check_call([
              "python3",
              "tools/diagnose_decoder_selected_path_provenance.py",
              "--model",str(root/spec["model"]),
              "--tokens",str(root/spec["tokens"]),
              "--keywords-tsv",str(root/spec["keywords_tsv"]),
              "--pack",str(root/spec["keyword_pack"]),
              "--decoder-path-replay","build-observe/kws_decoder_path_replay",
              "--posterior-cache",str(root/spec["posterior_cache"]),
              "--acoustic-alignment",str(root/spec["acoustic_alignment"]),
              "--output",str(output),
          ])
          value=json.loads(output.read_text(encoding="utf-8"))
          print(json.dumps({
              "cohorts":value["positive_sample"]["cohorts"],
              "by_keyword":value["positive_sample"]["by_keyword"],
              "selection_feedback_allowed":value["selection_feedback_allowed"],
          },sort_keys=True))
          PY

      - name: Retain decoder search-path evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retained-decoder-search-path-decomposition-${{ github.event.pull_request.head.sha }}
          path: |
            build/retained-decoder-search-path-decomposition.json
            build/retained-decoder-selected-path-provenance.json
          if-no-files-found: error
          retention-days: 30
