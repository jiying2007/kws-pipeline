name: kws-v2-speech-like-base-contract

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "configs/training/xiaowo.torch-domain.json"
      - "configs/training/xiaowo.v2-speech-like-stage-base.json"
      - "configs/training/kws-v2-staged-experiments-v1.json"
      - "training/hard_negative_replay.py"
      - "training/development_failure_replay.py"
      - ".github/workflows/kws-v2-speech-like-base-contract.yml"
  pull_request:
    paths:
      - "configs/training/xiaowo.torch-domain.json"
      - "configs/training/xiaowo.v2-speech-like-stage-base.json"
      - "configs/training/kws-v2-staged-experiments-v1.json"
      - "training/hard_negative_replay.py"
      - "training/development_failure_replay.py"
      - ".github/workflows/kws-v2-speech-like-base-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify v2 base differs only by speech-like replay policy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, json, pathlib
          canonical = json.loads(pathlib.Path("configs/training/xiaowo.torch-domain.json").read_text())
          v2 = json.loads(pathlib.Path("configs/training/xiaowo.v2-speech-like-stage-base.json").read_text())

          contract = v2["kws_v2_speech_like_training"]
          assert contract == {
              "external_base_required": True,
              "tone_replay_allowed": False,
              "fixed_hard_negative_replay": "disabled",
              "positive_stress_replay": "disabled",
              "failure_replay": "disabled",
          }
          assert v2["data_augmentation_v3"]["failure_replay_enabled"] is False
          assert v2["domain_iteration"]["hard_negative_replay"] == []
          assert v2["domain_iteration"]["positive_stress_replay"] == []

          normalized = copy.deepcopy(v2)
          normalized["name"] = canonical["name"]
          normalized.pop("kws_v2_speech_like_training")
          normalized["data_augmentation_v3"]["failure_replay_enabled"] = canonical["data_augmentation_v3"]["failure_replay_enabled"]
          normalized["domain_iteration"]["hard_negative_replay"] = canonical["domain_iteration"]["hard_negative_replay"]
          normalized["domain_iteration"]["positive_stress_replay"] = canonical["domain_iteration"]["positive_stress_replay"]
          assert normalized == canonical
          print("speech-like-stage-base-diff: ok")
          PY

      - name: Fixed replay must remain empty without invoking tone
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, tempfile, sys
          sys.path.insert(0, "training")
          import hard_negative_replay

          with tempfile.TemporaryDirectory() as temp:
              evidence = hard_negative_replay.render_hard_negative_replay(
                  pathlib.Path("configs/training/xiaowo.v2-speech-like-stage-base.json"),
                  pathlib.Path(temp) / "fixed",
                  round_index=0,
                  curriculum_weights=None,
              )
              assert evidence["examples"] == 0
              assert evidence["hard_negative_examples"] == 0
              assert evidence["positive_stress_examples"] == 0
              assert pathlib.Path(evidence["manifest"]).read_text() == ""
          print("fixed-tone-replay-disabled: ok")
          PY

      - name: Failure replay must remain disabled
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, tempfile, sys
          sys.path.insert(0, "training")
          import development_failure_replay

          with tempfile.TemporaryDirectory() as temp:
              root = pathlib.Path(temp)
              evidence = development_failure_replay.render_development_failure_replay(
                  pathlib.Path("configs/training/xiaowo.v2-speech-like-stage-base.json"),
                  [],
                  root / "work",
                  root / "failure",
              )
              assert evidence["enabled"] is False
              assert evidence["examples"] == 0
              assert evidence["formal_qualification_used"] is False
              assert evidence["development_source_wav_bytes_copied"] is False
              assert pathlib.Path(evidence["manifest"]).read_text() == ""
          print("failure-tone-replay-disabled: ok")
          PY

      - name: Staged experiment policy must use v2 speech-like base
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          policy = json.load(open("configs/training/kws-v2-staged-experiments-v1.json"))
          assert policy["inputs"]["base_config"] == "configs/training/xiaowo.v2-speech-like-stage-base.json"
          assert policy["inputs"]["corpus_requirement"] == "immutable-speech-like-external-base-v1"
          assert policy["invariants"]["tone_replay_allowed"] is False
          print("staged-speech-like-base-binding: ok")
          PY

      - name: Python syntax
        run: >-
          python3 -m py_compile
          training/hard_negative_replay.py
          training/development_failure_replay.py
          tools/bind_kws_v2_candidate.py

      - name: Worktree remains clean
        run: git diff --exit-code -- .
