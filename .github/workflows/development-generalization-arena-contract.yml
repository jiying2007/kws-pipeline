name: development-generalization-arena-contract

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "tools/run_development_generalization_arena.py"
      - ".github/workflows/development-generalization-arena-contract.yml"
  pull_request:
    paths:
      - "tools/run_development_generalization_arena.py"
      - ".github/workflows/development-generalization-arena-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build predeclared four-seed fixture
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/generalization-arena"
          mkdir -p "$root"
          printf 'model-fixture\n' > "$root/model.bin"
          printf 'keywords-fixture\n' > "$root/keywords.bin"
          printf '{}\n' > "$root/config.json"
          printf '#!/bin/sh\nexit 0\n' > "$root/runner"
          chmod +x "$root/runner"
          model_sha="$(sha256sum "$root/model.bin" | awk '{print $1}')"
          product_head="$(git rev-parse HEAD)"
          python3 tools/development_generalization_plan.py \
            --policy configs/training/development-generalization-v1.json \
            --tier search \
            --candidate-id rnn-arena-contract \
            --model-family rnn \
            --model-sha256 "$model_sha" \
            --product-head "$product_head" \
            --count 4 \
            --output "$root/plan.json"

          cat > "$root/fake-seed-executor.py" <<'PY'
          #!/usr/bin/env python3
          import argparse, json, os, pathlib, sys
          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / 'tools'))
          from build_development_generalization_seed import build_seed, load_object

          p = argparse.ArgumentParser()
          p.add_argument('--plan', required=True, type=pathlib.Path)
          p.add_argument('--plan-ordinal', required=True, type=int)
          p.add_argument('--config'); p.add_argument('--runner'); p.add_argument('--model')
          p.add_argument('--keywords'); p.add_argument('--split'); p.add_argument('--work-dir')
          p.add_argument('--output', required=True, type=pathlib.Path)
          p.add_argument('--product-root'); p.add_argument('--pre-tolerance-ms'); p.add_argument('--post-tolerance-ms')
          a = p.parse_args()
          if os.environ.get('FAIL_ORDINAL') == str(a.plan_ordinal):
              raise SystemExit(7)
          plan = load_object(a.plan)
          entry = plan['seed_plan'][a.plan_ordinal]
          domain = {
              'schema_version': 6,
              'overall': {
                  'expected': 32,
                  'false_rejects': 0,
                  'false_accepts': 0,
                  'negative_audio_hours': 1.0,
              },
              'keyword_domains': {
                  '1': {'overall': {'expected': 16, 'false_rejects': 0}},
                  '2': {'overall': {'expected': 16, 'false_rejects': 0}},
              },
          }
          robustness = {
              'schema_version': 4,
              'evidence_class': 'synthetic-domain-robustness-matrix',
              'qualified': True,
              'blocked': False,
              'gates': {},
              'slices': {},
              'failures': [],
          }
          result = build_seed(
              domain_metrics=domain,
              robustness=robustness,
              tier=plan['tier'],
              model_family=plan['model_family'],
              candidate_id=plan['candidate_id'],
              source_identity=entry['source_identity'],
              seed=int(entry['seed']),
              plan=plan,
              plan_ordinal=a.plan_ordinal,
          )
          a.output.parent.mkdir(parents=True, exist_ok=True)
          a.output.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          chmod +x "$root/fake-seed-executor.py"

      - name: Fan out and aggregate the complete cohort
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/generalization-arena"
          python3 tools/run_development_generalization_arena.py \
            --plan "$root/plan.json" \
            --policy configs/training/development-generalization-v1.json \
            --config "$root/config.json" \
            --runner "$root/runner" \
            --model "$root/model.bin" \
            --keywords "$root/keywords.bin" \
            --product-root . \
            --workers 2 \
            --work-dir "$root/work" \
            --output "$root/report.json" \
            --seed-executor "$root/fake-seed-executor.py"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'generalization-arena'
          plan = json.loads((root / 'plan.json').read_text())
          report = json.loads((root / 'report.json').read_text())
          manifest = json.loads((root / 'work' / 'arena-manifest.json').read_text())
          assert report['plan_sha256'] == plan['plan_sha256']
          assert report['plan_complete'] is True
          assert report['independent_seed_count'] == 4
          assert report['seed_ids'] == sorted(int(x['seed']) for x in plan['seed_plan'])
          assert report['pooled']['expected_wakes'] == 128
          assert report['pooled']['false_rejects'] == 0
          assert report['pooled']['false_accepts'] == 0
          assert manifest['independent_seed_count'] == 4
          assert manifest['workers'] == 2
          assert manifest['protected_evidence_used'] is False
          assert [x['ordinal'] for x in manifest['seed_summaries']] == [0, 1, 2, 3]
          print('development-generalization-arena-contract: ok')
          PY

      - name: Seed infrastructure failure must fail the arena
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/generalization-arena"
          rm -rf "$root/fail-work" "$root/fail-report.json"
          if FAIL_ORDINAL=2 python3 tools/run_development_generalization_arena.py \
            --plan "$root/plan.json" \
            --policy configs/training/development-generalization-v1.json \
            --config "$root/config.json" \
            --runner "$root/runner" \
            --model "$root/model.bin" \
            --keywords "$root/keywords.bin" \
            --product-root . \
            --workers 4 \
            --work-dir "$root/fail-work" \
            --output "$root/fail-report.json" \
            --seed-executor "$root/fake-seed-executor.py"; then
            echo 'arena accepted a failed seed executor' >&2
            exit 1
          fi
          test ! -f "$root/fail-report.json"
          test -f "$root/fail-work/seed-002/executor.log"

      - name: Python syntax
        run: python3 -m py_compile tools/run_development_generalization_arena.py

      - name: Worktree remains clean
        run: git diff --exit-code -- .
