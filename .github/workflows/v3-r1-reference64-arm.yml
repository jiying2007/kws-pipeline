name: V3 R1 binary64 ARM source build
on:
  push:
    branches: ['research/v3-r1-reference64-arm-20261107']
permissions:
  contents: read
concurrency:
  group: v3-r1-reference64-arm-20261107
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'jiying2007/kws-pipeline' && github.event_name == 'push' && github.ref == 'refs/heads/research/v3-r1-reference64-arm-20261107' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 71e6a93ab2a7bbae95387a662650a5ecbc8d0c29
          persist-credentials: false
      - uses: ./.github/actions/setup-research-python
      - name: Install fixed-scope cross tools with the existing bounded helper
        run: sudo python3 -I -S -B tools/install_arm_dependencies.py
      - name: Materialize source only; no private weights or audio
        run: python3 -I -S -B research/r1_stream_c/numerics.py --mode reference64 --output "$RUNNER_TEMP/r1-reference64"
      - name: Build static CLI and bounded capture tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer/arm transfer/executor
          python3 -I -S - <<'PY'
          import hashlib,json,os,pathlib,shutil,struct,subprocess,time
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'r1-reference64';src=root/'source';out=pathlib.Path('transfer/arm').resolve()
          capture=r'''/* SPDX-License-Identifier: Apache-2.0; fixed-record numerical capture, no acoustic labels. */
          #include "r1d_stream.h"
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          #include <inttypes.h>
          #include <string.h>
          typedef struct {uint64_t rows;} status;
          static int u64(uint64_t v){unsigned char b[8];for(unsigned i=0;i<8;i++)b[i]=(unsigned char)(v>>(8*i));return fwrite(b,1,8,stdout)==8?0:1;}
          static int sink(void *p,uint64_t i,uint64_t source,uint64_t delivery,const double *f,const double *z){
              status *s=p;if(i!=s->rows || u64(i)||u64(source)||u64(delivery))return 1;
              if(fwrite(f,sizeof(double),400,stdout)!=400 || fwrite(z,sizeof(double),2601,stdout)!=2601)return 1;
              s->rows++;return 0;
          }
          static unsigned char *read_exact(const char *p,size_t size){FILE *f=fopen(p,"rb");if(!f)return NULL;
              unsigned char *x=malloc(size);if(!x){fclose(f);return NULL;}
              size_t n=fread(x,1,size,f);int tail=fgetc(f),bad=ferror(f);fclose(f);
              if(n!=size || tail!=EOF || bad){free(x);return NULL;}return x;}
          int main(int argc,char **argv){
              if(argc!=3){fputs("model/table paths required; raw PCM16LE stdin\n",stderr);return 2;}
              unsigned char *w=read_exact(argv[1],3028860),*t=read_exact(argv[2],83840);status st={0};
              if(!w||!t){free(w);free(t);return 2;}
              r1d_stream *s=r1d_create(w,3028860,t,83840,sink,&st);free(w);free(t);if(!s)return 2;
              if(fwrite("R1DREF1\0",1,8,stdout)!=8){r1d_destroy(s);return 2;}
              unsigned char b[640];size_t n,used;uint64_t bytes=0;int rc=0;
              while((n=fread(b,1,sizeof(b),stdin))>0){rc=r1d_feed(s,b,n,&used);bytes+=used;if(rc||used!=n){rc=1;break;}}
              if(ferror(stdin)){rc=1;}if(!rc){rc=r1d_finish(s);}if(fflush(stdout)){rc=1;}
              fprintf(stderr,"{\"status\":\"%s\",\"frames\":%" PRIu64 ",\"pcm_bytes\":%" PRIu64 ",\"state_bytes\":%zu,\"synthetic_eof\":false}\n",rc?"failed":"complete",st.rows,bytes,r1d_state_bytes());
              r1d_destroy(s);return rc?2:0;
          }
          '''
          if hashlib.sha256(capture.encode()).hexdigest()!='0368c9d00a1622ddb08855a21ac828cf32bc148f06c4cd9e3840df719007415c':raise SystemExit('reviewed capture source changed')
          (out/'capture.c').write_text(capture)
          cc='/usr/bin/arm-linux-gnueabihf-gcc'
          flags=['-std=c11','-O2','-Wall','-Wextra','-Werror','-pedantic','-fno-fast-math','-ffp-contract=off','-fexcess-precision=standard','-mcpu=cortex-a32','-mfpu=neon-vfpv4','-mfloat-abi=hard','-I'+str(src)]
          sources=[str(src/n) for n in ('r1d_stream.c','r1d_pcm.c','reference64_fbank.c','r1dfsmn.c','sha256.c')]
          start=time.monotonic();commands=[]
          for name,main in [('r1d_pcm_armhf_static',src/'r1d_pcm_cli.c'),('r1d_capture_armhf_static',out/'capture.c')]:
              command=[cc,*flags,'-static',str(main),*sources,'-lm','-o',str(out/name)];commands.append(command)
              result=subprocess.run(command,capture_output=True,timeout=max(1,60-(time.monotonic()-start)))
              (out/(name+'.compile.log')).write_bytes(result.stdout+result.stderr)
              if result.returncode:raise SystemExit('compiler failure; inspect retained log')
              raw=(out/name).read_bytes();eflags=struct.unpack_from('<I',raw,36)[0]
              if raw[:6]!=b'\x7fELF\x01\x01' or struct.unpack_from('<H',raw,18)[0]!=40 or eflags&0xff000000!=0x05000000 or not eflags&0x400 or eflags&0x200:raise SystemExit('ELF contract')
              (out/(name+'.ELF.txt')).write_bytes(subprocess.check_output(['readelf','-h','-A',str(out/name)],timeout=5))
          executor=pathlib.Path('transfer/executor');shutil.copyfile('/usr/bin/qemu-arm-static',executor/'qemu-arm-static')
          copyrights=pathlib.Path('/usr/share/doc/qemu-user-static/copyright')
          if copyrights.is_file():shutil.copyfile(copyrights,executor/'COPYRIGHT')
          (executor/'PACKAGE.txt').write_bytes(subprocess.check_output(['dpkg-query','-W','-f=${Package}\n${Version}\n${Source}\n','qemu-user-static'],timeout=5))
          (executor/'README.txt').write_text('Unmodified Ubuntu qemu-user-static executor, separate from the Apache-licensed model sources. See COPYRIGHT and PACKAGE.txt. Corresponding Ubuntu source is the qemu source package in the configured Ubuntu noble/noble-updates archive; retrieve with apt source qemu. This executor is not included in the model delivery ZIP. No private inputs were loaded on this hosted runner.\n')
          manifest={'schema':'kws-r1-reference64-arm-build-v1','source_commit':'71e6a93ab2a7bbae95387a662650a5ecbc8d0c29','target':'cortex-a32/neon-vfpv4/hard','compiler':subprocess.check_output([cc,'--version'],timeout=5).decode().splitlines()[0],
              'commands':commands,'compiler_invocations':2,'model_loads':0,'private_audio':False,'model_forwards':0,'physical_ssc305':False,'previous_failed_build':42384580307,'scope':'cross-build and executor transfer only; local inference has a separate bounded declaration',
              'files':{p.relative_to('transfer').as_posix():{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in pathlib.Path('transfer').rglob('*') if p.is_file()}}
          pathlib.Path('transfer/BUILD.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n');print(json.dumps({k:v for k,v in manifest.items() if k not in ('files','commands')}))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v3-r1-reference64-arm
          path: transfer/
          retention-days: 3
          if-no-files-found: error
