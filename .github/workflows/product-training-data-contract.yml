permissions:
  contents: read
  actions: read

jobs:
  select-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      existing_required: ${{ steps.scope.outputs.existing_required }}
      candidate_required: ${{ steps.scope.outputs.candidate_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select complete product and candidate change scopes
        id: scope
        run: python3 -B tools/candidate_numeric_ci_changes.py
      - name: Candidate numeric CI scope and source contracts
        run: |
          python3 -S -B tests/test_candidate_encoder_numeric_ci.py
          python3 -S -B -O tests/test_candidate_encoder_numeric_ci.py
          python3 -S -B -OO tests/test_candidate_encoder_numeric_ci.py
          python3 -S -B tests/test_research_ci_changes.py
          python3 tools/check_workflow_path_filters.py

  contract:
    needs: select-scope
    if: ${{ needs.select-scope.outputs.existing_required == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Product training entry contract
        run: |
          python3 tests/test_product_training_entry_contract.py
          python3 tests/test_feature_cache_contract.py
          python3 tests/test_replay_provider_semantic_identity.py
          python3 training/compare_product_objective_pair.py --self-test
      - name: Python syntax
        run: >-
          python3 -m py_compile
          training/materialize_product_training_config.py
          training/verify_product_development_preflight.py
          tests/test_product_development_preflight.py
          tests/test_product_development_experiment.py
          training/compare_product_development_pair.py
          training/compare_product_objective_pair.py
          training/synthetic_audio.py
          tools/bootstrap_speech_like_stage_a.py
          training/verify_training_entry_contract.py
          training/training_request.py
          training/product_development_experiment.py
          training/adversarial_refinement.py
          training/train_ctc.py
          training/ctc_primary.py
          training/ctc_label_prior_contract.py
          training/test_ctc_primary.py
          training/objective_config.py
          training/objective_contract.py
          training/suffix_root_loss.py
          tests/test_suffix_root_objective.py
          training/path_purity.py
          training/export_model.py
          training/feature_cached_trainer.py
          training/frontend.py
          training/iterate_domain.py
          training/test_sequence_margin.py
          tests/test_product_training_entry_contract.py
          tests/test_feature_cache_contract.py
          tests/test_replay_provider_semantic_identity.py
          tests/test_adversarial_refinement_source.py
      - name: Governed product training shell syntax
        run: |
          bash -n training/materialize_governed_product_base.sh
          bash -n training/require_product_development_preflight.sh
      - name: Product development preflight guard contract
        run: python3 tests/test_product_development_preflight.py
      - name: PR-head development experiment contract
        run: python3 tests/test_product_development_experiment.py
      - name: Product development preflight workflow contract
        run: |
          python3 - <<'PY'
          import pathlib
          workflow=pathlib.Path(".github/workflows/model-training-preflight.yml").read_text(encoding="utf-8")
          verifier=pathlib.Path("training/require_product_development_preflight.sh").read_text(encoding="utf-8")
          assert "--defer-qualification" in workflow
          assert "--stop-after-development-eval" in workflow
          assert 'train["epochs"]=12' in workflow
          assert 'train["warm_start_epochs"]=6' in workflow
          assert 'adversarial["refinement_epochs"]=6' in workflow
          assert "verify_product_development_preflight.py" in workflow
          assert "xiaowo-product-development-preflight-" in workflow
          assert "github.event.pull_request.base.sha" in workflow
          assert "pr_base_sha" in verifier
          assert '.path == ".github/workflows/model-training-preflight.yml"' in verifier
          assert "/artifacts?per_page=100" in verifier
          assert 'expected_artifact="xiaowo-product-development-preflight-$pr_base_sha"' in verifier
          assert "pull_requests" not in verifier
          full=pathlib.Path(".github/workflows/model-training.yml").read_text(encoding="utf-8")
          assert "actions: read" in full
          assert "pull-requests: read" in full
          assert "Require successful product development preflight" in full
          assert "require_product_development_preflight.sh" in full
          print("product development preflight workflow: ok")
          PY
      - name: Development refinement source contract
        run: python3 tests/test_adversarial_refinement_source.py
      - name: Static product base identity
        run: |
          python3 - <<'PY'
          import json, pathlib
          p=json.loads(pathlib.Path("configs/training/product-speech-like-base-v1.json").read_text())
          assert p["policy"]=="product-speech-like-base-v1"
          assert p["release_tag"]=="speech-like-base-5204b798033f"
          assert p["release_id"]==392032606
          assert p["release_archive_sha256"]=="18c0401b6b8d2d4a01d6b28f3d17ffbacb33a6c359e50e890d7882f478e4bfd6"
          assert p["release_bundle_manifest_sha256"]=="e979c4b4910346c529d48ee466375add267e06213e7b5c15a224fb2a0d97ba4d"
          assert p["source_repro_run_id"]==35318933124
          assert p["external_base_bundle_sha256"]=="5204b798033fe46e5381c743accf638ab7f16d4e4367f42cba38a6bb44c97b35"
          assert p["provider_identity_sha256"]=="d12728562db74951191575e9afe4922adc1260934b02d577dda67d91faa4aff9"
          assert p["splits"]=={"train":128,"calibration":64,"test":64,"qualification":128}
          assert p["tone_backend_used"] is False
          assert p["protected_evidence_used"] is False
          assert p["replay_provider_identity_sha256"]==p["provider_identity_sha256"]
          assert p["replay_train_voice_slots"]==8
          assert p["replay_voice_scope"]=="train-only"
          assert p["replay_backend"]=="command"
          assert p["replay_tone_allowed"] is False
          replay=json.loads(pathlib.Path("configs/training/product-replay-provider-semantic-v1.json").read_text())
          assert replay["policy"]=="product-replay-provider-semantic-v1"
          assert replay["semantic_identity_sha256"]=="9b0fd7f00914a074ce610d2b2d604848c8053b68c9bc044d9abcd20b2f6bf916"
          assert replay["replay_train_voice_slots"]==8
          assert replay["replay_voice_scope"]=="train-only"
          print("product speech-like base + replay semantic contracts: ok")
          PY
      - name: Verify promoted model keeps product data lineage
        run: |
          python3 - <<'PY'
          import pathlib
          finalizer=pathlib.Path("training/finalize_domain_candidate.py").read_text()
          promoter=pathlib.Path("tools/verify_model_promotion_bundle.py").read_text()
          materializer=pathlib.Path("training/materialize_product_training_config.py").read_text()
          assert "effective-training-config.json" in finalizer
          assert "product-speech-like-base-contract.json" in finalizer
          assert "training-invocation.json" in finalizer
          assert "base_contract_sha256" in materializer
          assert "replay_provider_semantic_contract_sha256" in materializer
          assert "replay_provider_execution_identity_sha256" in materializer
          assert "replay-provider-semantic-contract.json" in finalizer
          assert "xiaowo-replay-provider-semantic-contract.json" in promoter
          assert "source_template_config_sha256" in materializer
          assert "xiaowo-effective-training-config.json" in promoter
          assert "xiaowo-product-speech-like-base-contract.json" in promoter
          assert "training-invocation.json" in promoter
          assert "governed-model-training-invocation-v1" in promoter
          assert "ordered-token sample weighting" in promoter
          assert "tone fallback" in promoter
          print("promoted product data lineage contract: ok")
          PY
      - name: Worktree remains clean
        run: git diff --exit-code -- .

  objective-math:
    needs: select-scope
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      MKL_NUM_THREADS: "1"
      MKL_CBWR: COMPATIBLE
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      ATEN_CPU_CAPABILITY: default
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned CPU objective runtime
        run: |
          python3 -m venv .venv-objective
          .venv-objective/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2 scipy==1.17.1
          .venv-objective/bin/python -m pip install --disable-pip-version-check --no-input \
            torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Decoder-aligned objective math contract
        if: ${{ needs.select-scope.outputs.existing_required == 'true' }}
        run: |
          .venv-objective/bin/python training/test_sequence_margin.py
          .venv-objective/bin/python training/test_ctc_primary.py
          .venv-objective/bin/python tests/test_suffix_root_objective.py
      - name: Candidate encoder random-feature numeric contracts
        if: ${{ needs.select-scope.outputs.candidate_required == 'true' }}
        timeout-minutes: 5
        run: |
          .venv-objective/bin/python -B tests/test_candidate_encoder_numeric.py \
            --report build/candidate-encoder-numeric.json
      - name: ASR audio derivation and explicit third-confirmation contracts
        timeout-minutes: 3
        run: |
          .venv-objective/bin/python -B research/tts-pilot-screening-v1/test_suite.py --require-numeric
      - name: Research model train and streaming numeric smoke
        timeout-minutes: 3
        run: |
          timeout 120s .venv-objective/bin/python -B tests/test_model_comparison_numeric.py \
            --repo . --receipt build/model-comparison-numeric-receipt.json
      - name: Retain research model numeric smoke receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-comparison-numeric-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/model-comparison-numeric-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain candidate numeric contract receipt
        if: ${{ always() && needs.select-scope.outputs.candidate_required == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-encoder-numeric-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/candidate-encoder-numeric.json
          if-no-files-found: error
          retention-days: 14

  live-base-binding:
    needs: select-scope
    if: ${{ needs.select-scope.outputs.existing_required == 'true' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download immutable product speech-like base
        run: |
          set -euo pipefail
          contract=configs/training/product-speech-like-base-v1.json
          tag="$(jq -r '.release_tag' "$contract")"
          release_id="$(jq -r '.release_id' "$contract")"
          target="$(jq -r '.source_repro_head_sha' "$contract")"
          archive="$(jq -r '.release_archive' "$contract")"
          archive_sha="$(jq -r '.release_archive_sha256' "$contract")"
          mkdir -p .generated/release .generated/product-speech-like-base
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > .generated/release/release.json
          jq -e --arg target "$target" --argjson id "$release_id" '
            .id == $id and .immutable == true and .draft == false and .prerelease == false
            and .target_commitish == $target
          ' .generated/release/release.json >/dev/null
          jq -e --arg name "$archive" --arg digest "sha256:$archive_sha" '
            [.assets[] | select(.name == $name and .digest == $digest)] | length == 1
          ' .generated/release/release.json >/dev/null
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir .generated/release
          (cd .generated/release && sha256sum -c SPEECH_LIKE_BASE_SHA256SUMS)
          tar -xzf ".generated/release/$archive" -C .generated/product-speech-like-base
      - name: Audit recovered train and calibration metadata only
        run: |
          python3 -B tools/audit_historical_base_metadata.py \
            --corpus-root .generated/product-speech-like-base/corpus \
            --output .generated/historical-base-selected-metadata.json
      - name: Retain historical metadata audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: historical-base-selected-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: .generated/historical-base-selected-metadata.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Materialize exact effective product training config
        run: |
          set -euo pipefail
          python3 tools/bootstrap_speech_like_stage_a.py             --provider-only             --cache-dir .generated/replay-provider-cache             --work-dir .generated/replay-provider
          python3 training/materialize_product_training_config.py             --source-config configs/training/xiaowo.torch-domain.json             --base-contract configs/training/product-speech-like-base-v1.json             --bundle-root .generated/product-speech-like-base/corpus             --replay-provider .generated/replay-provider/corpus/provider/provider.json             --replay-provider-summary .generated/replay-provider/corpus/provider/provider-summary.json             --replay-provider-contract configs/training/product-replay-provider-semantic-v1.json             --voice-inventory .generated/replay-provider/corpus/provider/voice-inventory.jsonl             --output .generated/xiaowo.product-effective.json
          if python3 training/verify_training_entry_contract.py --config .generated/xiaowo.product-effective.json --require-product-speech-like-base > .generated/training-admission.log 2>&1; then
            echo "Historical base unexpectedly admitted for new training" >&2
            exit 1
          fi
          grep -F "historical frozen base is diagnostic-only" .generated/training-admission.log
          python3 training/external_base_dataset.py             --config .generated/xiaowo.product-effective.json             --output .generated/external-base-summary.json
          python3 - <<'PY'
          import json, pathlib
          expected=json.loads(pathlib.Path("configs/training/product-speech-like-base-v1.json").read_text())
          replay=json.loads(pathlib.Path("configs/training/product-replay-provider-semantic-v1.json").read_text())
          actual=json.loads(pathlib.Path(".generated/external-base-summary.json").read_text())
          assert actual["bundle_sha256"]==expected["external_base_bundle_sha256"]
          assert actual["tone_backend_used"] is False
          assert set(actual["splits"])=={"train","calibration","test","qualification"}
          effective=json.loads(pathlib.Path(".generated/xiaowo.product-effective.json").read_text())
          tts=effective["generator"]["tts"]
          product=effective["product_candidate_data"]
          assert tts["backend"]=="command"
          assert tts["provider_identity_sha256"]==replay["semantic_identity_sha256"]
          assert len(tts["provider_execution_identity_sha256"])==64
          assert tts["provider_semantic_identity_policy"]=="product-replay-provider-semantic-v1"
          assert len(tts["speaker_profiles"])==replay["replay_train_voice_slots"]==8
          assert tts["replay_voice_scope"]=="train-only"
          assert product["replay_tone_allowed"] is False
          assert product["provider_identity_sha256"]==expected["provider_identity_sha256"]
          assert product["replay_provider_identity_sha256"]==replay["semantic_identity_sha256"]
          assert product["replay_provider_execution_identity_sha256"]==tts["provider_execution_identity_sha256"]
          assert product["replay_provider_semantic_identity_policy"]=="product-replay-provider-semantic-v1"
          print("live product speech-like base/replay semantic binding: ok")
          PY


  training-reproducibility-replica:
    needs: select-scope
    if: ${{ needs.select-scope.outputs.existing_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      MKL_NUM_THREADS: "1"
      MKL_CBWR: COMPATIBLE
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      ATEN_CPU_CAPABILITY: default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned CPU reproducibility runtime
        run: |
          python3 -m venv .venv-repro
          .venv-repro/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2 scipy==1.17.1
          .venv-repro/bin/python -m pip install --disable-pip-version-check --no-input \
            torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Train unobserved parity reference
        run: |
          .venv-repro/bin/python training/reproducibility_smoke.py \
            --work-dir "build/plain-${{ matrix.replica }}" \
            --output "build/plain-${{ matrix.replica }}.json"
      - name: Train deterministic fixture
        run: |
          .venv-repro/bin/python training/reproducibility_smoke.py \
            --work-dir "build/training-reproducibility-${{ matrix.replica }}" \
            --output "build/training-reproducibility-${{ matrix.replica }}.json" --numeric-trace
      - name: Verify observation leaves actual training unchanged
        run: |
          .venv-repro/bin/python training/compare_reproducibility_trace.py --observer-parity \
            --left "build/plain-${{ matrix.replica }}" \
            --right "build/training-reproducibility-${{ matrix.replica }}" \
            --output "build/observer-parity-${{ matrix.replica }}.json"
      - name: Retain reproducibility identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: training-reproducibility-${{ matrix.replica }}
          path: |
            build/training-reproducibility-${{ matrix.replica }}.json
            build/training-reproducibility-${{ matrix.replica }}/**
            build/plain-${{ matrix.replica }}.json
            build/observer-parity-${{ matrix.replica }}.json
          if-no-files-found: error
          retention-days: 7

  training-reproducibility-compare:
    needs: [select-scope, training-reproducibility-replica]
    if: ${{ always() && needs.select-scope.outputs.existing_required == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download independent runner identities
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: training-reproducibility-*
          path: .repro
          merge-multiple: false
      - name: Locate first observed numeric divergence
        if: always()
        continue-on-error: true
        run: |
          python3 training/compare_reproducibility_trace.py \
            --left .repro/training-reproducibility-a/training-reproducibility-a.json \
            --right .repro/training-reproducibility-b/training-reproducibility-b.json \
            --output build/numeric-divergence.json
      - name: Retain numeric divergence even on mismatch
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: training-numeric-divergence
          path: build/numeric-divergence.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce numerical-class reproducibility policy
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          paths=sorted(pathlib.Path('.repro').glob('**/training-reproducibility-*.json'))
          assert len(paths)==2, paths
          rows=[json.loads(path.read_text(encoding='utf-8')) for path in paths]
          report=json.loads(pathlib.Path('build/numeric-divergence.json').read_text(encoding='utf-8'))

          # Input/runtime identity remains strict for every pair. A numerical
          # boundary never excuses changed data, code, torch or thread policy.
          assert {row['pythonhashseed'] for row in rows}=={'0'}
          assert {row['torch_num_threads'] for row in rows}=={1}
          assert {row['torch_num_interop_threads'] for row in rows}=={1}
          assert len({row['torch_version'] for row in rows})==1
          assert len({row['fixture_manifest_sha256'] for row in rows})==1
          assert len({json.dumps(row['training_code_sha256'],sort_keys=True) for row in rows})==1
          assert report.get('infrastructure_complete') is True
          assert report.get('release_authority') is False

          if report.get('cross_vendor_pair_observed') is True:
              vendors=sorted(report.get('cpu_vendors') or [])
              assert vendors==['AMD','Intel'], vendors
              # #298/#146 retained evidence established that universal
              # AMD<->Intel bit equality is not a supported training claim.
              # Preserve the exact divergence report, but do not seed-shop
              # hosted runners until a same-vendor pair happens by chance.
              print(
                  'cross-vendor numerical boundary retained: '
                  f'exact_match={report.get("exact_match")} '
                  f'first={report.get("first_observed_divergence")}'
              )
          else:
              # Within one known vendor class (and for unknown/unclassified
              # pairs), keep the original fail-closed byte identity contract.
              if report.get('exact_match') is not True:
                  raise SystemExit(
                      'non-cross-vendor training reproducibility mismatch: '
                      + json.dumps(report.get('first_observed_divergence'), sort_keys=True)
                  )
              float_shas={row['float_state_sha256'] for row in rows}
              if len(float_shas)!=1 or any(len(value)!=64 for value in float_shas):
                  raise SystemExit('training float state mismatch: ' + str(float_shas))
              model_shas={row['model_sha256'] for row in rows}
              if len(model_shas)!=1:
                  raise SystemExit('training model mismatch: ' + str(model_shas))
              print('same-class training reproducibility: PASS', next(iter(model_shas)))
          PY
