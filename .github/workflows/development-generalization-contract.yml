name: development-generalization-contract

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "tools/development_generalization.py"
      - "tools/statistical_bounds.py"
      - "configs/training/development-generalization-v1.json"
      - ".github/workflows/development-generalization-contract.yml"
  pull_request:
    paths:
      - "tools/development_generalization.py"
      - "tools/statistical_bounds.py"
      - "configs/training/development-generalization-v1.json"
      - ".github/workflows/development-generalization-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build independent development seed fixtures
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/generalization"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "generalization"
          for seed in range(8):
              value = {
                  "schema_version": 1,
                  "evidence_class": "development-generalization-seed-v1",
                  "evidence_scope": "development-only",
                  "tier": "freeze",
                  "model_family": "rnn",
                  "candidate_id": "fixture-rnn-h48-logmel",
                  "source_identity": f"fixture-source-{seed}",
                  "seed": 880000 + seed,
                  "expected_wakes": 128,
                  "false_rejects": 0,
                  "false_accepts": 0,
                  "negative_audio_hours": 4.0,
                  "coverage_passed": True,
                  "fresh_used": False,
                  "shadow_used": False,
                  "formal_qualification_used": False,
                  "keywords": {
                      "1": {"expected_wakes": 64, "false_rejects": 0},
                      "2": {"expected_wakes": 64, "false_rejects": 0}
                  }
              }
              (root / f"freeze-{seed}.json").write_text(json.dumps(value) + "\n")
              value["tier"] = "search"
              (root / f"search-{seed}.json").write_text(json.dumps(value) + "\n")
          PY
      - name: Verify search and freeze aggregation
        run: |
          set -euo pipefail
          search_args=()
          for i in 0 1 2 3; do search_args+=(--seed-summary "$RUNNER_TEMP/generalization/search-$i.json"); done
          python3 tools/development_generalization.py \
            --policy configs/training/development-generalization-v1.json \
            --tier search "${search_args[@]}" \
            --output "$RUNNER_TEMP/search-report.json"
          freeze_args=()
          for i in 0 1 2 3 4 5 6 7; do freeze_args+=(--seed-summary "$RUNNER_TEMP/generalization/freeze-$i.json"); done
          python3 tools/development_generalization.py \
            --policy configs/training/development-generalization-v1.json \
            --tier freeze "${freeze_args[@]}" \
            --output "$RUNNER_TEMP/freeze-report.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          search = json.loads((root / "search-report.json").read_text())
          freeze = json.loads((root / "freeze-report.json").read_text())
          assert search["independent_seed_count"] == 4
          assert freeze["independent_seed_count"] == 8
          assert search["pooled"]["expected_wakes"] == 512
          assert freeze["pooled"]["expected_wakes"] == 1024
          assert search["pooled"]["false_rejects"] == 0
          assert freeze["pooled"]["false_accepts"] == 0
          assert freeze["pooled"]["frr_upper_bound"] < search["pooled"]["frr_upper_bound"]
          assert freeze["pooled"]["far_upper_bound_per_hour"] < search["pooled"]["far_upper_bound_per_hour"]
          assert freeze["coverage_passed"] is True
          assert freeze["protected_evidence_used"] is False
          assert freeze["statistical_gate_mode"] == "report-only-until-baseline-calibrated"
          print("development-generalization-contract: ok")
          PY
      - name: Verify duplicate seed fails closed
        run: |
          set -euo pipefail
          if python3 tools/development_generalization.py \
            --policy configs/training/development-generalization-v1.json \
            --tier search \
            --seed-summary "$RUNNER_TEMP/generalization/search-0.json" \
            --seed-summary "$RUNNER_TEMP/generalization/search-0.json" \
            --seed-summary "$RUNNER_TEMP/generalization/search-1.json" \
            --seed-summary "$RUNNER_TEMP/generalization/search-2.json" \
            --output "$RUNNER_TEMP/invalid.json"; then
            echo "duplicate seed unexpectedly accepted" >&2
            exit 1
          fi
      - name: Python syntax
        run: python3 -m py_compile tools/development_generalization.py
      - name: Worktree remains clean
        run: git diff --exit-code -- .
