# One-shot, public source-only handoff to owner local ARM emulator.
name: R1 public source handoff 20261110
on:
  push:
    branches: [research/r1-public-source-handoff-20261110-v1]
permissions:
  contents: read
jobs:
  source-export:
    if: ${{ github.ref == 'refs/heads/research/r1-public-source-handoff-20261110-v1' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Snapshot only pinned publicly reviewed qhead8 generator sources
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/r1-public-qhead8-sources"
          mkdir -p "$out"
          files=(research/r1_stream_c/quant_head8/materialize.py research/r1_stream_c/quant_head8/pack_model.py research/r1_stream_c/quant_head8/owner_arm_replay.py research/r1_stream_c/quant_head8/owner_arm_trace.c)
          for f in "${files[@]}"; do test -f "$f" && test ! -L "$f"; done
          tar -czf "$out/source.tar.gz" "${files[@]}"
          (cd "$out"; sha256sum source.tar.gz > SHA256SUMS)
          git rev-parse HEAD > "$out/COMMIT.txt"
          printf '%s\n' 'Public, reviewed, source-only files. No checkpoint, no audio, no private labels.' > "$out/README.txt"
          test "$(stat -c%s "$out/source.tar.gz")" -lt 100000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r1-public-qhead8-sources-20261110-v1
          path: ${{ runner.temp }}/r1-public-qhead8-sources/
          retention-days: 1
          if-no-files-found: error
