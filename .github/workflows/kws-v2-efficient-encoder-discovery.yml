name: kws-v2-efficient-encoder-discovery

on:
  workflow_dispatch:
  push:
    branches:
      - "research/kws-efficient-encoder-v2"
    paths:
      - "configs/training/kws-v2-efficient-encoder-discovery-v1.json"
      - "training/research_keyword_classifier.py"
      - "training/analyze_efficient_encoder_discovery.py"
      - ".github/workflows/kws-v2-efficient-encoder-discovery.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: kws-v2-efficient-encoder-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  same-runner-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download frozen rendered research dataset
        uses: actions/download-artifact@v4
        with:
          name: kws-v2-research-rendered-dataset-gru-logmel-8961cfd981c80a3
          path: ${{ runner.temp }}/rendered-cache
          github-token: ${{ github.token }}
          repository: jiying2007/kws-pipeline
          run-id: 35412153192

      - name: Download frozen ordinary-speech sidecar
        uses: actions/download-artifact@v4
        with:
          name: kws-v2-research-negative-sidecar-b1eb61db767122ebc8a28d40151b73667d135c33
          path: ${{ runner.temp }}/negative-sidecar
          github-token: ${{ github.token }}
          repository: jiying2007/kws-pipeline
          run-id: 35367960968

      - name: Install pinned CPU training runtime
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input \
            torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Train all seeds and candidates on one runner
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/efficient"
          mkdir -p "$root"
          common=(
            --train-manifest "$RUNNER_TEMP/rendered-cache/train.tsv"
            --train-manifest "$RUNNER_TEMP/negative-sidecar/train/negative-empty-target.tsv"
            --calibration-manifest "$RUNNER_TEMP/rendered-cache/calibration.tsv"
            --calibration-manifest "$RUNNER_TEMP/negative-sidecar/calibration/negative-empty-target.tsv"
            --test-manifest "$RUNNER_TEMP/rendered-cache/test.tsv"
            --test-manifest "$RUNNER_TEMP/negative-sidecar/test/negative-empty-target.tsv"
            --tokens keywords/tokens.example.txt
            --keywords keywords/zh_cn_example.tsv
            --frontend logmel
            --feature-dim 32
            --epochs 24
            --batch-size 16
            --lr 0.001
            --lr-schedule fixed-v1
            --sampler-seed 1337
            --init-mode default-pytorch-v1
            --balance-mode equal-class-sampler-v1
          )
          seeds="$(python3 - <<'PY'
          import json, pathlib
          p=json.loads(pathlib.Path("configs/training/kws-v2-efficient-encoder-discovery-v1.json").read_text())
          print(" ".join(str(v) for v in p["fixed"]["model_seeds"]))
          PY
          )"
          for seed in $seeds; do
            seed_root="$root/$seed"
            mkdir -p "$seed_root"
            train() {
              local name="$1" architecture="$2" hidden="$3"
              mkdir -p "$seed_root/$name"
              .venv/bin/python training/research_keyword_classifier.py \
                "${common[@]}" \
                --model-seed "$seed" \
                --encoder-architecture "$architecture" \
                --hidden-dim "$hidden" \
                --output "$seed_root/$name/classifier.json"
            }
            train b0-gru64 single-gru-v1 64
            train e40-gru2x40 stacked-gru-v2 40
            train e48-gru2x48 stacked-gru-v2 48
            .venv/bin/python training/analyze_efficient_encoder_discovery.py trial \
              --config configs/training/kws-v2-efficient-encoder-discovery-v1.json \
              --model-seed "$seed" \
              --root "$seed_root" \
              --output "$seed_root/trial-evidence.json"
          done

      - name: Aggregate same-runner calibration-only discovery
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/efficient-summary"
          .venv/bin/python training/analyze_efficient_encoder_discovery.py aggregate \
            --config configs/training/kws-v2-efficient-encoder-discovery-v1.json \
            --root "$RUNNER_TEMP/efficient" \
            --output "$RUNNER_TEMP/efficient-summary/summary.json"

      - name: Upload same-runner discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: kws-v2-efficient-encoder-same-runner-${{ github.sha }}
          path: |
            ${{ runner.temp }}/efficient/
            ${{ runner.temp }}/efficient-summary/
          if-no-files-found: error
          retention-days: 30
