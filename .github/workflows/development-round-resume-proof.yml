name: development-round-resume-proof

on:
  push:
    branches:
      - tmp/development-round-resume
    paths:
      - '.github/triggers/development-round-resume-proof.txt'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/development-round-resume
          persist-credentials: false
      - name: Build shipping RNN runner
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel --target kws_wav
      - name: Install pinned CPU runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Prepare tiny deterministic development contract
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('build/resume-proof-config')
          root.mkdir(parents=True, exist_ok=True)
          cfg=json.load(open('configs/training/xiaowo.torch-domain.json', encoding='utf-8'))
          for split in ('train','calibration','test','qualification'):
              cfg['dataset'][split]={
                  'positive_families_per_keyword': 1,
                  'confusable_families_per_keyword': 1,
                  'random_negative_families': 1,
                  'background_seconds_per_profile': 0.1,
                  'variants_per_family': 1,
              }
              cfg['domains']['scenes_per_example'][split]=1
          cfg['calibration']={'thresholds':[0.55], 'coordinate_rounds':1}
          cfg['train']['batch_size']=8
          cfg['domain_iteration']['hard_negative_replay']=[{
              'tokens':['ni3','hao3','xiao3'], 'examples':1, 'focus_keyword_id':1
          }]
          cfg['domain_iteration']['positive_stress_replay']=[]
          cfg['data_augmentation_v3']['failure_replay_examples_per_failure']=1
          cfg['data_augmentation_v3']['failure_replay_max_unique_failures']=4
          cfg['data_augmentation_v3']['failure_replay_max_per_keyword']=2
          cfg['robustness_gates']['min_expected_wakes']=1
          cfg['robustness_gates']['min_negative_recordings']=1
          (root/'config.json').write_text(json.dumps(cfg, indent=2, sort_keys=True)+'\n')

          policy=json.load(open('configs/training/xiaowo.rnn-development-loop.json', encoding='utf-8'))
          policy['max_rounds']=2
          policy['min_rounds']=2
          policy['patience']=2
          policy['stable_strict_pass_rounds']=2
          policy['epochs_per_round']=1
          policy['feature_cache_max_items']=512
          (root/'policy.json').write_text(json.dumps(policy, indent=2, sort_keys=True)+'\n')
          PY
      - name: Run uninterrupted two-round reference
        id: continuous
        shell: bash
        run: |
          set +e
          .venv/bin/python training/run_rnn_development.py \
            --config build/resume-proof-config/config.json \
            --policy build/resume-proof-config/policy.json \
            --runner build/kws_wav \
            --work-dir build/resume-proof-continuous
          code=$?
          set -e
          test "$code" = 0 -o "$code" = 1
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Run first one-round segment
        shell: bash
        run: |
          set +e
          .venv/bin/python training/run_rnn_development.py \
            --config build/resume-proof-config/config.json \
            --policy build/resume-proof-config/policy.json \
            --runner build/kws_wav \
            --work-dir build/resume-proof-segment-1 \
            --round-budget 1
          code=$?
          set -e
          test "$code" = 3
          test -s build/resume-proof-segment-1/development-resume-state.json
          test ! -e build/resume-proof-segment-1/development-loop-manifest.json
      - name: Move resume bundle to a new work root
        run: |
          cp -a build/resume-proof-segment-1 build/resume-proof-segment-2
          rm -rf build/resume-proof-segment-1
      - name: Resume second round from immutable state
        id: resumed
        shell: bash
        run: |
          set +e
          .venv/bin/python training/run_rnn_development.py \
            --config build/resume-proof-config/config.json \
            --policy build/resume-proof-config/policy.json \
            --runner build/kws_wav \
            --work-dir build/resume-proof-segment-2 \
            --resume-state build/resume-proof-segment-2/development-resume-state.json \
            --round-budget 1
          code=$?
          set -e
          test "$code" = 0 -o "$code" = 1
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Prove continuous and resumed semantics match
        env:
          CONTINUOUS_CODE: ${{ steps.continuous.outputs.code }}
          RESUMED_CODE: ${{ steps.resumed.outputs.code }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          a=pathlib.Path('build/resume-proof-continuous')
          b=pathlib.Path('build/resume-proof-segment-2')
          ma=json.load(open(a/'development-loop-manifest.json'))
          mb=json.load(open(b/'development-loop-manifest.json'))
          assert os.environ['CONTINUOUS_CODE'] == os.environ['RESUMED_CODE']
          assert len(ma['records']) == len(mb['records']) == 2
          for ra, rb in zip(ma['records'], mb['records']):
              assert ra['round'] == rb['round']
              assert ra['score'] == rb['score']
              assert ra['calibration_gate'] == rb['calibration_gate']
              assert ra['test_gate'] == rb['test_gate']
              assert ra['false_rejects'] == rb['false_rejects']
              assert ra['false_accepts'] == rb['false_accepts']
              assert ra['training'] == rb['training']
              assert sha(pathlib.Path(ra['model'])) == sha(pathlib.Path(rb['model']))
          assert ma['selected_round'] == mb['selected_round']
          assert ma['selected_score'] == mb['selected_score']
          assert ma['next_controller'] == mb['next_controller']
          assert ma['final_curriculum'] == mb['final_curriculum']
          state=json.load(open(b/'development-resume-state.json'))
          assert state['complete'] is True
          assert state['next_round'] == 2
          print('round resume equivalence proof: PASS')
          PY
