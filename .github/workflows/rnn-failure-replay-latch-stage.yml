name: rnn-failure-replay-latch-stage

on:
  push:
    branches:
      - codex/rnn-failure-replay-latch-v1
    paths:
      - '.github/triggers/rnn-failure-replay-latch-stage'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/rnn-failure-replay-latch-v1
      - name: Patch RNN failure replay latch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          policy = Path('configs/training/xiaowo.rnn-development-loop.json')
          text = policy.read_text(encoding='utf-8')
          old = '  "failure_replay_repeat_max": 3,\n'
          new = '  "failure_replay_repeat_max": 3,\n  "failure_replay_latch_after_failure": true,\n'
          if old not in text:
              raise SystemExit('policy marker missing')
          policy.write_text(text.replace(old, new, 1), encoding='utf-8')

          iterator = Path('training/iterate_rnn_development.py')
          text = iterator.read_text(encoding='utf-8')
          old = '''    if not 1 <= int(policy.get("failure_replay_repeat_max", 0)) <= 8:\n        raise ValueError("failure_replay_repeat_max must be 1..8")\n'''
          new = old + '''    if policy.get("failure_replay_latch_after_failure") is not True:\n        raise ValueError("RNN development requires failure_replay_latch_after_failure=true")\n'''
          if old not in text:
              raise SystemExit('iterator policy marker missing')
          text = text.replace(old, new, 1)
          old = '''    failures = fr + fa\n    repeat = 0 if failures <= 0 else 1 if failures <= 4 else 2\n    if failures > 16:\n        repeat = int(policy["failure_replay_repeat_max"])\n'''
          new = '''    failures = fr + fa\n    previous_repeat = int(current.get("failure_replay_repeat", 0))\n    if failures <= 0:\n        repeat = previous_repeat if bool(policy["failure_replay_latch_after_failure"]) else 0\n    else:\n        repeat = 1 if failures <= 4 else 2\n        if failures > 16:\n            repeat = int(policy["failure_replay_repeat_max"])\n'''
          if old not in text:
              raise SystemExit('iterator controller marker missing')
          iterator.write_text(text.replace(old, new, 1), encoding='utf-8')

          contract = Path('tools/verify_rnn_parallel_contract.py')
          text = contract.read_text(encoding='utf-8')
          old = 'import json\nimport pathlib\n'
          new = 'import importlib.util\nimport json\nimport pathlib\n'
          if old not in text:
              raise SystemExit('contract import marker missing')
          text = text.replace(old, new, 1)
          old = '''    if rnn.get("loss_controller") != gru.get("loss_controller"):\n        raise ValueError("RNN/GRU loss-controller contract drifted")\n'''
          new = old + '''    if rnn.get("failure_replay_latch_after_failure") is not True:\n        raise ValueError("RNN failure replay latch policy is missing")\n\n    spec = importlib.util.spec_from_file_location(\n        "rnn_iterator_contract", ROOT / "training/iterate_rnn_development.py"\n    )\n    if spec is None or spec.loader is None:\n        raise ValueError("cannot load RNN iterator for controller contract")\n    iterator = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(iterator)\n    initial = iterator.controller_initial(rnn)\n    clean_initial = iterator.controller_next(rnn, initial, 0, 0)\n    after_failure = iterator.controller_next(rnn, initial, 1, 0)\n    clean_after_failure = iterator.controller_next(rnn, after_failure, 0, 0)\n    if int(clean_initial["failure_replay_repeat"]) != 0:\n        raise ValueError("RNN clean initial controller unexpectedly enables failure replay")\n    if int(after_failure["failure_replay_repeat"]) != 1:\n        raise ValueError("RNN controller did not enable replay after a development failure")\n    if int(clean_after_failure["failure_replay_repeat"]) != 1:\n        raise ValueError("RNN controller dropped replay before stability confirmation")\n'''
          if old not in text:
              raise SystemExit('contract controller marker missing')
          contract.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tools/verify_rnn_parallel_contract.py
          python3 -m py_compile training/iterate_rnn_development.py tools/verify_rnn_parallel_contract.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add configs/training/xiaowo.rnn-development-loop.json training/iterate_rnn_development.py tools/verify_rnn_parallel_contract.py
          git commit -m 'fix(training): latch RNN failure replay through stability'
          git push origin HEAD:codex/rnn-failure-replay-latch-v1
