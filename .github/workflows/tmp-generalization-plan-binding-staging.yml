name: tmp-generalization-plan-binding-staging

on:
  push:
    branches: ["codex/generalization-plan-binding-v1"]
    paths:
      - ".github/workflows/tmp-generalization-plan-binding-staging.yml"
      - "tmp/generalization-plan-binding.trigger"
      - "tmp/patch_generalization_plan_binding.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/generalization-plan-binding-v1
      - name: Patch product tools
        run: python3 tmp/patch_generalization_plan_binding.py
      - name: Python syntax
        run: python3 -m py_compile tools/build_development_generalization_seed.py tools/development_generalization.py tools/development_generalization_plan.py
      - name: Diff check
        run: git diff --check
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_development_generalization_seed.py tools/development_generalization.py
          git commit -m "eval: bind generalization seeds to predeclared plans"
          git push origin HEAD:codex/generalization-plan-binding-v1
