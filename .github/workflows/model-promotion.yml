name: model-promotion

on:
  workflow_dispatch:
    inputs:
      training_run_id:
        description: Successful model-training workflow run ID to promote
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-hex head SHA that the training run must have used
        required: true
        type: string
      release_tag:
        description: Optional model release tag; defaults to model-<12-char SHA>
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read
  pull-requests: write
  id-token: write
  attestations: write

concurrency:
  group: model-promotion-${{ inputs.expected_head_sha }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TRAINING_RUN_ID: ${{ inputs.training_run_id }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify requested training run
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRAINING_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TRAINING_RUN_ID}" > run.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path('run.json').read_text(encoding='utf-8'))
          expected = os.environ['EXPECTED_HEAD_SHA']
          if run.get('name') != 'model-training':
              raise SystemExit(f"unexpected workflow name: {run.get('name')!r}")
          if run.get('status') != 'completed' or run.get('conclusion') != 'success':
              raise SystemExit(
                  f"training run is not completed/success: "
                  f"status={run.get('status')} conclusion={run.get('conclusion')}"
              )
          if run.get('head_sha') != expected:
              raise SystemExit(
                  f"training run head mismatch: expected={expected} actual={run.get('head_sha')}"
              )
          print(
              f"verified model-training run id={run['id']} "
              f"event={run.get('event')} head={run['head_sha']}"
          )
          PY

      - name: Resolve exact trained-model artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TRAINING_RUN_ID}/artifacts?per_page=100" > artifacts.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          payload = json.loads(Path('artifacts.json').read_text(encoding='utf-8'))
          matches = [
              row for row in payload.get('artifacts', [])
              if row.get('name') == 'xiaowo-torch-domain-model' and not row.get('expired', False)
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one live xiaowo-torch-domain-model artifact, got {len(matches)}"
              )
          row = matches[0]
          print(f"artifact_id={row['id']}")
          print(f"artifact_digest={row.get('digest') or ''}")
          print(f"artifact_size={row.get('size_in_bytes') or 0}")
          PY

      - name: Download exact trained-model artifact
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output trained-model.zip
          test -s trained-model.zip
          mkdir artifact
          unzip -q trained-model.zip -d artifact

      - name: Freeze and verify deployable model evidence
        id: assets
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
          ARTIFACT_SIZE: ${{ steps.artifact.outputs.artifact_size }}
        run: |
          set -euo pipefail
          python3 tools/verify_model_promotion_bundle.py \
            --artifact-root artifact \
            --dist dist \
            --repository "$GITHUB_REPOSITORY" \
            --training-run-id "$TRAINING_RUN_ID" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --artifact-size "$ARTIFACT_SIZE"
          (cd dist && sha256sum -c MODEL_SHA256SUMS)
          model_sha="$(sha256sum dist/xiaowo-model.kwm | awk '{print $1}')"
          echo "model_sha256=$model_sha" >> "$GITHUB_OUTPUT"

      - name: Attest promoted model assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/MODEL_SHA256SUMS

      - name: Resolve immutable model release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_RELEASE_TAG" ]]; then
            tag="$REQUESTED_RELEASE_TAG"
          else
            tag="model-${EXPECTED_HEAD_SHA:0:12}"
          fi
          [[ "$tag" =~ ^model-[A-Za-z0-9._-]+$ ]]
          exists=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exists=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Publish trained model release
        if: steps.release.outputs.exists != 'true'
        shell: bash
        env:
          MODEL_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          MODEL_SHA256: ${{ steps.assets.outputs.model_sha256 }}
        run: |
          set -euo pipefail
          gh release create "$MODEL_RELEASE_TAG" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$EXPECTED_HEAD_SHA" \
            --title "kws-pipeline trained model ${EXPECTED_HEAD_SHA:0:12}" \
            --notes "Promoted from successful model-training run ${TRAINING_RUN_ID}. Deployable model SHA256: ${MODEL_SHA256}."

      - name: Verify immutable model release
        shell: bash
        env:
          MODEL_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${MODEL_RELEASE_TAG}" > model-release.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          release = json.loads(pathlib.Path("model-release.json").read_text(encoding="utf-8"))
          tag = os.environ["MODEL_RELEASE_TAG"]
          target = os.environ["EXPECTED_HEAD_SHA"]
          if release.get("tag_name") != tag:
              raise SystemExit(f"release tag mismatch: {release.get('tag_name')!r} != {tag!r}")
          if release.get("draft") is not False or release.get("prerelease") is not False:
              raise SystemExit("model release must be published and non-prerelease")
          if release.get("immutable") is not True:
              raise SystemExit("model release must be immutable")
          if release.get("target_commitish") != target:
              raise SystemExit(
                  f"model release target mismatch: {release.get('target_commitish')!r} != {target!r}"
              )

          expected = {}
          for path in sorted(pathlib.Path("dist").iterdir()):
              if path.is_file():
                  expected[path.name] = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
          if not expected:
              raise SystemExit("dist contains no release assets")

          assets = release.get("assets")
          if not isinstance(assets, list):
              raise SystemExit("release assets are missing")
          actual = {}
          for row in assets:
              name = str(row.get("name") or "")
              digest = str(row.get("digest") or "")
              if not name or name in actual:
                  raise SystemExit(f"invalid or duplicate release asset: {name!r}")
              actual[name] = digest
          if set(actual) != set(expected):
              raise SystemExit(
                  f"release asset set mismatch: expected={sorted(expected)} actual={sorted(actual)}"
              )
          bad = [name for name, digest in expected.items() if actual.get(name) != digest]
          if bad:
              raise SystemExit(f"release asset digest mismatch: {bad}")
          print(f"immutable model release verified: {tag}")
          PY

      - name: Mirror promoted model into Git registry
        shell: bash
        env:
          MODEL_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          python3 tools/materialize_model_registry.py \
            --assets-dir dist \
            --output-root models/registry \
            --release-json model-release.json
          python3 tools/verify_model_registry.py \
            --registry-dir "models/registry/${MODEL_RELEASE_TAG}"

          registry_branch="model-registry/${MODEL_RELEASE_TAG}"
          expected_dir="$RUNNER_TEMP/expected-model-registry"
          rm -rf "$expected_dir"
          cp -a "models/registry/${MODEL_RELEASE_TAG}" "$expected_dir"

          cat > /tmp/model-registry-pr.md <<EOF
          Byte-for-byte Git mirror of immutable model release `${MODEL_RELEASE_TAG}`.

          Generated by `model-promotion` from training run `${TRAINING_RUN_ID}`
          at source `${EXPECTED_HEAD_SHA}`.

          Shipping approval remains governed independently by
          `configs/shipping.xiaowo.json` and protected qualification evidence.
          EOF

          ensure_registry_pr() {
            local pr_url
            pr_url="$(gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${registry_branch}" \
              --state open \
              --json url \
              --jq '.[0].url // empty')"
            if [[ -z "$pr_url" ]]; then
              pr_url="$(gh pr create \
                --repo "${GITHUB_REPOSITORY}" \
                --base main \
                --head "${registry_branch}" \
                --title "models: register ${MODEL_RELEASE_TAG}" \
                --body-file /tmp/model-registry-pr.md)"
            fi
            test -n "$pr_url"
            echo "model registry PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          }

          gh auth setup-git
          git fetch --no-tags origin main

          main_snapshot="$RUNNER_TEMP/main-model-registry"
          if git ls-tree -d --name-only origin/main -- "models/registry/${MODEL_RELEASE_TAG}" \
              | grep -Fxq "models/registry/${MODEL_RELEASE_TAG}"; then
            rm -rf "$main_snapshot"
            mkdir -p "$main_snapshot"
            git archive origin/main "models/registry/${MODEL_RELEASE_TAG}" | tar -x -C "$main_snapshot"
            diff -qr "$expected_dir" "$main_snapshot/models/registry/${MODEL_RELEASE_TAG}"
            echo "model registry already present on main: ${MODEL_RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "${registry_branch}" >/dev/null 2>&1; then
            git fetch --no-tags origin \
              "refs/heads/${registry_branch}:refs/remotes/origin/${registry_branch}"
            unexpected="$(git diff --name-only "origin/main...origin/${registry_branch}" -- \
              | grep -v "^models/registry/${MODEL_RELEASE_TAG}/" || true)"
            test -z "$unexpected" || {
              echo "existing registry branch contains unrelated changes:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 2
            }

            branch_snapshot="$RUNNER_TEMP/branch-model-registry"
            rm -rf "$branch_snapshot"
            mkdir -p "$branch_snapshot"
            git archive "origin/${registry_branch}" "models/registry/${MODEL_RELEASE_TAG}" \
              | tar -x -C "$branch_snapshot"
            diff -qr "$expected_dir" "$branch_snapshot/models/registry/${MODEL_RELEASE_TAG}"
            ensure_registry_pr
            exit 0
          fi

          git switch --create "${registry_branch}" origin/main
          mkdir -p models/registry
          rm -rf "models/registry/${MODEL_RELEASE_TAG}"
          cp -a "$expected_dir" "models/registry/${MODEL_RELEASE_TAG}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "models/registry/${MODEL_RELEASE_TAG}"
          git commit -m "models: mirror promoted ${MODEL_RELEASE_TAG} into Git registry"
          git push origin "${registry_branch}"
          ensure_registry_pr
