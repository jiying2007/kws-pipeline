name: one-shot-branch-cleanup

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - gru-development-once-v5
      - gru-multiseed-development-once-v1
      - rnn-development-once-v1
      - development-source-binding-proof
    types:
      - completed
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: one-shot-branch-cleanup
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete only successful terminal one-shot branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          remote="https://github.com/${repo}.git"
          gh auth setup-git >/dev/null

          is_candidate() {
            case "$1" in
              codex/gru-development-once-*|tmp/gru-development-once-*) return 0 ;;
              codex/gru-multiseed-development-once-*|tmp/gru-multiseed-development-once-*) return 0 ;;
              codex/rnn-development-once-*|tmp/rnn-development-once-*) return 0 ;;
              codex/development-source-binding-proof*|tmp/development-source-binding-proof*) return 0 ;;
              *) return 1 ;;
            esac
          }

          expected_workflow() {
            local branch="$1"
            local base="${branch##*/}"
            case "$base" in
              development-source-binding-proof*) printf '%s\n' 'development-source-binding-proof' ;;
              *) printf '%s\n' "$base" ;;
            esac
          }

          path_allowed() {
            case "$1" in
              .github/workflows/*development-once*.yml) return 0 ;;
              .github/workflows/development-source-binding-proof.yml) return 0 ;;
              .github/triggers/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          branches_json="$(gh api --paginate --slurp "repos/${repo}/branches?per_page=100")"
          mapfile -t candidates < <(
            jq -r '.[][] | select(.protected == false) | [.name, .commit.sha] | @tsv' <<<"${branches_json}" |
            while IFS=$'\t' read -r branch sha; do
              if is_candidate "$branch"; then
                printf '%s\t%s\n' "$branch" "$sha"
              fi
            done
          )

          graph="${RUNNER_TEMP}/one-shot-cleanup-graph"
          git init -q "$graph"
          git -C "$graph" remote add origin "$remote"
          git -C "$graph" fetch --quiet --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          default_branch="$(gh api "repos/${repo}" --jq '.default_branch')"
          default_ref="refs/remotes/origin/${default_branch}"
          git -C "$graph" show-ref --verify --quiet "$default_ref"

          deleted=0
          skipped=0
          for row in "${candidates[@]}"; do
            IFS=$'\t' read -r branch expected_sha <<<"$row"
            expected="$(expected_workflow "$branch")"

            open_prs="$(gh api -X GET "repos/${repo}/pulls" \
              -f state=open -f head="${owner}:${branch}" -f per_page=100 --jq 'length')"
            if (( open_prs != 0 )); then
              echo "skip open PR: ${branch}"
              skipped=$((skipped + 1))
              continue
            fi

            runs="$(gh api -X GET "repos/${repo}/actions/runs" \
              -f branch="$branch" -f per_page=100)"
            run_count="$(jq '.workflow_runs | length' <<<"$runs")"
            active="$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$runs")"
            primary_success="$(jq --arg name "$expected" '[.workflow_runs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length' <<<"$runs")"
            if (( run_count == 0 || active != 0 || primary_success == 0 )); then
              echo "skip nonterminal/non-success one-shot: ${branch} runs=${run_count} active=${active} primary_success=${primary_success}"
              skipped=$((skipped + 1))
              continue
            fi

            branch_ref="refs/remotes/origin/${branch}"
            if ! git -C "$graph" show-ref --verify --quiet "$branch_ref"; then
              echo "skip missing fetched branch: ${branch}"
              skipped=$((skipped + 1))
              continue
            fi
            merge_base="$(git -C "$graph" merge-base "$default_ref" "$branch_ref")"
            mapfile -t changed < <(git -C "$graph" diff --name-only "$merge_base" "$branch_ref")
            if ((${#changed[@]} == 0)); then
              echo "skip empty one-shot diff: ${branch}"
              skipped=$((skipped + 1))
              continue
            fi
            unsafe=0
            for path in "${changed[@]}"; do
              if path_allowed "$path"; then
                continue
              fi
              branch_blob="$(git -C "$graph" rev-parse "${branch_ref}:${path}" 2>/dev/null || true)"
              default_blob="$(git -C "$graph" rev-parse "${default_ref}:${path}" 2>/dev/null || true)"
              if [[ -n "$branch_blob" && "$branch_blob" == "$default_blob" ]]; then
                echo "allow already-integrated identical blob on ${branch}: ${path}"
                continue
              fi
              echo "skip unsafe path on ${branch}: ${path}"
              unsafe=1
            done
            if (( unsafe != 0 )); then
              skipped=$((skipped + 1))
              continue
            fi

            # Re-read every deletion condition immediately before deleting the ref.
            latest_sha="$(git ls-remote --heads "$remote" "refs/heads/${branch}" | awk '{print $1}')"
            latest_open_prs="$(gh api -X GET "repos/${repo}/pulls" \
              -f state=open -f head="${owner}:${branch}" -f per_page=100 --jq 'length')"
            latest_runs="$(gh api -X GET "repos/${repo}/actions/runs" \
              -f branch="$branch" -f per_page=100)"
            latest_active="$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$latest_runs")"
            latest_primary_success="$(jq --arg name "$expected" '[.workflow_runs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length' <<<"$latest_runs")"
            if [[ "$latest_sha" != "$expected_sha" ]] || (( latest_open_prs != 0 || latest_active != 0 || latest_primary_success == 0 )); then
              echo "skip race/state change: ${branch}"
              skipped=$((skipped + 1))
              continue
            fi

            git -C "$graph" push --quiet origin ":refs/heads/${branch}"
            echo "deleted terminal one-shot branch: ${branch}"
            deleted=$((deleted + 1))
          done

          echo "summary: deleted=${deleted} skipped=${skipped}"
