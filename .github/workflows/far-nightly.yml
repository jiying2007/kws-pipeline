name: far-nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "47 18 * * *"

permissions:
  contents: read

concurrency:
  group: far-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen-model-far:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MODEL_RELEASE_TAG: model-749187ec1d66
      EXPECTED_TRAINED_HEAD_SHA: 749187ec1d6662658f06aa9c76d47fde835968db
      EXPECTED_TRAINING_RUN_ID: "34134789576"
      EXPECTED_MODEL_SHA256: ece44b47bd378c20dd254220b368e41143ec678cbab9dc56901513026ed8d402
      EXPECTED_KEYWORD_PACK_SHA256: 370ee3eeba27b1d62b38f32f53d8302b47c2b762392101e6ca7eb0ccf8dfb723
      NIGHTLY_CONFIG: configs/nightly.xiaowo-frozen-model.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and verify real C runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel --target \
            kws_raw_stream kws_decoder_tests kws_decoder_retention_tests
          ctest --test-dir build --output-on-failure -R '^kws_decoder_(tests|retention_tests)$'

      - name: Download exact immutable promoted model
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$MODEL_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease \
            > build/model-release.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path('build/model-release.json').read_text(encoding='utf-8'))
          if release.get('tagName') != os.environ['MODEL_RELEASE_TAG']:
              raise SystemExit('model release tag mismatch')
          if release.get('targetCommitish') != os.environ['EXPECTED_TRAINED_HEAD_SHA']:
              raise SystemExit('model release target is not the frozen trained HEAD')
          if bool(release.get('isDraft')) or bool(release.get('isPrerelease')):
              raise SystemExit('nightly model release must be final, not draft/prerelease')
          PY
          mkdir -p build/frozen-model
          gh release download "$MODEL_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir build/frozen-model
          test -s build/frozen-model/MODEL_SHA256SUMS
          (
            cd build/frozen-model
            sha256sum -c MODEL_SHA256SUMS
          )

      - name: Verify frozen model provenance and strict acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('build/frozen-model')

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          required = (
              'xiaowo-model.kwm',
              'xiaowo-keywords.kwk',
              'xiaowo-keywords.tsv',
              'model-promotion-manifest.json',
              'qualification-summary.json',
              'qualification-cohort.json',
              'robustness-summary.json',
              'continuous-far-summary.json',
          )
          for name in required:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing frozen release asset: {name}')

          model_sha = sha256(root / 'xiaowo-model.kwm')
          keyword_sha = sha256(root / 'xiaowo-keywords.kwk')
          if model_sha != os.environ['EXPECTED_MODEL_SHA256']:
              raise SystemExit('released model SHA drifted')
          if keyword_sha != os.environ['EXPECTED_KEYWORD_PACK_SHA256']:
              raise SystemExit('released keyword-pack SHA drifted')

          manifest = json.loads((root / 'model-promotion-manifest.json').read_text(encoding='utf-8'))
          source = manifest.get('source', {})
          acceptance = manifest.get('acceptance', {})
          if int(manifest.get('schema_version', -1)) != 2:
              raise SystemExit('unexpected model-promotion manifest schema')
          if int(source.get('training_run_id', -1)) != int(os.environ['EXPECTED_TRAINING_RUN_ID']):
              raise SystemExit('promotion manifest training run drifted')
          if source.get('head_sha') != os.environ['EXPECTED_TRAINED_HEAD_SHA']:
              raise SystemExit('promotion manifest trained HEAD drifted')
          if int(source.get('qualification_seed', -1)) != 271838:
              raise SystemExit('promotion manifest qualification seed drifted')
          if int(acceptance.get('qualification_expected', -1)) != 256:
              raise SystemExit('promotion manifest expected-wake count drifted')
          if int(acceptance.get('qualification_matched', -1)) != 256:
              raise SystemExit('promotion manifest matched-wake count drifted')
          if int(acceptance.get('qualification_false_rejects', -1)) != 0:
              raise SystemExit('promotion manifest contains false rejects')
          if int(acceptance.get('qualification_false_accepts', -1)) != 0:
              raise SystemExit('promotion manifest contains false accepts')
          if not bool(acceptance.get('robustness_qualified')):
              raise SystemExit('promotion manifest robustness is not qualified')
          if float(acceptance.get('continuous_far_per_hour', -1.0)) != 0.0:
              raise SystemExit('promotion manifest continuous FAR is not zero')
          if not bool(acceptance.get('continuous_far_full_negative_manifest_coverage')):
              raise SystemExit('promotion manifest lacks continuous FAR coverage')

          qualification = json.loads((root / 'qualification-summary.json').read_text(encoding='utf-8'))
          if (
              int(qualification.get('expected', -1)) != 256
              or int(qualification.get('matched', -1)) != 256
              or int(qualification.get('false_rejects', -1)) != 0
              or int(qualification.get('false_accepts', -1)) != 0
          ):
              raise SystemExit('released qualification is not strict 256/256 zero-error')

          cohort = json.loads((root / 'qualification-cohort.json').read_text(encoding='utf-8'))
          if int(cohort.get('qualification_seed', -1)) != 271838:
              raise SystemExit('released qualification cohort seed drifted')
          if not bool(cohort.get('generated_after_training')) or not bool(cohort.get('seed_disjoint')):
              raise SystemExit('released qualification cohort is not untouched/disjoint')

          robustness = json.loads((root / 'robustness-summary.json').read_text(encoding='utf-8'))
          if not bool(robustness.get('qualified')) or robustness.get('failures') != []:
              raise SystemExit('released robustness is not strict-pass')

          far = json.loads((root / 'continuous-far-summary.json').read_text(encoding='utf-8'))
          if (
              not bool(far.get('qualified'))
              or int(far.get('false_accepts', -1)) != 0
              or float(far.get('far_per_hour', -1.0)) != 0.0
              or not bool(far.get('full_negative_manifest_coverage'))
              or far.get('model_sha256') != model_sha
          ):
              raise SystemExit('released continuous-FAR evidence is not strict-pass')

          print(json.dumps({
              'release_tag': os.environ['MODEL_RELEASE_TAG'],
              'trained_head_sha': os.environ['EXPECTED_TRAINED_HEAD_SHA'],
              'model_sha256': model_sha,
              'keyword_pack_sha256': keyword_sha,
              'qualification_seed': 271838,
              'qualification': '256/256, 0 FR, 0 FA',
              'robustness': 'qualified',
              'continuous_far_per_hour': 0.0,
          }, indent=2, sort_keys=True, ensure_ascii=False))
          PY
          python3 tools/validate_shipping_keywords.py build/frozen-model/xiaowo-keywords.tsv

      - name: Render isolated nightly negative regression corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path(os.environ['NIGHTLY_CONFIG']).read_text(encoding='utf-8'))
          forbidden = {
              'qualification_holdout_seed',
              'retired_qualification_holdout_seeds',
              'far_holdout_round_namespace',
              'retired_far_holdout_round_namespaces',
          }
          leaked = sorted(forbidden.intersection(config))
          if leaked:
              raise SystemExit(f'nightly regression config leaked formal namespaces: {leaked}')
          if config.get('regression_namespace') != 'nightly-frozen-model-v1':
              raise SystemExit('unexpected nightly regression namespace')
          PY
          python3 training/render_domains.py \
            --config "$NIGHTLY_CONFIG" \
            --output build/nightly-domain \
            > build/nightly-render-summary.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          index = Path('build/nightly-domain/domain-index.jsonl')
          rows = [json.loads(raw) for raw in index.read_text(encoding='utf-8').splitlines() if raw.strip()]
          negative = [row for row in rows if row.get('kind') != 'positive']
          if len(negative) < 200:
              raise SystemExit(f'nightly regression corpus unexpectedly small: {len(negative)}')
          manifest = Path('build/nightly-negative.tsv')
          manifest.write_text(
              ''.join(f"{row['path']}\n" for row in negative),
              encoding='utf-8',
          )
          evidence = {
              'schema_version': 1,
              'evidence_class': 'synthetic-nightly-regression',
              'regression_namespace': 'nightly-frozen-model-v1',
              'formal_qualification_seed_consumed': False,
              'training_performed': False,
              'negative_clip_count': len(negative),
          }
          Path('build/nightly-regression-contract.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Stream four independent negative shards against the frozen released model
        shell: bash
        run: |
          set -euo pipefail
          replay=build/nightly-negative.tsv
          for seed in 1103 2207 3301 4409; do
            python3 eval/long_far_stream.py \
              --runner build/kws_raw_stream \
              --model build/frozen-model/xiaowo-model.kwm \
              --keywords build/frozen-model/xiaowo-keywords.kwk \
              --negative-manifest "$replay" \
              --hard-negative-rate-per-minute 2.0 \
              --min-hard-negative-injections-per-clip 1 \
              --coverage-hard-negative-gain 0.90 \
              --seconds 7200 \
              --seed "$seed" \
              --output-dir "build/far-run-$seed" \
              --max-far-per-hour 1000000
          done

      - name: Aggregate eight hours for the frozen released model only
        run: >-
          python3 eval/aggregate_far.py
          --summary build/far-run-1103/summary.json
          --summary build/far-run-2207/summary.json
          --summary build/far-run-3301/summary.json
          --summary build/far-run-4409/summary.json
          --output build/far-aggregate.json
          --confidence 0.95
          --max-far-per-hour 0
          --max-upper-bound-per-hour 0.40
          --min-hard-negative-injections 800
          --min-hard-negative-audio-seconds 800

      - name: Retain frozen-model nightly FAR evidence and captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: far-frozen-model-regression
          path: |
            build/model-release.json
            build/frozen-model/model-promotion-manifest.json
            build/frozen-model/qualification-summary.json
            build/frozen-model/qualification-cohort.json
            build/frozen-model/robustness-summary.json
            build/frozen-model/continuous-far-summary.json
            build/nightly-domain/domain-summary.json
            build/nightly-regression-contract.json
            build/nightly-negative.tsv
            build/far-run-*/
            build/far-aggregate.json
          if-no-files-found: warn
          retention-days: 30
