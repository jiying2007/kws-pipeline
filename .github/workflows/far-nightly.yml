name: far-nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "47 18 * * *"

permissions:
  contents: read

concurrency:
  group: far-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  streaming-far:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify real C runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel --target \
            kws_wav kws_raw_stream kws_decoder_tests kws_decoder_retention_tests
          ctest --test-dir build --output-on-failure -R '^kws_decoder_(tests|retention_tests)$'
      - name: Install pinned CPU training runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input \
            torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python - <<'PY'
          import numpy
          import torch
          assert numpy.__version__ == '2.3.2'
          assert str(torch.__version__).split('+', 1)[0] == '2.13.0'
          PY
      - name: Train the canonical domain model
        id: train
        shell: bash
        run: |
          set +e
          .venv/bin/python training/iterate_domain.py \
            --config configs/training/xiaowo.torch-domain.json \
            --runner build/kws_wav \
            --work-dir build/far-training
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Finalize latest strict gate-passing canonical candidate
        env:
          ITERATION_EXIT_CODE: ${{ steps.train.outputs.exit_code }}
        run: |
          .venv/bin/python training/finalize_domain_candidate.py \
            --config configs/training/xiaowo.torch-domain.json \
            --runner build/kws_wav \
            --work-dir build/far-training \
            --iteration-exit-code "$ITERATION_EXIT_CODE"
      - name: Verify frozen model and held-out hard-negative evidence
        run: |
          .venv/bin/python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('build/far-training')
          manifest = json.loads((root / 'domain-loop-manifest.json').read_text(encoding='utf-8'))
          summary = json.loads((root / 'training-run-summary.json').read_text(encoding='utf-8'))
          if not summary.get('qualified') or not manifest.get('qualified'):
              raise SystemExit('canonical finalized domain model is not qualified')
          selection = summary.get('candidate_selection', {})
          selected_round = int(selection.get('selected_round', -1))
          training_replay_round = int(selection.get('replay_round', -2))
          if selected_round < 0 or selected_round != training_replay_round:
              raise SystemExit(
                  f'finalized model/training-replay mismatch: model={selected_round} '
                  f'replay={training_replay_round}'
              )
          if not bool(selection.get('model_replay_generation_match')):
              raise SystemExit('finalizer did not attest model/training-replay generation match')
          if bool(selection.get('qualification_used_for_selection', True)):
              raise SystemExit('qualification leaked into candidate selection')
          if bool(selection.get('far_holdout_used_for_training', True)):
              raise SystemExit('FAR holdout leaked into model training')
          if bool(selection.get('far_holdout_used_for_selection', True)):
              raise SystemExit('FAR holdout leaked into candidate selection')
          if int(selection.get('overlapping_training_holdout_wav_sha256', -1)) != 0:
              raise SystemExit('FAR holdout overlaps training hard-negative WAV content')
          if int(selection.get('training_replay_clip_count', 0)) <= 0:
              raise SystemExit('training hard-negative replay has no clips')
          if int(selection.get('far_holdout_clip_count', 0)) != int(
              selection.get('training_replay_clip_count', -1)
          ):
              raise SystemExit('FAR holdout/training replay clip counts differ')

          model = root / 'best/model.kwm'
          keywords = root / 'best/keywords.kwk'
          training_replay = root / 'best/training-hard-negatives.tsv'
          far_holdout = root / 'best/hard-negatives.tsv'
          for path in (model, keywords, training_replay, far_holdout):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing frozen FAR input/evidence: {path}')

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          model_sha = sha256(model)
          keyword_sha = sha256(keywords)
          training_replay_sha = sha256(training_replay)
          far_holdout_sha = sha256(far_holdout)
          if model_sha != manifest['best_model_sha256']:
              raise SystemExit('best model hash does not match finalized manifest')
          if keyword_sha != manifest['best_pack_sha256']:
              raise SystemExit('best keyword pack hash does not match finalized manifest')
          if training_replay_sha != manifest['best_training_hard_negative_manifest_sha256']:
              raise SystemExit('training replay hash does not match finalized manifest')
          if training_replay_sha != selection['replay_sha256']:
              raise SystemExit('training replay hash does not match candidate record evidence')
          if far_holdout_sha != manifest['best_hard_negative_manifest_sha256']:
              raise SystemExit('FAR holdout hash does not match finalized manifest')
          if far_holdout_sha != selection['far_holdout_sha256']:
              raise SystemExit('FAR holdout hash does not match candidate-selection evidence')
          if far_holdout_sha == training_replay_sha:
              raise SystemExit('FAR holdout manifest equals training replay manifest')
          print(json.dumps({
              'best_round': manifest['best_round'],
              'best_frontend': manifest['best_frontend'],
              'model_sha256': model_sha,
              'keyword_pack_sha256': keyword_sha,
              'training_replay_source': selection['replay_source'],
              'training_replay_sha256': training_replay_sha,
              'far_holdout_source': selection['far_holdout_source'],
              'far_holdout_sha256': far_holdout_sha,
              'far_holdout_generation_index': selection['far_holdout_generation_index'],
              'overlapping_training_holdout_wav_sha256': 0,
          }, indent=2, sort_keys=True))
          PY
      - name: Stream four independent negative shards against the frozen canonical model
        shell: bash
        run: |
          set -euo pipefail
          replay=build/far-training/best/hard-negatives.tsv
          for seed in 1103 2207 3301 4409; do
            .venv/bin/python eval/long_far_stream.py \
              --runner build/kws_raw_stream \
              --model build/far-training/best/model.kwm \
              --keywords build/far-training/best/keywords.kwk \
              --negative-manifest "$replay" \
              --hard-negative-rate-per-minute 2.0 \
              --seconds 7200 \
              --seed "$seed" \
              --output-dir "build/far-run-$seed" \
              --max-far-per-hour 1000000
          done
      - name: Aggregate eight hours for the frozen model only
        run: >-
          .venv/bin/python eval/aggregate_far.py
          --summary build/far-run-1103/summary.json
          --summary build/far-run-2207/summary.json
          --summary build/far-run-3301/summary.json
          --summary build/far-run-4409/summary.json
          --output build/far-aggregate.json
          --confidence 0.95
          --max-far-per-hour 0
          --max-upper-bound-per-hour 0.40
          --min-hard-negative-injections 800
          --min-hard-negative-audio-seconds 800
      - name: Retain canonical FAR evidence and captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: far-canonical
          path: |
            build/far-training/best/
            build/far-training/domain-loop-manifest.json
            build/far-training/training-run-summary.json
            build/far-training/hard-negative-replay/
            build/far-training/hard-negative-holdout/
            build/far-run-*/
            build/far-aggregate.json
          if-no-files-found: warn
          retention-days: 30