name: kws-v2-research-reset-contract

on:
  push:
    branches: [main, "research/**", "codex/**"]
    paths:
      - "configs/training/kws-v2-research-reset-v1.json"
      - "configs/training/kws-v2-research-negative-utterances-v1.json"
      - "configs/training/xiaowo.gru-development-stage-a-v1.json"
      - "configs/training/xiaowo.rnn-development-stage-a-v1.json"
      - "training/train_ctc.py"
      - "training/train_gru_ctc.py"
      - "training/development_loss_controller.py"
      - "training/development_resume.py"
      - "training/iterate_gru_development.py"
      - "training/iterate_rnn_development.py"
      - "training/research_keyword_classifier.py"
      - "training/run_kws_research_baseline.py"
      - "eval/build_research_negative_exposure.py"
      - "tools/build_kws_v2_research_negative_requests.py"
      - "tools/materialize_kws_v2_research_negative_sidecar.py"
      - "tools/run_speech_like_corpus_generation.py"
      - "tests/test_development_loss_controller.py"
      - "tests/test_research_negative_sidecar.py"
      - ".github/workflows/kws-v2-research-reset.yml"
      - ".github/workflows/kws-v2-research-negative-sidecar.yml"
      - ".github/workflows/kws-v2-research-reset-contract.yml"
      - "docs/KWS_RESEARCH_RESET.md"
  pull_request:
    paths:
      - "configs/training/kws-v2-research-reset-v1.json"
      - "configs/training/kws-v2-research-negative-utterances-v1.json"
      - "configs/training/xiaowo.gru-development-stage-a-v1.json"
      - "configs/training/xiaowo.rnn-development-stage-a-v1.json"
      - "training/train_ctc.py"
      - "training/train_gru_ctc.py"
      - "training/development_loss_controller.py"
      - "training/development_resume.py"
      - "training/iterate_gru_development.py"
      - "training/iterate_rnn_development.py"
      - "training/research_keyword_classifier.py"
      - "training/run_kws_research_baseline.py"
      - "eval/build_research_negative_exposure.py"
      - "tools/build_kws_v2_research_negative_requests.py"
      - "tools/materialize_kws_v2_research_negative_sidecar.py"
      - "tools/run_speech_like_corpus_generation.py"
      - "tests/test_development_loss_controller.py"
      - "tests/test_research_negative_sidecar.py"
      - ".github/workflows/kws-v2-research-reset.yml"
      - ".github/workflows/kws-v2-research-negative-sidecar.yml"
      - ".github/workflows/kws-v2-research-reset-contract.yml"
      - "docs/KWS_RESEARCH_RESET.md"
permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify research reset policy is fail-open on model quality only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p=json.loads(pathlib.Path("configs/training/kws-v2-research-reset-v1.json").read_text())
          assert p["policy"]=="kws-v2-research-reset-v1"
          assert p["evidence_scope"]=="research-only"
          assert p["protected_evidence"] == {
              "fresh_used": False,
              "shadow_used": False,
              "formal_qualification_used": False,
              "qualification_split_consumed": False,
          }
          lane=p["research_lane"]
          for key in (
              "curriculum_feedback","failure_replay","fixed_hard_negative_replay",
              "adaptive_loss_controller","warm_start","hard_gate_required",
              "candidate_freeze_allowed","promotion_allowed",
          ):
              assert lane[key] is False, key
          ladder=p["loss_ladder"]
          assert list(ladder)==[
              "m0-ctc-only","m1-ctc-ordered","m2-plus-margin",
              "m3-plus-completion","m4-plus-release",
          ]
          assert ladder["m0-ctc-only"] == {
              "positive_example_weight_policy":"class-balance",
              "ordered_token_loss_weight":0.0,
              "keyword_sequence_margin_loss_weight":0.0,
              "prefix_completion_loss_weight":0.0,
              "recurrent_release_loss_weight":0.0,
          }
          balance=p["class_balance"]
          assert balance["policy"]=="binary-positive-negative-count-ratio-v1"
          assert balance["enabled"] is True
          assert balance["derived_before_training"] is True
          assert balance["same_weight_across_loss_ladder"] is True
          assert balance["classifier_balance_mode"]=="equal-class-sampler-v1"
          assert 0 < balance["minimum_positive_example_weight"] <= balance["maximum_positive_example_weight"]
          assert all(
              row["positive_example_weight_policy"]=="class-balance"
              for row in ladder.values()
          )
          previous=None
          keys=(
              "ordered_token_loss_weight",
              "keyword_sequence_margin_loss_weight",
              "prefix_completion_loss_weight",
              "recurrent_release_loss_weight",
          )
          for name,row in ladder.items():
              current=tuple(float(row[k]) for k in keys)
              if previous is not None:
                  changed=sum(a!=b for a,b in zip(previous,current))
                  assert changed==1, (name, previous, current)
              previous=current
          assert p["threshold_diagnostic"]["select_shipping_threshold"] is False
          assert p["threshold_diagnostic"]["feed_threshold_back_into_training"] is False
          assert p["negative_exposure"]["shipping_far_claim_allowed"] is False
          limits=p["data_limitations"]
          assert limits["source_sample_rate_hz"] == 8000
          assert limits["normalized_sample_rate_hz"] == 16000
          assert limits["source_bandwidth_limitation_retained"] is True
          assert limits["real_human_speech"] is False
          print("research reset policy contract: ok")
          PY

      - name: Verify training defaults remain backward-compatible
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          for path in ("training/train_ctc.py","training/train_gru_ctc.py"):
              text=pathlib.Path(path).read_text()
              assert 'default=ORDERED_TOKEN_LOSS_WEIGHT' in text
              assert 'default=KEYWORD_SEQUENCE_MARGIN_LOSS_WEIGHT' in text
              assert 'default=PREFIX_COMPLETION_LOSS_WEIGHT' in text
              assert 'default=RECURRENT_RELEASE_LOSS_WEIGHT' in text
              assert 'args.keyword_sequence_margin_loss_weight * margin_loss' in text
              assert 'args.prefix_completion_loss_weight * completion_loss' in text
              assert 'args.recurrent_release_loss_weight * release_loss' in text
          print("trainer auxiliary-loss compatibility: ok")
          PY

      - name: Verify research runner cannot consume qualification or adaptive feedback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          text=pathlib.Path("training/run_kws_research_baseline.py").read_text()
          assert "qualification.references" not in text
          assert "run_gru_development.py" not in text
          assert "run_rnn_development.py" not in text
          assert "render_development_failure_replay" not in text
          assert "update_curriculum" not in text
          assert '"promotion_allowed": False' in text
          assert '"qualification_split_consumed": False' in text
          print("research isolation contract: ok")
          PY

      - name: Normalized controller regression
        run: python3 tests/test_development_loss_controller.py

      - name: Research negative sidecar portability
        run: python3 tests/test_research_negative_sidecar.py

      - name: Research negative plan contract
        run: |
          python3 - <<'PY'
          import importlib.util, json, pathlib
          path=pathlib.Path("tools/build_kws_v2_research_negative_requests.py")
          spec=importlib.util.spec_from_file_location("negative_plan", path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          value=module.validate_plan(
              pathlib.Path("configs/training/kws-v2-research-negative-utterances-v1.json")
          )
          assert len(value["utterances"]) == 32
          assert value["qualification_split_allowed"] is False
          assert all(
              not slot.startswith("freeze-")
              for slots in value["split_voice_slots"].values()
              for slot in slots
          )
          print("research negative plan contract: ok")
          PY

      - name: Python syntax
        run: >-
          python3 -m py_compile
          training/train_ctc.py
          training/train_gru_ctc.py
          training/development_loss_controller.py
          training/development_resume.py
          training/iterate_gru_development.py
          training/iterate_rnn_development.py
          tests/test_development_loss_controller.py
          tests/test_research_negative_sidecar.py
          training/research_keyword_classifier.py
          training/run_kws_research_baseline.py
          eval/build_research_negative_exposure.py
          tools/build_kws_v2_research_negative_requests.py
          tools/materialize_kws_v2_research_negative_sidecar.py
          tools/run_speech_like_corpus_generation.py

      - name: Worktree remains clean
        run: git diff --exit-code -- .
