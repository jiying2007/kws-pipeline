name: gru-frozen-candidate-qualification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/gru-development-curriculum
      - codex/gru-two-layer-*
    paths:
      - 'training/validate_frozen_gru_candidate.py'
      - 'training/qualify_frozen_gru_formal.py'
      - 'eval/gate_robustness.py'
      - 'tools/gru_development_gate.py'
      - 'tools/verify_gru_development_gate.py'
      - 'tools/finalize_gru_frozen_candidate.py'
      - 'tools/verify_gru_frozen_candidate.py'
      - 'tools/verify_gru_stability_evidence.py'
      - 'tools/verify_gru_evaluation_independence.py'
      - 'tools/verify_development_source_binding.py'
      - 'tools/materialize_gru_candidate_workspace.py'
      - 'tools/prepare_gru_shadow_config.py'
      - 'experiments/model_family/fresh_validation_registry.json'
      - 'experiments/model_family/shadow_arena_registry.json'
      - 'tests/test_gru_frozen_qualification_contract.py'
      - 'tests/test_gru_stability_evidence_contract.py'
      - '.github/workflows/gru-frozen-candidate-qualification.yml'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Workflow run containing the frozen GRU development artifact
        required: true
        type: string
      source_artifact_name:
        description: Frozen development artifact name
        required: true
        default: gru-development-curriculum
        type: string
      expected_artifact_digest:
        description: Exact sha256:... digest of the frozen development artifact
        required: true
        type: string
      expected_source_head:
        description: Exact 40-hex workflow run HEAD that retained the artifact
        required: true
        type: string
      expected_product_head:
        description: Exact 40-hex product source HEAD used to train the frozen candidate
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: gru-frozen-candidate-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Frozen qualification contract
        run: |
          python3 tests/test_gru_frozen_qualification_contract.py
          python3 tests/test_gru_stability_evidence_contract.py
          python3 tools/verify_gru_development_gate.py --self-test
          python3 tools/verify_development_source_binding.py --self-test
      - name: Python syntax
        run: >-
          python3 -m py_compile
          training/validate_frozen_gru_candidate.py
          training/qualify_frozen_gru_formal.py
          tools/gru_development_gate.py
          tools/verify_gru_development_gate.py
          tools/finalize_gru_frozen_candidate.py
          tools/verify_gru_frozen_candidate.py
          tools/verify_gru_stability_evidence.py
          tools/verify_gru_evaluation_independence.py
          tools/verify_development_source_binding.py
          tools/materialize_gru_candidate_workspace.py
          tools/prepare_gru_shadow_config.py
          tests/test_gru_frozen_qualification_contract.py
          tests/test_gru_stability_evidence_contract.py

  qualification:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bind exact frozen development artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT_NAME: ${{ inputs.source_artifact_name }}
          EXPECTED_DIGEST: ${{ inputs.expected_artifact_digest }}
          EXPECTED_SOURCE_HEAD: ${{ inputs.expected_source_head }}
          EXPECTED_PRODUCT_HEAD: ${{ inputs.expected_product_head }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_PRODUCT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" \
            --jq ".artifacts[] | select(.name == \"${SOURCE_ARTIFACT_NAME}\") | .digest")"
          head="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.head_sha')"
          test -n "$digest" && test "$digest" = "$EXPECTED_DIGEST"
          test "$head" = "$EXPECTED_SOURCE_HEAD"
          echo "frozen artifact bound: run=$SOURCE_RUN_ID workflow_head=$head product_head=$EXPECTED_PRODUCT_HEAD digest=$digest"

      - name: Download exact frozen development artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.source_artifact_name }}
          path: build/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Checkout exact development product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_product_head }}
          path: build/product-source
          persist-credentials: false

      - name: Resolve and verify frozen candidate bundle
        id: candidate
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ inputs.expected_source_head }}
          EXPECTED_PRODUCT_HEAD: ${{ inputs.expected_product_head }}
        run: |
          set -euo pipefail
          test "$(git -C build/product-source rev-parse HEAD)" = "$EXPECTED_PRODUCT_HEAD"
          freeze="$(find build/source -type f -path '*/frozen-candidate/freeze-manifest.json' -print -quit)"
          test -n "$freeze"
          candidate="$(dirname "$freeze")"
          binding="$(find build/source -type f -name 'development-source-binding.json' -print -quit)"
          binding_args=()
          if [ -n "$binding" ]; then
            binding_args=(--binding "$binding")
          fi
          mkdir -p build/gru-frozen-qualification
          python3 tools/verify_development_source_binding.py \
            --candidate "$candidate" \
            --product-root build/product-source \
            --source-run-head "$EXPECTED_SOURCE_HEAD" \
            --product-head "$EXPECTED_PRODUCT_HEAD" \
            "${binding_args[@]}" \
            > build/gru-frozen-qualification/development-product-source-binding.json
          python3 tools/verify_gru_frozen_candidate.py --candidate "$candidate"
          python3 tools/verify_gru_stability_evidence.py --candidate "$candidate"
          python3 tools/verify_gru_development_gate.py --candidate "$candidate"
          echo "path=$candidate" >> "$GITHUB_OUTPUT"

      - name: Materialize qualification-only candidate workspace
        run: >-
          python3 tools/materialize_gru_candidate_workspace.py
          --candidate "${{ steps.candidate.outputs.path }}"
          --output build/gru-frozen-candidate-workspace

      - name: Build GRU runtime and decoder contracts
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel --target kws_wav_gru kws_decoder_tests kws_decoder_retention_tests
          ctest --test-dir build --output-on-failure -R '^kws_decoder_(tests|retention_tests)$'

      - name: Install pinned CPU surrogate runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input \
            torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run feedback-free fresh validation
        id: fresh
        shell: bash
        run: |
          set +e
          .venv/bin/python training/validate_frozen_gru_candidate.py \
            --candidate "${{ steps.candidate.outputs.path }}" \
            --runner build/kws_wav_gru \
            --output build/gru-frozen-qualification/fresh-validation
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify fresh validation split SHA independence
        if: steps.fresh.outputs.exit_code == '0'
        run: >-
          python3 tools/verify_gru_evaluation_independence.py
          --mode fresh
          --fresh-index build/gru-frozen-qualification/fresh-validation/dataset/domain-index.jsonl
          --output build/gru-frozen-qualification/fresh-validation/fresh-split-independence.json

      - name: Bind reserved shadow arena
        if: steps.fresh.outputs.exit_code == '0'
        run: >-
          python3 tools/prepare_gru_shadow_config.py
          --candidate "${{ steps.candidate.outputs.path }}"
          --output build/gru-frozen-qualification/shadow-effective-config.json

      - name: Run reserved shadow qualification
        if: steps.fresh.outputs.exit_code == '0'
        id: shadow
        shell: bash
        run: |
          set +e
          .venv/bin/python training/shadow_qualification.py \
            --config build/gru-frozen-qualification/shadow-effective-config.json \
            --runner build/kws_wav_gru \
            --work-dir build/gru-frozen-candidate-workspace \
            --output build/gru-frozen-qualification/shadow
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify reserved shadow seed SHA independence
        if: steps.fresh.outputs.exit_code == '0' && steps.shadow.outputs.exit_code == '0'
        run: >-
          python3 tools/verify_gru_evaluation_independence.py
          --mode shadow
          --shadow-root build/gru-frozen-qualification/shadow
          --shadow-summary build/gru-frozen-qualification/shadow/summary.json
          --output build/gru-frozen-qualification/shadow/shadow-seed-independence.json

      - name: Run isolated formal qualification
        if: steps.fresh.outputs.exit_code == '0' && steps.shadow.outputs.exit_code == '0'
        id: formal
        shell: bash
        run: |
          set +e
          .venv/bin/python training/qualify_frozen_gru_formal.py \
            --candidate "${{ steps.candidate.outputs.path }}" \
            --runner build/kws_wav_gru \
            --fresh-summary build/gru-frozen-qualification/fresh-validation/fresh-validation-summary.json \
            --shadow-root build/gru-frozen-qualification/shadow \
            --output build/gru-frozen-qualification/formal
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Retain immutable qualification verdicts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gru-frozen-candidate-qualification
          path: |
            build/gru-frozen-qualification/development-product-source-binding.json
            build/gru-frozen-candidate-workspace/frozen-candidate-manifest.json
            build/gru-frozen-candidate-workspace/frozen-selection-evidence.json
            build/gru-frozen-qualification/fresh-validation/fresh-validation-summary.json
            build/gru-frozen-qualification/fresh-validation/fresh-split-independence.json
            build/gru-frozen-qualification/shadow/summary.json
            build/gru-frozen-qualification/shadow/failure-summary.json
            build/gru-frozen-qualification/shadow/shadow-seed-independence.json
            build/gru-frozen-qualification/formal/formal-qualification-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Gate frozen candidate qualification
        run: |
          test "${{ steps.fresh.outputs.exit_code }}" = '0'
          test "${{ steps.shadow.outputs.exit_code }}" = '0'
          test "${{ steps.formal.outputs.exit_code }}" = '0'
