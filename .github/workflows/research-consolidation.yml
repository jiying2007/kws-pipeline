name: research-consolidation
on:
  pull_request:
  push:
    branches: [main, "consolidate/**"]
permissions:
  contents: read
jobs:
  source-retention:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify integrated source identities and negative cases
        run: |
          python3 -B tools/verify_research_consolidation.py
          python3 -B research/consolidation/tests/test_research_consolidation.py
          python3 -B research/consolidation/tests/test_cleanup_retention.py
          python3 -B tools/test_inventory.py --root research/consolidation/tests --workflow .github/workflows/research-consolidation.yml
