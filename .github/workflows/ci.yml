      - name: Verify tracked worktree after Release workflow command contract
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "Release workflow command contract"'
      - name: Repository cleanup safety contract
        run: python3 tests/test_repository_cleanup_contract.py
      - name: Verify tracked worktree after Repository cleanup safety contract
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "Repository cleanup safety contract"'
      - name: Dataset split leakage audit
        run: |
          python3 -S -B tests/test_dataset_audit.py
          python3 -S -B -O tests/test_dataset_audit.py
          python3 -S -B -OO tests/test_dataset_audit.py
      - name: Verify tracked worktree after Dataset split leakage audit
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "Dataset split leakage audit"'
      - name: Corpus byte identity
        run: |
          python3 tests/test_corpus_identity.py
          python3 -S -B -O tests/test_corpus_identity.py
          python3 -S -B -OO tests/test_corpus_identity.py
          python3 tests/test_reviewed_corpus_admission.py
          python3 tests/test_training_admission.py
          python3 -S -B -O tests/test_training_admission.py
