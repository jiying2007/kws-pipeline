      - name: Verify tracked worktree after Bounded source-screen historical review and live guard contracts
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "Bounded source-screen historical review and live guard contracts"'
      # Explicit stdlib-only suites run once per Python mode in the required
      # compiler-independent chain. No optional/path-filtered workflow gate.
