  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure coverage build
        run: >-
          cmake -S . -B build-coverage -DCMAKE_BUILD_TYPE=Debug
          -DKWS_BUILD_BENCH=OFF -DKWS_BUILD_TOOLS=OFF -DKWS_BUILD_FUZZ=OFF
          -DCMAKE_C_FLAGS="-O0 --coverage"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build and run C tests
        run: |
          cmake --build build-coverage --parallel
          ctest --test-dir build-coverage --output-on-failure
      - name: Generate gcov reports
        run: |
          set -euo pipefail
          shopt -s nullglob
          data=(build-coverage/CMakeFiles/kws_pipeline.dir/src/*.gcda)
          test "${#data[@]}" -gt 0
          for file in "${data[@]}"; do
            gcov "$file" >/dev/null
          done
      - name: C line coverage gate
        run: python3 tools/check_gcov.py --root . --minimum 55

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure ASan/UBSan
        run: >-
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-san --parallel
      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Clang libFuzzer + ASan/UBSan
        env:
          CC: clang
        run: >-
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug
          -DKWS_BUILD_TESTS=OFF -DKWS_BUILD_BENCH=OFF -DKWS_BUILD_TOOLS=OFF
          -DKWS_BUILD_FUZZ=ON -DKWS_STRICT=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build fuzz targets
        run: cmake --build build-fuzz --parallel
      - name: Generate canonical fuzz seeds
        run: python3 tests/generate_fuzz_seeds.py --output build-fuzz/corpus
      - name: Fuzz model parser smoke
        run: ./build-fuzz/kws_fuzz_model -runs=2000 -max_len=4096 -timeout=5 build-fuzz/corpus/model
      - name: Fuzz keyword-pack parser smoke
        run: ./build-fuzz/kws_fuzz_keyword_pack -runs=2000 -max_len=2048 -timeout=5 build-fuzz/corpus/keyword_pack

  armv7-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cross compiler and ARM user-mode emulator
        run: >-
          sudo apt-get update && sudo apt-get install -y
          gcc-arm-linux-gnueabihf qemu-user-static
      - name: Locate ARM sysroot for the emulator
        run: |
          set -euo pipefail
          loader="$(find /usr/arm-linux-gnueabihf -name 'ld-linux-armhf.so.3' -print -quit)"
          test -n "$loader"
          sysroot="$(dirname "$(dirname "$loader")")"
          echo "ARM sysroot for qemu-arm-static: $sysroot"
          echo "KWS_ARM_SYSROOT=$sysroot" >>"$GITHUB_ENV"
      - name: Configure hosted reference build
        run: >-
          cmake -S . -B build-ref
          -DCMAKE_BUILD_TYPE=Release
          -DKWS_BUILD_TESTS=OFF
          -DKWS_BUILD_BENCH=OFF
          -DKWS_BUILD_TOOLS=ON
          -DKWS_BUILD_FUZZ=OFF
          -DKWS_STRICT=ON
      - name: Build hosted reference runners
        run: cmake --build build-ref --parallel
      - name: Configure Cortex-A32
        run: >-
          cmake -S . -B build-arm
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc
          -DCMAKE_C_FLAGS="-mcpu=cortex-a32 -mfpu=neon-vfpv4 -mfloat-abi=hard"
          -DCMAKE_CROSSCOMPILING_EMULATOR="/usr/bin/qemu-arm-static;-L;$KWS_ARM_SYSROOT"
          -DKWS_BUILD_TESTS=ON
          -DKWS_BUILD_BENCH=OFF
          -DKWS_BUILD_TOOLS=ON
          -DKWS_BUILD_FUZZ=OFF
          -DKWS_STRICT=ON
      - name: Cross build core, tests and target qualification tools
        run: cmake --build build-arm --parallel
      - name: Run the Cortex-A32 test suite under qemu-arm-static
        run: ctest --test-dir build-arm --output-on-failure
      - name: Frontend C/spec parity on the Cortex-A32 build
        run: |
          set -euo pipefail
          wrapper="$RUNNER_TEMP/qemu-arm-kws-feature-dump"
          cat >"$wrapper" <<EOF
          #!/usr/bin/env bash
          exec /usr/bin/qemu-arm-static -L "$KWS_ARM_SYSROOT" ./build-arm/kws_feature_dump "\$@"
          EOF
          chmod +x "$wrapper"
          python3 tests/test_frontend_parity.py "$wrapper"
      - name: NEON int8 kernel parity against the hosted reference
        run: >-
          python3 tests/test_arm_parity.py
          --reference-runner ./build-ref/kws_wav
          --candidate-runner ./build-arm/kws_wav
          --emulator /usr/bin/qemu-arm-static
          --emulator-sysroot "$KWS_ARM_SYSROOT"