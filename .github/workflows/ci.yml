name: ci

on:
  push:
    branches: [main, "feature/**", "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-contracts:
    outputs:
      research_required: ${{ steps.research_changes.outputs.required }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Initialize execution report directory
        run: printf 'KWS_TEST_REPORT_DIR=%s/checked-unittest\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install tracked-worktree integrity guard
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/check-tracked-worktree.sh"
          cat >"$guard" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          stage=${1:?stage name required}

          mapfile -d '' paths < <(git diff --name-only -z HEAD --)
          if ((${#paths[@]} == 0)); then
            echo "tracked-worktree clean after: $stage"
            exit 0
          fi

          echo "::error title=Tracked worktree polluted::first detected after stage: $stage"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "tracked status:"
          git status --short --untracked-files=no

          for path in "${paths[@]}"; do
            if head_blob=$(git rev-parse "HEAD:$path" 2>/dev/null); then
              head_sha256=$(git show "HEAD:$path" | sha256sum | awk '{print $1}')
            else
              head_blob=MISSING
              head_sha256=MISSING
            fi

            if [[ -f "$path" ]]; then
              worktree_blob=$(git hash-object -- "$path")
              worktree_sha256=$(sha256sum -- "$path" | awk '{print $1}')
            elif [[ -e "$path" ]]; then
              worktree_blob=NONREGULAR
              worktree_sha256=NONREGULAR
            else
              worktree_blob=MISSING
              worktree_sha256=MISSING
            fi

            printf 'path=%q head_blob=%s head_sha256=%s worktree_blob=%s worktree_sha256=%s\n' \
              "$path" "$head_blob" "$head_sha256" "$worktree_blob" "$worktree_sha256"
          done
          exit 1
          EOF
          chmod +x "$guard"
          "$guard" "checkout baseline"
      - name: Select research checks from the complete change
        id: research_changes
        run: python3 -B tools/research_ci_changes.py
      - name: Research change selection contract
        run: python3 -B tests/test_research_ci_changes.py
      - name: Verify tracked worktree after Research change selection contract
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "Research change selection contract"'
      - name: ARM dependency wall-clock budget contracts with fake APT only
        timeout-minutes: 2
        run: |
          python3 -I -S -B tests/test_arm_dependency_budget.py
          python3 -I -S -B -O tests/test_arm_dependency_budget.py
          python3 -I -S -B -OO tests/test_arm_dependency_budget.py
      - name: Verify tracked worktree after ARM dependency budget contracts
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "ARM dependency budget contracts"'
      - name: K1 punctuation6 ASR18 offline source contracts
        id: asr18_contracts
        timeout-minutes: 5
        run: |
          set -euo pipefail
          asr18_tests='import os,sys,unittest; from pathlib import Path; os.chdir(sys.argv[1]); sys.path.insert(0,str(Path("research/k1-punctuation6-asr18-v1").resolve())); suite=unittest.defaultTestLoader.loadTestsFromNames(("test_asr18_binding", "test_asr18_contract", "test_asr18_prerequisite", "test_asr18_entrypoints", "test_asr18_freeze", "test_asr18_failure_observer", "test_publisher_observation", "test_publisher_checkpoint", "test_transfer_recovery", "test_asr18_host", "test_asr18_metadata", "test_asr18_raw_data_reader", "test_asr18_receipts", "test_asr18_resources", "test_asr18_transport", "test_asr18_worker", "test_bound_claim_contract", "test_claim_admission_host", "test_claim_consumer_integration")); sys.path.insert(0,str(Path("tools").resolve())); from checked_unittest import run_checked_suite; raise SystemExit(run_checked_suite(suite, "asr18"))'
          mode_logs="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/k1-asr18-contracts.XXXXXX")"
          # Frozen fixture helpers may create temporary children beside their
          # source. Give each optimization mode an exact independent checkout
          # so one mode cannot copy a directory another mode is removing.
          cleanup_mode_worktrees() {
            for mode in normal O OO; do
              checkout="$mode_logs/source-$mode"
              if [ -f "$checkout/.git" ]; then
                git worktree remove --force "$checkout" || return 1
              fi
            done
          }
          trap cleanup_mode_worktrees EXIT
          for mode in normal O OO; do
            git worktree add --quiet --detach "$mode_logs/source-$mode" HEAD
          done
          stop_contracts() {
            running="$(jobs -pr)"
            if [ -n "$running" ]; then kill $running 2>/dev/null || true; fi
            wait || true
            exit 2
          }
          trap stop_contracts INT TERM
          python3 -I -S -B -c "$asr18_tests" "$mode_logs/source-normal" > "$mode_logs/normal.log" 2>&1 & normal_pid=$!
          python3 -I -S -B -O -c "$asr18_tests" "$mode_logs/source-O" > "$mode_logs/O.log" 2>&1 & optimized_pid=$!
          python3 -I -S -B -OO -c "$asr18_tests" "$mode_logs/source-OO" > "$mode_logs/OO.log" 2>&1 & double_optimized_pid=$!
          failed=0
          for test_pid in "$normal_pid" "$optimized_pid" "$double_optimized_pid"; do
            wait "$test_pid" || failed=1
          done
          trap - INT TERM
          for mode in normal O OO; do
            printf 'ASR18_CONTRACT_MODE=%s\n' "$mode"
            cat "$mode_logs/$mode.log"
            git -C "$mode_logs/source-$mode" diff --exit-code HEAD -- || failed=1
          done
          cleanup_mode_worktrees || failed=1
          trap - EXIT
          exit "$failed"
      - name: Verify tracked worktree after K1 punctuation6 ASR18 contracts
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "K1 punctuation6 ASR18 contracts"'
      - name: Fixed zero-model hosted transfer contracts
        id: transfer_contracts
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -I -S -B research/k1-evidence-transfer-qualification-v1/test_qualification.py
          python3 -I -S -B -O research/k1-evidence-transfer-qualification-v1/test_qualification.py
          python3 -I -S -B -OO research/k1-evidence-transfer-qualification-v1/test_qualification.py
      - name: Verify tracked worktree after hosted transfer contracts
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "Hosted transfer contracts"'
      - name: Fixed zero-model atomic claim contracts
        id: atomic_claim_contracts
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 -I -S -B research/k1-atomic-claim-qualification-v1/test_git_claim_qualification.py
          python3 -I -S -B -O research/k1-atomic-claim-qualification-v1/test_git_claim_qualification.py
          python3 -I -S -B -OO research/k1-atomic-claim-qualification-v1/test_git_claim_qualification.py
          python3 -B tools/test_inventory.py --root research/k1-atomic-claim-qualification-v1 --workflow .github/workflows/ci.yml
      - name: Verify tracked worktree after atomic claim contracts
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "Atomic claim contracts"'
      - name: K1 punctuation6 prepare diagnostic offline source contracts
        id: prepare_contracts
        timeout-minutes: 5
        run: |
          set -euo pipefail
          prepare_tests='import sys,unittest; from pathlib import Path; sys.path.insert(0,str(Path("research/k1-punctuation6-prepare-diagnostic-v1").resolve())); suite=unittest.defaultTestLoader.loadTestsFromNames(("test_prepare_only", "test_prepare_transport", "test_prepare_hosted", "test_prepare_launch_ci")); sys.path.insert(0,str(Path("tools").resolve())); from checked_unittest import run_checked_suite; raise SystemExit(run_checked_suite(suite, "prepare"))'
          python3 -I -S -B -c "$prepare_tests"
          python3 -I -S -B -O -c "$prepare_tests"
          python3 -I -S -B -OO -c "$prepare_tests"
      - name: Verify tracked worktree after K1 prepare diagnostic contracts
