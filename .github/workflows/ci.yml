          python3 -S -B tools/private_candidate_host_smoke.py --self-test
          python3 -S -B -O tools/private_candidate_host_smoke.py --self-test
          python3 -S -B -OO tools/private_candidate_host_smoke.py --self-test
          python3 -S -B tools/private_candidate_host_smoke.py
      - name: Verify tracked worktree after Hosted CLI stdout contracts
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "Hosted CLI stdout contracts"'
      - name: SenseVoice runtime binding contracts without model execution
        run: |
          python3 -S -B tests/test_sense_runtime_binding.py
