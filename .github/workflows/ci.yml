  asr-offline-posterior:
    # Stdlib-only evidence fixtures; never setup, load or run a model.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Initialize execution report directory
        run: printf 'KWS_TEST_REPORT_DIR=%s/checked-unittest\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read-only ASR evidence acceptance contracts
        run: |
          set -euo pipefail
          posterior_tests='import sys,unittest; from pathlib import Path; sys.path.insert(0,str(Path("research/k1-asr18-offline-posterior-v1").resolve())); suite=unittest.defaultTestLoader.loadTestsFromNames(tuple(name[:-3] for name in ("test_asr_posterior.py", "test_offline_custody.py", "test_claim_posterior_integration.py"))); sys.path.insert(0,str(Path("tools").resolve())); from checked_unittest import run_checked_suite; raise SystemExit(run_checked_suite(suite, "posterior"))'
          python3 -I -S -B -c "$posterior_tests"
          python3 -I -S -B -O -c "$posterior_tests"
          python3 -I -S -B -OO -c "$posterior_tests"
          python3 -I -S -B tools/test_inventory.py --root research/k1-asr18-offline-posterior-v1 --workflow .github/workflows/ci.yml
      - name: Verify actual posterior suite execution
        run: python3 -I -S -B tools/checked_unittest.py --verify-reports "$KWS_TEST_REPORT_DIR" --suite posterior
      - name: Retain actual posterior execution evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-unittest-posterior
          path: ${{ env.KWS_TEST_REPORT_DIR }}/*.json
          if-no-files-found: error
      - name: Verify unchanged tracked source after offline posterior contracts
        if: always()
        run: git diff --exit-code HEAD --

  research-sources:
    needs: python-contracts
    if: ${{ needs.python-contracts.outputs.research_required == 'true' }}
    uses: ./.github/workflows/research-source-consolidation.yml

  hosted:
    # Preserve the existing required check names. always() prevents a failed or
    # skipped dependency from turning this required gate into a successful skip.
    needs: [python-contracts, research-sources, asr-offline-posterior, hosted-build, coverage, sanitizers, fuzz, armv7-cross]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Require every applicable CI dependency
        env:
          CONTRACT_RESULT: ${{ needs.python-contracts.result }}
          RESEARCH_REQUIRED: ${{ needs.python-contracts.outputs.research_required }}
          RESEARCH_RESULT: ${{ needs.research-sources.result }}
          POSTERIOR_RESULT: ${{ needs.asr-offline-posterior.result }}
          BUILD_RESULT: ${{ needs.hosted-build.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          SANITIZERS_RESULT: ${{ needs.sanitizers.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          ARM_RESULT: ${{ needs.armv7-cross.result }}
        run: |
          set -euo pipefail
          for result in "$CONTRACT_RESULT" "$POSTERIOR_RESULT" "$BUILD_RESULT" "$COVERAGE_RESULT" "$SANITIZERS_RESULT" "$FUZZ_RESULT" "$ARM_RESULT"; do
            test "$result" = success
          done
          if [[ "$RESEARCH_REQUIRED" == true ]]; then
            test "$RESEARCH_RESULT" = success
          else
            test "$RESEARCH_REQUIRED" = false
            test "$RESEARCH_RESULT" = skipped
          fi

  hosted-build:
    # Actual compiler-dependent work starts immediately, without Python/research needs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tracked-worktree integrity guard
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/check-tracked-worktree.sh"
          cat >"$guard" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          stage=${1:?stage name required}

          mapfile -d '' paths < <(git diff --name-only -z HEAD --)
          if ((${#paths[@]} == 0)); then
            echo "tracked-worktree clean after: $stage"
            exit 0
          fi

          echo "::error title=Tracked worktree polluted::first detected after stage: $stage"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "tracked status:"
          git status --short --untracked-files=no

          for path in "${paths[@]}"; do
            if head_blob=$(git rev-parse "HEAD:$path" 2>/dev/null); then
              head_sha256=$(git show "HEAD:$path" | sha256sum | awk '{print $1}')
            else
              head_blob=MISSING
              head_sha256=MISSING
            fi

            if [[ -f "$path" ]]; then
              worktree_blob=$(git hash-object -- "$path")
              worktree_sha256=$(sha256sum -- "$path" | awk '{print $1}')
            elif [[ -e "$path" ]]; then
              worktree_blob=NONREGULAR
              worktree_sha256=NONREGULAR
            else
              worktree_blob=MISSING
              worktree_sha256=MISSING
            fi

            printf 'path=%q head_blob=%s head_sha256=%s worktree_blob=%s worktree_sha256=%s\n' \
              "$path" "$head_blob" "$head_sha256" "$worktree_blob" "$worktree_sha256"
          done
          exit 1
          EOF
          chmod +x "$guard"
          "$guard" "checkout baseline"
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
      - name: Verify tracked worktree after Configure
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "Configure"'
      - name: Build
        run: cmake --build build --parallel
      - name: Verify tracked worktree after Build
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "Build"'
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify tracked worktree after Test
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "Test"'
      - name: Causal research stdlib and artificial oracle contracts
        run: |
          python3 -S -B tests/test_causal_research_contract.py
