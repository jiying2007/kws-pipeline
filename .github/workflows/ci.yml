          command -v cc
          # Qualify the unchanged historical overlay against its original pins.
          # Current shipping decoder coverage runs separately; this is not its parity claim.
          python3 -S -B tests/prepare_frozen_decoder_source.py \
            --source-root . --output-dir "$RUNNER_TEMP/near-pronunciation-frozen-source"
          python3 -S -B research/near_pronunciation_v1/verify_decoder.py \
            --source-root "$RUNNER_TEMP/near-pronunciation-frozen-source" \
            --output-dir "$RUNNER_TEMP/near-pronunciation-decoder-verify"
      - name: Verify tracked worktree after Near-pronunciation decoder verification
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "Near-pronunciation decoder verification"'
      - name: Three-ASR pending label metadata without model execution
        run: |
          python3 -S -B tests/test_reviewed_corpus_admission.py ThreeASRMetadataTests
          python3 -S -B -O tests/test_reviewed_corpus_admission.py ThreeASRMetadataTests
          python3 -S -B -OO tests/test_reviewed_corpus_admission.py ThreeASRMetadataTests
          python3 -S -B tests/test_training_admission.py ThreeASRTrainerMetadataTests
          python3 -S -B -O tests/test_training_admission.py ThreeASRTrainerMetadataTests
          python3 -S -B -OO tests/test_training_admission.py ThreeASRTrainerMetadataTests
      - name: Verify tracked worktree after Three-ASR pending label metadata
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "Three-ASR pending label metadata"'
      - name: Trusted ASR source and native adapter metadata
        run: |
          python3 -S -B tests/test_asr_source_resolver.py
          python3 -S -B -O tests/test_asr_source_resolver.py
          python3 -S -B -OO tests/test_asr_source_resolver.py
          python3 -S -B tests/test_asr_producer_metadata.py
          python3 -S -B -O tests/test_asr_producer_metadata.py
          python3 -S -B -OO tests/test_asr_producer_metadata.py
          python3 -S -B tests/test_asr_native_contracts.py
          python3 -S -B -O tests/test_asr_native_contracts.py
          python3 -S -B -OO tests/test_asr_native_contracts.py
      - name: Verify tracked worktree after Trusted ASR source and native adapter metadata
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "Trusted ASR source and native adapter metadata"'
      - name: Maintained speech data queue research-only contracts
        run: |
          python3 -S -B tests/test_speech_data_queue.py
          python3 -S -B -O tests/test_speech_data_queue.py
          python3 -S -B -OO tests/test_speech_data_queue.py
          python3 -S -B tests/test_language_conditioned_queue.py
          python3 -S -B -O tests/test_language_conditioned_queue.py
          python3 -S -B -OO tests/test_language_conditioned_queue.py
          python3 -S -B tests/test_batch_weak_import.py
