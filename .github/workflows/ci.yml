      - name: Verify tracked worktree after SenseVoice runtime binding contracts
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "SenseVoice runtime binding contracts"'
      - name: Near-pronunciation historical decoder synthetic verification
