      - name: Research retention event linkage synthetic contracts
        run: |
          python3 -S -B -m unittest discover -s tests -p test_link_retention_events.py -v
          python3 -S -B -O -m unittest discover -s tests -p test_link_retention_events.py -v
          python3 -S -B -OO -m unittest discover -s tests -p test_link_retention_events.py -v
          python3 -S -B research/bounded-local-retention-2026-10-20/trace/run_checks.py --repo-root . --cc gcc
