      - name: Verify tracked worktree after Workflow exact path-filter integrity
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "Workflow exact path-filter integrity"'
      - name: Disabled parallel candidate plan metadata
        run: |
          python3 -S -B tests/test_parallel_candidate_plan.py
          python3 -S -B -O tests/test_parallel_candidate_plan.py
          python3 -S -B -OO tests/test_parallel_candidate_plan.py
      - name: Verify tracked worktree after Disabled parallel candidate plan metadata
        run: '"$RUNNER_TEMP/check-tracked-worktree.sh" "Disabled parallel candidate plan metadata"'
      - name: Candidate encoder source contracts without model execution
        run: |
          python3 -S -B tests/test_candidate_encoder_contract.py
          python3 -S -B -O tests/test_candidate_encoder_contract.py
          python3 -S -B -OO tests/test_candidate_encoder_contract.py
          python3 -S -B tests/test_candidate_encoder_source.py
