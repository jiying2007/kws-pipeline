name: acoustic-boundary-segmentation

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful product-development-experiment run containing the frozen development model
        required: true
        type: string
      source_artifact_name:
        description: Optional exact product-development-experiment artifact name
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: acoustic-boundary-segmentation-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_ARTIFACT_NAME_INPUT: ${{ inputs.source_artifact_name }}
      SOURCE_ROOT: build/acoustic-boundary-segmentation/source-artifact
      OUTPUT_ROOT: build/acoustic-boundary-segmentation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download retained development evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$SOURCE_RUN_ID" in
            ''|*[!0-9]*) echo "source_run_id must be numeric" >&2; exit 2 ;;
          esac
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e '
            .conclusion == "success" and
            .event == "pull_request" and
            .path == ".github/workflows/product-development-experiment.yml"
          ' <<<"$run_json" >/dev/null || exit 2
          source_head_sha="$(jq -r '.head_sha // empty' <<<"$run_json")"
          test "${#source_head_sha}" -eq 40 || exit 2

          mkdir -p "$SOURCE_ROOT"
          artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          artifact="$SOURCE_ARTIFACT_NAME_INPUT"
          if [ -z "$artifact" ]; then
            artifact="$(jq -r '
              [.artifacts[] |
                select(.expired == false) |
                select(.name | startswith("product-development-experiment-"))] |
              if length == 1 then .[0].name
              else error("source run must have exactly one non-expired product-development-experiment artifact")
              end
            ' <<<"$artifacts_json")"
          else
            jq -e --arg name "$artifact" '
              [.artifacts[] |
                select(.expired == false) |
                select(.name == $name) |
                select(.name | startswith("product-development-experiment-"))] |
              length == 1
            ' <<<"$artifacts_json" >/dev/null || exit 2
          fi
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$SOURCE_ROOT"
          echo "SOURCE_ARTIFACT_NAME=$artifact" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_HEAD_SHA=$source_head_sha" >> "$GITHUB_ENV"

      - name: Bind exact frozen model
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root=pathlib.Path(os.environ['SOURCE_ROOT'])
          out=pathlib.Path(os.environ['OUTPUT_ROOT'])/'source'
          grid=root/'build/product-development-experiment/decoder-policy-replay-grid.json'
          value=json.loads(grid.read_text(encoding='utf-8'))
          if value.get('evidence_class') != 'decoder-policy-posterior-replay-grid-development-v1':
              raise SystemExit('retained source grid evidence class mismatch')
          model_sha=str(value.get('model_sha256') or '')
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda:stream.read(1024*1024),b''):
                      h.update(block)
              return h.hexdigest()
          models=[
              path for path in root.glob('build/product-development-experiment/candidates/*/model.kwm')
              if sha(path)==model_sha
          ]
          if len(model_sha)!=64 or len(models)!=1:
              raise SystemExit('frozen model binding failed')
          out.mkdir(parents=True,exist_ok=True)
          target=out/'source-model.kwm'
          shutil.copy2(models[0],target)
          selection={
              'schema_version':1,
              'evidence_class':'acoustic-boundary-segmentation-source-v1',
              'development_only':True,
              'selection_feedback_allowed':True,
              'protected_evidence_used':False,
              'release_authority':False,
              'source_split':'train',
              'source_run_id':int(os.environ['SOURCE_RUN_ID']),
              'source_run_head_sha':os.environ['SOURCE_RUN_HEAD_SHA'],
              'source_artifact_name':os.environ['SOURCE_ARTIFACT_NAME'],
              'source_grid_sha256':sha(grid),
              'source_model_sha256':sha(target),
          }
          (out/'source-selection.json').write_text(
              json.dumps(selection,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          PY

      - name: Materialize governed speech-like base
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash training/materialize_governed_product_base.sh

      - name: Build posterior dump runtime only
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel --target kws_posterior_dump

      - name: Measure multi-gap acoustic segmentation feasibility
        run: |
          set -euo pipefail
          python3 tools/diagnose_acoustic_boundary_segmentation.py             --dataset-index .generated/product-speech-like-base/corpus/bundle/train/dataset-index.jsonl             --model "$OUTPUT_ROOT/source/source-model.kwm"             --posterior-dump build/kws_posterior_dump             --posterior-cache "$OUTPUT_ROOT/posterior-cache"             --output-dir "$OUTPUT_ROOT/diagnostic"             --gap-ms 160 240 320 400 480

      - name: Retain segmentation receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root=pathlib.Path(os.environ['OUTPUT_ROOT'])
          report=json.loads((root/'diagnostic'/'segmentation-feasibility.json').read_text(encoding='utf-8'))
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda:stream.read(1024*1024),b''):
                      h.update(block)
              return h.hexdigest()
          if (
              report.get('selection_feedback_allowed') is not True
              or report.get('source_split') != 'train'
              or report.get('protected_evidence_used') is not False
          ):
              raise SystemExit('segmentation report authority mismatch')
          receipt={
              'schema_version':1,
              'evidence_class':'acoustic-boundary-segmentation-receipt-v1',
              'development_only':True,
              'selection_feedback_allowed':True,
              'protected_evidence_used':False,
              'release_authority':False,
              'source_split':'train',
              'source_run_id':int(os.environ['SOURCE_RUN_ID']),
              'source_run_head_sha':os.environ['SOURCE_RUN_HEAD_SHA'],
              'source_artifact_name':os.environ['SOURCE_ARTIFACT_NAME'],
              'runtime_repository_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'source_selection_sha256':sha(root/'source'/'source-selection.json'),
              'segmentation_sha256':sha(root/'diagnostic'/'segmentation-feasibility.json'),
              'samples':int(report['samples']),
              'voices':int(report['voices']),
              'gap_ms':list(report['gap_ms']),
              'stable_feature_sets':list(report['stable_feature_sets']),
              'segmentation_signal_observed':bool(report['segmentation_signal_observed']),
          }
          (root/'receipt.json').write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          PY

      - name: Upload segmentation feasibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acoustic-boundary-segmentation-${{ inputs.source_run_id }}-${{ github.sha }}
          path: |
            build/acoustic-boundary-segmentation/source/**
            build/acoustic-boundary-segmentation/diagnostic/**
            build/acoustic-boundary-segmentation/receipt.json
            build/acoustic-boundary-segmentation/posterior-cache/**/*.json
            build/acoustic-boundary-segmentation/posterior-cache/**/*.kwtr
            .generated/xiaowo.product-effective.json
          if-no-files-found: error
          retention-days: 30
