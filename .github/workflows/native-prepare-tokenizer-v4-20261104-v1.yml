name: Native tokenizer-binding no-audio preparation v4 20261104
on:
  push:
    branches: [research/native-prepare-tokenizer-v4-20261104-v1]
permissions:
  contents: read
concurrency:
  group: native-prepare-tokenizer-v4-20261104-v1
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'jiying2007/kws-pipeline' && github.event_name == 'push' && github.ref == 'refs/heads/research/native-prepare-tokenizer-v4-20261104-v1' && github.event.created == true && github.event.deleted == false && github.event.repository.private == false && github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Offline no-model source tests
        run: |
          set -euo pipefail
          for opt in '' -O -OO; do
            python3 -I -B $opt research/native-prepare-fence-v2-20261104/test_host_overlay.py
            python3 -I -B $opt research/native-prepare-scan-v3-20261104/test_host_scan.py
            python3 -I -B $opt research/native-prepare-tokenizer-v4-20261104/test_host_tokenizer.py
            python3 -I -B $opt research/native-prepare-tokenizer-v4-20261104/test_tokenizer_binding.py
            python3 -I -B $opt research/native-prepare-scan-v3-20261104/test_output_size.py
            python3 -I -B $opt research/native-prepare-fence-v2-20261104/test_safe_diagnostic.py
            python3 -I -B $opt research/native-prepare-fence-v2-20261104/test_prepare_diagnostics.py
            python3 -I -B $opt research/native-prepare-fence-v2-20261104/test_whisper_overlay.py
            python3 -I -B $opt research/native-prepare-fence-v2-20261104/test_fence_composition.py
            python3 -I -B $opt research/native-asr-integration-20261104/test_zero_forward.py
            python3 -I -B $opt research/native-asr-integration-20261104/test_integration.py
          done
      - name: Prepare three actual models without audio or recognition
        run: python3 -I -B research/native-prepare-tokenizer-v4-20261104/host.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-prepare-tokenizer-v4-20261104-v1-public
          path: |
            native-private-native-prepare-tokenizer-v4-20261104-v1/aggregate-only/status.json
            native-private-native-prepare-tokenizer-v4-20261104-v1/aggregate-only/capacity.json
            native-private-native-prepare-tokenizer-v4-20261104-v1/aggregate-only/safe-summary.json
          if-no-files-found: error
          retention-days: 7
