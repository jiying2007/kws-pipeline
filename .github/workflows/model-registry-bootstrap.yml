name: model-registry-bootstrap

# One-shot bootstrap for the model-registry-v1 PR. The generated registry commit
# changes only models/registry/**, so it does not recursively trigger this job.
on:
  push:
    branches:
      - "ops/model-registry-v1"
    paths:
      - ".github/workflows/model-registry-bootstrap.yml"
      - "tools/materialize_model_registry.py"
      - "tools/verify_model_registry.py"
      - "models/README.md"
      - "models/registry/README.md"
      - ".gitignore"

permissions:
  contents: write

concurrency:
  group: model-registry-bootstrap
  cancel-in-progress: false

jobs:
  import-pinned-release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve pinned immutable release
        id: pinned
        run: |
          set -euo pipefail
          tag="$(jq -r '.model.release_tag' configs/shipping.xiaowo.json)"
          test -n "$tag" && test "$tag" != null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -d "models/registry/$tag" ]; then
            python3 tools/verify_model_registry.py \
              --registry-dir "models/registry/$tag" \
              --config configs/shipping.xiaowo.json
            echo "already_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify pinned model release
        if: steps.pinned.outputs.already_present != 'true'
        env:
          MODEL_TAG: ${{ steps.pinned.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p build/model-release
          gh release download "$MODEL_TAG" --repo "$GITHUB_REPOSITORY" --dir build/model-release
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$MODEL_TAG" > build/model-release.json
          python3 tools/verify_model_release.py \
            --assets-dir build/model-release \
            --config configs/shipping.xiaowo.json \
            --release-tag "$MODEL_TAG"

      - name: Materialize immutable Git registry entry
        if: steps.pinned.outputs.already_present != 'true'
        env:
          MODEL_TAG: ${{ steps.pinned.outputs.tag }}
        run: |
          set -euo pipefail
          python3 tools/materialize_model_registry.py \
            --assets-dir build/model-release \
            --output-root models/registry \
            --release-json build/model-release.json \
            --config configs/shipping.xiaowo.json
          python3 tools/verify_model_registry.py \
            --registry-dir "models/registry/$MODEL_TAG" \
            --config configs/shipping.xiaowo.json

      - name: Commit pinned model tuple to Git
        if: steps.pinned.outputs.already_present != 'true'
        env:
          MODEL_TAG: ${{ steps.pinned.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "models/registry/$MODEL_TAG"
          git commit -m "models: mirror promoted $MODEL_TAG into Git registry"
          gh auth setup-git
          git push origin "HEAD:$GITHUB_REF_NAME"
