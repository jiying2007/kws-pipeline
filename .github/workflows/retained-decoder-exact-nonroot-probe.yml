name: retained-decoder-exact-nonroot-probe

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/triggers/retained-decoder-exact-nonroot-probe.json'
      - '.github/workflows/retained-decoder-exact-nonroot-probe.yml'
      - 'src/decoder.c'
      - 'src/decoder.h'
      - 'src/kws.c'
      - 'src/kws_debug.h'
      - 'tools/kws_decoder_replay.c'
      - 'tools/diagnose_decoder_exact_nonroot_probe.py'

permissions:
  contents: read
  actions: read

env:
  KWS_PROBE_SPEC: .github/triggers/retained-decoder-exact-nonroot-probe.json

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      probe_changed: ${{ steps.resolve.outputs.probe_changed }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      source_artifact_name: ${{ steps.resolve.outputs.source_artifact_name }}
      source_pr_number: ${{ steps.resolve.outputs.source_pr_number }}
      source_head_sha: ${{ steps.resolve.outputs.source_head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve retained exact-nonroot probe
        id: resolve
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$KWS_PROBE_SPEC"; then
            echo "probe_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, re
          path=pathlib.Path(os.environ["KWS_PROBE_SPEC"])
          value=json.loads(path.read_text(encoding="utf-8"))
          required={
              "schema_version","experiment_id","development_only",
              "selection_feedback_allowed","protected_evidence_used",
              "source_run_id","source_artifact_name","source_pr_number",
              "source_head_sha","model","tokens","keywords_tsv","keyword_pack",
              "posterior_cache","acoustic_alignment",
          }
          if set(value) != required:
              raise SystemExit("retained exact-nonroot probe fields mismatch")
          if value["schema_version"] != 1:
              raise SystemExit("schema_version must be 1")
          if value["development_only"] is not True:
              raise SystemExit("probe must be development_only")
          if value["selection_feedback_allowed"] is not False:
              raise SystemExit("probe must not feed selection")
          if value["protected_evidence_used"] is not False:
              raise SystemExit("probe must not use protected evidence")
          if not isinstance(value["source_run_id"], int) or value["source_run_id"] <= 0:
              raise SystemExit("source_run_id must be positive")
          if not isinstance(value["source_pr_number"], int) or value["source_pr_number"] <= 0:
              raise SystemExit("source_pr_number must be positive")
          if re.fullmatch(r"[0-9a-f]{40}", str(value["source_head_sha"])) is None:
              raise SystemExit("source_head_sha is invalid")
          for key in (
              "source_artifact_name","model","tokens","keywords_tsv",
              "keyword_pack","posterior_cache","acoustic_alignment",
          ):
              raw=value[key]
              if (
                  not isinstance(raw,str)
                  or not raw.strip()
                  or raw.startswith("/")
                  or ".." in pathlib.PurePosixPath(raw).parts
              ):
                  raise SystemExit(f"{key} must be a safe relative path/name")
          print("probe_changed=true")
          for key in (
              "source_run_id","source_artifact_name",
              "source_pr_number","source_head_sha",
          ):
              print(f"{key}={value[key]}")
          PY

  analyze:
    needs: resolve
    if: needs.resolve.outputs.probe_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download retained exact-source evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.resolve.outputs.source_artifact_name }}
          path: .retained
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.source_run_id }}

      - name: Verify retained authority
        env:
          SOURCE_HEAD: ${{ needs.resolve.outputs.source_head_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(".retained")
          spec=json.loads(pathlib.Path(os.environ["KWS_PROBE_SPEC"]).read_text(encoding="utf-8"))
          receipt=json.loads((root/"build/product-development-experiment-receipt.json").read_text(encoding="utf-8"))
          model=root/spec["model"]
          if receipt.get("source_policy") != "exact-pr-head":
              raise SystemExit("retained source is not exact-pr-head")
          if receipt.get("development_only") is not True:
              raise SystemExit("retained source is not development-only")
          if receipt.get("protected_evidence_used") is not False:
              raise SystemExit("retained source used protected evidence")
          if receipt.get("pr_head_sha") != os.environ["SOURCE_HEAD"]:
              raise SystemExit("retained source head mismatch")
          if not model.is_file():
              raise SystemExit("retained model is missing")
          print("retained model sha256="+hashlib.file_digest(model.open("rb"),"sha256").hexdigest())
          PY

      - name: Build exact retained baseline replay
        env:
          SOURCE_HEAD: ${{ needs.resolve.outputs.source_head_sha }}
          SOURCE_PR: ${{ needs.resolve.outputs.source_pr_number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "pull/$SOURCE_PR/head"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_HEAD"
          BASELINE_ROOT="$RUNNER_TEMP/exact-nonroot-baseline"
          git worktree add --detach "$BASELINE_ROOT" "$SOURCE_HEAD"
          cmake -S "$BASELINE_ROOT" -B "$BASELINE_ROOT/build" -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build "$BASELINE_ROOT/build" --parallel --target kws_decoder_replay
          test -x "$BASELINE_ROOT/build/kws_decoder_replay"
          echo "BASELINE_REPLAY=$BASELINE_ROOT/build/kws_decoder_replay" >> "$GITHUB_ENV"

      - name: Build PR-head diagnostic replay
        run: |
          set -euo pipefail
          cmake -S . -B build-probe -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build-probe --parallel --target             kws_decoder_replay kws_decoder_tests kws_decoder_retention_tests
          ctest --test-dir build-probe --output-on-failure -R '^kws_decoder_(tests|retention_tests)$'
          test -x build-probe/kws_decoder_replay
          python3 -m py_compile tools/diagnose_decoder_exact_nonroot_probe.py

      - name: Compare exact baseline with strict nonroot counterfactual
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          spec=json.loads(pathlib.Path(os.environ["KWS_PROBE_SPEC"]).read_text(encoding="utf-8"))
          root=pathlib.Path(".retained")
          output=pathlib.Path("build/exact-nonroot-counterfactual.json")
          subprocess.check_call([
              "python3",
              "tools/diagnose_decoder_exact_nonroot_probe.py",
              "--model",str(root/spec["model"]),
              "--tokens",str(root/spec["tokens"]),
              "--keywords-tsv",str(root/spec["keywords_tsv"]),
              "--pack",str(root/spec["keyword_pack"]),
              "--posterior-cache",str(root/spec["posterior_cache"]),
              "--acoustic-alignment",str(root/spec["acoustic_alignment"]),
              "--baseline-decoder-replay",os.environ["BASELINE_REPLAY"],
              "--probe-decoder-replay","build-probe/kws_decoder_replay",
              "--output",str(output),
          ])
          value=json.loads(output.read_text(encoding="utf-8"))
          if value.get("probe_off_matches_exact_retained_baseline") is not True:
              raise SystemExit("probe-off equivalence failed")
          print(json.dumps({
              "positive":value["positive"],
              "runtime_gap":value["runtime_gap"],
              "totals":value["totals"],
          },sort_keys=True))
          PY

      - name: Retain strict nonroot counterfactual
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retained-decoder-exact-nonroot-probe-${{ github.event.pull_request.head.sha }}
          path: build/exact-nonroot-counterfactual.json
          if-no-files-found: error
          retention-days: 30
