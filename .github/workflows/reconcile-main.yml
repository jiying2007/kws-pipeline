name: reconcile-main-once

on:
  push:
    branches:
      - codex/terminal-hardening-v0.3
    paths:
      - .github/workflows/reconcile-main.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          echo "branch=$(git rev-parse HEAD)"
          echo "main=$(git rev-parse origin/main)"
          git merge --no-commit -X ours origin/main
          rm -f .github/workflows/reconcile-main.yml
          git add -A
          git commit -m "merge: reconcile v0.3 hardening with current main"
          git push origin HEAD:codex/terminal-hardening-v0.3
