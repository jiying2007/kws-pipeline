name: direct-keyword-benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'training/direct_keyword_benchmark.py'
      - 'tests/test_direct_keyword_benchmark.py'
      - '.github/workflows/direct-keyword-benchmark.yml'

permissions:
  contents: read

concurrency:
  group: direct-keyword-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OMP_DYNAMIC: 'FALSE'
  MKL_NUM_THREADS: '1'
  MKL_CBWR: COMPATIBLE
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  ATEN_CPU_CAPABILITY: default

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pool_sha: ${{ steps.pool.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify and download existing immutable speech base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          contract=configs/training/product-speech-like-base-v1.json
          tag="$(jq -r .release_tag "$contract")"
          archive="$(jq -r .release_archive "$contract")"
          mkdir -p build/frozen-download
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > build/frozen-download/release.json
          jq -e --argjson id "$(jq .release_id "$contract")" \
            --arg target "$(jq -r .source_repro_head_sha "$contract")" \
            '.id == $id and .immutable == true and .draft == false and .prerelease == false and .target_commitish == $target' \
            build/frozen-download/release.json >/dev/null
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir build/frozen-download
          echo "$(jq -r .release_archive_sha256 "$contract")  build/frozen-download/$archive" | sha256sum -c -
      - name: Prepare frozen development pool
        id: pool
        run: |
          archive="$(jq -r .release_archive configs/training/product-speech-like-base-v1.json)"
          python3 training/frozen_speech_ablation.py prepare --archive "build/frozen-download/$archive" --output build/frozen-pool
          echo "sha=$(sha256sum build/frozen-pool/pool.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: direct-keyword-pool-${{ github.event.pull_request.head.sha }}
          path: build/frozen-pool/
          if-no-files-found: error
          retention-days: 14

  benchmark:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: direct-keyword-pool-${{ github.event.pull_request.head.sha }}
          path: build/frozen-pool
      - name: Build unchanged C runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel 2 --target kws_wav
      - name: Install pinned CPU runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.2
          .venv/bin/python -m pip install --disable-pip-version-check --no-input torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test direct benchmark contracts
        run: .venv/bin/python tests/test_direct_keyword_benchmark.py
      - name: Train paired grounded CTC and runtime-acceptance treatment
        env:
          POOL_SHA: ${{ needs.prepare.outputs.pool_sha }}
        run: |
          set -euo pipefail
          mkdir -p build/direct-keyword
          for seed in 1337 2346; do
            for treatment in grounded accept; do
              name="${seed}-${treatment}"
              if [ "$treatment" = grounded ]; then objective=grounded-ctc; else objective=grounded-ctc-accept; fi
              .venv/bin/python training/direct_keyword_benchmark.py train \
                --pool build/frozen-pool --pool-sha "$POOL_SHA" \
                --output "build/direct-keyword/$name" --seed "$seed" --epochs 200 \
                --objective "$objective" \
                > "build/direct-keyword/$name-train.log" 2>&1
              .venv/bin/python training/direct_keyword_benchmark.py evaluate \
                --pool build/frozen-pool --pool-sha "$POOL_SHA" \
                --model "build/direct-keyword/$name/model.kwm" \
                --runner build/kws_wav --output "build/direct-keyword/$name-evaluation" \
                --train-only \
                > "build/direct-keyword/$name-evaluation.log" 2>&1
            done
          done
      - name: Verify paired isolation and report train-only gate
        run: |
          .venv/bin/python - <<'PY'
          import json,pathlib,torch
          root=pathlib.Path('build/direct-keyword');rows=[]
          def clean(metric):
              return metric['matched']==metric['expected']==32 and metric['false_accepts']==0
          control_spec={'kind':'activity-grounded-one-token-ctc','normalization':'active-input-frames','blank_id':0,
                        'activity_source':'waveform-activity-bounds-v1','blank_boundary_guard_hops':2,
                        'positive_non_speech_blank_weight':0.3,'negative_policy':'full-sequence-blank'}
          candidate_spec={**control_spec,'kind':'activity-grounded-one-token-ctc-plus-runtime-acceptance-v1',
                          'runtime_acceptance_threshold':0.55,'runtime_acceptance_loss_weight':1.0}
          for seed in (1337,2346):
              pair={}
              for treatment in ('grounded','accept'):
                  name=f'{seed}-{treatment}'
                  cp=torch.load(root/name/'model.pt',weights_only=True,map_location='cpu')
                  value=json.loads((root/f'{name}-evaluation'/'summary.json').read_text())
                  assert set(value['splits'])=={'train'} and set(value['pause'])=={'train'}
                  pair[treatment]=(cp,value)
              base,candidate=pair['grounded'],pair['accept']
              for field in ('initial_float_state_identity','batch_order_sha256','context_order_sha256','training_corpus_identity'):
                  assert base[0][field]==candidate[0][field],field
              a=dict(base[0]['development_recipe']);b=dict(candidate[0]['development_recipe'])
              assert a['positive_objective']==control_spec
              assert b['positive_objective']==candidate_spec
              a.pop('positive_objective');b.pop('positive_objective')
              assert a==b,'unplanned paired recipe difference'
              assert all(e['non_speech_blank']>0.0 and e['ctc']>0.0 and e['runtime_acceptance']==0.0 for e in base[0]['epoch_history'])
              assert all(e['non_speech_blank']>0.0 and e['ctc']>0.0 for e in candidate[0]['epoch_history'])
              assert any(e['runtime_acceptance']>0.0 for e in candidate[0]['epoch_history'])
              base_train=base[1]['splits']['train'];cand_train=candidate[1]['splits']['train']
              train_gate=all(clean(cand_train[arm]) for arm in ('silence1s','prior'))
              rows.append({'seed':seed,'control_objective':'activity-grounded-one-token-ctc',
                           'candidate_objective':'activity-grounded-one-token-ctc-plus-runtime-acceptance-v1',
                           'base_train':base_train,'candidate_train':cand_train,
                           'base_pause':base[1]['pause']['train'],'candidate_pause':candidate[1]['pause']['train'],
                           'train_gate_pass':train_gate})
          report={'schema_version':1,'evidence_class':'direct-whole-keyword-runtime-acceptance-paired-v5',
                  'development_only':True,'release_authority':False,'selection_feedback_allowed':False,
                  'epochs':200,'threshold':0.55,'control_objective':'activity-grounded-one-token-ctc',
                  'candidate_objective':'activity-grounded-one-token-ctc-plus-runtime-acceptance-v1',
                  'train_gate_pass':all(r['train_gate_pass'] for r in rows),'rows':rows,
                  'limitations':['Train split only; calibration/test are intentionally not evaluated in this experiment.',
                                 'Frozen synthetic development pool only; no qualification or DUT authority.',
                                 'Passing the train gate only authorizes a separate frozen-model evaluation; it does not promote a model.']}
          (root/'comparison.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'train_gate_pass':report['train_gate_pass'],
                            'rows':[{r['seed']:{'control':r['base_train'],'candidate':r['candidate_train'],
                                                'pause400':r['candidate_pause']['400']}} for r in rows]},sort_keys=True))
          PY
      - name: Retain benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: direct-keyword-${{ github.event.pull_request.head.sha }}
          path: build/direct-keyword/
          if-no-files-found: error
          retention-days: 14
