name: research-asr-runtime
# Ordinary PRs run only source/fixtures. The separately admitted one-time job
# is disabled by the source admission until explicit review/publication approval.
# No model, user audio, artifact upload, cache, paid runner or schedule.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'research/asr_runtime/**'
      - '.github/workflows/research-asr-runtime.yml'
permissions:
  contents: read
concurrency:
  group: research-asr-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  candidate-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise offline synthetic contracts only
        run: python3 -I -S research/asr_runtime/tests/test_qualify.py
      - name: Check candidate status and inventory wiring
        run: |
          python3 -I -S research/asr_runtime/qualify.py --candidate
          python3 -I -S tools/test_inventory.py --root research/asr_runtime/tests --workflow .github/workflows/research-asr-runtime.yml

  one-time-runtime:
    # Labeling this exact owner-controlled branch is still insufficient: the first
    # step also requires a reviewed enabled admission and exact SHA/budget PR line.
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'asr-runtime-qualify-v3' &&
      github.run_attempt == 1 &&
      github.repository == 'jiying2007/kws-pipeline' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/github-asr-runtime-once-20261001' &&
      github.event.pull_request.user.login == 'jiying2007' &&
      github.actor == 'jiying2007' &&
      contains(github.event.pull_request.body, 'KWS_ASR_RUNTIME_APPROVAL=')
    needs: candidate-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact owner-approved head, source, scope and budget before networking
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I -S research/asr_runtime/admit_run.py
      - name: Run admitted no-model qualification once
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I -S - <<'PY'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / 'research/asr_runtime'))
          import admit_run, controller, qualify
          marker = pathlib.Path(os.environ['RUNNER_TEMP']) / 'asr-runtime-admitted.json'
          approved = qualify.load_json(marker, maximum=65536)
          if approved['source_sha256'] != admit_run.source_identity(root):
              raise SystemExit('Source changed after admission')
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / ('asr-runtime-' + os.environ['GITHUB_RUN_ID'])
          controller.qualify(root / 'research/asr_runtime', destination)
          PY
      - name: Emit bounded terminal receipts even on failure
        if: always()
        run: |
          python3 -I -S - <<'PY'
          import hashlib, json, os, pathlib
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / ('asr-runtime-' + os.environ['GITHUB_RUN_ID'])
          total = 0
          for path in sorted(destination.glob('*.json')):
              if path.is_symlink() or path.stat().st_size > 65536:
                  raise SystemExit('Unsafe or oversized receipt')
              data = path.read_bytes()
              total += len(data)
              if total > 524288:
                  raise SystemExit('Aggregate receipt cap exceeded')
              record = json.loads(data)
              print(json.dumps({'receipt': path.name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'record': record}, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('No model/audio inputs. Bounded receipt JSON and hashes are in logs; no artifact/cache upload.\n')
          PY
