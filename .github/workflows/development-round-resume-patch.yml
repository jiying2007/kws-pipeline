name: development-round-resume-patch

on:
  push:
    branches:
      - tmp/development-round-resume
    paths:
      - '.github/triggers/development-round-resume-patch.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/development-round-resume
      - name: Patch resumable development rounds
        run: |
          cat > training/development_resume.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import math
          import pathlib
          import shutil
          import subprocess
          import tempfile
          from collections.abc import Callable

          ROOT = pathlib.Path(__file__).resolve().parents[1]
          POLICY = "development-round-resume-v1"
          SEGMENT_CONTINUE_EXIT_CODE = 3
          CANDIDATE_PATH_FIELDS = ("model", "checkpoint", "provenance", "keywords", "pack")


          def sha256_file(path: pathlib.Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          def repository_sha() -> str:
              value = subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], cwd=ROOT, text=True
              ).strip()
              if len(value) != 40 or any(ch not in "0123456789abcdef" for ch in value):
                  raise ValueError("repository HEAD is not a canonical git SHA")
              return value


          def _rounds(records: list[dict]) -> None:
              observed = [int(row.get("round", -1)) for row in records]
              expected = list(range(len(records)))
              if observed != expected:
                  raise ValueError(
                      f"development resume rounds must be contiguous from zero: {observed}"
                  )


          def _under_root(path: pathlib.Path, root: pathlib.Path, label: str) -> pathlib.Path:
              resolved = path.resolve()
              try:
                  resolved.relative_to(root.resolve())
              except ValueError as exc:
                  raise ValueError(f"{label} escaped development work root: {resolved}") from exc
              return resolved


          def _candidate_hashes(records: list[dict], work: pathlib.Path) -> list[dict]:
              result: list[dict] = []
              for record in records:
                  row = {"round": int(record["round"]), "members": {}}
                  for field in CANDIDATE_PATH_FIELDS:
                      raw = record.get(field)
                      if not isinstance(raw, str) or not raw:
                          raise ValueError(f"resume record missing candidate path: {field}")
                      path = _under_root(pathlib.Path(raw), work, field)
                      if not path.is_file() or path.stat().st_size <= 0:
                          raise ValueError(f"resume candidate member missing: {path}")
                      row["members"][field] = sha256_file(path)
                  result.append(row)
              return result


          def _rebase(value, old_root: pathlib.Path, new_root: pathlib.Path):
              if isinstance(value, dict):
                  return {key: _rebase(item, old_root, new_root) for key, item in value.items()}
              if isinstance(value, list):
                  return [_rebase(item, old_root, new_root) for item in value]
              if isinstance(value, str):
                  old = str(old_root)
                  if value == old:
                      return str(new_root)
                  prefix = old + "/"
                  if value.startswith(prefix):
                      return str(new_root / value[len(prefix) :])
              return value


          def write_state(
              path: pathlib.Path,
              *,
              work: pathlib.Path,
              model_family: str,
              architecture: str,
              source_policy: str,
              config_path: pathlib.Path,
              policy_path: pathlib.Path,
              records: list[dict],
              complete: bool,
          ) -> dict:
              work = work.resolve()
              _rounds(records)
              candidate_hashes = _candidate_hashes(records, work)
              curriculum_sha = None
              if records:
                  curriculum = work / "curriculum" / f"round-{len(records) - 1:02d}.json"
                  if not curriculum.is_file():
                      raise ValueError("resume state is missing last curriculum")
                  curriculum_sha = sha256_file(curriculum)
              value = {
                  "schema_version": 1,
                  "policy": POLICY,
                  "repository_sha": repository_sha(),
                  "work_root": str(work),
                  "model_family": str(model_family),
                  "architecture": str(architecture),
                  "source_policy": str(source_policy),
                  "config_sha256": sha256_file(config_path),
                  "development_policy_sha256": sha256_file(policy_path),
                  "next_round": len(records),
                  "complete": bool(complete),
                  "last_curriculum_sha256": curriculum_sha,
                  "candidate_hashes": candidate_hashes,
                  "records": records,
              }
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False)
                  + "\n",
                  encoding="utf-8",
              )
              return value


          def load_state(
              path: pathlib.Path,
              *,
              work: pathlib.Path,
              model_family: str,
              architecture: str,
              source_policy: str,
              config_path: pathlib.Path,
              policy_path: pathlib.Path,
          ) -> dict:
              value = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict) or int(value.get("schema_version", 0)) != 1:
                  raise ValueError("development resume state schema mismatch")
              expected = {
                  "policy": POLICY,
                  "repository_sha": repository_sha(),
                  "model_family": str(model_family),
                  "architecture": str(architecture),
                  "source_policy": str(source_policy),
                  "config_sha256": sha256_file(config_path),
                  "development_policy_sha256": sha256_file(policy_path),
              }
              for key, item in expected.items():
                  if value.get(key) != item:
                      raise ValueError(f"development resume state {key} mismatch")
              old_root = pathlib.Path(str(value.get("work_root", ""))).resolve()
              work = work.resolve()
              raw_records = value.get("records")
              if not isinstance(raw_records, list):
                  raise ValueError("development resume records must be a list")
              records = _rebase(raw_records, old_root, work)
              if not isinstance(records, list):
                  raise ValueError("rebased development resume records are invalid")
              _rounds(records)
              if int(value.get("next_round", -1)) != len(records):
                  raise ValueError("development resume next_round drifted")
              expected_hashes = value.get("candidate_hashes")
              if not isinstance(expected_hashes, list) or len(expected_hashes) != len(records):
                  raise ValueError("development resume candidate hashes are incomplete")
              actual_hashes = _candidate_hashes(records, work)
              if actual_hashes != expected_hashes:
                  raise ValueError("development resume candidate bytes drifted")
              if records:
                  curriculum = work / "curriculum" / f"round-{len(records) - 1:02d}.json"
                  if not curriculum.is_file():
                      raise ValueError("development resume curriculum is missing")
                  if sha256_file(curriculum) != value.get("last_curriculum_sha256"):
                      raise ValueError("development resume curriculum bytes drifted")
              if bool(value.get("complete")):
                  manifest = work / "development-loop-manifest.json"
                  if not manifest.is_file():
                      raise ValueError("complete development resume state lacks final manifest")
              return {
                  "records": records,
                  "next_round": len(records),
                  "complete": bool(value.get("complete")),
              }


          def rebuild_progress(
              records: list[dict],
              policy: dict,
              controller_initial: Callable[[dict], dict],
              controller_next: Callable[[dict, dict, int, int], dict],
              strict_fn: Callable[[dict], bool],
          ) -> tuple[dict, float | None, int, int]:
              controller = controller_initial(policy)
              best: float | None = None
              stale = 0
              streak = 0
              for record in records:
                  score = float(record.get("score"))
                  if not math.isfinite(score):
                      raise ValueError("development resume score must be finite")
                  fr = int(record.get("false_rejects", 0))
                  fa = int(record.get("false_accepts", 0))
                  controller = controller_next(policy, controller, fr, fa)
                  streak = streak + 1 if strict_fn(record) else 0
                  if best is None or score < best - 1.0e-12:
                      best = score
                      stale = 0
                  else:
                      stale += 1
              return controller, best, stale, streak


          def self_test() -> None:
              with tempfile.TemporaryDirectory() as td:
                  root = pathlib.Path(td)
                  old = root / "old-work"
                  candidate = old / "candidates" / "round-00"
                  candidate.mkdir(parents=True)
                  members = {}
                  for field in CANDIDATE_PATH_FIELDS:
                      suffix = {"model": ".kwm", "checkpoint": ".pt", "provenance": ".json", "keywords": ".tsv", "pack": ".kwk"}[field]
                      member = candidate / f"{field}{suffix}"
                      member.write_bytes((field + "\n").encode())
                      members[field] = str(member)
                  curriculum = old / "curriculum" / "round-00.json"
                  curriculum.parent.mkdir(parents=True)
                  curriculum.write_text('{"weight":1}\n', encoding="utf-8")
                  config = root / "config.json"
                  policy = root / "policy.json"
                  config.write_text('{"x":1}\n', encoding="utf-8")
                  policy.write_text('{"y":1}\n', encoding="utf-8")
                  record = {
                      "round": 0,
                      "score": 1.0,
                      "false_rejects": 1,
                      "false_accepts": 0,
                      "calibration_gate": True,
                      "test_gate": True,
                      **members,
                  }
                  state = old / "development-resume-state.json"
                  write_state(
                      state,
                      work=old,
                      model_family="test",
                      architecture="test-v1",
                      source_policy="test-policy",
                      config_path=config,
                      policy_path=policy,
                      records=[record],
                      complete=False,
                  )
                  new = root / "new-work"
                  shutil.copytree(old, new)
                  loaded = load_state(
                      new / "development-resume-state.json",
                      work=new,
                      model_family="test",
                      architecture="test-v1",
                      source_policy="test-policy",
                      config_path=config,
                      policy_path=policy,
                  )
                  assert loaded["next_round"] == 1
                  assert str(loaded["records"][0]["checkpoint"]).startswith(str(new))
                  pathlib.Path(loaded["records"][0]["model"]).write_bytes(b"tampered")
                  try:
                      load_state(
                          new / "development-resume-state.json",
                          work=new,
                          model_family="test",
                          architecture="test-v1",
                          source_policy="test-policy",
                          config_path=config,
                          policy_path=policy,
                      )
                  except ValueError as exc:
                      assert "candidate bytes drifted" in str(exc)
                  else:
                      raise AssertionError("tampered resume candidate was accepted")


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--self-test", action="store_true")
              args = parser.parse_args()
              if args.self_test:
                  self_test()
                  print("development round resume self-test: PASS")
                  return 0
              parser.error("--self-test is required")
              return 2


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          python3 - <<'PY'
          from pathlib import Path

          def patch_iterator(path: Path, *, family: str, architecture: str, rnn: bool) -> None:
              text = path.read_text()
              if 'import development_resume as development_resume' not in text:
                  text = text.replace(
                      'from development_failure_replay import render_development_failure_replay  # noqa: E402\n',
                      'import development_resume as development_resume  # noqa: E402\nfrom development_failure_replay import render_development_failure_replay  # noqa: E402\n',
                      1,
                  )
              if family == 'gru' and 'MODEL_FAMILY = "gru"' not in text:
                  text = text.replace(
                      'SELECTION_POLICY = "best-strict-development-objective-round"\n',
                      'SELECTION_POLICY = "best-strict-development-objective-round"\nMODEL_FAMILY = "gru"\nARCHITECTURE = "tiny-gru-v1"\n',
                      1,
                  )
              parser_old = '    parser.add_argument("--work-dir", required=True, type=pathlib.Path)\n'
              parser_new = parser_old + '    parser.add_argument("--resume-state", type=pathlib.Path)\n    parser.add_argument("--round-budget", type=int)\n'
              if '--round-budget' not in text:
                  if parser_old not in text:
                      raise SystemExit(f'{path}: parser marker missing')
                  text = text.replace(parser_old, parser_new, 1)
              text = text.replace('    work = safe_reset(args.work_dir)\n', '    work = args.work_dir.resolve()\n', 1)

              if rnn:
                  old_init = '''    records: list[dict] = []\n    curriculum: dict | None = None\n    controller = controller_initial(policy)\n    previous_checkpoint: pathlib.Path | None = None\n    best_objective: float | None = None\n    stale_rounds = 0\n    for round_index in range(int(policy["max_rounds"])):\n'''
                  new_init = '''    if args.round_budget is not None and args.round_budget <= 0:\n        raise ValueError("round budget must be positive")\n    state_path = work / "development-resume-state.json"\n    if args.resume_state is None:\n        work = safe_reset(work)\n        records: list[dict] = []\n        curriculum: dict | None = None\n        controller = controller_initial(policy)\n        previous_checkpoint: pathlib.Path | None = None\n        best_objective: float | None = None\n        stale_rounds = 0\n        start_round = 0\n    else:\n        work.mkdir(parents=True, exist_ok=True)\n        restored = development_resume.load_state(\n            args.resume_state.resolve(),\n            work=work,\n            model_family=MODEL_FAMILY,\n            architecture=ARCHITECTURE,\n            source_policy=POLICY,\n            config_path=config_path,\n            policy_path=policy_path,\n        )\n        records = restored["records"]\n        start_round = int(restored["next_round"])\n        if restored["complete"]:\n            manifest = load_object(work / "development-loop-manifest.json")\n            print(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False))\n            return 0 if bool(manifest.get("development_qualified")) else 1\n        curriculum = (\n            load_object(work / "curriculum" / f"round-{start_round - 1:02d}.json")\n            if start_round > 0\n            else None\n        )\n        controller, best_objective, stale_rounds, _ = development_resume.rebuild_progress(\n            records, policy, controller_initial, controller_next, strict\n        )\n        previous_checkpoint = pathlib.Path(str(records[-1]["checkpoint"])) if records else None\n    rounds_run = 0\n    for round_index in range(start_round, int(policy["max_rounds"])):\n'''
              else:
                  old_init = '''    records: list[dict] = []\n    curriculum: dict | None = None\n    controller = controller_initial(policy)\n    previous_checkpoint: pathlib.Path | None = None\n    best_objective: float | None = None\n    stale_rounds = 0\n    strict_streak = 0\n\n    for round_index in range(int(policy["max_rounds"])):\n'''
                  new_init = '''    if args.round_budget is not None and args.round_budget <= 0:\n        raise ValueError("round budget must be positive")\n    state_path = work / "development-resume-state.json"\n    if args.resume_state is None:\n        work = safe_reset(work)\n        records: list[dict] = []\n        curriculum: dict | None = None\n        controller = controller_initial(policy)\n        previous_checkpoint: pathlib.Path | None = None\n        best_objective: float | None = None\n        stale_rounds = 0\n        strict_streak = 0\n        start_round = 0\n    else:\n        work.mkdir(parents=True, exist_ok=True)\n        restored = development_resume.load_state(\n            args.resume_state.resolve(),\n            work=work,\n            model_family=MODEL_FAMILY,\n            architecture=ARCHITECTURE,\n            source_policy=POLICY,\n            config_path=config_path,\n            policy_path=policy_path,\n        )\n        records = restored["records"]\n        start_round = int(restored["next_round"])\n        if restored["complete"]:\n            manifest = load_object(work / "development-loop-manifest.json")\n            print(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False))\n            return 0 if bool(manifest.get("development_qualified")) else 1\n        curriculum = (\n            load_object(work / "curriculum" / f"round-{start_round - 1:02d}.json")\n            if start_round > 0\n            else None\n        )\n        controller, best_objective, stale_rounds, strict_streak = development_resume.rebuild_progress(\n            records, policy, controller_initial, controller_next, strict\n        )\n        previous_checkpoint = pathlib.Path(str(records[-1]["checkpoint"])) if records else None\n    rounds_run = 0\n\n    for round_index in range(start_round, int(policy["max_rounds"])):\n'''
              if old_init not in text:
                  raise SystemExit(f'{path}: init block missing')
              text = text.replace(old_init, new_init, 1)

              if rnn:
                  old_stop = '''        completed = round_index + 1\n        observed = terminal_strict_streak(records)\n        if completed >= int(policy["min_rounds"]) and observed >= int(policy["stable_strict_pass_rounds"]):\n            break\n        if completed >= int(policy["min_rounds"]) and stale_rounds >= int(policy["patience"]):\n            break\n'''
                  new_stop = '''        completed = round_index + 1\n        observed = terminal_strict_streak(records)\n        rounds_run += 1\n        development_resume.write_state(\n            state_path,\n            work=work,\n            model_family=MODEL_FAMILY,\n            architecture=ARCHITECTURE,\n            source_policy=POLICY,\n            config_path=config_path,\n            policy_path=policy_path,\n            records=records,\n            complete=False,\n        )\n        terminal_stop = (\n            completed >= int(policy["min_rounds"])\n            and (\n                observed >= int(policy["stable_strict_pass_rounds"])\n                or stale_rounds >= int(policy["patience"])\n            )\n        )\n        if terminal_stop:\n            break\n        if (\n            args.round_budget is not None\n            and rounds_run >= args.round_budget\n            and completed < int(policy["max_rounds"])\n        ):\n            print(json.dumps({"segment_complete": True, "next_round": completed}, sort_keys=True))\n            return development_resume.SEGMENT_CONTINUE_EXIT_CODE\n'''
              else:
                  old_stop = '''        completed = round_index + 1\n        if completed >= int(policy["min_rounds"]) and strict_streak >= int(policy["stable_strict_pass_rounds"]):\n            break\n        if completed >= int(policy["min_rounds"]) and stale_rounds >= int(policy["patience"]):\n            break\n'''
                  new_stop = '''        completed = round_index + 1\n        rounds_run += 1\n        development_resume.write_state(\n            state_path,\n            work=work,\n            model_family=MODEL_FAMILY,\n            architecture=ARCHITECTURE,\n            source_policy=POLICY,\n            config_path=config_path,\n            policy_path=policy_path,\n            records=records,\n            complete=False,\n        )\n        terminal_stop = (\n            completed >= int(policy["min_rounds"])\n            and (\n                strict_streak >= int(policy["stable_strict_pass_rounds"])\n                or stale_rounds >= int(policy["patience"])\n            )\n        )\n        if terminal_stop:\n            break\n        if (\n            args.round_budget is not None\n            and rounds_run >= args.round_budget\n            and completed < int(policy["max_rounds"])\n        ):\n            print(json.dumps({"segment_complete": True, "next_round": completed}, sort_keys=True))\n            return development_resume.SEGMENT_CONTINUE_EXIT_CODE\n'''
              if old_stop not in text:
                  raise SystemExit(f'{path}: stop block missing')
              text = text.replace(old_stop, new_stop, 1)

              manifest_write = '''    print(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False))\n    return 0 if selected is not None else 1\n'''
              manifest_new = '''    development_resume.write_state(\n        state_path,\n        work=work,\n        model_family=MODEL_FAMILY,\n        architecture=ARCHITECTURE,\n        source_policy=POLICY,\n        config_path=config_path,\n        policy_path=policy_path,\n        records=records,\n        complete=True,\n    )\n    print(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False))\n    return 0 if selected is not None else 1\n'''
              if manifest_write not in text:
                  raise SystemExit(f'{path}: manifest return block missing')
              text = text.replace(manifest_write, manifest_new, 1)
              code_marker = 'TRAINING / "feature_cached_trainer.py",'
              if 'TRAINING / "development_resume.py",' not in text:
