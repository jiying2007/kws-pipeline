              path.write_text(text)

          patch_iterator(Path('training/iterate_gru_development.py'), family='gru', architecture='tiny-gru-v1', rnn=False)
          patch_iterator(Path('training/iterate_rnn_development.py'), family='rnn', architecture='tiny-streaming-rnn-v1', rnn=True)
