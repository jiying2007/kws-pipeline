name: Product development automatic pair analysis

on:
  workflow_run:
    workflows:
      - product-development-experiment
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  resolve:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.resolve.outputs.ready }}
      state: ${{ steps.resolve.outputs.state }}
      control_run_id: ${{ steps.resolve.outputs.control_run_id }}
      treatment_run_id: ${{ steps.resolve.outputs.treatment_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve retained counterfactual pair
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 training/resolve_product_development_pair.py \
            --run-id "${{ github.event.workflow_run.id }}" \
            --output build/product-development-auto-pair-resolution.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Retain automatic pair resolution
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-development-auto-pair-resolution-${{ github.event.workflow_run.id }}
          path: build/product-development-auto-pair-resolution.json
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    uses: ./.github/workflows/product-development-pair-analysis.yml
    with:
      control_run_id: ${{ needs.resolve.outputs.control_run_id }}
      treatment_run_id: ${{ needs.resolve.outputs.treatment_run_id }}
