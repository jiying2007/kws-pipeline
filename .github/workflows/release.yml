name: release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

permissions:
  contents: read

jobs:
  hosted:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release ref matches SDK version
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) release_tag="$GITHUB_REF_NAME" ;;
            refs/heads/release/v*) release_tag="${GITHUB_REF_NAME#release/}" ;;
            *) echo "unsupported release ref: $GITHUB_REF" >&2; exit 2 ;;
          esac
          expected="${release_tag#v}"
          actual="$(sed -nE 's/^project\(kws_pipeline VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test -n "$actual"
          test "$expected" = "$actual"
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
      - name: Build
        run: cmake --build build --parallel
      - name: C tests
        run: ctest --test-dir build --output-on-failure
      - name: Clang static analysis
        if: matrix.cc == 'clang'
        run: |
          set -euo pipefail
          for source in src/*.c; do
            clang --analyze -std=c11 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
              -Iinclude -Isrc -Ibuild/generated "$source"
          done
      - name: Python/product tests
        run: |
          python3 tests/test_frontend_parity.py ./build/kws_feature_dump
          python3 tests/test_dataset_audit.py
          python3 tests/test_corpus_identity.py
          python3 tests/test_false_reject_mining.py
          python3 tests/test_synthetic_loop.py --runner ./build/kws_wav
          python3 tests/test_domain_scene.py
          python3 tests/test_domain_metrics.py
          python3 tests/test_domain_curriculum.py
          python3 tests/test_domain_loop.py --runner ./build/kws_wav
          python3 tests/test_long_far.py --runner ./build/kws_raw_stream
          python3 tests/test_keyword_compile.py
          python3 tests/test_eval.py
          python3 tests/test_statistical_bounds.py
          python3 tests/test_run_corpus.py
          python3 tests/test_board_bench.py --runner ./build/kws_board_bench
          python3 tests/test_release_qualification.py
          python3 tests/test_runtime_soak.py
          python3 tests/test_target_evidence.py
          python3 tests/test_audio_discontinuity_contract.py
          python3 tests/test_training_supply_chain.py
          python3 tests/test_reproducible_sdk.py
          python3 tests/test_terminal_docs.py
          python3 tests/test_test_inventory.py
      - name: Hosted benchmark signal
        run: ./build/kws_bench
      - name: Python test inventory
        run: >-
          python3 tools/test_inventory.py
          --workflow .github/workflows/ci.yml
          --workflow .github/workflows/training-integration.yml
          --workflow .github/workflows/release.yml
      - name: Python syntax
        run: python3 -m py_compile tools/*.py training/*.py eval/*.py tests/*.py

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release ref matches SDK version
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) release_tag="$GITHUB_REF_NAME" ;;
            refs/heads/release/v*) release_tag="${GITHUB_REF_NAME#release/}" ;;
            *) exit 2 ;;
          esac
          expected="${release_tag#v}"
          actual="$(sed -nE 's/^project\(kws_pipeline VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test "$expected" = "$actual"
      - name: Configure coverage build
        run: >-
          cmake -S . -B build-coverage -DCMAKE_BUILD_TYPE=Debug
          -DKWS_BUILD_BENCH=OFF -DKWS_BUILD_TOOLS=OFF -DKWS_BUILD_FUZZ=OFF
          -DCMAKE_C_FLAGS="-O0 --coverage"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build and run C tests
        run: |
          cmake --build build-coverage --parallel
          ctest --test-dir build-coverage --output-on-failure
      - name: Generate gcov reports
        run: |
          set -euo pipefail
          shopt -s nullglob
          data=(build-coverage/CMakeFiles/kws_pipeline.dir/src/*.gcda)
          test "${#data[@]}" -gt 0
          for file in "${data[@]}"; do
            gcov "$file" >/dev/null
          done
      - name: C line coverage gate
        run: python3 tools/check_gcov.py --root . --minimum 55

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release ref matches SDK version
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) release_tag="$GITHUB_REF_NAME" ;;
            refs/heads/release/v*) release_tag="${GITHUB_REF_NAME#release/}" ;;
            *) exit 2 ;;
          esac
          expected="${release_tag#v}"
          actual="$(sed -nE 's/^project\(kws_pipeline VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test "$expected" = "$actual"
      - name: Configure ASan/UBSan
        run: >-
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-san --parallel
      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release ref matches SDK version
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) release_tag="$GITHUB_REF_NAME" ;;
            refs/heads/release/v*) release_tag="${GITHUB_REF_NAME#release/}" ;;
            *) exit 2 ;;
          esac
          expected="${release_tag#v}"
          actual="$(sed -nE 's/^project\(kws_pipeline VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test "$expected" = "$actual"
      - name: Configure libFuzzer
        env:
          CC: clang
        run: >-
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug
          -DKWS_BUILD_TESTS=OFF -DKWS_BUILD_BENCH=OFF -DKWS_BUILD_TOOLS=OFF
          -DKWS_BUILD_FUZZ=ON -DKWS_STRICT=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-fuzz --parallel
      - name: Seed and fuzz parsers
        run: |
          python3 tests/generate_fuzz_seeds.py --output build-fuzz/corpus
          ./build-fuzz/kws_fuzz_model -runs=5000 -max_len=4096 -timeout=5 build-fuzz/corpus/model
          ./build-fuzz/kws_fuzz_keyword_pack -runs=5000 -max_len=2048 -timeout=5 build-fuzz/corpus/keyword_pack

  armv7-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release ref matches SDK version
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) release_tag="$GITHUB_REF_NAME" ;;
            refs/heads/release/v*) release_tag="${GITHUB_REF_NAME#release/}" ;;
            *) exit 2 ;;
          esac
          expected="${release_tag#v}"
          actual="$(sed -nE 's/^project\(kws_pipeline VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test "$expected" = "$actual"
      - name: Install Cortex-A32 cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
      - name: Configure
        run: >-
          cmake -S . -B build-arm -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc
          -DCMAKE_C_FLAGS="-mcpu=cortex-a32 -mfpu=neon-vfpv4 -mfloat-abi=hard"
          -DKWS_BUILD_TESTS=OFF -DKWS_BUILD_BENCH=OFF
          -DKWS_BUILD_TOOLS=ON -DKWS_BUILD_FUZZ=OFF -DKWS_STRICT=ON
      - name: Cross build
        run: cmake --build build-arm --parallel

  publish:
    needs: [hosted, coverage, sanitizers, fuzz, armv7-cross]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*)
              release_tag="$GITHUB_REF_NAME"
              bootstrap=false
              ;;
            refs/heads/release/v*)
              release_tag="${GITHUB_REF_NAME#release/}"
              bootstrap=true
              ;;
            *) echo "unsupported release ref: $GITHUB_REF" >&2; exit 2 ;;
          esac
          version="${release_tag#v}"
          actual="$(sed -nE 's/^project\(kws_pipeline VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          test -n "$actual"
          test "$version" = "$actual"
          printf 'tag=%s\nversion=%s\nbootstrap=%s\n' "$release_tag" "$version" "$bootstrap" >> "$GITHUB_OUTPUT"
      - name: Refuse duplicate release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists: $RELEASE_TAG" >&2
            exit 2
          fi
      - name: Build installable SDK twice
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_BUILD_FUZZ=OFF -DKWS_STRICT=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix "$RUNNER_TEMP/sdk"
          cmake -S . -B build-repro -DCMAKE_BUILD_TYPE=Release -DKWS_BUILD_FUZZ=OFF -DKWS_STRICT=ON
          cmake --build build-repro --parallel
          cmake --install build-repro --prefix "$RUNNER_TEMP/sdk-repro"
          python3 tools/check_reproducible_sdk.py "$RUNNER_TEMP/sdk" "$RUNNER_TEMP/sdk-repro"
          mkdir -p dist
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$RUNNER_TEMP/sdk" -czf "dist/kws-pipeline-${VERSION}-sdk.tar.gz" .
          git archive --format=tar.gz --prefix="kws-pipeline-${VERSION}/" \
            -o "dist/kws-pipeline-${VERSION}-source.tar.gz" "$GITHUB_SHA"
          python3 tools/generate_sbom.py \
            --root "$RUNNER_TEMP/sdk" \
            --name kws-pipeline \
            --version "$VERSION" \
            --source-sha "$GITHUB_SHA" \
            --output "dist/kws-pipeline-${VERSION}.spdx.json"
          python3 -m json.tool "dist/kws-pipeline-${VERSION}.spdx.json" >/dev/null
          (cd dist && sha256sum "kws-pipeline-${VERSION}-sdk.tar.gz" "kws-pipeline-${VERSION}-source.tar.gz" "kws-pipeline-${VERSION}.spdx.json" > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Validate release artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          test -s "dist/kws-pipeline-${VERSION}-sdk.tar.gz"
          test -s "dist/kws-pipeline-${VERSION}-source.tar.gz"
          test -s "dist/kws-pipeline-${VERSION}.spdx.json"
          test -s dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest SDK SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/kws-pipeline-${{ steps.release.outputs.version }}-sdk.tar.gz
          sbom-path: dist/kws-pipeline-${{ steps.release.outputs.version }}.spdx.json
      - name: Publish existing-tag release
        if: steps.release.outputs.bootstrap != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "dist/kws-pipeline-${VERSION}-sdk.tar.gz" \
            "dist/kws-pipeline-${VERSION}-source.tar.gz" \
            "dist/kws-pipeline-${VERSION}.spdx.json" \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "kws-pipeline $RELEASE_TAG"
      - name: Publish bootstrap release and tag
        if: steps.release.outputs.bootstrap == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "dist/kws-pipeline-${VERSION}-sdk.tar.gz" \
            "dist/kws-pipeline-${VERSION}-source.tar.gz" \
            "dist/kws-pipeline-${VERSION}.spdx.json" \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "kws-pipeline $RELEASE_TAG"

  cleanup-bootstrap-branch:
    needs: [hosted, coverage, sanitizers, fuzz, armv7-cross, publish]
    if: ${{ always() && startsWith(github.ref, 'refs/heads/release/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete release bootstrap branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
