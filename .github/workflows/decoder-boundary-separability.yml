name: decoder-boundary-separability

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful product-development-experiment run containing the frozen development model
        required: true
        type: string
      source_artifact_name:
        description: Optional exact product-development-experiment artifact name
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: decoder-boundary-separability-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_ARTIFACT_NAME_INPUT: ${{ inputs.source_artifact_name }}
      SOURCE_ROOT: build/decoder-boundary-separability/source-artifact
      OUTPUT_ROOT: build/decoder-boundary-separability
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download retained development evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$SOURCE_RUN_ID" in
            ''|*[!0-9]*) echo "source_run_id must be numeric" >&2; exit 2 ;;
          esac
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e '
            .conclusion == "success" and
            .event == "pull_request" and
            .path == ".github/workflows/product-development-experiment.yml"
          ' <<<"$run_json" >/dev/null || {
            echo "source run must be a successful product-development-experiment pull_request run" >&2
            exit 2
          }
          source_head_sha="$(jq -r '.head_sha // empty' <<<"$run_json")"
          test "${#source_head_sha}" -eq 40 || exit 2

          mkdir -p "$SOURCE_ROOT"
          artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          artifact="$SOURCE_ARTIFACT_NAME_INPUT"
          if [ -z "$artifact" ]; then
            artifact="$(jq -r '
              [.artifacts[] |
                select(.expired == false) |
                select(.name | startswith("product-development-experiment-"))] |
              if length == 1 then .[0].name
              else error("source run must have exactly one non-expired product-development-experiment artifact")
              end
            ' <<<"$artifacts_json")"
          else
            jq -e --arg name "$artifact" '
              [.artifacts[] |
                select(.expired == false) |
                select(.name == $name) |
                select(.name | startswith("product-development-experiment-"))] |
              length == 1
            ' <<<"$artifacts_json" >/dev/null || exit 2
          fi
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$SOURCE_ROOT"
          echo "SOURCE_ARTIFACT_NAME=$artifact" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_HEAD_SHA=$source_head_sha" >> "$GITHUB_ENV"

      - name: Bind exact frozen model
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root=pathlib.Path(os.environ['SOURCE_ROOT'])
          out=pathlib.Path(os.environ['OUTPUT_ROOT'])/'source'
          grid=root/'build/product-development-experiment/decoder-policy-replay-grid.json'
          value=json.loads(grid.read_text(encoding='utf-8'))
          if value.get('evidence_class') != 'decoder-policy-posterior-replay-grid-development-v1':
              raise SystemExit('retained source grid evidence class mismatch')
          model_sha=str(value.get('model_sha256') or '')
          if len(model_sha) != 64:
              raise SystemExit('retained source grid model identity is invalid')
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda:stream.read(1024*1024),b''):
                      h.update(block)
              return h.hexdigest()
          models=[
              path for path in root.glob('build/product-development-experiment/candidates/*/model.kwm')
              if sha(path)==model_sha
          ]
          if len(models) != 1:
              raise SystemExit(f'expected one retained model match, got {len(models)}')
          out.mkdir(parents=True,exist_ok=True)
          target=out/'source-model.kwm'
          shutil.copy2(models[0],target)
          selection={
              'schema_version':1,
              'evidence_class':'decoder-boundary-separability-source-v1',
              'development_only':True,
              'selection_feedback_allowed':True,
              'protected_evidence_used':False,
              'source_split':'train',
              'source_run_id':int(os.environ['SOURCE_RUN_ID']),
              'source_run_head_sha':os.environ['SOURCE_RUN_HEAD_SHA'],
              'source_artifact_name':os.environ['SOURCE_ARTIFACT_NAME'],
              'source_grid_sha256':sha(grid),
              'source_model_sha256':sha(target),
              'source_model_original_path':models[0].as_posix(),
          }
          (out/'source-selection.json').write_text(
              json.dumps(selection,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          PY

      - name: Materialize governed speech-like base
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash training/materialize_governed_product_base.sh

      - name: Build posterior dump runtime only
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKWS_STRICT=ON
          cmake --build build --parallel --target kws_posterior_dump

      - name: Measure train-only boundary separability
        run: |
          set -euo pipefail
          python3 tools/diagnose_boundary_separability.py             --dataset-index .generated/product-speech-like-base/corpus/bundle/train/dataset-index.jsonl             --model "$OUTPUT_ROOT/source/source-model.kwm"             --posterior-dump build/kws_posterior_dump             --posterior-cache "$OUTPUT_ROOT/posterior-cache"             --output-dir "$OUTPUT_ROOT/diagnostic"

      - name: Retain separability receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root=pathlib.Path(os.environ['OUTPUT_ROOT'])
          report=json.loads((root/'diagnostic'/'separability.json').read_text(encoding='utf-8'))
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda:stream.read(1024*1024),b''):
                      h.update(block)
              return h.hexdigest()
          if report.get('selection_feedback_allowed') is not True or report.get('source_split') != 'train':
              raise SystemExit('separability report authority mismatch')
          receipt={
              'schema_version':1,
              'evidence_class':'decoder-boundary-separability-receipt-v1',
              'development_only':True,
              'selection_feedback_allowed':True,
              'protected_evidence_used':False,
              'release_authority':False,
              'source_split':'train',
              'source_run_id':int(os.environ['SOURCE_RUN_ID']),
              'source_run_head_sha':os.environ['SOURCE_RUN_HEAD_SHA'],
              'source_artifact_name':os.environ['SOURCE_ARTIFACT_NAME'],
              'runtime_repository_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'source_selection_sha256':sha(root/'source'/'source-selection.json'),
              'separability_sha256':sha(root/'diagnostic'/'separability.json'),
              'pairs':int(report['pairs']),
              'voices':int(report['voices']),
              'stable_scalar_features':list(report['stable_scalar_features']),
              'simple_scalar_separability_observed':bool(report['simple_scalar_separability_observed']),
          }
          (root/'receipt.json').write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          PY

      - name: Upload train-only separability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: decoder-boundary-separability-${{ inputs.source_run_id }}-${{ github.sha }}
          path: |
            build/decoder-boundary-separability/source/**
            build/decoder-boundary-separability/diagnostic/**
            build/decoder-boundary-separability/receipt.json
            build/decoder-boundary-separability/posterior-cache/**/*.json
            build/decoder-boundary-separability/posterior-cache/**/*.kwtr
            .generated/xiaowo.product-effective.json
          if-no-files-found: error
          retention-days: 30
